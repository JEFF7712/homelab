apiVersion: v1
kind: Pod
metadata:
  name: disk-resize
  namespace: admin-tools
spec:
  nodeName: controlplane-01-vm
  restartPolicy: Never
  containers:
  - name: resize
    image: alpine:latest
    command: ["sleep", "3600"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: host-dev
      mountPath: "/dev"
  volumes:
  - name: host-dev
    hostPath:
      path: "/dev"
