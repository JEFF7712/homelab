# Jarvis voice regression corpus.
#
# Canonical commands to re-run (via assist_pipeline/run at the intent
# stage, checking processed_locally) whenever the model, system prompt,
# Whisper version, or Assist exposures change. See docs/runbooks/jarvis-voice.md
# ("Eval loop") for the procedure.
#
# Schema per entry:
#   id: unique stable slug
#   say: the exact utterance to speak or type into Assist debug
#   path: local (built-in intent engine) or llm (Ollama fallback)
#   intent: built-in intent name, required when path is local. Must have a
#     terse override in home-assistant/custom_sentences/en/jarvis_terse.yaml.
#   targets: entity IDs the turn must act on. Required when path is local;
#     every ID must exist in home-assistant/core/configuration.yaml groups
#     or home-assistant/scripts/.
#   response: exact expected spoken reply, required when path is local.
#   tool: expected tool or script, required when path is llm.
#   notes: free-form expectation for llm-path turns.
