apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiobookshelf
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.christianhuth.de
    chart: audiobookshelf
    targetRevision: 1.6.1
    helm:
      values: |
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: latest
          pullPolicy: Always

        persistence:
          config:
            enabled: true
            type: pvc
            accessMode: ReadWriteOnce
            size: "2Gi"
            resources:
              requests:
                storage: "2Gi"

          metadata:
            enabled: true
            type: pvc
            accessMode: ReadWriteOnce
            size: "10Gi"
            resources:
              requests:
                storage: "10Gi"

          backup:
            enabled: false 

          library:
            enabled: true
            type: pvc
            accessMode: ReadWriteOnce
            size: "10Gi"
            resources:
              requests:
                storage: "10Gi"
            mountPath: /audiobooks

        ingress:
          main:
            enabled: true
            className: "traefik"
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
            hosts:
              - host: books.rupan.dev
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: books-tls
                hosts:
                  - books.distrojeff.com

  destination:
    server: https://kubernetes.default.svc
    namespace: media
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true