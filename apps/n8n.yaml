apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://8gears.container-registry.com/library
    chart: n8n
    targetRevision: 2.0.1
    helm:
      values: |
        config:
          encryptionKey:
            existingSecret: n8n-secret
            encryptionKeyKey: encryption-key
        persistence:
          enabled: true
          storageClass: longhorn
          size: 5Gi
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: n8n.rupan.dev
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: n8n-tls
              hosts:
                - n8n.rupan.dev
        podSecurityContext:
          fsGroup: 1000
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true