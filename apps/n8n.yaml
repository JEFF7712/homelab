apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: n8n
    targetRevision: 1.16.14 
    helm:
      values: |

        db:
          type: postgresdb

        externalPostgresql:
          host: postgresql.n8n.svc.cluster.local
          database: n8n_db
          username: n8n_user
          existingSecret: n8n-db-auth

        extraEnvVars:
          - name: GENERIC_TIMEZONE
            value: "America/Chicago"
          - name: TZ
            value: "America/Chicago"

        main:
          count: 1
          persistence:
            enabled: true
            accessMode: ReadWriteOnce
            volumeName: "n8n-main-data"
            mountPath: "/home/node/.n8n"
            size: 10Gi
            storageClass: longhorn
          resources:
            limits:
              memory: 2Gi
              cpu: 1000m
            requests:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            initialDelaySeconds: 120
          readinessProbe:
            initialDelaySeconds: 60
          
        existingEncryptionKeySecret: n8n-secret

        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: n8n.rupan.dev
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: n8n-tls
              hosts:
                - n8n.rupan.dev
        
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true