apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tutor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/JEFF7712/homelab.git'
    targetRevision: main
    path: infrastructure/tutor
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tutor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
