apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://docs.renovatebot.com/helm-charts
    chart: renovate
    targetRevision: 45.64.2
    helm:
      values: |
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        renovate:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          config: |
            {
              "platform": "gitlab",
              "endpoint": "https://gitlab.com/api/v4", 
              "autodiscover": true,
              "autodiscoverFilter": ["jeff7712/*"],
              "onboarding": false,
              "requireConfig": "optional"
            }
        cronjob:
          schedule: "0 * * * *"
        envList:
          - name: LOG_LEVEL
            value: "info"
          - name: RENOVATE_TOKEN
            valueFrom:
              secretKeyRef:
                name: renovate-secrets
                key: gitlab-token
          - name: GITHUB_COM_TOKEN
            valueFrom:
              secretKeyRef:
                name: renovate-secrets
                key: github-token
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-websites
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://docs.renovatebot.com/helm-charts
    chart: renovate
    targetRevision: 45.64.2
    helm:
      values: |
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        renovate:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          config: |
            {
              "platform": "github",
              "endpoint": "https://api.github.com/", 
              "autodiscover": true,
              "autodiscoverFilter": [
                "jeff7712/apolline-site",
                "jeff7712/darkbit-site",
                "jeff7712/distrojeff-site",
                "jeff7712/pulse",
                "jeff7712/rupanism",
                "jeff7712/solubility-predictor",
                "jeff7712/spatia"
              ],
              "onboarding": true,
              "onboardingConfig": {
                "extends": ["config:recommended"]
              }
            }
        cronjob:
          schedule: "30 */2 * * *"
        envList:
          - name: LOG_LEVEL
            value: "info"
          - name: RENOVATE_TOKEN
            valueFrom:
              secretKeyRef:
                name: renovate-secrets
                key: github-token
          - name: GITHUB_COM_TOKEN
            valueFrom:
              secretKeyRef:
                name: renovate-secrets
                key: github-token
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
