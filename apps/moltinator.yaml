apiVersion: v1
kind: Namespace
metadata:
  name: moltbot
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moltinator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/JEFF7712/homelab.git'
    targetRevision: main
    path: infrastructure/moltinator
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: moltbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true