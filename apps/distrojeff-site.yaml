apiVersion: v1
kind: Namespace
metadata:
  name: distrojeff
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distrojeff-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/JEFF7712/homelab.git'
    targetRevision: main
    path: infrastructure/distrojeff-site
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: distrojeff
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
