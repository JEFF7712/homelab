apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: ">= 12.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    persistence:
      enabled: true
      size: 10Gi
    adminPassword: "admin"
    service:
      type: NodePort
      port: 80
      targetPort: 3000
