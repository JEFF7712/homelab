apiVersion: v1
kind: Namespace
metadata:
  name: volsync-system
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: r2-backup-credentials
  namespace: longhorn-system
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_ENDPOINTS: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: r2-backup-credentials
      namespace: longhorn-system
    type: Opaque
---
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: "s3://homelab-longhorn-backup@us-east-1/"
  credentialSecret: r2-backup-credentials
  pollInterval: 5m0s
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: app-configs-12h
  namespace: longhorn-system
spec:
  cron: "0 */12 * * *"
  task: snapshot
  groups:
    - app-configs
  retain: 4
  concurrency: 1
  labels:
    managed-by: gitops
    purpose: app-config-snapshot
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: app-configs-weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 4 * * 0"
  task: backup
  groups:
    - app-configs
  retain: 4
  concurrency: 1
  labels:
    managed-by: gitops
    purpose: app-config-offsite
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: important-data-daily
  namespace: longhorn-system
spec:
  cron: "30 3 * * *"
  task: backup
  groups:
    - important-data
  retain: 7
  concurrency: 1
  labels:
    managed-by: gitops
    purpose: important-data-offsite
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://piraeus.io/helm-charts
    chart: snapshot-controller
    targetRevision: 5.0.4
    helm:
      valuesObject:
        installCRDs: true
        volumeSnapshotClasses:
          - name: longhorn-snapshot-vsc
            annotations:
              snapshot.storage.kubernetes.io/is-default-class: "true"
            driver: driver.longhorn.io
            deletionPolicy: Delete
            parameters:
              type: snap
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    targetRevision: 0.15.0
    helm:
      valuesObject:
        manageCRDs: true
        metrics:
          disableAuth: true
  destination:
    server: https://kubernetes.default.svc
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
