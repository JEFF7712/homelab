apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.1
    helm:
      values: |
        image:
          registry: docker.io
          repository: tensorchord/pgvecto-rs
          tag: pg16-v0.2.1
        auth:
          username: immich
          database: immich
          password: "change-me-please"
        primary:
          persistence:
            enabled: true
            storageClass: "longhorn"
            size: 8Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://immich-app.github.io/immich-charts
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        valkey:
          enabled: true
          primary:
            persistence:
              enabled: true
              storageClass: "longhorn"
              size: 8Gi

        immich:
          persistence:
            library:
              existingClaim: immich-library-pvc

        controllers:
          main:
            containers:
              main:
                image:
                  tag: v1.124.1
                env:
                  TZ: America/Chicago
                  # Connection to the separate DB deployed above
                  DB_HOSTNAME: immich-db-postgresql.immich.svc.cluster.local
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD: "change-me-please"
                  # REDIS_HOSTNAME: immich-valkey-primary

          server:
            ingress:
              main:
                enabled: true
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: photos.rupan.dev
                    paths:
                      - path: "/"
                        service:
                          identifier: main
                tls:
                  - hosts:
                      - photos.rupan.dev
                    secretName: immich-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true