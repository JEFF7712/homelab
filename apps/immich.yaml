apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://immich-app.github.io/immich-charts
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v1.124.1
                env:
                  TZ: America/Chicago

        immich:
          persistence:
            library:
              enabled: true
              size: 100Gi
              storageClass: "longhorn"
              accessMode: ReadWriteOnce

        postgresql:
          enabled: true
          global:
            postgresql:
              auth:
                username: immich
                database: immich
                password: "change-me-please"
          primary:
            persistence:
              enabled: true
              size: 8Gi
              storageClass: "longhorn"

        redis:
          enabled: true
          architecture: standalone
          master:
            persistence:
              enabled: true
              size: 8Gi
              storageClass: "longhorn"

        server:
          enabled: true
          persistence:
            server:
              enabled: true
              size: 1Gi
              storageClass: "longhorn"
              accessMode: ReadWriteOnce
          ingress:
            main:
              enabled: true
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
              hosts:
                - host: photos.rupan.dev
                  paths:
                    - path: "/"
                      service:
                        identifier: main
              tls:
                - hosts:
                    - photos.rupan.dev
                  secretName: immich-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
