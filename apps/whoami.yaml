apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/JEFF7712/homelab.git
    targetRevision: main
    path: infrastructure/whoami
    
  destination:
    server: https://kubernetes.default.svc
    namespace: default 
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true