apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/whoami
    targetRevision: v1.10.1
    chart: whoami
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - host: whoami.10.0.20.180.nip.io
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
