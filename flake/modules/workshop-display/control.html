<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send to Workshop</title><style>:root{color-scheme:dark;font-family:system-ui;background:#101315;color:#ecf1ed}body{max-width:480px;margin:10vh auto;padding:24px}h1{font-weight:450}p{color:#a8b6ad;line-height:1.6}input,button{display:block;width:100%;box-sizing:border-box;padding:16px;margin:16px 0;border-radius:10px;border:1px solid #465449;background:#1c2520;color:inherit;font:inherit}button{background:#c8edaf;color:#162014;font-weight:600}#result{min-height:3em}</style><h1>Send to Workshop</h1><p>Put a tutorial or reference on the bench display. It stays until you dismiss it. Bookmark this paired page.</p><input id="url" type="url" placeholder="Paste a YouTube link" aria-label="YouTube link"><button id="video">Show video</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Choose an image"><button id="image">Show image</button><button id="dismiss">Return to dashboard</button><p id="result" role="status"></p><p>For screen mirroring: iPhone Control Center → Screen Mirroring → Workshop. Videos may need a click on the monitor to start.</p><script>
const key=new URLSearchParams(location.search).get('k')||'',result=document.querySelector('#result');async function send(path,data){result.textContent='Sending…';try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Workshop-Key':key},body:JSON.stringify(data)});const v=await r.json();result.textContent=r.ok?'Done. Check the workshop monitor.':v.error;}catch{result.textContent='Cannot reach the workshop. Check your Wi-Fi connection.';}}
document.querySelector('#video').onclick=()=>send('/share',{kind:'youtube',value:document.querySelector('#url').value});document.querySelector('#dismiss').onclick=()=>send('/dismiss',{});document.querySelector('#image').onclick=()=>{const f=document.querySelector('#file').files[0];if(!f||f.size>6*1024*1024){result.textContent='Choose a PNG, JPEG or WebP under 6 MB.';return;}const reader=new FileReader();reader.onload=()=>send('/share',{kind:'image',value:reader.result});reader.readAsDataURL(f);};
</script></html>
