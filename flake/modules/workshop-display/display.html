<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101315;color:#ecf1ed}*{box-sizing:border-box}body{margin:0;padding:5vh 5vw;height:100vh;overflow:hidden;cursor:none}header,footer{display:flex;justify-content:space-between;align-items:center}header{font-size:1.1vw;text-transform:uppercase;letter-spacing:.22em;color:#9ba9a2}.dot{color:#c8edaf}main{height:74vh;display:flex;align-items:center;justify-content:center}#time{font-size:19vw;font-weight:250;letter-spacing:-.065em;line-height:1}#date{text-align:center;color:#9ba9a2;font-size:1.7vw;margin-top:2vh}footer{font-size:1vw;color:#7f9086;min-height:100px}body:not(.idle) #qr{visibility:hidden}#print{width:100%;display:grid;grid-template-columns:1.2fr 1fr;gap:4vw;align-items:center}#camera{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:#191f1b}h1{font-size:3vw;font-weight:450;overflow-wrap:anywhere;margin:.4em 0}.progress{font-size:8vw;letter-spacing:-.06em}progress{width:100%;height:8px;accent-color:#c8edaf}#stats{display:grid;grid-template-columns:auto 1fr;gap:.5vh 2vw;margin-top:3vh;font-size:1.5vw;color:#9ba9a2}#stats b{font-weight:450;color:#ecf1ed}#errors{white-space:pre-line;margin-top:3vh;font-size:1.3vw;line-height:1.5;color:#f0a8a0}#errors:empty{display:none}.night{filter:brightness(.23)}#media{width:100%;height:100%;object-fit:contain;border:0}#status{color:#c8edaf}.failed #status,.failed .progress,.failed small{color:#f0a8a0}.failed progress{accent-color:#f0a8a0}#notice{position:absolute;bottom:9vh;font-size:1vw;color:#d1b98d}small{font-size:1.2vw;color:#9ba9a2;letter-spacing:.12em}.hint{margin-top:3vh;font-size:1.1vw;color:#7f9086}
</style><header><span><span class="dot">●</span> Workshop / 04</span><span id="status"></span></header><main id="main"></main><div id="notice"></div><footer><img id="qr" alt="Scan to pair your phone" style="width:140px;background:white"></footer>
<script>
const main=document.querySelector('#main'),text=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};let mode='',signature='',state={},last=0;const params=new URLSearchParams(location.search),preview=location.pathname==='/preview/clock'||params.has('preview'),previewNight=(params.get('preview')||params.get('mode'))==='night';
const clock=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const span=s=>{if(!Number.isFinite(s)||s<0)return'';const m=Math.round(s/60),h=Math.floor(m/60);return h?h+' h '+(m%60)+' min':m+' min'};
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
const temp=(now,target)=>{const n=num(now),t=num(target);return(n===null?'—':Math.round(n)+'°')+(t?' → '+Math.round(t)+'°':'')};
function rows(pairs){const el=document.querySelector('#stats');el.replaceChildren();for(const[k,v]of pairs){if(!v)continue;const a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;el.append(a,b);}}
let player={},seen=null;
// YouTube's iframe postMessage protocol: commands in, infoDelivery (position, state) out.
function yt(func,args){const f=document.querySelector('iframe#media');if(!f)return;f.contentWindow.postMessage(JSON.stringify(func==='listening'?{event:'listening',id:'workshop',channel:'widget'}:{event:'command',func,args:args||[],id:'workshop',channel:'widget'}),'https://www.youtube.com');}
addEventListener('message',e=>{if(e.origin!=='https://www.youtube.com')return;let d;try{d=JSON.parse(e.data)}catch{return}const i=d&&d.info;if(i&&typeof i==='object')for(const k of['currentTime','duration','playerState'])if(k in i)player[k]=i[k];});
function media(list){if(!Array.isArray(list))return;const top=list.reduce((n,c)=>Math.max(n,c.seq),seen||0);if(seen===null||mode!=='youtube'){seen=top;return;}for(const c of list){if(c.seq<=seen)continue;if(c.action==='play')yt('playVideo');else if(c.action==='pause')yt('pauseVideo');else if(c.action==='seek')yt('seekTo',[c.time,true]);}seen=top;}
function report(){if(mode!=='youtube'||!('currentTime'in player))return;fetch('/player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time:player.currentTime,duration:player.duration,state:player.playerState})}).catch(()=>{});}
function camera(){const c=document.querySelector('#camera');if(!c)return;c.onerror=()=>setTimeout(camera,3000);c.src='/camera.mjpeg?t='+Date.now();}
function render(){const now=new Date(),p=state.printer||{},s=state.shared,f=state.finished,night=preview?previewNight:(now.getHours()>=22||now.getHours()<7),stale=Date.now()/1000-(state.updated||0)>30;const active=['running','prepare','pause','failed'].includes(p.print_status);const next=state.mode||(s?s.kind:active?'print':night?'night':'clock');document.body.classList.toggle('night',next==='night');document.body.classList.toggle('idle',next==='night'||next==='clock');document.body.classList.toggle('failed',next==='print'&&p.print_status==='failed');text('status',next==='print'?'A1 · '+p.print_status:next==='finished'?'A1 · finished':'');text('notice',Date.now()-last>15000?'Display connection lost':stale?'Printer connection unavailable · last observation may be stale':'');const sig=next+JSON.stringify(s);if(sig!==signature){signature=sig;mode=next;player={};main.replaceChildren();if(s){const el=document.createElement(s.kind==='youtube'?'iframe':'img');el.id='media';if(s.kind==='youtube'){el.src='https://www.youtube.com/embed/'+s.value+'?autoplay=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);el.onload=()=>yt('listening');el.referrerPolicy='strict-origin-when-cross-origin';el.allow='autoplay; fullscreen';el.allowFullscreen=true;}else el.src=s.value;main.append(el);}else if(next==='print'||next==='finished'){main.innerHTML='<section id="print"><img id="camera" alt="Printer camera"><div><small id="label"></small><h1 id="task"></h1><div class="progress" id="progress"></div><progress id="bar" max="100"></progress><div id="stats"></div><div id="errors"></div><div class="hint" id="hint"></div></div></section>';camera();}else main.innerHTML='<section><div id="time"></div><div id="date"></div></section>';}
text('time',now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));text('date',now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}));
if(mode==='print'){const n=num(p.print_progress),end=new Date(p.end_time),left=num(p.remaining_time),stage=p.current_stage&&!['idle','printing','unknown','unavailable'].includes(p.current_stage)?p.current_stage.replaceAll('_',' '):'';text('label',p.print_status==='failed'?'BAMBU LAB / A1 · PRINT FAILED':'BAMBU LAB / A1');text('task',p.task_name||'Print in progress');text('progress',n===null?'—':n+'%');document.querySelector('#bar').value=n??0;rows([['Done at',p.print_status==='failed'?'':isNaN(end)?'Unavailable':clock(end)+(left?' · '+span(left*3600)+' left':'')],['Stage',stage],['Layer',num(p.total_layer_count)?p.current_layer+' / '+p.total_layer_count:''],['Nozzle',temp(p.nozzle_temperature,p.nozzle_target_temperature)],['Bed',temp(p.bed_temperature,p.bed_target_temperature)]]);text('errors',(p.errors||[]).join('\n'));}
if(mode==='finished'&&f){const w=num(f.weight),l=num(f.length);text('label','BAMBU LAB / A1 · FINISHED');text('task',f.task||'Print finished');text('progress','Done');document.querySelector('#bar').value=100;rows([['Finished',clock(new Date(f.at*1000))],['Took',span(f.duration)],['Filament',[w?w+' g':'',l?l+' m':''].filter(Boolean).join(' · ')]]);text('hint','Returns to the clock in '+span(Math.max(60,1800-(Date.now()/1000-f.at)))+' · Return to dashboard on your phone clears it now');}}
async function poll(){if(preview){state={printer:{print_status:'idle'},shared:null,mode:previewNight?'night':'clock',updated:Date.now()/1000,control:'http://workshop/control'};last=Date.now();render();return;}try{const r=await fetch('/state');if(!r.ok)throw Error();const fresh=await r.json();if(fresh.control!==state.control)document.querySelector("#qr").src="/pair.svg?t="+Date.now();state=fresh;last=Date.now();}catch{}render();media(state.media);report();}if(preview){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90"><rect width="90" height="90" fill="white"/><g fill="black"><path d="M5 5h25v25H5zM60 5h25v25H60zM5 60h25v25H5zM38 5h8v12h-8zM38 27h12v14H38zM57 40h25v8H57zM40 57h10v25H40zM60 60h10v10H60zM75 75h10v10H75z"/></g></svg>';document.querySelector('#qr').src='data:image/svg+xml,'+encodeURIComponent(svg);}(function loop(){poll().finally(()=>setTimeout(loop,mode==='youtube'?1000:3000));})();setInterval(render,1000);setInterval(camera,60000);
</script></html>
