<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101315;color:#ecf1ed}*{box-sizing:border-box}body{margin:0;padding:5vh 5vw;height:100vh;overflow:hidden;cursor:none}header,footer{display:flex;justify-content:space-between;align-items:center}header{font-size:1.1vw;text-transform:uppercase;letter-spacing:.22em;color:#9ba9a2}.dot{color:#c8edaf}main{height:74vh;display:flex;align-items:center;justify-content:center}#time{font-size:19vw;font-weight:250;letter-spacing:-.065em;line-height:1}#date{text-align:center;color:#9ba9a2;font-size:1.7vw;margin-top:2vh}footer{font-size:1vw;color:#7f9086}#print{width:100%;display:grid;grid-template-columns:1.2fr 1fr;gap:4vw;align-items:center}#camera{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:#191f1b}h1{font-size:3vw;font-weight:450;overflow-wrap:anywhere}.progress{font-size:8vw;letter-spacing:-.06em}progress{width:100%;height:8px;accent-color:#c8edaf}#stats{line-height:2.2;font-size:1.5vw;color:#9ba9a2}.night{filter:brightness(.23)}#media{width:100%;height:100%;object-fit:contain;border:0}#status{color:#c8edaf}#notice{position:absolute;bottom:9vh;font-size:1vw;color:#d1b98d}small{font-size:1.2vw;color:#9ba9a2}
</style><header><span><span class="dot">●</span> Workshop / 04</span><span id="status"></span></header><main id="main"></main><div id="notice"></div><footer><img id="qr" alt="Scan to pair your phone" style="width:140px;background:white"></footer>
<script>
const main=document.querySelector('#main'),text=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};let mode='',signature='',state={},last=0;const params=new URLSearchParams(location.search),preview=location.pathname==='/preview/clock'||params.has('preview'),previewNight=(params.get('preview')||params.get('mode'))==='night';
function render(){const now=new Date(),p=state.printer||{},s=state.shared,night=preview?previewNight:(now.getHours()>=22||now.getHours()<7),stale=Date.now()/1000-(state.updated||0)>30;const active=['running','prepare','pause','failed'].includes(p.print_status);const next=state.mode||(s?s.kind:active?'print':night?'night':'clock');document.body.classList.toggle('night',night&&!s&&!active);text('status',active?'A1 · '+p.print_status:'');text('notice',Date.now()-last>15000?'Display connection lost':stale?'Printer connection unavailable · last observation may be stale':'');const sig=next+JSON.stringify(s);if(sig!==signature){signature=sig;mode=next;main.replaceChildren();if(s){const el=document.createElement(s.kind==='youtube'?'iframe':'img');el.id='media';if(s.kind==='youtube'){el.src='https://www.youtube.com/embed/'+s.value+'?autoplay=1';el.referrerPolicy='strict-origin-when-cross-origin';el.allow='autoplay; fullscreen';el.allowFullscreen=true;}else el.src=s.value;main.append(el);}else if(next==='print'){main.innerHTML='<section id="print"><img id="camera" alt="Printer camera"><div><small>BAMBU LAB / A1</small><h1 id="task"></h1><div class="progress" id="progress"></div><progress id="bar" max="100"></progress><div id="stats"></div></div></section>';}else main.innerHTML='<section><div id="time"></div><div id="date"></div></section>';}
text('time',now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));text('date',now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}));if(mode==='print'){text('task',p.task_name||'Print in progress');const n=Number(p.print_progress);text('progress',Number.isFinite(n)?n+'%':'—');document.querySelector('#bar').value=Number.isFinite(n)?n:0;const end=new Date(p.end_time);text('stats',(isNaN(end)?'Finish time unavailable':'Done at '+end.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))+' · Layer '+p.current_layer+' / '+p.total_layer_count+' · Nozzle '+p.nozzle_temperature+'° · Bed '+p.bed_temperature+'°');}}
async function poll(){if(preview){state={printer:{print_status:'idle'},shared:null,mode:previewNight?'night':'clock',updated:Date.now()/1000,control:'http://workshop/control'};last=Date.now();render();return;}try{const r=await fetch('/state');if(!r.ok)throw Error();const fresh=await r.json();if(fresh.control!==state.control)document.querySelector("#qr").src="/pair.svg?t="+Date.now();state=fresh;last=Date.now();}catch{}render();}if(preview){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90"><rect width="90" height="90" fill="white"/><g fill="black"><path d="M5 5h25v25H5zM60 5h25v25H60zM5 60h25v25H5zM38 5h8v12h-8zM38 27h12v14H38zM57 40h25v8H57zM40 57h10v25H40zM60 60h10v10H60zM75 75h10v10H75z"/></g></svg>';document.querySelector('#qr').src='data:image/svg+xml,'+encodeURIComponent(svg);}setInterval(poll,3000);setInterval(render,1000);setInterval(()=>{const c=document.querySelector('#camera');if(c)c.src='/camera?t='+Date.now();},5000);poll();
</script></html>
