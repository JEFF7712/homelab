apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: moltbot-secrets-eso
  namespace: moltbot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: moltbot-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        telegram-token: "{{ .telegram_token }}"
        anthropic-key: "{{ .anthropic_key }}"
        gateway-token: "{{ .gateway_token }}"
  data:
  - secretKey: telegram_token
    remoteRef:
      key: MOLTBOT_TELEGRAM_TOKEN
  - secretKey: anthropic_key
    remoteRef:
      key: MOLTBOT_ANTHROPIC_KEY
  - secretKey: gateway_token
    remoteRef:
      key: MOLTBOT_GATEWAY_TOKEN
