apiVersion: external-secrets.io/v1b1
kind: ExternalSecret
metadata:
  name: couchdb-creds-eso
  namespace: obsidian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: couchdb-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"

  data:
  - secretKey: password
    remoteRef:
      key: COUCHDB_PASSWORD