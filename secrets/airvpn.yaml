apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn-external-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: airvpn-secret
    creationPolicy: Owner
  data:
    - secretKey: VPN_PORT_FORWARDING
      remoteRef:
        key: VPN_PORT_FORWARDING
        
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: WIREGUARD_PRIVATE_KEY
        
    - secretKey: WIREGUARD_PRESHARED_KEY
      remoteRef:
        key: WIREGUARD_PRESHARED_KEY
        
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: WIREGUARD_ADDRESSES