apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-secret-eso
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: lidarr-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DEEZER_ARL
      remoteRef:
        key: LIDARR_DEEZER_ARL
