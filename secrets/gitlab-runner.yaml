apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token-eso
  namespace: gitlab-runner
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore

  target:
    name: gitlab-runner-token
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        runner-registration-token: ""
        runner-token: "{{ .token }}"

  data:
  - secretKey: token
    remoteRef:
      key: GITLAB_RUNNER_TOKEN
