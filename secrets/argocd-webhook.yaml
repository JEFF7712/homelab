apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret-eso
  namespace: argocd
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore

  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    
  data:
  - secretKey: webhook.gitlab.secret
    remoteRef:
      key: ARGOCD_WEBHOOK_SECRET