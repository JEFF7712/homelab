apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apptly-app-secrets-eso
  namespace: apptly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: apptly-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://apptly:{{ .db_password }}@postgres:5432/apptly"
        POSTGRES_HOST: "postgres"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "apptly"
        POSTGRES_USER: "apptly"
        POSTGRES_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: APPTLY_DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apptly-postgres-secrets-eso
  namespace: apptly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_DB: "apptly"
        POSTGRES_USER: "apptly"
        POSTGRES_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: APPTLY_DB_PASSWORD
