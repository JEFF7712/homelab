apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-secret-eso
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: slskd-secret
    creationPolicy: Owner
    template:
      type: Opaque

  data:
  - secretKey: username
    remoteRef:
      key: SLSKD_USERNAME
  - secretKey: password
    remoteRef:
      key: SLSKD_PASSWORD