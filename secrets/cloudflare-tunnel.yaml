apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-eso
  namespace: cloudflare
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore

  target:
    name: cloudflare-tunnel
    creationPolicy: Owner
    template:
      type: Opaque

  data:
  - secretKey: tunnel-toke
    remoteRef:
      key: CF_TUNNEL_TOKEN