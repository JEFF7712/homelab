apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets-eso
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        telegram-token: "{{ .telegram_token }}"
        anthropic-key: "{{ .anthropic_key }}"
        gateway-token: "{{ .gateway_token }}"
        gitlab-token: "{{ .gitlab_token }}"
        auth-profiles.json: "{{ .auth_profiles }}"
        brave-api-key: "{{ .brave_api_key }}"
  data:
  - secretKey: telegram_token
    remoteRef:
      key: MOLTBOT_TELEGRAM_TOKEN
  - secretKey: anthropic_key
    remoteRef:
      key: MOLTBOT_ANTHROPIC_KEY
  - secretKey: gateway_token
    remoteRef:
      key: MOLTBOT_GATEWAY_TOKEN
  - secretKey: gitlab_token
    remoteRef:
      key: KUBECLAW_GITLAB_TOKEN
  - secretKey: auth_profiles
    remoteRef:
      key: OPENCLAW_ANTIGRAVITY_AUTH
  - secretKey: brave_api_key
    remoteRef:
      key: OPENCLAW_BRAVE_API_KEY
