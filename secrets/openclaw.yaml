apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets-eso
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        db-password: "{{ .db_password }}"
        netbird-setup-key: "{{ .netbird_setup_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: OPENCLAW_DB_PASSWORD
    - secretKey: netbird-setup-key
      remoteRef:
        key: OPENCLAW_NETBIRD_SETUP_KEY

