apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: automation-secrets-eso
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: automation-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ntfy-auth-users
      remoteRef:
        key: NTFY_AUTH_USERS

    - secretKey: ntfy-auth-tokens
      remoteRef:
        key: NTFY_AUTH_TOKENS

    - secretKey: ntfy-auth-access
      remoteRef:
        key: NTFY_AUTH_ACCESS

    - secretKey: ntfy-token
      remoteRef:
        key: NTFY_TOKEN

    - secretKey: dockerhub-username
      remoteRef:
        key: DOCKERHUB_USERNAME

    - secretKey: dockerhub-token
      remoteRef:
        key: DOCKERHUB_TOKEN

    - secretKey: github-token
      remoteRef:
        key: GITHUB_TOKEN

    - secretKey: openai-api-key
      remoteRef:
        key: OPENAI_API_KEY
