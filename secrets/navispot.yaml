apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navispot-secret-eso
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitlab-backend
    kind: ClusterSecretStore
  target:
    name: navispot-secret
    creationPolicy: Owner
    template:
      type: Opaque

  data:
  - secretKey: SPOTIFY_CLIENT_ID
    remoteRef:
      key: NAVISPOT_SPOTIFY_CLIENT_ID
  - secretKey: SPOTIFY_CLIENT_SECRET
    remoteRef:
      key: NAVISPOT_SPOTIFY_CLIENT_SECRET
