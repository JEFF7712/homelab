apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-media-rwo-to-rwx
  namespace: media
spec:
  template:
    spec:
      containers:
      - name: sync
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          - apk add --no-cache rsync &&
            echo "Starting Migration..." &&
            rsync -avP /source/ /dest/ &&
            echo "Migration Complete."
        volumeMounts:
        - name: source-rwo
          mountPath: /source
          readOnly: true
        - name: dest-rwx
          mountPath: /dest
      restartPolicy: OnFailure
      volumes:
      - name: source-rwo
        persistentVolumeClaim:
          claimName: media-pvc
      - name: dest-rwx
        persistentVolumeClaim:
          claimName: media-pvc-rwx