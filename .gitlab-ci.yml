image: nixos/nix:latest@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

stages:
  - lint
  - test
  - security
  - sync
  - registry
  - opnsense
  - deploy

variables:
  NIX_CONFIG: |-
    experimental-features = nix-command flakes
    extra-substituters = http://10.0.30.20:8080/homelab
    extra-trusted-public-keys = homelab:J+OVQOCG2sNT2KoVbWGPikoWcIbBanHnY2NOcMF3vwk=
  TF_PLUGIN_CACHE_DIR: "/tmp/tofu-plugin-cache"
  TF_STATE_NAME: opnsense-production
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  TF_HTTP_LOCK_METHOD: POST
  TF_HTTP_UNLOCK_METHOD: DELETE
  TF_HTTP_RETRY_WAIT_MIN: "5"

.nas_ci:
  tags:
    - nas-ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.shared_feature:
  tags:
    - nas-ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

.nix_format:
  stage: lint
  needs: []
  script:
    - nix develop ./flake -c just fmt-check

nix_format:
  extends:
    - .nas_ci
    - .nix_format

nix_format_feature:
  extends:
    - .shared_feature
    - .nix_format

.repository_tests:
  stage: test
  needs: []
  script:
    - nix develop ./flake -c bash -c 'just provision-check-deps && SKIP_FLAKE_CHECK=1 just check'

repository_tests:
  extends:
    - .nas_ci
    - .repository_tests

repository_tests_feature:
  extends:
    - .shared_feature
    - .repository_tests

jev_decision_gate:
  extends:
    - .shared_feature
    - .nas_ci
  stage: test
  needs: []
  script:
    - nix develop ./flake -c python scripts/jev_decision_gate.py

.flake_check:
  stage: test
  needs: []
  script:
    - nix develop ./flake -c nix flake check 'path:.?dir=flake' --no-write-lock-file

flake_check:
  extends:
    - .nas_ci
    - .flake_check

flake_check_feature:
  extends:
    - .shared_feature
    - .flake_check

.yaml_schema:
  stage: test
  needs: []
  script:
    - nix develop ./flake -c yamllint .

yaml_schema:
  extends:
    - .nas_ci
    - .yaml_schema

yaml_schema_feature:
  extends:
    - .shared_feature
    - .yaml_schema

.nix_cache:
  stage: test
  script:
    - |
      if [ -z "${ATTIC_TOKEN:-}" ]; then
        echo "ATTIC_TOKEN is not set; skipping binary cache upload."
        exit 0
      fi
      export HOME="${TMPDIR:-/tmp}/attic-ci-home-$$"
      mkdir -p "$HOME"
      trap 'rm -rf "$HOME"' EXIT
      nix develop ./flake -c attic login local http://10.0.30.20:8080/ "$ATTIC_TOKEN"
      nix build --no-link --print-out-paths \
        ./flake#nixosConfigurations.nas-01.config.system.build.toplevel \
        ./flake#nixosConfigurations.adguard-netbird-01.config.system.build.toplevel \
        ./flake#nixosConfigurations.homelab-01.config.system.build.toplevel \
        ./flake#nixosConfigurations.homelab-02.config.system.build.toplevel \
        ./flake#nixosConfigurations.homelab-03.config.system.build.toplevel \
        ./flake#nixosConfigurations.homelab-04.config.system.build.toplevel \
        ./flake#nixosConfigurations.homelab-05.config.system.build.toplevel \
        ./flake#checks.x86_64-linux.repository-contract \
        ./flake#checks.x86_64-linux.agent-workspace-network \
        ./flake#checks.x86_64-linux.agent-workspace-packet-flow \
        ./flake#checks.x86_64-linux.agent-workspace-host-reservations \
        ./flake#checks.x86_64-linux.agent-workspace-libvirt-normalization \
        ./flake#checks.x86_64-linux.zot-registry \
        | nix develop ./flake -c attic push local:homelab --stdin

nix_cache:
  extends:
    - .nas_ci
    - .nix_cache
  needs:
    - repository_tests
    - flake_check

.secret_scan:
  stage: security
  needs: []
  script:
    - nix develop ./flake -c gitleaks detect --source . --redact

secret_scan:
  extends:
    - .nas_ci
    - .secret_scan

secret_scan_feature:
  extends:
    - .shared_feature
    - .secret_scan

.registry_lock:
  stage: registry
  needs: []
  script:
    - nix develop ./flake -c bash -c 'just check-registry && just registry-plan > registry-copy-plan.json'
  artifacts:
    expire_in: 7 days
    paths:
      - registry-copy-plan.json

registry_lock:
  extends:
    - .nas_ci
    - .registry_lock

registry_lock_feature:
  extends:
    - .shared_feature
    - .registry_lock

registry_resolve:
  stage: registry
  tags:
    - nas-ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - mkdir -p artifacts/registry
    - >-
      nix develop ./flake -c python -m scripts.registry inventory
      --output artifacts/registry/images.inventory.json
    - >-
      nix develop ./flake -c python -m scripts.registry resolve
      --inventory artifacts/registry/images.inventory.json
      --output artifacts/registry/images.lock.candidate.json
    - >-
      nix develop ./flake -c python -m scripts.registry plan
      --lock artifacts/registry/images.lock.candidate.json
      > artifacts/registry/copy-plan.candidate.json
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/registry/

registry_update_import:
  stage: registry
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: registry-content
  needs:
    - job: registry_resolve
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_IMPORTER_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -m scripts.registry copy
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-import-report.json
    - >-
      nix develop ./flake -c python -m scripts.registry verify
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-verify-report.json
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

registry_lock_import:
  stage: registry
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: registry-content
  needs:
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_IMPORTER_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -m scripts.registry copy
      --lock registry/images.lock.json --kind upstream
      --report artifacts/registry/lock-import-report.json
    - >-
      nix develop ./flake -c python -m scripts.registry verify
      --lock registry/images.lock.json --kind upstream
      --report artifacts/registry/lock-verify-report.json
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

.registry_ssh:
  tags:
    - nas-privileged
  environment:
    name: production
  before_script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"
  after_script:
    - shred -u ~/.ssh/id_ed25519 ~/.ssh/known_hosts 2>/dev/null || rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

deploy_registry_platform:
  extends: .registry_ssh
  stage: registry
  resource_group: registry-platform
  needs:
    - repository_tests
    - flake_check
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo zfs list tank/registry >/dev/null 2>&1 || sudo zfs create -o mountpoint=legacy tank/registry;
      sudo install -d -m 0750 -o root -g root /tank/registry /persist/zot /persist/zot/status'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/htpasswd'
      < "$REGISTRY_HTPASSWD_FILE"
    - >-
      nix develop ./flake -c python -m scripts.registry access-control
      --lock registry/images.lock.json --output /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/access-control.json'
      < /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/cloudflare-dns-api-token'
      < "$REGISTRY_CLOUDFLARE_TOKEN_FILE"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/restic-password'
      < "$REGISTRY_RESTIC_PASSWORD_FILE"
    - >-
      nixos-rebuild --flake ./flake#nas-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.20 --build-host rupan@10.0.30.20
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo chown root:zot /persist/zot/restic-password;
      sudo chmod 0640 /persist/zot/restic-password'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'mountpoint -q /tank/registry && sudo systemctl is-active zot nginx'

deploy_registry_dns:
  extends: .registry_ssh
  stage: registry
  resource_group: registry-dns
  needs:
    - deploy_registry_platform
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nixos-rebuild --flake ./flake#adguard-netbird-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.10 --build-host rupan@10.0.30.10
    - >-
      test "$(getent ahostsv4 registry.rupan.dev | awk 'NR == 1 { print $1 }')"
      = 10.0.30.20
    - >-
      test "$(nix develop ./flake -c curl --silent --show-error --output /dev/null
      --write-out '%{http_code}' https://registry.rupan.dev/v2/)" = 401

deploy_zigbee_gateway:
  extends: .registry_ssh
  stage: deploy
  resource_group: zigbee-gateway
  needs:
    - repository_tests
    - flake_check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nix develop ./flake -c python -m scripts.zigbee_gateway |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/zigbee2mqtt-secret.yaml'
    - >-
      printf '%s' "$HOME_ASSISTANT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-home-assistant-password'
    - >-
      printf '%s' "$ZIGBEE2MQTT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-zigbee2mqtt-password'
    - >-
      nix develop ./flake -c python -m scripts.roku_bridge |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/roku-bridge-bulbs.yaml'
    - >-
      printf '%s' "$ROKU_BRIDGE_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-roku-bridge-password'
    - >-
      nixos-rebuild --flake ./flake#adguard-netbird-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.10 --build-host rupan@10.0.30.10
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo test -e /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Lite_MG21_048030cb64a2ef11b809926661ce3355-if00-port0;
      sudo systemctl is-active mosquitto zigbee2mqtt roku-bridge'

.deploy_registry_node:
  extends: .registry_ssh
  stage: deploy
  resource_group: registry-node-rollout
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      test "$(nix eval --json
      path:.?dir=flake#nixosConfigurations.${DEPLOY_HOST}-registry.config.homelab.k3s.registry.enable)"
      = "true"
    - >-
      nix develop ./flake -c python -m scripts.registry node-config
      --lock registry/images.lock.json --username node
      --password-file "$REGISTRY_NODE_PASSWORD_FILE"
      --output /tmp/k3s-registries.yaml
    - >-
      node_password="$(tr -d '\r\n' < "$REGISTRY_NODE_PASSWORD_FILE")";
      test -n "$node_password";
      node_auth="$(printf 'node:%s' "$node_password" | base64 -w0)";
      jq -n --arg auth "$node_auth"
      '{"auths":{"registry.rupan.dev":{"auth":$auth}}}'
      > /tmp/registry-node-auth.json;
      chmod 0600 /tmp/registry-node-auth.json;
      unset node_password node_auth
    - export REGISTRY_DEST_AUTH_FILE=/tmp/registry-node-auth.json
    - >-
      nix develop ./flake -c just registry-verify
      /tmp/registry-node-verify-report.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/k3s-registries.yaml'
      < /tmp/k3s-registries.yaml
    - >-
      nixos-rebuild --flake ./flake#"$DEPLOY_HOST-registry" --use-remote-sudo switch
      --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo systemctl is-active k3s && sudo test -s /etc/rancher/k3s/registries.yaml'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.11
      'sudo k3s kubectl get --raw="/readyz?verbose" | grep -F "[+]etcd ok";
      sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s'

