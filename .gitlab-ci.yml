opnsense_inventory:
  timeout: 15m
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: opnsense-control-plane
  needs:
    - repository_tests
    - flake_check
    - secret_scan
    - nix_format
    - yaml_schema
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - nix develop ./flake -c python -m opnsense_reconciler.inventory --artifact-dir artifacts/opnsense
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/opnsense/

opnsense_plan:
  timeout: 15m
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: opnsense-control-plane
  variables:
    # The firewall serves its default self-signed cert (SAN: OPNsense.internal,
    # no IP SANs) and the tofu provider has no TLS server-name override, so it
    # must address the firewall by its certificate DNS name, not the IP literal.
    OPNSENSE_URI: "https://OPNsense.internal"
    TF_VAR_opnsense_uri: "https://OPNsense.internal"
  before_script:
    - export SSL_CERT_FILE="/tmp/opnsense-combined-ca.crt"
    - >-
      for bundle in "${NIX_SSL_CERT_FILE:-}" /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-bundle.crt; do
        if [ -n "$bundle" ] && [ -f "$bundle" ]; then
          cat "$bundle" > "$SSL_CERT_FILE"
          break
        fi
      done
    - >-
      if [ -n "${OPNSENSE_CA_FILE:-}" ] && [ -f "${OPNSENSE_CA_FILE:-}" ]; then
        cat "$OPNSENSE_CA_FILE" >> "$SSL_CERT_FILE"
      fi
  after_script:
    - rm -f /tmp/opnsense-combined-ca.crt
  needs:
    - job: opnsense_inventory
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - >-
      nix develop ./flake -c bash -e -c '
      tofu -chdir=tofu/opnsense init -reconfigure &&
      tofu -chdir=tofu/opnsense validate &&
      tofu -chdir=tofu/opnsense plan -refresh-only -out=refresh-only.tfplan &&
      tofu -chdir=tofu/opnsense plan -out=desired.tfplan'
  artifacts:
    expire_in: 7 days
    paths:
      - tofu/opnsense/refresh-only.tfplan
      - tofu/opnsense/desired.tfplan

opnsense_dataplane:
  timeout: 15m
  stage: opnsense
  tags:
    - nas-privileged
  resource_group: opnsense-control-plane
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - >-
      nix develop ./flake -c python -m opnsense_reconciler.dataplane
      --targets opnsense_reconciler/lb-data-plane-targets.json

opnsense_apply:
  retry: 0
  timeout: 45m
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: opnsense-control-plane
  variables:
    OPNSENSE_URI: "https://OPNsense.internal"
  before_script:
    - export SSL_CERT_FILE="/tmp/opnsense-combined-ca.crt"
    - >-
      for bundle in "${NIX_SSL_CERT_FILE:-}" /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-bundle.crt; do
        if [ -n "$bundle" ] && [ -f "$bundle" ]; then
          cat "$bundle" > "$SSL_CERT_FILE"
          break
        fi
      done
    - >-
      if [ -n "${OPNSENSE_CA_FILE:-}" ] && [ -f "${OPNSENSE_CA_FILE:-}" ]; then
        cat "$OPNSENSE_CA_FILE" >> "$SSL_CERT_FILE"
      fi
  after_script:
    - rm -f /tmp/opnsense-combined-ca.crt
  needs:
    - job: opnsense_inventory
      artifacts: true
    - job: opnsense_plan
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nix develop ./flake -c tofu -chdir=tofu/opnsense show -json desired.tfplan
      > /tmp/desired.json && nix develop ./flake -c python -m
      opnsense_reconciler.check_plan --plan /tmp/desired.json --expect-uri "$OPNSENSE_URI"
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - nix develop ./flake -c tofu -chdir=tofu/opnsense init -reconfigure
    - nix develop ./flake -c tofu -chdir=tofu/opnsense apply desired.tfplan
    - >-
      nix develop ./flake -c python -m opnsense_reconciler.reconcile
      --assignments opnsense_reconciler/assignments.json
      --inventory artifacts/opnsense/inventory.json
      --kea-interfaces opnsense_reconciler/kea-interfaces.json
      --udp-broadcast-relays opnsense_reconciler/udp-broadcast-relays.json
      --bgp-neighbors opnsense_reconciler/bgp-neighbors.json
      --bgp-expected-routes opnsense_reconciler/bgp-expected-routes.json
      --outbound-nat-rules opnsense_reconciler/outbound-nat-rules.json
      --unbound-acls opnsense_reconciler/unbound-acls.json
    - >-
      nix develop ./flake -c python -m opnsense_reconciler.dataplane
      --targets opnsense_reconciler/lb-data-plane-targets.json

