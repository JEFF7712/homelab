stages:
  - lint
  - validate
  - security
  - build
  - image_scan
  - sync
  # - apply
  # - configure

variables:
  # renovate: datasource=docker depName=jeff7712/homelab-ci
  CI_IMAGE_TAG: "0.0.1230"

  KUBERNETES_VERSION: "1.35.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

yaml_lint:
  stage: lint
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  script:
    - nix develop /etc/ci-flake#ci -c yamllint .

json_validate:
  stage: lint
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  script:
    - nix develop /etc/ci-flake#ci -c python -m json.tool renovate.json > /dev/null

terraform_format:
  stage: lint
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - terraform/**/*
        - .gitlab-ci.yml
  script:
    - nix develop /etc/ci-flake#ci -c terraform fmt -check -recursive terraform
    - nix develop /etc/ci-flake#ci -c terragrunt hcl format --check --working-dir terraform

ansible_lint:
  stage: lint
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - ansible/**/*
        - .gitlab-ci.yml
  script:
    - |
      nix develop /etc/ci-flake#ci -c bash -e -c '
        ansible-galaxy collection install -r ansible/requirements.yml
        cd ansible
        ansible-lint
      '

ansible_syntax:
  stage: validate
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - ansible/**/*
        - .gitlab-ci.yml
  script:
    - |
      nix develop /etc/ci-flake#ci -c bash -e -c '
        ansible-galaxy collection install -r ansible/requirements.yml
        cd ansible
        for playbook in playbooks/*.yml; do
          ansible-playbook --syntax-check "$playbook"
        done
      '

argocd_app_validate:
  stage: validate
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - apps/**/*
        - scripts/validate_argocd_apps.py
        - .gitlab-ci.yml
  script:
    - nix develop /etc/ci-flake#ci -c python scripts/validate_argocd_apps.py

kubernetes_validate:
  stage: validate
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - apps/**/*
        - bootstrap/**/*
        - infrastructure/**/*
        - secrets/**/*
        - .gitlab-ci.yml
  script:
    - |
      nix develop /etc/ci-flake#ci -c bash -e -c '
        find apps bootstrap infrastructure secrets \
          -type f \( -name "*.yaml" -o -name "*.yml" \) \
          ! -path "bootstrap/wyse-disk-patch.yaml" \
          -print0 \
          | xargs -0 kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION"
      '

terraform_validate:
  stage: validate
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  rules:
    - changes:
        - terraform/**/*
        - .gitlab-ci.yml
  script:
    - nix develop /etc/ci-flake#ci -c terragrunt run --all init --non-interactive --working-dir terraform
    - nix develop /etc/ci-flake#ci -c terragrunt run --all validate --non-interactive --working-dir terraform

secret_scan:
  stage: security
  variables:
    GIT_DEPTH: "0"
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  script:
    - nix develop /etc/ci-flake#ci -c gitleaks detect --source . --redact --verbose

kubernetes_security_scan:
  stage: security
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  script:
    - nix develop /etc/ci-flake#ci -c trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .

sync_to_github:
  stage: sync
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      nix develop /etc/ci-flake#ci -c bash -e -c '
        git remote add github "https://oauth2:$GITHUB_TOKEN@github.com/JEFF7712/homelab.git"
        git fetch --unshallow || git fetch --all

        printf "**NOTE - This repository is a mirror.** Active development happens on [GitLab](https://gitlab.com/JEFF7712/homelab).\n\n%s" "$(cat README.md)" > README.md

        git config --global user.email "runner@gitlab.com"
        git config --global user.name "GitLab Runner"
        git commit -am "Automated: Add GitHub Mirror Warning" || echo "No changes to commit"

        for attempt in 1 2 3; do
          if git -c http.version=HTTP/1.1 push github HEAD:main --force; then
            exit 0
          fi
          sleep $((attempt * 15))
        done
        exit 1
      '

build_renovate_agent_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-agent/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-agent"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-agent/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

build_renovate_dashboard_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-dashboard/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-dashboard"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-dashboard"
      --dockerfile "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-dashboard/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

scan_renovate_agent_image:
  stage: image_scan
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  needs:
    - build_renovate_agent_image
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-agent/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-agent"
  script:
    - nix develop /etc/ci-flake#ci -c trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"

scan_renovate_dashboard_image:
  stage: image_scan
  image: jeff7712/homelab-ci:$CI_IMAGE_TAG
  needs:
    - build_renovate_dashboard_image
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-dashboard/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-dashboard"
  script:
    - nix develop /etc/ci-flake#ci -c trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"

build_ci_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  # NOTE: do NOT include .gitlab-ci.yml in changes — that would feedback-loop
  # with Renovate's CI_IMAGE_TAG bumps. The image's content only depends on
  # flake.nix, flake.lock, and the Dockerfile.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - flake.nix
        - flake.lock
        - infrastructure/automation/images/ci/**/*
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-ci"
    # Nix needs to build terraform from source (HashiCorp BSL is excluded from
    # cache.nixos.org); the default 1Gi pod limit OOMs during the Go build.
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    KUBERNETES_CPU_REQUEST: "500m"
    KUBERNETES_CPU_LIMIT: "4"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infrastructure/automation/images/ci/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

push_ci_closure_to_attic:
  stage: image_scan
  # Use the just-built image (matches build_ci_image's IMAGE_TAG) so the
  # push job always has the same attic-client version as the closure it
  # pushes; avoids waiting for Renovate to bump $CI_IMAGE_TAG.
  image: jeff7712/homelab-ci:0.0.$CI_PIPELINE_IID
  needs:
    - build_ci_image
  allow_failure: true
  # Mirror build_ci_image rules — only fire when actual image inputs change.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - flake.nix
        - flake.lock
        - infrastructure/automation/images/ci/**/*
  variables:
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - |
      nix develop /etc/ci-flake#ci -c bash -c '
        set -u
        attic login homelab http://10.0.20.190:8080 "$ATTIC_CI_PUSH_TOKEN" || exit 1
        root=$(cat /etc/ci-flake/closure-root)
        echo "Pushing closure of $root"
        # Push paths one-at-a-time so a single "Bad chunk hash or size"
        # failure does not abort the whole batch.
        failed=0
        total=0
        while read -r path; do
          total=$((total + 1))
          if ! attic push homelab "$path"; then
            echo "WARN: push failed for $path" >&2
            failed=$((failed + 1))
          fi
        done < <(nix path-info --recursive --offline "$root")
        echo "attic push summary: $((total - failed))/$total paths uploaded ($failed failures)"
        # allow_failure: true also set on the job; we still return 0 so the
        # job is recorded as "passed-with-warnings" rather than failed.
        exit 0
      '

