stages:
  - lint
  - validate
  - security
  - build
  - image_scan
  - sync
  # - apply
  # - configure

variables:
  KUBECONFORM_VERSION: "0.6.7"
  KUBERNETES_VERSION: "1.35.0"
  TERRAGRUNT_VERSION: "0.99.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

.terraform_terragrunt:
  image:
    name: hashicorp/terraform:1.15.4
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl
    - curl -fsSLo /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
    - chmod +x /usr/local/bin/terragrunt

yaml_lint:
  stage: lint
  image: python:3.13-alpine
  before_script:
    - pip install --no-cache-dir yamllint
  script:
    - yamllint .

json_validate:
  stage: lint
  image: python:3.13-alpine
  script:
    - python -m json.tool renovate.json > /dev/null

terraform_format:
  stage: lint
  extends: .terraform_terragrunt
  script:
    - terraform fmt -check -recursive terraform
    - terragrunt hcl format --check --working-dir terraform

ansible_lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir ansible ansible-lint
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - cd ansible
    - ansible-lint

ansible_syntax:
  stage: validate
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir ansible
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - cd ansible
    - for playbook in playbooks/*.yml; do ansible-playbook --syntax-check "$playbook"; done

argocd_app_validate:
  stage: validate
  image: python:3.13-alpine
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - python scripts/validate_argocd_apps.py

kubernetes_validate:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
  script:
    - |
      find apps bootstrap infrastructure secrets \
        -type f \( -name '*.yaml' -o -name '*.yml' \) \
        ! -path 'bootstrap/wyse-disk-patch.yaml' \
        -print0 \
        | xargs -0 kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION"

terraform_validate:
  stage: validate
  extends: .terraform_terragrunt
  cache:
    key: terraform-${CI_COMMIT_REF_SLUG}
    paths:
      - terraform/**/.terraform/
      - terraform/**/.terragrunt-cache/
  script:
    - terragrunt run --all init --non-interactive --working-dir terraform
    - terragrunt run --all validate --non-interactive --working-dir terraform

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose

kubernetes_security_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .

sync_to_github:
  stage: sync
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - git remote add github https://oauth2:$GITHUB_TOKEN@github.com/JEFF7712/homelab.git
    - git fetch --unshallow || git fetch --all

    - echo -e "**NOTE - This repository is a mirror.** Active development happens on [GitLab](https://gitlab.com/JEFF7712/homelab).\n\n$(cat README.md)" > README.md

    - git config --global user.email "runner@gitlab.com"
    - git config --global user.name "GitLab Runner"
    - 'git commit -am "Automated: Add GitHub Mirror Warning" || echo "No changes to commit"'

    - git push github HEAD:main --force

build_renovate_agent_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-agent/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-agent"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-agent/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

build_renovate_dashboard_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-dashboard/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-dashboard"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-dashboard"
      --dockerfile "$CI_PROJECT_DIR/infrastructure/automation/images/renovate-dashboard/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"

scan_renovate_agent_image:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build_renovate_agent_image
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-agent/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-agent"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"

scan_renovate_dashboard_image:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build_renovate_dashboard_image
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/automation/images/renovate-dashboard/**/*
        - .gitlab-ci.yml
  variables:
    IMAGE_TAG: "0.0.$CI_PIPELINE_IID"
    IMAGE_NAME: "jeff7712/homelab-renovate-dashboard"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"

