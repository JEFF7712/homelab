.deploy_home_assistant_base:
  stage: deploy
  resource_group: home-assistant-homelab-01
  tags:
    - nas-privileged
  environment:
    name: production
  needs:
    - repository_tests
    - flake_check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - home-assistant/**/*
        - gitops/home-assistant/**/*
      when: manual
  before_script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - mkdir -p ~/.ssh ~/.kube
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.11
      'sudo cat /etc/rancher/k3s/k3s.yaml' |
      sed 's/127.0.0.1/10.0.30.11/' > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG="$HOME/.kube/config"
    - >-
      if [ -z "${HASS_TOKEN:-}" ]; then
        token_b64=$(kubectl get secret -n home-assistant home-assistant-token \
          -o jsonpath='{.data.token}' 2>/dev/null || true)
        export HASS_TOKEN=$(echo "$token_b64" | base64 -d 2>/dev/null || true)
      fi
    - >-
      if [ -z "${HASS_TOKEN:-}" ]; then echo 'ERROR: HASS_TOKEN is empty and
      cluster secret home-assistant/home-assistant-token is missing or
      unreadable. Provision it once with: kubectl create secret -n
      home-assistant generic home-assistant-token
      --from-literal=token=<HA long-lived access token>' >&2; exit 1; fi
  after_script:
    - shred -u ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.kube/config 2>/dev/null || rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.kube/config  # yamllint disable-line rule:line-length

deploy_home_assistant_dry_run:
  extends: .deploy_home_assistant_base
  script:
    - nix develop ./flake -c python -m scripts.home_assistant diff --instance homelab-01

deploy_home_assistant:
  extends: .deploy_home_assistant_base
  script:
    - >-
      nix develop ./flake -c python -m scripts.home_assistant plan --instance homelab-01 --json > plan.json;
      rc=$?; cat plan.json; test $rc -eq 0
    - >-
      plan_file=$(nix develop ./flake -c python3 -c 'import json; print(json.load(open("plan.json"))["plan_file"])')
    - nix develop ./flake -c python -m scripts.home_assistant apply --instance homelab-01 --plan-file "$plan_file" --yes
    - nix develop ./flake -c python -m scripts.home_assistant verify --instance homelab-01


sync_to_github:
  stage: sync
  tags:
    - nas-ci
  image: nixos/nix:latest@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - repository_tests
    - flake_check
    - nix_format
    - yaml_schema
    - secret_scan
  script:
    - >-
      nix develop ./flake -c bash -e -c '
        export GIT_TERMINAL_PROMPT=0
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "WARNING: GITHUB_TOKEN is not set; skipping GitHub mirror sync."
          exit 0
        fi
        cred_config=$(mktemp /tmp/gh-credential-config-XXXXXX)
        printf "%s\n" "[credential \"https://github.com\"]" "helper =" > "$cred_config"
        printf 'helper = "!f() { echo username=x-access-token; echo password=%s; }; f"\n' \
          "$GITHUB_TOKEN" >> "$cred_config"
        git config --local --unset-all include.path 2>/dev/null || true
        git config --local --add include.path "$cred_config"
        git remote set-url github https://github.com/JEFF7712/homelab-new.git 2>/dev/null ||
          git remote add github https://github.com/JEFF7712/homelab-new.git
        git fetch --unshallow origin 2>/dev/null || git fetch origin

        mirror_warning="**NOTE - This repository is a mirror.** Active development happens "
        mirror_warning+="on [GitLab](https://gitlab.com/JEFF7712/homelab-new)."
        printf "%s\n\n%s" "$mirror_warning" "$(cat README.md)" > README.md

        git config user.email "runner@gitlab.com"
        git config user.name "GitLab Runner"
        git commit -am "Automated: Add GitHub Mirror Warning" || echo "No changes to commit"

        for attempt in 1 2 3; do
          if git -c http.version=HTTP/1.1 push github HEAD:main --force; then
            rm -f "$cred_config"
            exit 0
          fi
          sleep $((attempt * 15))
        done
        rm -f "$cred_config"
        exit 1
      '
  after_script:
    - git remote remove github 2>/dev/null || true
    - git config --local --unset-all include.path 2>/dev/null || true
    - rm -f /tmp/gh-credential-config*
