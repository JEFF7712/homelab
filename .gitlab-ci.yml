image: nixos/nix:latest@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c

default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_external_dependency_failure

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

stages:
  - lint
  - test
  - security
  - sync
  - registry
  - opnsense
  - deploy

variables:
  NIX_CONFIG: |-
    experimental-features = nix-command flakes
    extra-substituters = http://10.0.30.20:8080/homelab
    extra-trusted-public-keys = homelab:J+OVQOCG2sNT2KoVbWGPikoWcIbBanHnY2NOcMF3vwk=
  TF_PLUGIN_CACHE_DIR: "/tmp/tofu-plugin-cache"
  TF_STATE_NAME: opnsense-production
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  TF_HTTP_LOCK_METHOD: POST
  TF_HTTP_UNLOCK_METHOD: DELETE
  TF_HTTP_RETRY_WAIT_MIN: "5"

.nas_ci:
  timeout: 15m
  tags:
    - nas-ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.shared_feature:
  timeout: 15m
  tags:
    - nas-ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

.nix_format:
  timeout: 15m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
  interruptible: true
  stage: lint
  needs: []
  script:
    - nix develop ./flake -c python -m scripts.ci.run formatting -- just fmt-check

nix_format:
  extends:
    - .nas_ci
    - .nix_format

nix_format_feature:
  extends:
    - .shared_feature
    - .nix_format

.repository_tests:
  timeout: 15m
  interruptible: true
  stage: test
  needs: []
  variables:
    SKIP_FLAKE_CHECK: "1"
    SKIP_SECRET_SCAN: "1"
    CI_LINT_EXTERNAL: "1"
    CI_TEST_REPORT: artifacts/ci/tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
    reports:
      junit: artifacts/ci/tests.xml
  script:
    - nix develop ./flake -c python -m scripts.ci.run providers -- just provision-check-deps
    - nix develop ./flake -c python -m scripts.ci.run repository -- just check

repository_tests:
  extends:
    - .nas_ci
    - .repository_tests

repository_tests_feature:
  extends:
    - .shared_feature
    - .repository_tests

jev_decision_gate:
  timeout: 15m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
  interruptible: true
  extends:
    - .shared_feature
    - .nas_ci
  stage: test
  needs: []
  script:
    - nix develop ./flake -c python -m scripts.ci.run decisions -- python scripts/jev_decision_gate.py

.flake_check:
  timeout: 15m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
  interruptible: true
  resource_group: nix-flake-evaluation
  stage: test
  needs: []
  script:
    - >-
      nix develop ./flake -c python -m scripts.ci.run flake -- bash -c
      'export NIX_SHOW_STATS=1; time nix flake check ./flake --no-write-lock-file'

flake_check:
  extends:
    - .nas_ci
    - .flake_check

flake_check_feature:
  extends:
    - .shared_feature
    - .flake_check

.yaml_schema:
  timeout: 15m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
  interruptible: true
  stage: test
  needs: []
  script:
    - nix develop ./flake -c python -m scripts.ci.run yaml -- yamllint .

yaml_schema:
  extends:
    - .nas_ci
    - .yaml_schema

yaml_schema_feature:
  extends:
    - .shared_feature
    - .yaml_schema

.nix_cache:
  stage: test
  timeout: 45m
  resource_group: nix-flake-evaluation
  script:
    - nix develop ./flake -c python -m scripts.ci.run cache -- bash scripts/ci/cache.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/

nix_cache:
  extends:
    - .nas_ci
    - .nix_cache
  needs:
    - repository_tests
    - flake_check
    - secret_scan
    - nix_format
    - yaml_schema
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - flake/**/*
        - config/**/*
        - scripts/**/*
        - tests/**/*
        - gitops/**/*
        - registry/**/*
        - home-assistant/**/*
        - .gitlab-ci.yml
        - justfile
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: manual
      allow_failure: false

.secret_scan:
  timeout: 15m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ci/
  interruptible: true
  stage: test
  needs: []
  script:
    - nix develop ./flake -c python -m scripts.ci.run secrets -- bash scripts/checks/secrets.sh

secret_scan:
  extends:
    - .nas_ci
    - .secret_scan

secret_scan_feature:
  extends:
    - .shared_feature
    - .secret_scan

.registry_lock:
  timeout: 15m
  interruptible: true
  stage: test
  needs: []
  script:
    - >-
      nix develop ./flake -c python -m scripts.ci.run registry -- bash -euo pipefail -c
      'just registry-check && just registry-plan > registry-copy-plan.json'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - registry-copy-plan.json
      - artifacts/ci/

registry_lock:
  extends:
    - .nas_ci
    - .registry_lock

registry_lock_feature:
  extends:
    - .shared_feature
    - .registry_lock

registry_resolve:
  timeout: 15m
  stage: registry
  tags:
    - nas-ci
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -c 'import base64, json, os;
      password = open(os.environ["REGISTRY_NODE_PASSWORD_FILE"]).read().strip();
      assert password, "node registry password is empty";
      auth = base64.b64encode(f"node:{password}".encode()).decode();
      fd = os.open("/tmp/registry-node-auth.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600);
      handle = os.fdopen(fd, "w");
      json.dump({"auths": {"registry.rupan.dev": {"auth": auth}}}, handle);
      handle.close()'
    - export REGISTRY_DEST_AUTH_FILE=/tmp/registry-node-auth.json
    - mkdir -p artifacts/registry
    - >-
      nix develop ./flake -c python -m scripts.registry inventory
      --output artifacts/registry/images.inventory.json
    - >-
      nix develop ./flake -c python -m scripts.registry resolve
      --inventory artifacts/registry/images.inventory.json
      --output artifacts/registry/images.lock.candidate.json
    - >-
      nix develop ./flake -c python -m scripts.registry plan
      --lock artifacts/registry/images.lock.candidate.json
      > artifacts/registry/copy-plan.candidate.json
  after_script:
    - shred -u /tmp/registry-node-auth.json 2>/dev/null || rm -f /tmp/registry-node-auth.json
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/registry/

registry_promote_first_party:
  retry: 0
  timeout: 15m
  stage: registry
  tags:
    - nas-ci
  resource_group: registry-content
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -c 'import base64, json, os;
      password = open(os.environ["REGISTRY_NODE_PASSWORD_FILE"]).read().strip();
      assert password, "node registry password is empty";
      auth = base64.b64encode(f"node:{password}".encode()).decode();
      fd = os.open("/tmp/registry-node-auth.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600);
      handle = os.fdopen(fd, "w");
      json.dump({"auths": {"registry.rupan.dev": {"auth": auth}}}, handle);
      handle.close()'
    - export REGISTRY_DEST_AUTH_FILE=/tmp/registry-node-auth.json
    - >-
      nix develop ./flake -c python -m scripts.registry promote
      --lock registry/images.lock.json
      --inventory registry/images.inventory.json
      | tee promote-report.json
    - nix develop ./flake -c bash -c 'just check-registry'
    - >-
      nix develop ./flake -c bash -e -c '
        export GIT_TERMINAL_PROMPT=0
        if git diff --quiet -- registry/ gitops/; then
          echo "No first-party promotions; nothing to commit."
          exit 0
        fi
        if [ -z "${GITLAB_PUSH_TOKEN:-}" ]; then
          echo "WARNING: GITLAB_PUSH_TOKEN is not set; promotion changes will not be committed."
          git diff --stat -- registry/ gitops/
          exit 0
        fi
        git config user.email "registry-promote@homelab.local"
        git config user.name "Homelab Registry Promotion"
        git add registry/ gitops/
        git commit -m "registry: promote first-party images to newest producer tags"
        push_url="https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        for attempt in 1 2 3; do
          if git push "$push_url" HEAD:"$CI_COMMIT_BRANCH"; then
            exit 0
          fi
          git fetch "$push_url" "$CI_COMMIT_BRANCH"
          git rebase FETCH_HEAD
          sleep $((attempt * 15))
        done
        exit 1
      '
  artifacts:
    expire_in: 7 days
    when: always
    paths:
      - promote-report.json
  after_script:
    - shred -u /tmp/registry-node-auth.json 2>/dev/null || rm -f /tmp/registry-node-auth.json

registry_update_import:
  retry: 0
  timeout: 15m
  stage: registry
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: registry-content
  needs:
    - job: registry_resolve
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_IMPORTER_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -m scripts.registry copy
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-import-report.json
    - >-
      nix develop ./flake -c python -m scripts.registry verify
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-verify-report.json
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

registry_lock_import:
  retry: 0
  timeout: 15m
  stage: registry
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: registry-content
  needs:
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_IMPORTER_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -m scripts.registry copy
      --lock registry/images.lock.json --kind upstream
      --report artifacts/registry/lock-import-report.json
    - >-
      nix develop ./flake -c python -m scripts.registry verify
      --lock registry/images.lock.json --kind upstream
      --report artifacts/registry/lock-verify-report.json
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

.registry_ssh:
  retry: 0
  timeout: 45m
  tags:
    - nas-privileged
  environment:
    name: production
  before_script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"
  after_script:
    - shred -u ~/.ssh/id_ed25519 ~/.ssh/known_hosts 2>/dev/null || rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

provision_jarvis_publisher:
  timeout: 45m
  extends: .registry_ssh
  stage: registry
  resource_group: registry-platform
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - nix develop ./flake -c python -m unittest tests.test_registry_jarvis_publisher
    - nix develop ./flake -c just check-registry
    - nix develop ./flake -c python -m scripts.registry.provision_jarvis

deploy_registry_platform:
  timeout: 45m
  extends: .registry_ssh
  stage: registry
  resource_group: registry-platform
  needs:
    - repository_tests
    - flake_check
    - secret_scan
    - registry_lock
    - nix_format
    - yaml_schema
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo zfs list tank/registry >/dev/null 2>&1 || sudo zfs create -o mountpoint=legacy tank/registry;
      sudo install -d -m 0750 -o root -g root /tank/registry /persist/zot /persist/zot/status'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/htpasswd'
      < "$REGISTRY_HTPASSWD_FILE"
    - >-
      nix develop ./flake -c python -m scripts.registry access-control
      --lock registry/images.lock.json --output /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/access-control.json'
      < /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/cloudflare-dns-api-token'
      < "$REGISTRY_CLOUDFLARE_TOKEN_FILE"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/restic-password'
      < "$REGISTRY_RESTIC_PASSWORD_FILE"
    - >-
      nixos-rebuild --flake ./flake#nas-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.20 --build-host rupan@10.0.30.20
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo chown root:zot /persist/zot/restic-password;
      sudo chmod 0640 /persist/zot/restic-password'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'mountpoint -q /tank/registry && sudo systemctl is-active zot nginx'

deploy_registry_dns:
  timeout: 45m
  extends: .registry_ssh
  stage: registry
  resource_group: registry-dns
  needs:
    - deploy_registry_platform
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nixos-rebuild --flake ./flake#adguard-netbird-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.10 --build-host rupan@10.0.30.10
    - >-
      test "$(getent ahostsv4 registry.rupan.dev | awk 'NR == 1 { print $1 }')"
      = 10.0.30.20
    - >-
      test "$(nix develop ./flake -c curl --silent --show-error --output /dev/null
      --write-out '%{http_code}' https://registry.rupan.dev/v2/)" = 401

deploy_zigbee_gateway:
  retry: 0
  timeout: 45m
  extends: .registry_ssh
  stage: deploy
  resource_group: zigbee-gateway
  needs:
    - repository_tests
    - flake_check
    - secret_scan
    - nix_format
    - yaml_schema
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nix develop ./flake -c python -m scripts.zigbee_gateway |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/zigbee2mqtt-secret.yaml'
    - >-
      printf '%s' "$HOME_ASSISTANT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-home-assistant-password'
    - >-
      printf '%s' "$ZIGBEE2MQTT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-zigbee2mqtt-password'
    - >-
      nix develop ./flake -c python -m scripts.roku_bridge |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/roku-bridge-bulbs.yaml'
    - >-
      printf '%s' "$ROKU_BRIDGE_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/mosquitto-roku-bridge-password'
    - >-
      nix develop ./flake -c python -m scripts.roku_cloud_bridge |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/roku-cloud-bulbs.yaml'
    - >-
      ROKU_CLOUD_RENDER_MODE=cookies nix develop ./flake -c python -m scripts.roku_cloud_bridge |
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/roku-cloud-cookies.json'
    - >-
      nixos-rebuild --flake ./flake#adguard-netbird-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.10 --build-host rupan@10.0.30.10
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo systemctl restart roku-bridge-secrets roku-cloud-bridge-secrets
      roku-bridge roku-cloud-bridge'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.10
      'sudo test -e /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Lite_MG21_048030cb64a2ef11b809926661ce3355-if00-port0;
      sudo systemctl is-active mosquitto zigbee2mqtt roku-bridge roku-cloud-bridge ledfx-roku-bridge'

.deploy_registry_node:
  retry: 0
  timeout: 45m
  extends: .registry_ssh
  stage: deploy
  resource_group: registry-node-rollout
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      test "$(nix eval --json
      path:.?dir=flake#nixosConfigurations.${DEPLOY_HOST}-registry.config.homelab.k3s.registry.enable)"
      = "true"
    - >-
      nix develop ./flake -c python -m scripts.registry node-config
      --lock registry/images.lock.json --username node
      --password-file "$REGISTRY_NODE_PASSWORD_FILE"
      --output /tmp/k3s-registries.yaml
    - >-
      node_password="$(tr -d '\r\n' < "$REGISTRY_NODE_PASSWORD_FILE")";
      test -n "$node_password";
      node_auth="$(printf 'node:%s' "$node_password" | base64 -w0)";
      jq -n --arg auth "$node_auth"
      '{"auths":{"registry.rupan.dev":{"auth":$auth}}}'
      > /tmp/registry-node-auth.json;
      chmod 0600 /tmp/registry-node-auth.json;
      unset node_password node_auth
    - export REGISTRY_DEST_AUTH_FILE=/tmp/registry-node-auth.json
    - >-
      nix develop ./flake -c just registry-verify
      /tmp/registry-node-verify-report.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/k3s-registries.yaml'
      < /tmp/k3s-registries.yaml
    - >-
      nixos-rebuild --flake ./flake#"$DEPLOY_HOST-registry" --use-remote-sudo switch
      --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo systemctl is-active k3s && sudo test -s /etc/rancher/k3s/registries.yaml'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.11
      'sudo k3s kubectl get --raw="/readyz?verbose" | grep -F "[+]etcd ok";
      sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s'

deploy_nas_ledfx_bedroom:
  retry: 0
  timeout: 45m
  extends: .registry_ssh
  stage: deploy
  resource_group: nas-ledfx-bedroom
  needs:
    - repository_tests
    - flake_check
    - secret_scan
    - nix_format
    - yaml_schema
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    # Reuse the existing read-only `node` registry account rather than minting a
    # second credential: it already has read on upstream/** and is what the k3s
    # nodes authenticate with. The NAS never sees the password itself, only
    # this podman authfile.
    - >-
      nix develop ./flake -c python3 -c 'import base64,json,os,pathlib;
      password = pathlib.Path(os.environ["REGISTRY_NODE_PASSWORD_FILE"]).read_text().strip();
      auth = base64.b64encode(f"node:{password}".encode()).decode();
      pathlib.Path("/tmp/registry-auth.json").write_text(
      json.dumps({"auths": {"registry.rupan.dev": {"auth": auth}}}, indent=2))'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -d -m 0700 /persist/secrets;
      sudo install -m 0600 -o root -g root /dev/stdin
      /persist/secrets/registry-auth.json' < /tmp/registry-auth.json
    - >-
      rm -f /tmp/registry-auth.json
    - >-
      nixos-rebuild --flake ./flake#nas-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.20 --build-host rupan@10.0.30.20
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo systemctl is-active ledfx-bedroom;
      for attempt in $(seq 1 60); do
        if curl --silent --fail --output /dev/null http://127.0.0.1:8888/api/info; then
          echo "LedFx API ready"; exit 0
        fi;
        sleep 2;
      done;
      echo "LedFx API did not become ready" >&2;
      sudo journalctl -u ledfx-bedroom -n 40 --no-pager >&2;
      exit 1'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.11
      'sudo k3s kubectl get --raw="/readyz" >/dev/null'

