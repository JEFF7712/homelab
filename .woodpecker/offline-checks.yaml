# .woodpecker/offline-checks.yaml
# Complete offline validation gate: all tests, flake evaluations, gitops checks.

when:
  - event: [pull_request, push, manual]
    branch: main

labels:
  tier: trusted
  type: local

concurrency:
  group: nix-flake-evaluation
  limit: 1

steps:
  - name: provision-deps
    image: bash
    commands:
      - nix develop ./flake -c just provision-check-deps

  - name: offline-gate
    image: bash
    environment:
      CI_LINT_EXTERNAL: "1"
    commands:
      - nix develop ./flake -c bash scripts/checks/all.sh
