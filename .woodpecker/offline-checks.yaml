when:
  - event: [pull_request, push, manual, tag, cron]

labels:
  tier: sandbox
  type: docker

steps:
  - name: validation-v2
    image: nixos/nix:latest@sha256:9305de534abed691d0f569502a4962a3a072ea8e888502c453ecfe35ae182867
    environment:
      CI_LINT_EXTERNAL: "1"
      TF_PLUGIN_CACHE_DIR: "/tmp/tofu-plugin-cache"
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
        build-users-group =
        max-jobs = 2
        cores = 2
        connect-timeout = 5
        download-attempts = 3
        extra-substituters = http://10.0.30.20:8080/homelab?priority=30
        extra-trusted-public-keys = homelab:J+OVQOCG2sNT2KoVbWGPikoWcIbBanHnY2NOcMF3vwk=
    commands:
      - >-
        nix develop ./flake#ci -c bash -e -c 'python -m scripts.ci.run fmt -- just
        fmt-check & f=$!; python -m scripts.ci.run jev -- python
        scripts/jev_decision_gate.py & j=$!; python -m scripts.ci.run gate --
        python -m scripts.ci.validate repository & c=$!; rc=0; wait "$f" ||
        rc=1; wait "$j" || rc=1; wait "$c" || rc=1; python -m
        scripts.ci.timings_report || true; exit $rc'
