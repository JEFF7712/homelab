when:
  - event: [pull_request, push, manual, tag, cron]

labels:
  tier: sandbox
  type: docker

steps:
  - name: validation-v2
    image: nixos/nix:latest@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
        max-jobs = 1
        cores = 2
        extra-substituters = http://10.0.30.20:8080/homelab
        extra-trusted-public-keys = homelab:J+OVQOCG2sNT2KoVbWGPikoWcIbBanHnY2NOcMF3vwk=
    commands:
      - >-
        nix develop ./flake -c bash -e -c 'just provision-check-deps; just
        fmt-check & f=$!; python scripts/jev_decision_gate.py & j=$!; just
        check & c=$!; wait "$f" && wait "$j" && wait "$c"'
