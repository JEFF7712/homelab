# .woodpecker/tofu-plan.yaml
# Infrastructure plans and validation against Garage S3 backend.

when:
  - event: [push, manual]
    branch: main

labels:
  tier: trusted
  type: local

concurrency:
  group: opnsense-control-plane
  limit: 1

steps:
  - name: tofu-validation
    image: bash
    commands:
      - nix develop ./flake -c bash scripts/checks/tofu.sh
