# predmarkbot — credentials template.
#
# Copy this file to `credentials.yaml` (gitignored) and fill in your values.
# This is the canonical source of truth for predmarkbot secrets.
#
# ─── Roadmap ────────────────────────────────────────────────────────
#
# Local dev (today):
#   `credentials.yaml` lives at the repo root, gitignored. The bot reads
#   credentials from env vars + file paths, so you either export them
#   yourself or hook up direnv / a tiny loader script to project this
#   file into your shell.
#
# Plan 2 (homelab GitOps):
#   - Each top-level key below becomes a GitLab CI/CD variable of the
#     same name (Settings → CI/CD → Variables).
#       * KALSHI_DEMO_PRIVATE_KEY and KALSHI_PROD_PRIVATE_KEY use
#         "File" type so GitLab stores the PEM content and exposes the
#         on-disk path via the env var.
#       * All other entries use the default "Variable" type.
#   - An ESO `ExternalSecret` in ~/homelab/secrets/predmarkbot.yaml
#     pulls those GitLab variables into a k8s `Secret` in the
#     `predmarkbot` namespace.
#   - The predmarkbot `Deployment` mounts the PEM as a file and
#     projects the rest as env vars — using the exact names below.

# ─── Kalshi DEMO (sandbox / fake money) ─────────────────────────────

KALSHI_DEMO_KEY_ID: "00000000-0000-0000-0000-000000000000"

KALSHI_DEMO_PRIVATE_KEY: |
  -----BEGIN RSA PRIVATE KEY-----
  REPLACE_WITH_DEMO_KEY_CONTENT
  -----END RSA PRIVATE KEY-----

# ─── Kalshi PROD (real money — gated by mode=prod + prod_confirmed) ─

KALSHI_PROD_KEY_ID: "00000000-0000-0000-0000-000000000000"

KALSHI_PROD_PRIVATE_KEY: |
  -----BEGIN RSA PRIVATE KEY-----
  REPLACE_WITH_PROD_KEY_CONTENT
  -----END RSA PRIVATE KEY-----

# ─── ntfy notification auth (single token shared across modes) ─────

NTFY_TOKEN: "tk_REPLACE_WITH_NTFY_TOKEN"
