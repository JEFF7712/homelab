apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: predmarkbot-data
  namespace: predmarkbot
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-configs: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
