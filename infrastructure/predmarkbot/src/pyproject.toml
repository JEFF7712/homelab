[project]
name = "predmarkbot"
version = "0.0.1"
description = "Kalshi prediction-market trading bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "pyyaml>=6",
    "structlog>=24",
    "click>=8.1",
]

[project.scripts]
predmarkbot = "predmarkbot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmarkbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits Kalshi demo API; opt-in via -m integration",
]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
