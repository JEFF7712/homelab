apiVersion: v1
kind: ConfigMap
metadata:
  name: predmarkbot-config
  namespace: predmarkbot
  annotations:
    reloader.stakater.com/match: "true"
data:
  config.yaml: |
    # predmarkbot runtime config.
    # Shadow mode against Kalshi PROD: real prices, no orders submitted —
    # strategy fires record to shadow_intents. Flip mode: live only after
    # the shadow run shows expected fire rate.

    mode: shadow

    kalshi:
      api_base_url: https://api.elections.kalshi.com/trade-api/v2
      ws_base_url: wss://api.elections.kalshi.com/trade-api/ws/v2
      key_id_env: KALSHI_PROD_KEY_ID
      private_key_path: /var/run/secrets/kalshi/kalshi-prod-private-key.pem

    discovery:
      series:
        - KXMLBRFI
        - KXBRASILEIROTOTAL
        - KXBRASILEIROSPREAD
        - KXLOLTOTALMAPS
        - KXLIGUE1SPREAD
        - KXSOL15M
      poll_interval_seconds: 300

    feed:
      reconcile_interval_seconds: 60
      ws_reconnect_max_backoff_seconds: 60

    risk:
      min_edge_cents: 1
      max_per_market_dollars: 50
      max_total_exposure_dollars: 200
      max_orders_per_minute: 30
      max_daily_loss_dollars: 25
      max_intent_size: 10

    strategy:
      candidate_shadow_enabled: true
      candidate_shadow_size_contracts: 1
      shadow_milestone_event_counts: [30, 75, 100, 150, 250]

    state:
      db_path: /var/lib/predmarkbot/state.db

    notify:
      ntfy_url: https://ntfy.rupan.dev
      ntfy_topic: predmarkbot
      ntfy_token_env: NTFY_TOKEN

    dashboard:
      enabled: false
      port: 8080
