apiVersion: v1
kind: ConfigMap
metadata:
  name: predmarkbot-config
  namespace: predmarkbot
  annotations:
    reloader.stakater.com/match: "true"
data:
  config.yaml: |
    # predmarkbot runtime config.
    # Against Kalshi PROD (real money). Shadow vs live is per-strategy (the
    # `live` flag); there is no global mode. MLBRFI is LIVE (places real
    # orders); all other strategies are shadow (record to shadow_intents only).
    # A live strategy on the prod endpoint requires `prod_confirmed: true`.

    kalshi:
      api_base_url: https://api.elections.kalshi.com/trade-api/v2
      ws_base_url: wss://api.elections.kalshi.com/trade-api/ws/v2
      key_id_env: KALSHI_PROD_KEY_ID
      private_key_path: /var/run/secrets/kalshi/kalshi-prod-private-key.pem

    discovery:
      series:
        - KXMLBRFI
        - KXBRASILEIROTOTAL
        - KXBRASILEIROSPREAD
        - KXLOLTOTALMAPS
        - KXLIGUE1SPREAD
        - KXBTC15M
        - KXETH15M
        - KXSOL15M
        - KXDOGE15M
        - KXXRP15M
      poll_interval_seconds: 300

    feed:
      reconcile_interval_seconds: 60
      ws_reconnect_max_backoff_seconds: 60

    risk:
      min_edge_cents: 1
      max_per_market_dollars: 50
      max_total_exposure_dollars: 200
      max_orders_per_minute: 30
      max_daily_loss_dollars: 25
      max_intent_size: 10

    strategy:
      candidate_shadow_enabled: true
      candidate_shadow_size_contracts: 1
      shadow_milestone_event_counts: [30, 75, 100, 150, 250]
      mlbrfi:
        enabled: true
        live: true                   # LIVE: places real orders on the prod endpoint
        # If redeploying a build with the capital_fraction/Kelly validator,
        # a live strategy requires capital_fraction > 0 or the bot won't start.
        # Uncomment and set the intended allocation, e.g.:
        # capital_fraction: 1.0
        series_allowlist: ["KXMLBRFI"]
        size_contracts: 10
        min_price_cents: 46
        max_price_cents: 50
        min_volume: 10
        min_seconds_to_close: 82800  # T-25h
        max_seconds_to_close: 90000  # T-23h
        max_daily_trades: 5
        kill_switch_loss_cents: -200
      markov_shadow:
        enabled: true
        artifact_run_id: "2026-06-08-be2cbbc"
        research_db_path: /app/markov-artifacts/2026-06-08-be2cbbc.db
        edge_thresholds_cents: [3, 5, 8]
        size_contracts: 1
        spot_staleness_threshold_seconds: 30
        kill_switch:
          max_loss_cents_per_trade_avg: -5
          max_brier_score: 0.25
          last_n_trades: 100
          last_window_days: 7
          check_interval_seconds: 300

    prod_confirmed: true            # required: a live strategy on the prod endpoint

    state:
      db_path: /var/lib/predmarkbot/state.db

    notify:
      ntfy_url: https://ntfy.rupan.dev
      ntfy_topic: predmarkbot
      ntfy_token_env: NTFY_TOKEN

    dashboard:
      enabled: false
      port: 8080
