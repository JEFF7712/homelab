apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "38.0.1" 
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    service:
      type: LoadBalancer 
    ports:
      web:
        redirectTo: websecure
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    ingressRoute:
      dashboard:
        enabled: false