apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-db-pvc
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-db
  namespace: openclaw
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-db
  template:
    metadata:
      labels:
        app: openclaw-db
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: openclaw
            - name: POSTGRES_USER
              value: claw_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-db-pvc
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "claw_admin"]
        initialDelaySeconds: 30
        periodSeconds: 10
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "claw_admin"]
        initialDelaySeconds: 5
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-db
  namespace: openclaw
spec:
  type: NodePort
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
  selector:
    app: openclaw-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawdb-dashboard
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawdb-dashboard
  template:
    metadata:
      labels:
        app: clawdb-dashboard
    spec:
      containers:
      - name: dashboard
        image: jeff7712/clawdb-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "openclaw-db"
        - name: DB_USER
          value: "claw_admin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: db-password
        - name: DB_NAME
          value: "openclaw"
---
apiVersion: v1
kind: Service
metadata:
  name: clawdb-dashboard
  namespace: openclaw
spec:
  selector:
    app: clawdb-dashboard
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clawdb-dashboard 
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
  - hosts:
    - clawdb.rupan.dev
    secretName: clawdb-rupan-dev-tls
  rules:
  - host: clawdb.rupan.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clawdb-dashboard
            port:
              number: 80