apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-viewer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-viewer-binding
subjects:
- kind: ServiceAccount
  name: openclaw-viewer
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io