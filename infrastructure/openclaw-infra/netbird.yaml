apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-client
  namespace: openclaw
spec:
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: netbird
        image: netbirdio/netbird:latest
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN"]
        env:
        - name: NB_SETUP_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: netbird-setup-key
        - name: NB_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        - name: netbird-data
          mountPath: /var/lib/netbird
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
      - name: netbird-data
        hostPath:
          path: /var/lib/netbird
          type: DirectoryOrCreate
