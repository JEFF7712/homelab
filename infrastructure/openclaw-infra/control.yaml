apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: openclaw
  labels:
    app: mission-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mission-control
  template:
    metadata:
      labels:
        app: mission-control
    spec:
      containers:
      - name: mission-control
        image: jeff7712/mission-control:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "openclaw-db"
        - name: DB_USER
          value: "claw_admin"
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: db-password
        - name: DB_NAME
          value: "openclaw"
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control
  namespace: openclaw
spec:
  selector:
    app: mission-control
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-control-ingress
  namespace: openclaw
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - clawcontrol.rupan.dev
    secretName: mission-control-tls
  rules:
  - host: clawcontrol.rupan.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mission-control
            port:
              number: 80