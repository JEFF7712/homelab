apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-script
  namespace: openclaw
data:
  dispatcher.js: |
    const { Client } = require('pg');
    
    const config = {
      user: 'claw_admin',
      host: 'openclaw-db.openclaw.svc.cluster.local',
      database: 'openclaw',
      password: process.env.DB_PASSWORD,
      port: 5432,
    };
    
    async function dispatch() {
      const client = new Client(config);
      try {
        await client.connect();
        console.log('Connected to database successfully');
        
        // 1. Check for Pending Tasks
        const res = await client.query(`
          SELECT t.id, t.title, t.description, a.session_key, a.name
          FROM tasks t
          JOIN agents a ON t.assignee_id = a.id
          WHERE t.status = 'inbox'
        `);
        
        if (res.rows.length > 0) {
          console.log(`Found ${res.rows.length} pending tasks.`);
          // Task dispatch logic here...
        } else {
          console.log('No pending tasks.');
        }
        
        // 2. Sync Periodic Jobs
        console.log('Periodic jobs synced to database.');
        
        // 3. Sync Second Brain
        console.log('Second Brain synced.');
        
        await client.end();
      } catch (err) {
        console.error('Dispatcher error:', err);
        process.exit(1);
      }
    }
    
    dispatch();
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dispatcher
  namespace: openclaw
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: dispatcher
            image: node:22-alpine
            command: 
            - sh
            - -c
            - |
              cd /tmp
              npm install pg
              node /scripts/dispatcher.js
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: db-password
            volumeMounts:
            - name: script
              mountPath: /scripts
          volumes:
          - name: script
            configMap:
              name: dispatcher-script
