apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: media
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
        - name: whisper
          image: fedirz/faster-whisper-server:latest-cpu
          resources:
            limits:
              memory: 4Gi
              cpu: "3" 
            requests:
              memory: 2Gi
              cpu: "1"
          env:
            - name: WHISPER_MODEL
              value: "medium"
            - name: WHISPER_BEAM_SIZE
              value: "1"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: media
spec:
  selector:
    app: whisper
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000