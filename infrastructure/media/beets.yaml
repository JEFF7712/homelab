apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: media
data:
  config.yaml: |
    directory: /data/music
    library: /data/.beets/library.db
    plugins: fetchart embedart scrub
    import:
      move: no
      copy: no
      write: yes
      incremental: yes
      quiet: yes
      log: /data/.beets/import.log
    paths:
      default: $albumartist/$album%aunique{}/$track - $title
      singleton: Non-Album/$artist - $title
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets-nightly
  namespace: media
spec:
  schedule: "0 3 * * *"
  timeZone: "America/Chicago"
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
          containers:
            - name: beets
              image: lscr.io/linuxserver/beets@sha256:54b4d3424965f76a22affae64b7aa51b061fe45f4c84f17a6fe750de3b225ca6
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: "/data/.beets"
                - name: BEETSDIR
                  value: "/data/.beets"
                - name: TZ
                  value: "America/Chicago"
              command:
                - "/bin/sh"
                - "-c"
              args:
                - >-
                  mkdir -p /data/.beets;
                  exec >> /data/.beets/nightly.log 2>&1;
                  echo "[$(date -Is)] beets nightly start";
                  beet -c /config/config.yaml import -p -q /data/music;
                  status=$?;
                  echo "[$(date -Is)] beets nightly end status=$status";
                  exit $status
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - name: media-storage
                  mountPath: /data
                - name: beets-config
                  mountPath: /config
          volumes:
            - name: media-storage
              persistentVolumeClaim:
                claimName: media-pvc-hdd
            - name: beets-config
              configMap:
                name: beets-config
