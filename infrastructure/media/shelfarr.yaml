apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelfarr
  template:
    metadata:
      labels:
        app: shelfarr
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      initContainers:
        - name: prepare-paths
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /media/books/library /media/books/audiobooks /media/downloads/books
          volumeMounts:
            - name: media-storage
              mountPath: /media
      containers:
        - name: shelfarr
          image: ghcr.io/pedro-revez-silva/shelfarr:latest
          imagePullPolicy: Always
          env:
            - name: SOLID_QUEUE_IN_PUMA
              value: "1"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config-storage
              mountPath: /rails/storage
            - name: media-storage
              mountPath: /ebooks
              subPath: books/library
            - name: media-storage
              mountPath: /audiobooks
              subPath: books/audiobooks
            - name: media-storage
              mountPath: /downloads
              subPath: downloads/books
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-hdd
        - name: config-storage
          persistentVolumeClaim:
            claimName: shelfarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: shelfarr
  namespace: media
spec:
  selector:
    app: shelfarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shelfarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shelfarr.rupan.dev
      secretName: shelfarr-tls
  rules:
    - host: shelfarr.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shelfarr
                port:
                  number: 80
