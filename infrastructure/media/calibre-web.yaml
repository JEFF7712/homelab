apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config
  namespace: media
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-configs: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# Workaround for upstream CWA bug: the s6 startup script extracts the ingest
# folder with grep -o '"ingest_folder": "[^"]*' (note the space), but the
# bundled dirs.json has no space after the colon, so $WATCH_FOLDER ends up
# empty and inotifywait/watch_fallback.py never watch anything. Overlay a
# corrected dirs.json with the spaced format.
apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-web-dirs
  namespace: media
data:
  dirs.json: |
    {
        "ingest_folder": "/cwa-book-ingest",
        "calibre_library_dir": "/calibre-library",
        "tmp_conversion_dir": "/config/.cwa_conversion_tmp"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-storage
              mountPath: /config
        - name: prepare-calibre-bin
          image: crocodilestick/calibre-web-automated@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
          command:
            - sh
            - -c
            - cp -a /usr/bin/. /patched-usr-bin/ && ln -sf /app/calibre/calibredb /patched-usr-bin/calibredb
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: usr-bin
              mountPath: /patched-usr-bin
      containers:
        - name: calibre-web
          image: crocodilestick/calibre-web-automated@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
            # CWA's startup tries to symlink calibre binaries into /usr/local/bin
            # but readOnlyRootFilesystem blocks it, so calibredb is unreachable
            # via PATH. Prepend /app/calibre (where the binaries actually live)
            # and provide /usr/bin/calibredb via the prepared /usr/bin overlay.
            - name: PATH
              value: "/app/calibre:/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          ports:
            - containerPort: 8083
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: media-storage
              mountPath: /calibre-library
              subPath: books/library
            - name: media-storage
              mountPath: /cwa-book-ingest
              subPath: books/ingest
            - name: dirs-override
              mountPath: /app/calibre-web-automated/dirs.json
              subPath: dirs.json
              readOnly: true
            - name: usr-bin
              mountPath: /usr/bin
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-hdd
        - name: config-storage
          persistentVolumeClaim:
            claimName: calibre-web-config
        - name: dirs-override
          configMap:
            name: calibre-web-dirs
            items:
              - key: dirs.json
                path: dirs.json
        - name: usr-bin
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: media
spec:
  selector:
    app: calibre-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8083
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - books.rupan.dev
      secretName: calibre-web-tls
  rules:
    - host: books.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre-web
                port:
                  number: 80
