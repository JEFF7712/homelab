apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spotify-clone-postgres-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-clone-postgres
  namespace: media
  labels:
    app: spotify-clone-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotify-clone-postgres
  template:
    metadata:
      labels:
        app: spotify-clone-postgres
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: Always
          env:
            - name: POSTGRES_USER
              value: spotify_clone
            - name: POSTGRES_DB
              value: spotify_clone
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: spotify-clone-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-clone-postgres
  namespace: media
spec:
  selector:
    app: spotify-clone-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-clone
  namespace: media
  labels:
    app: spotify-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotify-clone
  template:
    metadata:
      labels:
        app: spotify-clone
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: spotify-clone
          image: jeff7712/spotify-clone:latest
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: NAVIDROME_URL
              value: http://navidrome
            - name: LIDARR_URL
              value: http://lidarr
            - name: SPOTIFY_REDIRECT_URI
              value: https://spotify.rupan.dev/api/auth/spotify/callback
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://spotify_clone:$(POSTGRES_PASSWORD)@spotify-clone-postgres:5432/spotify_clone
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: LIDARR_API_KEY
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: SPOTIFY_CLIENT_ID
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: ENCRYPTION_KEY
          ports:
            - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-clone-worker
  namespace: media
  labels:
    app: spotify-clone-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotify-clone-worker
  template:
    metadata:
      labels:
        app: spotify-clone-worker
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: spotify-clone-worker
          image: jeff7712/spotify-clone:latest
          imagePullPolicy: Always
          command:
            - npm
            - run
            - worker
          env:
            - name: NODE_ENV
              value: production
            - name: NAVIDROME_URL
              value: http://navidrome
            - name: LIDARR_URL
              value: http://lidarr
            - name: SPOTIFY_REDIRECT_URI
              value: https://spotify.rupan.dev/api/auth/spotify/callback
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://spotify_clone:$(POSTGRES_PASSWORD)@spotify-clone-postgres:5432/spotify_clone
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: LIDARR_API_KEY
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: SPOTIFY_CLIENT_ID
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spotify-clone-secret
                  key: ENCRYPTION_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-clone
  namespace: media
spec:
  selector:
    app: spotify-clone
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-clone
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - spotify.rupan.dev
      secretName: spotify-clone-tls
  rules:
    - host: spotify.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-clone
                port:
                  number: 80
