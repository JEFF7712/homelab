apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - qbittorrent
              topologyKey: "kubernetes.io/hostname"

      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc

      initContainers:
        # 1. PERMISSIONS FIX
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /music /downloads /config"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /downloads
              subPath: downloads
            - name: media-storage
              mountPath: /music
              subPath: music

        - name: install-extended-scripts
          image: alpine:latest
          env:
            - name: lidarrUrl
              value: "http://127.0.0.1:8686"
            - name: lidarrAPI
              value: "c5e923ba6883431ea9981238eeb64c76"
            - name: DEEZER_ARL
              value: "ea8d49952bb64817dc618ff4f713303b955f75da8dcc58edc3a2ee28743dd0548cc2790e8fe21b8c637e6317da3d1ae006ff50e15dba89f458d75cc2271e99c30eff659e896dcc14e5b3e50b5317b2a2bf8fdbe17f92ff423c5872600b275996"
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /config/extended.conf ]; then
                echo "Deleting old/corrupted extended.conf..."
                rm -f /config/extended.conf
              fi

              apk add --no-cache curl bash dos2unix sed
              
              echo "Downloading official extended.conf template..."
              curl -sL https://raw.githubusercontent.com/RandomNinjaAtk/arr-scripts/main/lidarr/extended.conf -o /config/extended.conf

              dos2unix /config/extended.conf

              echo "Injecting settings..."
              
              sed -i "s|lidarrUrl=\".*\"|lidarrUrl=\"$lidarrUrl\"|g" /config/extended.conf
              sed -i "s|lidarrAPI=\".*\"|lidarrAPI=\"$lidarrAPI\"|g" /config/extended.conf
              sed -i "s|arlToken=\".*\"|arlToken=\"$DEEZER_ARL\"|g" /config/extended.conf
              sed -i "s|enableUnmappedFilesCleaner=\".*\"|enableUnmappedFilesCleaner=\"false\"|g" /config/extended.conf

              curl -sL https://raw.githubusercontent.com/RandomNinjaAtk/arr-scripts/main/lidarr/setup.bash -o /config/setup.bash
              chmod +x /config/setup.bash
              
              mkdir -p /custom-cont-init.d
              cat << 'EOF' > /custom-cont-init.d/99-install-deps.sh
              #!/bin/bash
              echo "--- [Custom Init] Installing Dependencies ---"
              
              if command -v apk &> /dev/null; then
                  apk add --no-cache python3 py3-pip jq flac ffmpeg
              elif command -v apt-get &> /dev/null; then
                  apt-get update && apt-get install -y python3 python3-pip jq flac ffmpeg
              fi

              pip3 install yq --break-system-packages || pip3 install yq
              
              echo "--- [Custom Init] Running Setup Script ---"
              bash /config/setup.bash
              EOF
              
              chmod +x /custom-cont-init.d/99-install-deps.sh
              
          volumeMounts:
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /custom-cont-init.d
              subPath: lidarr-config/custom-cont-init.d

      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
            - name: lidarrUrl
              value: "http://127.0.0.1:8686"
          ports:
            - containerPort: 8686
          volumeMounts:
            - name: media-storage
              mountPath: /custom-cont-init.d
              subPath: lidarr-config/custom-cont-init.d
            - name: media-storage
              mountPath: /custom-services.d
              subPath: lidarr-config/custom-services.d
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /downloads
              subPath: downloads
            - name: media-storage
              mountPath: /music
              subPath: music

---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
spec:
  selector:
    app: lidarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8686

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lidarr.rupan.dev
      secretName: lidarr-tls
  rules:
    - host: lidarr.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 80