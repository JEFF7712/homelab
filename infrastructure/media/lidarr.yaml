apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - qbittorrent
              topologyKey: "kubernetes.io/hostname"

      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc

      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /music /downloads /config"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /downloads
              subPath: downloads
            - name: media-storage
              mountPath: /music
              subPath: music

        - name: install-extended-scripts
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache curl bash
              
              echo "Downloading Lidarr-Extended setup script..."
              curl -sL https://raw.githubusercontent.com/RandomNinjaAtk/arr-scripts/main/lidarr/setup.bash -o /config/setup.bash
              
              mkdir -p /custom-cont-init.d
              
              echo "Creating startup injector..."
              cat << 'EOF' > /custom-cont-init.d/99-install-deps.sh
              #!/bin/bash
              echo "--- [Custom Init] Starting Dependency Check ---"
              
              # 1. Install System Dependencies (ffmpeg, flac, jq)
              if command -v apk &> /dev/null; then
                  echo "Detected Alpine. Installing apk packages..."
                  apk add --no-cache python3 py3-pip jq flac ffmpeg
              elif command -v apt-get &> /dev/null; then
                  echo "Detected Debian/Ubuntu. Installing apt packages..."
                  apt-get update && apt-get install -y python3 python3-pip jq flac ffmpeg
              fi

              # 2. Install Python Dependencies
              pip3 install yq --break-system-packages || pip3 install yq
              
              # 3. Run the Main Lidarr-Extended Setup
              # This downloads the actual Audio/Tagger scripts into /custom-services.d
              echo "--- [Custom Init] Running Lidarr-Extended Setup ---"
              bash /config/setup.bash
              
              echo "--- [Custom Init] Done ---"
              EOF
              
              chmod +x /custom-cont-init.d/99-install-deps.sh
              chmod +x /config/setup.bash
              
              echo "Init container finished."
          volumeMounts:
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /custom-cont-init.d
              subPath: lidarr-config/custom-cont-init.d
            - name: media-storage
              mountPath: /custom-services.d
              subPath: lidarr-config/custom-services.d

      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
            - name: lidarrUrl
              value: "http://localhost:8686"
            - name: lidarrAPI
              value: "c5e923ba6883431ea9981238eeb64c76"
            - name: scriptInterval
              value: "15m"
            - name: enableUnmappedFilesCleaner
              value: "false"
          ports:
            - containerPort: 8686
          securityContext:
            capabilities:
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: media-storage
              mountPath: /custom-cont-init.d
              subPath: lidarr-config/custom-cont-init.d
            - name: media-storage
              mountPath: /custom-services.d
              subPath: lidarr-config/custom-services.d
            - name: media-storage
              mountPath: /config
              subPath: lidarr-config
            - name: media-storage
              mountPath: /downloads
              subPath: downloads
            - name: media-storage
              mountPath: /music
              subPath: music

---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
spec:
  selector:
    app: lidarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8686

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lidarr.rupan.dev
      secretName: lidarr-tls
  rules:
    - host: lidarr.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 80