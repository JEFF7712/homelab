apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: media
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-configs: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
  labels:
    app: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-hdd
        - name: extended-config
          configMap:
            name: lidarr-extended-config
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}

      initContainers:
        - name: fix-permissions
          image: busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-storage
              mountPath: /config

      containers:
        - name: lidarr
          image: ghcr.io/hotio/lidarr@sha256:f8a76d2ff0dac8e449c93c7c0e81b5fb063a3cd926d12420fdb1388818d2fdfe
          command:
            - /bin/sh
            - -c
          args:
            - apk add --no-cache ffmpeg && command -v ffprobe >/dev/null 2>&1 && exec /init
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
            - name: lidarrUrl
              value: "http://127.0.0.1:8686"
            - name: DEEZER_ARL
              valueFrom:
                secretKeyRef:
                  name: lidarr-secret
                  key: DEEZER_ARL
          ports:
            - containerPort: 8686
          volumeMounts:
            - name: config-storage
              mountPath: /config
            - name: media-storage
              mountPath: /data
            - name: extended-config
              mountPath: /config/extended.conf
              subPath: extended.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          securityContext:
            allowPrivilegeEscalation: false
            # The container installs ffmpeg at startup; replace this with a
            # custom image containing ffmpeg before making the rootfs read-only.
            readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
spec:
  selector:
    app: lidarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8686

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lidarr.rupan.dev
      secretName: lidarr-tls
  rules:
    - host: lidarr.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 80
