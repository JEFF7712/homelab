apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fipet-eth-data-pvc
  namespace: fipet
  labels:
    app.kubernetes.io/name: fipet-geth
    app.kubernetes.io/part-of: fipet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fipet-geth
  namespace: fipet
  labels:
    app.kubernetes.io/name: fipet-geth
    app.kubernetes.io/part-of: fipet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fipet-geth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fipet-geth
        app.kubernetes.io/part-of: fipet
    spec:
      containers:
        - name: geth
          image: ethereum/client-go:v1.14.12
          imagePullPolicy: IfNotPresent
          args:
            - "--dev"
            - "--dev.period=1"
            - "--datadir=/data"
            - "--http"
            - "--http.addr=0.0.0.0"
            - "--http.vhosts=*"
            - "--http.api=eth,net,web3"
          ports:
            - containerPort: 8545
              name: rpc
              protocol: TCP
            - containerPort: 30303
              name: p2p
              protocol: TCP
          volumeMounts:
            - name: eth-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: eth-data
          persistentVolumeClaim:
            claimName: fipet-eth-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fipet-geth
  namespace: fipet
  labels:
    app.kubernetes.io/name: fipet-geth
    app.kubernetes.io/part-of: fipet
spec:
  selector:
    app.kubernetes.io/name: fipet-geth
  ports:
    - name: rpc
      protocol: TCP
      port: 8545
      targetPort: rpc
  type: ClusterIP
