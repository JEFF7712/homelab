apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: metallb
      version: "0.15.3"
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    speaker:
      logLevel: debug
      frr:
        enabled: true
      tolerations:
        - operator: "Exists"
    controller:
      tolerations:
        - operator: "Exists"
