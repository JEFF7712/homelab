apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autocompress-cache
  namespace: autocompress
spec:
  # enwik9 (1 GB) + tiers (0.11 GB) + t2 scratch (~25 GB incl. ppm.temp and
  # the wiki transform temps) + repo clone + PGO build tree.
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 40Gi
