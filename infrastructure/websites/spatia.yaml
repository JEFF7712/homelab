apiVersion: v1
kind: Namespace
metadata:
  name: spatia
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spatia-tls
  namespace: spatia
spec:
  secretName: spatia-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - spatia.rupan.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: spatia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spatia-web
  template:
    metadata:
      labels:
        app: spatia-web
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: jeff7712/spatia-site:0.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spatia-route
  namespace: spatia
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spatia.rupan.dev`) || Host(`www.spatia.rupan.dev`)
      kind: Rule
      services:
        - name: spatia-svc
          port: 80
  tls:
    secretName: spatia-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: spatia-svc
  namespace: spatia
spec:
  selector:
    app: spatia-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
