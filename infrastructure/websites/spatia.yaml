apiVersion: v1
kind: Namespace
metadata:
  name: spatia
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spatia-tls
  namespace: spatia
spec:
  secretName: spatia-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - spatia.rupan.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: spatia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spatia-web
  template:
    metadata:
      labels:
        app: spatia-web
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-nginx-tmp
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["sh", "-c", "mkdir -p /tmp/nginx"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: ghcr.io/jeff7712/spatia-site:0.0.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spatia-route
  namespace: spatia
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spatia.rupan.dev`) || Host(`www.spatia.rupan.dev`)
      kind: Rule
      services:
        - name: spatia-svc
          port: 80
  tls:
    secretName: spatia-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: spatia-svc
  namespace: spatia
spec:
  selector:
    app: spatia-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
