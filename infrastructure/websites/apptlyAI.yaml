apiVersion: v1
kind: Namespace
metadata:
  name: apptly
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apptly-tls
  namespace: apptly
spec:
  secretName: apptly-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - apptly.rupan.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apptly-deploy
  namespace: apptly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptly-web
  template:
    metadata:
      labels:
        app: apptly-web
    spec:
      containers:
        - name: web
          image: jeff7712/apptlyai:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
---
apiVersion: v1
kind: Service
metadata:
  name: apptly-svc
  namespace: apptly
spec:
  selector:
    app: apptly-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apptly-route
  namespace: apptly
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`apptly.rupan.dev`) || Host(`www.apptly.rupan.dev`)
      kind: Rule
      services:
        - name: apptly-svc
          port: 80
  tls:
    secretName: apptly-tls-secret