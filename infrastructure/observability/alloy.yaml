apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.5.2
    chart: alloy
    helm:
      valuesObject:
        controller:
          type: daemonset
        alloy:
          extraArgs:
            - "--stability.level=experimental"
          extraPorts:
          - name: talos
            port: 1514
            targetPort: 1514
            protocol: TCP
            hostPort: 1514
          configMap:
            content: |
              otelcol.receiver.tcplog "talos" {
                listen_address = "0.0.0.0:1514"
                output {
                  logs = [otelcol.exporter.loki.talos.input]
                }
              }

              otelcol.exporter.loki "talos" {
                forward_to = [loki.process.talos.receiver]
              }

              loki.process "talos" {
                forward_to = [loki.write.local.receiver]

                stage.static_labels {
                    values = {
                        job       = "talos",
                        component = "kernel",
                        cluster   = "homelab",
                    }
                }

                stage.json {
                    expressions = {
                        msg   = "msg",
                        level = "level",
                        time  = "time",
                    }
                }

                stage.timestamp {
                    source = "time"
                    format = "RFC3339"
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }
              
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "__host__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.local.receiver]
              }

              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "kubelet" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                  target_label  = "__address__"
                  replacement   = "$1:10250"
                }
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "instance"
                }
                rule {
                  action = "replace" 
                  target_label = "__scheme__" 
                  replacement = "https"
                }
              }

              prometheus.scrape "kubelet" {
                targets = discovery.relabel.kubelet.output
                scheme  = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                metrics_path = "/metrics/cadvisor" 
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              discovery.relabel "node_exporter" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                  target_label  = "__address__"
                  replacement   = "$1:9100"
                }
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "instance"
                }
              }

              prometheus.scrape "nodes" {
                targets = discovery.relabel.node_exporter.output
                clustering { enabled = true }
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              discovery.kubernetes "ksm" {
                role = "service"
                namespaces {
                  names = ["observability"]
                }
              }

              discovery.relabel "ksm" {
                targets = discovery.kubernetes.ksm.targets
                rule {
                  source_labels = ["__meta_kubernetes_service_name"]
                  regex         = "kube-state-metrics"
                  action        = "keep"
                }
              }

              prometheus.scrape "ksm" {
                targets = discovery.relabel.ksm.output
                metrics_path = "/metrics"
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              discovery.relabel "blackbox_http" {
                targets = [
                  {
                    "__address__" = "https://apollinestore.com",
                    "probe_name"  = "apolline",
                  },
                  {
                    "__address__" = "https://darkbitapparel.com",
                    "probe_name"  = "darkbit",
                  },
                  {
                    "__address__" = "https://distrojeff.com",
                    "probe_name"  = "distrojeff",
                  },
                  {
                    "__address__" = "https://pulseagent.dev",
                    "probe_name"  = "pulse",
                  },
                  {
                    "__address__" = "https://spatia.rupan.dev",
                    "probe_name"  = "spatia",
                  },
                  {
                    "__address__" = "https://soluble.rupan.dev",
                    "probe_name"  = "soluble",
                  },
                  {
                    "__address__" = "https://ism.rupan.dev",
                    "probe_name"  = "ism",
                  },
                  {
                    "__address__" = "https://rupanism.rupan.dev",
                    "probe_name"  = "rupanism",
                  },
                  {
                    "__address__" = "https://notes.rupan.dev",
                    "probe_name"  = "notes",
                  },
                  {
                    "__address__" = "https://music.rupan.dev",
                    "probe_name"  = "music",
                  },
                  {
                    "__address__" = "https://jellyfin.rupan.dev",
                    "probe_name"  = "jellyfin",
                  },
                  {
                    "__address__" = "https://books.rupan.dev",
                    "probe_name"  = "books",
                  },
                  {
                    "__address__" = "https://nix.rupan.dev",
                    "probe_name"  = "nix",
                  },
                  {
                    "__address__" = "https://ntfy.rupan.dev",
                    "probe_name"  = "ntfy",
                  },
                  {
                    "__address__" = "https://grafana.rupan.dev",
                    "probe_name"  = "grafana",
                  },
                  {
                    "__address__" = "https://argo.rupan.dev",
                    "probe_name"  = "argo",
                  },
                  {
                    "__address__" = "https://longhorn.rupan.dev",
                    "probe_name"  = "longhorn",
                  },
                ]

                rule {
                  source_labels = ["__address__"]
                  target_label  = "__param_target"
                }

                rule {
                  source_labels = ["__param_target"]
                  target_label  = "instance"
                }

                rule {
                  source_labels = ["probe_name"]
                  target_label  = "target"
                }

                rule {
                  target_label = "job"
                  replacement  = "blackbox-http"
                }

                rule {
                  target_label = "__address__"
                  replacement  = "blackbox-exporter.observability.svc.cluster.local:9115"
                }
              }

              prometheus.scrape "blackbox_http" {
                targets      = discovery.relabel.blackbox_http.output
                metrics_path = "/probe"
                params       = { module = ["http_2xx"] }
                clustering { enabled = true }
                forward_to   = [prometheus.remote_write.mimir.receiver]
              }

              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  metrics = [otelcol.processor.batch.default.input]
                  logs    = [otelcol.processor.batch.default.input]
                  traces  = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  metrics = [otelcol.exporter.prometheus.mimir.input]
                  logs    = [otelcol.exporter.loki.to_loki.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }

              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-gateway.observability.svc:80/api/v1/push"
                  headers = { "X-Scope-OrgID" = "1" }
                }
                external_labels = {
                  cluster = "homelab",
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317" 
                  tls { insecure = true }
                }
              }

              otelcol.exporter.prometheus "mimir" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              otelcol.exporter.loki "to_loki" {
                forward_to = [loki.write.local.receiver]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
