apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.5.2
    chart: alloy
    helm:
      valuesObject:
        controller:
          type: daemonset
        alloy:
          extraPorts:
          - name: syslog
            port: 1514
            targetPort: 1514
            protocol: TCP
            hostPort: 1514
          configMap:
            content: |
              loki.source.syslog "talos_syslog" {
                listener {
                  address  = "0.0.0.0:1514"
                  protocol = "tcp"
                  labels   = { component = "talos_kernel", cluster = "talos" }
                }
                forward_to = [loki.write.local.receiver]
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }
              
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "__host__"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.local.receiver]
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki-gateway.observability.svc:80/loki/api/v1/push"
                }
              }

              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  metrics = [otelcol.processor.batch.default.input]
                  logs    = [otelcol.processor.batch.default.input]
                  traces  = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  metrics = [otelcol.exporter.prometheus.mimir.input]
                  logs    = [loki.write.local.receiver]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317" 
                  tls {
                    insecure = true
                  }
                }
              }

              prometheus.scrape "alloy_self" {
                targets = [{"__address__" = "0.0.0.0:12345"}]
                forward_to = [prometheus.remote_write.mimir.receiver]
              }
              
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-nginx.observability.svc:80/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "1",
                  }
                }
              }

              otelcol.exporter.prometheus "mimir" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true