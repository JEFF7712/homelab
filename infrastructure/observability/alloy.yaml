apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.5.2
    chart: alloy
    helm:
      valuesObject:
        controller:
          type: daemonset
        alloy:
          extraPorts:
          - name: syslog
            port: 1514
            targetPort: 1514
            protocol: TCP
            hostPort: 1514
          configMap:
            content: |
              loki.source.syslog "talos_syslog" {
                listener {
                  address  = "0.0.0.0:1514"
                  protocol = "tcp"
                  labels   = { component = "talos_kernel", cluster = "homelab" }
                }
                forward_to = [loki.write.local.receiver]
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }
              
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "__host__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.local.receiver]
              }

              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "kubelet" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  action = "replace" 
                  target_label = "__scheme__" 
                  replacement = "https"
                }
                rule {
                  source_labels = []
                  target_label  = "__tls_insecure_skip_verify"
                  replacement   = "true"
                }
              }

              prometheus.scrape "kubelet" {
                targets = discovery.relabel.kubelet.output
                scheme  = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                
                metrics_path = "/metrics/cadvisor" 
                
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              prometheus.scrape "node_exporter" {
                targets = discovery.kubernetes.nodes.targets
                scheme  = "http"
                metrics_path = "/metrics"
                
                clustering { enabled = true }
              }
              
              discovery.relabel "node_exporter" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                  target_label  = "__address__"
                  replacement   = "$1:9100"
                }
              }
              
              prometheus.scrape "nodes" {
                targets = discovery.relabel.node_exporter.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  metrics = [otelcol.processor.batch.default.input]
                  logs    = [otelcol.processor.batch.default.input]
                  traces  = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  metrics = [otelcol.exporter.prometheus.mimir.input]
                  logs    = [otelcol.exporter.loki.to_loki.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki-gateway.observability.svc:80/loki/api/v1/push"
                }
              }

              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-gateway.observability.svc:80/api/v1/push"
                  headers = { "X-Scope-OrgID" = "1" }
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317" 
                  tls { insecure = true }
                }
              }

              otelcol.exporter.prometheus "mimir" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              otelcol.exporter.loki "to_loki" {
                forward_to = [loki.write.local.receiver]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true