apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    targetRevision: 5.4.0
    chart: minio
    helm:
      valuesObject:
        mode: standalone
        replicas: 1
        persistence:
          enabled: true
          storageClass: "longhorn"
          size: 50Gi
          accessMode: ReadWriteOnce
        resources:
          requests:
            memory: 512Mi
        buckets:
          - name: loki-data
            policy: public
          - name: loki-ruler
            policy: public
          - name: tempo-data
            policy: public
          - name: mimir-data
            policy: public
        existingSecret: "minio-creds"

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true