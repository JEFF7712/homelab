apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.0.5
    chart: mimir-distributed
    helm:
      valuesObject:
        global:
          extraEnv:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
        chunks-cache:
          enabled: false
        index-cache:
          enabled: false
        metadata-cache:
          enabled: false
        results-cache:
          enabled: false
        kafka:
          persistence:
            size: 20Gi
            storageClassName: longhorn
          containerSecurityContext:
            readOnlyRootFilesystem: false
        compactor:
          persistentVolume:
            size: 5Gi
        ingester:
          persistentVolume:
            size: 10Gi
        minio:
          enabled: false
        mimir:
          structuredConfig:
            common:
              storage:
                backend: s3
                s3:
                  endpoint: minio.observability.svc:9000
                  access_key_id: ${MINIO_ACCESS_KEY}
                  secret_access_key: ${MINIO_SECRET_KEY}
                  insecure: true
                  bucket_name: mimir-data
            limits:
              accept_ha_samples: true
              ha_cluster_label: cluster
              ha_replica_label: __replica__
              ingestion_rate: 50000
              ingestion_burst_size: 1000000
            distributor:
              ha_tracker:
                enable_ha_tracker: true
                kvstore:
                  store: memberlist
            ruler_storage:
              s3:
                bucket_name: mimir-ruler
            blocks_storage:
              s3:
                bucket_name: mimir-data
            alertmanager_storage:
              s3:
                bucket_name: mimir-alertmanager
            ingester:
              ring:
                replication_factor: 1
            store_gateway:
              sharding_ring:
                replication_factor: 2
        store_gateway:
          persistentVolume:
            size: 5Gi
        alertmanager:
          enable_api: false
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: mimir-compactor
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-ingester-zone-a
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-ingester-zone-b
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-ingester-zone-c
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-store-gateway-zone-a
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-store-gateway-zone-b
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
    - group: apps
      kind: StatefulSet
      name: mimir-store-gateway-zone-c
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
