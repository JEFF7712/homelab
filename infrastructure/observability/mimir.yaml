apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.0.5
    chart: mimir-distributed
    helm:
      valuesObject:
        global:
          extraEnv:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
        chunks-cache:
          enabled: false
        index-cache:
          enabled: false
        metadata-cache:
          enabled: false
        results-cache:
          enabled: false
        minio:
          enabled: false
        mimir:
          structuredConfig:
            common:
              storage:
                backend: s3
                s3:
                  endpoint: minio.observability.svc:9000
                  access_key_id: ${MINIO_ACCESS_KEY}
                  secret_access_key: ${MINIO_SECRET_KEY}
                  insecure: true
                  bucket_name: mimir-data
            ruler_storage:
              s3:
                bucket_name: mimir-ruler
            blocks_storage:
              s3:
                bucket_name: mimir-data
              bucket_store:
                index_cache:
                  backend: inmemory
                chunks_cache:
                  backend: ""
                metadata_cache:
                  backend: inmemory
            alertmanager_storage:
              s3:
                bucket_name: mimir-alertmanager
            ingester:
              ring:
                replication_factor: 1
            store_gateway:
              sharding_ring:
                replication_factor: 1
            alertmanager:
              fallback_config_file: /etc/mimir/alertmanager-fallback-config.yaml
              sharding_ring:
                replication_factor: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true