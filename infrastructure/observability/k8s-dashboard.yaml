apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/dashboard/
    chart: kubernetes-dashboard
    targetRevision: 7.14.0
    helm:
      valuesObject:
        nginx:
          enabled: false
        cert-manager:
          enabled: false
        metrics-server:
          enabled: false

        app:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/service.serverscheme: https
              traefik.ingress.kubernetes.io/service.serverstransport: dashboard-insecure-transport@kubernetescrd
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts: 
              - dashboard.rupan.dev
            tls:
              enabled: true
              secretName: dashboard-tls
              hosts:
                - dashboard.rupan.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-tls
  namespace: kubernetes-dashboard
spec:
  secretName: dashboard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: dashboard.rupan.dev
  dnsNames:
    - dashboard.rupan.dev
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: dashboard-insecure-transport
  namespace: kubernetes-dashboard
spec:
  insecureSkipVerify: true