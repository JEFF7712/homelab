apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.8
    helm:
      valuesObject:
        extraEnvVars:
          - name: GF_PATHS_DATA
            value: /var/lib/grafana
          - name: GF_SHELL_SKIP_CHOWN
            value: "true"
        envValueFrom:
          NTFY_TOKEN:
            secretKeyRef:
              name: grafana-ntfy
              key: NTFY_TOKEN
        
        rbac:
          create: true

        grafana.ini:
          auth.anonymous:
            enabled: false
            org_name: "Main Org."
            org_role: Viewer
          security:
            allow_embedding: true

        persistence:
          enabled: true
          type: pvc
          storageClassName: longhorn
          size: 10Gi
          accessModes:
            - ReadWriteOnce
        
        podSecurityContext:
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - grafana.rupan.dev
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.rupan.dev

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                type: prometheus
                uid: mimir
                url: http://mimir-gateway.observability.svc:80/prometheus 
                isDefault: true
                jsonData:
                  timeInterval: "15s"
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "1"

              - name: Loki
                type: loki
                uid: loki
                url: http://loki.observability.svc:3100 
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "traceID=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"

              - name: Tempo
                type: tempo
                uid: tempo
                url: http://tempo.observability.svc:3200
                access: proxy
                jsonData:
                  tracesToLogs:
                    datasourceUid: loki
                  nodeGraph:
                    enabled: true
                  serviceMap:
                    datasourceUid: mimir

        alerting:
          policies.yaml:
            apiVersion: 1
            policies:
              - orgId: 1
                receiver: ntfy
                group_by:
                  - grafana_folder
                  - alertname
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 6h
                routes:
                  - receiver: ntfy-low-priority
                    object_matchers:
                      - ["alertname", "=", "DatasourceNoData"]
                    group_by:
                      - grafana_folder
                      - alertname
                    group_wait: 5m
                    group_interval: 30m
                    repeat_interval: 24h
          contactpoints.yaml:
            secret:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: ntfy
                  receivers:
                    - uid: ntfy-homelab-alerts
                      type: webhook
                      disableResolveMessage: false
                      settings:
                        url: http://ntfy.automation.svc.cluster.local/homelab-alerts
                        httpMethod: POST
                        authorization_scheme: Bearer
                        authorization_credentials: $NTFY_TOKEN
                        maxAlerts: "10"
                - orgId: 1
                  name: ntfy-low-priority
                  receivers:
                    - uid: ntfy-homelab-low-priority
                      type: webhook
                      disableResolveMessage: false
                      settings:
                        url: http://ntfy.automation.svc.cluster.local/homelab-alerts
                        httpMethod: POST
                        authorization_scheme: Bearer
                        authorization_credentials: $NTFY_TOKEN
                        httpHeaderName1: Priority
                        httpHeaderValue1: low
                        maxAlerts: "10"
          rules.yaml:
            apiVersion: 1
            groups:
              - orgId: 1
                name: blackbox
                folder: Observability
                interval: 1m
                rules:
                  - uid: blackbox-http-down
                    title: Blackbox HTTP probe failing
                    condition: C
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: mimir
                        model:
                          datasource:
                            type: prometheus
                            uid: mimir
                          editorMode: code
                          expr: probe_success{job="blackbox-http"} == 0
                          instant: true
                          intervalMs: 1000
                          maxDataPoints: 43200
                          refId: A
                      - refId: C
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: __expr__
                        model:
                          conditions:
                            - evaluator:
                                params:
                                  - 0
                                type: gt
                              operator:
                                type: and
                              query:
                                params:
                                  - C
                              reducer:
                                params: []
                                type: last
                              type: query
                          datasource:
                            type: __expr__
                            uid: __expr__
                          expression: A
                          intervalMs: 1000
                          maxDataPoints: 43200
                          refId: C
                          type: threshold
                    noDataState: OK
                    execErrState: Error
                    for: 2m
                    annotations:
                      summary: '{{ `{{ $labels.instance }}` }} blackbox HTTP probe is failing'
                      description: '{{ `{{ $labels.target }}` }} has failed for at least 2 minutes.'
                    labels:
                      severity: warning
                  - uid: blackbox-http-slow
                    title: Blackbox HTTP probe slow
                    condition: C
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: mimir
                        model:
                          datasource:
                            type: prometheus
                            uid: mimir
                          editorMode: code
                          expr: probe_duration_seconds{job="blackbox-http"} > 3
                          instant: true
                          intervalMs: 1000
                          maxDataPoints: 43200
                          refId: A
                      - refId: C
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: __expr__
                        model:
                          conditions:
                            - evaluator:
                                params:
                                  - 0
                                type: gt
                              operator:
                                type: and
                              query:
                                params:
                                  - C
                              reducer:
                                params: []
                                type: last
                              type: query
                          datasource:
                            type: __expr__
                            uid: __expr__
                          expression: A
                          intervalMs: 1000
                          maxDataPoints: 43200
                          refId: C
                          type: threshold
                    noDataState: OK
                    execErrState: Error
                    for: 5m
                    annotations:
                      summary: '{{ `{{ $labels.instance }}` }} blackbox HTTP probe is slow'
                      description: '{{ `{{ $labels.target }}` }} has exceeded 3 seconds for at least 5 minutes.'
                    labels:
                      severity: info

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        dashboards:
          default:
            k8s-views-global:
              url: https://grafana.com/api/dashboards/15757/revisions/37/download
              datasource: Mimir
            node-exporter-full:
              url: https://grafana.com/api/dashboards/1860/revisions/37/download
              datasource: Mimir

        admin:
          existingSecret: "grafana-admin-creds"
          userKey: "admin-user"
          passwordKey: "admin-password"

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: observability
spec:
  secretName: grafana-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: grafana.rupan.dev
  dnsNames:
    - grafana.rupan.dev
