apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.49.0
    chart: loki
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: 's3'
            bucketNames:
              chunks: loki-data
              ruler: loki-ruler
              admin: loki-data
            s3:
              endpoint: http://minio.observability.svc:9000
              access_key_id: ${MINIO_ACCESS_KEY}
              secret_access_key: ${MINIO_SECRET_KEY}
              s3ForcePathStyle: true
              insecure: true
        singleBinary: 
          replicas: 1
          extraArgs:
            - -config.expand-env=true
          extraEnv:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
        minio:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        resultsCache:
          enabled: false
        chunksCache:
          enabled: false
          
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
