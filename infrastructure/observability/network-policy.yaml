apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mimir-distributor-to-kafka
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/name: mimir
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mimir
              app.kubernetes.io/name: mimir
      ports:
        - protocol: TCP
          port: 9092
