apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-redis
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-redis
  template:
    metadata:
      labels:
        app: n8n-redis
    spec:
      # nodeSelector:
      #   type: storage
      containers:
        - name: redis
          image: redis:7-alpine
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-redis
  namespace: automation
spec:
  ports:
    - port: 6379
  selector:
    app: n8n-redis