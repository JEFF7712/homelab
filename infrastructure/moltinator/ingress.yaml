apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moltbot-manager
  namespace: moltbot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: moltbot.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moltbot-manager
                port:
                  number: 80
  tls:
    - hosts:
        - moltbot.rupan.dev
      secretName: moltbot-manager-tls
