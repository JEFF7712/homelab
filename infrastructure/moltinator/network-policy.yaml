apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: moltbot-egress
  namespace: moltbot
spec:
  endpointSelector:
    matchLabels:
      app: moltbot
  egress:
  - toEndpoints:
    - matchLabels:
      "k8s:io.kubernetes.pod.namespace": kube-system
      "k8s:k8s-app": kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
  - toFQDNs:
    - matchName: "api.telegram.org"
    - matchName: "api.anthropic.com"
    - matchName: "cdn.anthropic.com"