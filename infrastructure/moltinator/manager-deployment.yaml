apiVersion: apps/v1
kind: Deployment
metadata:
  name: moltbot-manager
  namespace: moltbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moltbot-manager
  template:
    metadata:
      labels:
        app: moltbot-manager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      initContainers:
      - name: fix-permissions
        image: busybox:latest
        command: ['sh', '-c', 'chown -R 1000:1000 /mnt/agents /mnt/credentials /mnt/cron']
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: moltbot-home
          mountPath: /mnt/agents
          subPath: agents
        - name: moltbot-home
          mountPath: /mnt/credentials
          subPath: credentials
        - name: moltbot-home
          mountPath: /mnt/cron
          subPath: cron

      containers:
      - name: bot
        image: jeff7712/moltbot-manager:latest
        imagePullPolicy: Always
        
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: anthropic-key } }
        - name: MOLTBOT_GATEWAY_TOKEN
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: gateway-token } }
        - name: TELEGRAM_BOT_TOKEN
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: telegram-token } }
          
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: exchange
          mountPath: /exchange
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
        - name: moltbot-home
          mountPath: /home/moltbot/clawd
          subPath: clawd
        - name: moltbot-home
          mountPath: /home/moltbot/.moltbot/cron
          subPath: cron
        - name: moltbot-home
          mountPath: /home/moltbot/.moltbot/agents
          subPath: agents
        - name: moltbot-home
          mountPath: /home/moltbot/.moltbot/credentials
          subPath: credentials

      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: exchange
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: moltbot-home
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: secrets
        secret:
          secretName: moltbot-secrets
          items:
            - key: telegram-token
              path: telegram-token