apiVersion: apps/v1
kind: Deployment
metadata:
  name: moltbot-manager
  namespace: moltbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moltbot-manager
  template:
    metadata:
      labels:
        app: moltbot-manager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: bot
        image: jeff7712/moltbot-manager:latest
        imagePullPolicy: Always
        
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: anthropic-key } }
        - name: MOLTBOT_GATEWAY_TOKEN
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: gateway-token } }
          
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: exchange
          mountPath: /exchange
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true

      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: exchange
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: secrets
        secret:
          secretName: moltbot-secrets
          items:
            - key: telegram-token
              path: telegram-token