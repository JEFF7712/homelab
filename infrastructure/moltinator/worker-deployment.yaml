apiVersion: apps/v1
kind: Deployment
metadata:
  name: moltbot-worker
  namespace: moltbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moltbot-worker
  template:
    metadata:
      labels:
        app: moltbot-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: bot
        image: jeff7712/moltbot-worker:latest
        imagePullPolicy: Always
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: anthropic-key } }
        - name: MOLTBOT_GATEWAY_TOKEN
          valueFrom: { secretKeyRef: { name: moltbot-secrets, key: gateway-token } }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: exchange
          mountPath: /exchange

      - name: watcher
        image: jeff7712/moltbot-worker:latest
        imagePullPolicy: Always
        command: ["/bin/watcher"] 
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: exchange
          mountPath: /exchange

      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim: { claimName: moltbot-pvc }
      - name: exchange
        persistentVolumeClaim: { claimName: moltbot-pvc }