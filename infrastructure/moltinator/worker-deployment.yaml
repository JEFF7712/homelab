apiVersion: apps/v1
kind: Deployment
metadata:
  name: moltbot-worker
  namespace: moltbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moltbot-worker
  template:
    metadata:
      labels:
        app: moltbot-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: gateway
        image: jeff7712/moltbot-hive-node:latest
        command: ["moltbot-gateway"]
        imagePullPolicy: Always
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: moltbot-secrets
              key: anthropic-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
          subPath: worker
        - name: exchange
          mountPath: /data/exchange
        - name: config
          mountPath: /data/.moltbot/config.json
          subPath: config.json

      - name: watcher
        image: jeff7712/moltbot-hive-node:latest
        command: ["/bin/bash", "/scripts/watcher.sh"]
        volumeMounts:
        - name: exchange
          mountPath: /data/exchange
        - name: scripts
          mountPath: /scripts/watcher.sh
          subPath: watcher.sh

      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: moltbot-pvc
      - name: config
        configMap:
          name: hive-configs
      - name: exchange 
        persistentVolumeClaim: 
          claimName: moltbot-pvc
          readOnly: false
      - name: scripts
        configMap: 
          name: hive-configs
          defaultMode: 0755