apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-configs
  namespace: moltbot
data:
  manager.json: |
    {
      "gateway": {
        "mode": "local",
        "port": 18789,
        "auth": { "mode": "none" }
      },
      "channels": {
        "telegram": { "enabled": true, "allowFrom": ["12345678"] },
        "anthropic": { "enabled": true }
      },
      "agents": {
        "list": [
          {
            "id": "manager",
            "identity": {
              "name": "Hive Manager",
              "theme": "helpful boss",
              "emoji": "👔"
            },
            "model": {
              "primary": "anthropic/claude-3-5-sonnet-20241022"
            },
            "workspace": "/data/.moltbot/workspace"
          }
        ]
      }
    }
  
  manager-soul.md: |
    ---
    name: Hive Manager
    ---
    You are the Manager. You interact with the user via Telegram.
    To delegate work:
    1. Write the task description to `/exchange/inbox.txt`.
    2. Wait for the result in `/exchange/outbox.txt`.
    3. Read the result and summarize it for the user.

  worker.json: |
    {
      "gateway": {
        "mode": "local",
        "port": 18789,
        "auth": { "mode": "none" }
      },
      "channels": {
        "anthropic": { "enabled": true }
      },
      "tools": {
        "allow": ["read", "write"]
      },
      "agents": {
        "list": [
          {
            "id": "worker",
            "identity": {
              "name": "Hive Worker",
              "theme": "robot",
              "emoji": "🤖"
            },
            "model": {
              "primary": "anthropic/claude-3-haiku-20240307"
            },
            "workspace": "/data/.moltbot/workspace"
          }
        ]
      }
    }

  worker-soul.md: |
    ---
    name: Hive Worker
    ---
    You are a headless worker. You process data. Be concise.

  watcher.sh: |
    #!/bin/bash
    echo "Worker Watchdog active on /exchange..."
    mkdir -p /exchange
    
    while true; do
      if [ -f /exchange/inbox.txt ]; then
        echo "[$(date)] Job received."
        TASK=$(cat /exchange/inbox.txt)
        
        # Pass task to local Gateway via CLI
        RESPONSE=$(moltbot agent --agent worker --message "$TASK" --text)
        
        # Write output
        echo "$RESPONSE" > /exchange/outbox.txt
        rm /exchange/inbox.txt
        echo "[$(date)] Job finished."
      fi
      sleep 2
    done