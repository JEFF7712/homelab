apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-configs
  namespace: moltbot
data:
  manager.json: |
    {
      "gateway": {
        "mode": "local",
        "port": 18789,
        "auth": { "mode": "token", "token": "hive-secret" }
      },
      "channels": {
        "telegram": { "enabled": true, "allowFrom": ["12345678"] }
      },
      "agents": {
        "list": [
          {
            "id": "manager",
            "identity": { "name": "Hive Manager", "theme": "boss", "emoji": "👔" },
            "model": { "primary": "anthropic/claude-3-5-sonnet-20241022" },
            "workspace": "/data/.moltbot/workspace",
          }
        ]
      }
    }
  
  manager-soul.md: |
    ---
    name: Hive Manager
    ---
    You are the Manager. Delegate tasks via /exchange/inbox.txt.

  worker.json: |
    {
      "gateway": {
        "mode": "local",
        "port": 18789,
        "auth": { "mode": "token", "token": "hive-secret" }
      },
      "channels": {},
      "agents": {
        "list": [
          {
            "id": "worker",
            "identity": { "name": "Hive Worker", "theme": "robot", "emoji": "🤖" },
            "model": { "primary": "anthropic/claude-3-haiku-20240307" },
            "workspace": "/data/.moltbot/workspace",
          }
        ]
      }
    }

  worker-soul.md: |
    ---
    name: Hive Worker
    ---
    You are a headless worker. Process data.

  watcher.sh: |
    #!/bin/bash
    echo "Worker Watchdog active..."
    mkdir -p /exchange
    export MOLTBOT_GATEWAY_TOKEN="hive-secret"
    export MOLTBOT_GATEWAY_URL="http://127.0.0.1:18789"
    while true; do
      if [ -f /exchange/inbox.txt ]; then
        TASK=$(cat /exchange/inbox.txt)
        RESPONSE=$(moltbot agent --agent worker --message "$TASK" --text)
        echo "$RESPONSE" > /exchange/outbox.txt
        rm /exchange/inbox.txt
      fi
      sleep 2
    done