apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-configs
  namespace: moltbot
data:
  manager.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "0.0.0.0",
        "port": 18789
      },
      "agents": {
        "defaults": {
          "name": "Hive Manager",
          "model": {
            "primary": "anthropic/claude-3-5-sonnet-20241022"
          },
          "systemPrompt": "You are the Hive Manager. Delegate tasks via files."
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "allowFrom": [ 12345678 ]
        },
        "anthropic": {
          "enabled": true
        }
      }
    }

  worker.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "0.0.0.0",
        "port": 18789
      },
      "agents": {
        "defaults": {
          "name": "Hive Worker",
          "model": {
            "primary": "anthropic/claude-3-haiku-20240307"
          },
          "systemPrompt": "You are a headless worker. Process data from the queue."
        }
      },
      "channels": {
        "anthropic": {
          "enabled": true
        }
      }
    }
    
  watcher.sh: |
    #!/bin/bash
    echo "Starting Worker Watchdog..."
    mkdir -p /data/exchange
    while true; do
      if [ -f /data/exchange/inbox.txt ]; then
        echo "Job received. Processing..."
        TASK=$(cat /data/exchange/inbox.txt)
        RESPONSE=$(moltbot send "$TASK")
        echo "$RESPONSE" > /data/exchange/outbox.txt
        rm /data/exchange/inbox.txt
        echo "Job done."
      fi
      sleep 2
    done