apiVersion: v1
kind: ConfigMap
metadata:
  name: config-manager
  namespace: moltbot
data:
  config.json: |
    {
      "agent": {
        "name": "Boss",
        "model": "claude-3-5-sonnet-20241022",
        "systemPrompt": "You are the manager. Delegate detailed work to the workers via the shared file queue. Synthesize their outputs for the user."
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-worker
data:
  config.json: |
    {
      "agent": {
        "name": "Worker",
        "model": "claude-3-haiku-20240307",
        "systemPrompt": "You are a worker. Process the data in the queue efficiently. Be concise. Do not chat."
      }
    }