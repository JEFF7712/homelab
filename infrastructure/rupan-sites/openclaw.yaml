---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-origin
  namespace: default
spec:
  clusterIP: None
  ports:
    - name: http-dashboard
      protocol: TCP
      port: 18789
      targetPort: 18789
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openclaw-origin
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.20
    ports:
      - name: http-dashboard
        port: 18789
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openclaw-web
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`claw.rupan.dev`)
      kind: Rule
      services:
        - name: openclaw-origin
          port: 18789
          scheme: http
  tls:
    secretName: claw-rupan-tls