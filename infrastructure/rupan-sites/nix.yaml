---
apiVersion: v1
kind: Service
metadata:
  name: nixos-iso-origin
  namespace: default
spec:
  clusterIP: None
  ports:
    - name: http-transport
      protocol: TCP
      port: 443
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nixos-iso-origin
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.70
    ports:
      - name: http-transport
        port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nixos-iso-web
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nix.rupan.dev`)
      kind: Rule
      services:
        - name: nixos-iso-origin
          port: 443
          scheme: http
  tls:
    secretName: iso-rupan-tls