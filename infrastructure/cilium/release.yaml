apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.18.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    routingMode: native
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
    ipv4NativeRoutingCIDR: "10.0.20.0/24"
    directRoutingDevice: "ens18"
    tunnel: "disabled"
    loadBalancer:
      mode: "snat"
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    securityContext:
      privileged: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    k8sServiceHost: localhost
    k8sServicePort: 7445
    operator:
      replicas: 1