apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    - start: "10.0.20.180"
      stop: "10.0.20.200"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: announce-policy
spec:
  serviceSelector:
    matchExpressions: []
  nodeSelector:
    matchExpressions: []
  interfaces:
  - ens18
  externalIPs: true
  loadBalancerIPs: true