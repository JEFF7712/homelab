apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
spec:
  blocks:
  - start: "10.0.20.180"
    stop: "10.0.20.190"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumBGPPeeringPolicy
metadata:
  name: opnsense-peering
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  virtualRouters:
  - localASN: 64512
    exportPodCIDR: false
    neighbors:
    - peerAddress: "10.0.20.1/32"
      peerASN: 64512
    serviceSelector:
      matchExpressions:
        - {key: "io.kubernetes.service.tag", operator: Exists}