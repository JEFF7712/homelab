apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
spec:
  blocks:
  - start: "10.0.20.180"
    stop: "10.0.20.190"
---
apiVersion: "cilium.io/v2"
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement
spec:
  ipPoolSelector:
    matchLabels:
      io.cilium.bgp.advertisement: "true"
---
apiVersion: "cilium.io/v2"
kind: CiliumBGPNodeConfig
metadata:
  name: opnsense-peering
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  peers:
    - name: opnsense
      peerAddress: "10.0.20.1"
      peerASN: 64512
      localASN: 64512