apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
  namespace: kube-system
spec:
  blocks:
  - start: "10.0.20.180"
    stop: "10.0.20.190"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main-policy
  namespace: kube-system
spec:
  loadBalancerIPs: true
  interfaces:
  - "^ens18$"
  nodeSelector:
    matchExpressions:
    - key: kubernetes.io/hostname
      operator: Exists