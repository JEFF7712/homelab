apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openebs

resources:
  - https://openebs.github.io/charts/openebs-operator-lite.yaml
  - storageclass.yaml

patches:
  - target:
      kind: Namespace
      name: openebs
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
