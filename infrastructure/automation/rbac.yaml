---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automation-runner
  namespace: automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: automation-deployment-reader
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - get
  - list
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  verbs:
  - get
  - list
- apiGroups:
  - longhorn.io
  resources:
  - backups
  - backuptargets
  - snapshots
  - volumes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: automation-deployment-reader
subjects:
- kind: ServiceAccount
  name: automation-runner
  namespace: automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: automation-deployment-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automation-state-writer
  namespace: automation
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automation-state-writer
  namespace: automation
subjects:
- kind: ServiceAccount
  name: automation-runner
  namespace: automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: automation-state-writer
