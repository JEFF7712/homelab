---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-reviewer-script
  namespace: automation
data:
  renovate-agent.py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import ssl
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    NAMESPACE = os.getenv("POD_NAMESPACE", "automation")
    STATE_CM = os.getenv("RENOVATE_AGENT_STATE_CONFIGMAP", "renovate-agent-state")
    MODE = os.getenv("RENOVATE_AGENT_MODE", "dry-run")
    REPAIR_MODE = os.getenv("RENOVATE_AGENT_REPAIR_MODE", "workflow-only")
    APPROVAL_LABEL = os.getenv("RENOVATE_AGENT_APPROVAL_LABEL", "renovate-agent-approved")
    APPROVAL_COMMAND = os.getenv("RENOVATE_AGENT_APPROVAL_COMMAND", "/renovate-agent approve")
    APPROVAL_URL = os.getenv("RENOVATE_AGENT_APPROVAL_URL", "https://renovate-approve.rupan.dev/approve")
    APPROVERS = {
      item.strip().lower()
      for item in os.getenv("RENOVATE_AGENT_APPROVERS", "rupan,jeff7712").split(",")
      if item.strip()
    }
    GITHUB_TOKEN = os.getenv("GITHUB_TOKEN", "")
    GITLAB_TOKEN = os.getenv("GITLAB_TOKEN", "")
    GITLAB_ENDPOINT = os.getenv("GITLAB_ENDPOINT", "https://gitlab.com/api/v4")
    OPENAI_API_KEY = os.getenv("OPENAI_API_KEY", "")
    OPENAI_MODEL = os.getenv("OPENAI_MODEL", "gpt-5.4-mini")
    TOPIC = open("/config/ntfy-topic", encoding="utf-8").read().strip()
    NTFY_URL = f"http://ntfy.automation.svc.cluster.local/{TOPIC}"
    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    KUBE_HOST = os.getenv("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
    KUBE_PORT = os.getenv("KUBERNETES_SERVICE_PORT", "443")
    KUBE_API = f"https://{KUBE_HOST}:{KUBE_PORT}"

    class HttpError(RuntimeError):
      def __init__(self, status, body):
        super().__init__(f"HTTP {status}: {body}")
        self.status = status
        self.body = body

    def request(method, url, headers=None, body=None, timeout=30, context=None):
      data = None
      if body is not None:
        data = json.dumps(body).encode("utf-8")
      req_headers = {"Accept": "application/json", **(headers or {})}
      if data is not None and "Content-Type" not in req_headers:
        req_headers["Content-Type"] = "application/json"
      req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
      try:
        with urllib.request.urlopen(req, timeout=timeout, context=context) as resp:
          raw = resp.read().decode("utf-8")
          return json.loads(raw) if raw else {}
      except urllib.error.HTTPError as exc:
        raw = exc.read().decode("utf-8", errors="replace")
        raise HttpError(exc.code, raw) from exc

    def github(method, path, body=None):
      if not GITHUB_TOKEN:
        raise RuntimeError("GITHUB_TOKEN is required")
      headers = {
        "Authorization": f"Bearer {GITHUB_TOKEN}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "homelab-renovate-agent",
      }
      return request(method, f"https://api.github.com{path}", headers, body)

    def gitlab(method, path, body=None):
      if not GITLAB_TOKEN:
        raise RuntimeError("GITLAB_TOKEN is required")
      headers = {
        "PRIVATE-TOKEN": GITLAB_TOKEN,
        "Accept": "application/json",
        "User-Agent": "homelab-renovate-agent",
      }
      return request(method, f"{GITLAB_ENDPOINT}{path}", headers, body)

    def kube_context():
      return ssl.create_default_context(cafile=SA_CA_PATH)

    def kube_headers():
      with open(SA_TOKEN_PATH, encoding="utf-8") as token_file:
        token = token_file.read().strip()
      return {"Authorization": f"Bearer {token}"}

    def ensure_state():
      path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{STATE_CM}"
      try:
        return request("GET", f"{KUBE_API}{path}", kube_headers(), context=kube_context())
      except HttpError as exc:
        if exc.status != 404:
          raise
      body = {
        "apiVersion": "v1",
        "kind": "ConfigMap",
        "metadata": {"name": STATE_CM, "namespace": NAMESPACE},
        "data": {"initialized": "true"},
      }
      return request("POST", f"{KUBE_API}/api/v1/namespaces/{NAMESPACE}/configmaps", kube_headers(), body, context=kube_context())

    def patch_state(key, value):
      safe_key = re.sub(r"[^A-Za-z0-9._-]", "-", key)
      path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{STATE_CM}"
      headers = {**kube_headers(), "Content-Type": "application/merge-patch+json"}
      body = {"data": {safe_key: value}}
      request("PATCH", f"{KUBE_API}{path}", headers, body, context=kube_context())

    def notify(title, priority, message, actions=None, click=None):
      headers = {
        "Authorization": f"Bearer {os.environ['NTFY_TOKEN']}",
        "X-Title": title,
        "X-Priority": priority,
      }
      if click:
        headers["Click"] = click
      if actions:
        headers["Actions"] = actions
      data = message.encode("utf-8")
      url = NTFY_URL
      req = urllib.request.Request(url, data=data, headers=headers, method="POST")
      try:
        with urllib.request.urlopen(req, timeout=20) as resp:
          resp.read()
      except Exception as exc:
        print(f"warning: ntfy notification failed: {exc}", file=sys.stderr)

    def load_repos():
      repos = []
      with open("/config/renovate-agent-repositories.txt", encoding="utf-8") as repo_file:
        for line in repo_file:
          line = line.strip()
          if not line or line.startswith("#"):
            continue
          owner, repo = line.split("|", 1)
          repos.append((owner.strip(), repo.strip()))
      return repos

    def load_gitlab_infra_repos():
      path = "/config/renovate-agent-gitlab-infra-repositories.txt"
      repos = []
      if not os.path.exists(path):
        return repos
      with open(path, encoding="utf-8") as repo_file:
        for line in repo_file:
          line = line.strip()
          if not line or line.startswith("#"):
            continue
          namespace, project = line.split("|", 1)
          repos.append((namespace.strip(), project.strip()))
      return repos

    def renovate_pr(pr):
      branch = pr.get("head", {}).get("ref", "")
      labels = {label.get("name", "").lower() for label in pr.get("labels", [])}
      user = pr.get("user", {}).get("login", "").lower()
      title = pr.get("title", "").lower()
      return (
        branch.startswith("renovate/")
        or "renovate" in labels
        or user.startswith("renovate")
        or "renovate" in title
      )

    def semver_major_pairs(text):
      pairs = []
      patterns = [
        r"from\s+v?(\d+)(?:\.\d+){0,2}\s+to\s+v?(\d+)(?:\.\d+){0,2}",
        r"v?(\d+)(?:\.\d+){1,2}\s*->\s*v?(\d+)(?:\.\d+){1,2}",
      ]
      for pattern in patterns:
        for current, new in re.findall(pattern, text, flags=re.IGNORECASE):
          pairs.append((int(current), int(new)))
      return pairs

    def major_update(pr):
      labels = {label.get("name", "").lower() for label in pr.get("labels", [])}
      body = pr.get("body") or ""
      combined = f"{pr.get('title', '')}\n{body}"
      if "major" in labels or re.search(r"\bmajor\b", combined, flags=re.IGNORECASE):
        return True
      return any(new > current for current, new in semver_major_pairs(combined))

    def checks_for(owner, repo, sha):
      errors = []
      try:
        statuses = github("GET", f"/repos/{owner}/{repo}/commits/{sha}/status")
        contexts = statuses.get("statuses", [])
      except Exception as exc:
        contexts = []
        errors.append(f"statuses unavailable: {exc}")
      try:
        check_runs = github("GET", f"/repos/{owner}/{repo}/commits/{sha}/check-runs?per_page=100")
        runs = check_runs.get("check_runs", [])
      except Exception as exc:
        runs = []
        errors.append(f"check runs unavailable: {exc}")
      failures = []
      pending = []
      successes = []
      for status in contexts:
        state = status.get("state")
        name = status.get("context", "status")
        if state == "success":
          successes.append(name)
        elif state in ("pending", "expected"):
          pending.append(name)
        else:
          failures.append(f"{name}: {state}")
      for run in runs:
        name = run.get("name", "check")
        status = run.get("status")
        conclusion = run.get("conclusion")
        if status != "completed":
          pending.append(name)
        elif conclusion in ("success", "neutral", "skipped"):
          successes.append(name)
        else:
          failures.append(f"{name}: {conclusion}")
      if failures:
        state = "failure"
      elif pending:
        state = "pending"
      elif successes:
        state = "success"
      else:
        state = "unknown"
      return {
        "state": state,
        "successes": successes[:10],
        "pending": pending[:10],
        "failures": failures[:10],
        "errors": errors[:5],
      }

    def changed_files(owner, repo, number):
      files = github("GET", f"/repos/{owner}/{repo}/pulls/{number}/files?per_page=100")
      summarized = []
      for item in files[:25]:
        patch = item.get("patch", "")
        if len(patch) > 2500:
          patch = patch[:2500] + "\n... truncated ..."
        summarized.append({
          "filename": item.get("filename"),
          "status": item.get("status"),
          "additions": item.get("additions"),
          "deletions": item.get("deletions"),
          "patch": patch,
        })
      return summarized

    def pull_request(owner, repo, number):
      return github("GET", f"/repos/{owner}/{repo}/pulls/{number}")

    def run(cmd, cwd=None, env=None, check=True):
      result = subprocess.run(
        cmd,
        cwd=cwd,
        env=env,
        text=True,
        stdout=subprocess.PIPE,
        stderr=subprocess.STDOUT,
      )
      if check and result.returncode != 0:
        command = " ".join(cmd).replace(GITHUB_TOKEN, "***")
        output = result.stdout.replace(GITHUB_TOKEN, "***")
        raise RuntimeError(f"{command} failed with {result.returncode}:\n{output}")
      return result

    def workflow_only(files):
      names = [item.get("filename", "") for item in files]
      return bool(names) and all(name.startswith(".github/workflows/") for name in names)

    def validate_workflow_yaml(repo_dir, files):
      script = "\n".join([
        "import sys, yaml",
        "for path in sys.argv[1:]:",
        "    with open(path, encoding='utf-8') as f:",
        "        yaml.safe_load(f)",
      ])
      paths = [item["filename"] for item in files]
      run(["python3", "-c", script, *paths], cwd=repo_dir)

    def resolve_workflow_conflicts(repo_dir):
      conflict_files = run(["git", "diff", "--name-only", "--diff-filter=U"], cwd=repo_dir).stdout.splitlines()
      if not conflict_files:
        return []
      if not all(path.startswith(".github/workflows/") for path in conflict_files):
        raise RuntimeError("conflicts are not limited to .github/workflows")
      for path in conflict_files:
        full_path = os.path.join(repo_dir, path)
        with open(full_path, encoding="utf-8") as source:
          text = source.read()
        pattern = re.compile(r"<<<<<<< HEAD\n(.*?)\n=======\n(.*?)\n>>>>>>> [^\n]+", re.DOTALL)

        def choose(match):
          ours = match.group(1)
          theirs = match.group(2)
          combined = []
          seen = set()
          for line in (ours + "\n" + theirs).splitlines():
            stripped = line.strip()
            if not stripped:
              continue
            if stripped.startswith("- uses: "):
              action = stripped.split("@", 1)[0]
              version = stripped.split("@", 1)[1] if "@" in stripped else ""
              existing_index = next((i for i, item in enumerate(combined) if item.strip().split("@", 1)[0] == action), None)
              if existing_index is not None:
                existing = combined[existing_index].strip().split("@", 1)[1] if "@" in combined[existing_index] else ""
                if version_key(version) >= version_key(existing):
                  combined[existing_index] = line
                continue
            if line not in seen:
              combined.append(line)
              seen.add(line)
          return "\n".join(combined)

        resolved = pattern.sub(choose, text)
        if "<<<<<<<" in resolved or "=======" in resolved or ">>>>>>>" in resolved:
          raise RuntimeError(f"unresolved conflict markers remain in {path}")
        with open(full_path, "w", encoding="utf-8") as target:
          target.write(resolved)
          if not resolved.endswith("\n"):
            target.write("\n")
        run(["git", "add", path], cwd=repo_dir)
      return conflict_files

    def version_key(version):
      version = version.strip()
      match = re.match(r"v?(\d+)(.*)", version)
      if not match:
        return (0, version)
      return (int(match.group(1)), match.group(2))

    def repair_workflow_pr(owner, repo, pr, files):
      if REPAIR_MODE != "workflow-only":
        return {"attempted": False, "reason": f"repair mode is {REPAIR_MODE}"}
      if not workflow_only(files):
        return {"attempted": False, "reason": "changed files are not workflow-only"}
      branch = pr.get("head", {}).get("ref", "")
      if not branch.startswith("renovate/"):
        return {"attempted": False, "reason": "branch is not a Renovate branch"}
      clone_url = f"https://x-access-token:{urllib.parse.quote(GITHUB_TOKEN, safe='')}@github.com/{owner}/{repo}.git"
      workdir = f"/tmp/renovate-repair-{repo}-{pr['number']}-{int(time.time())}"
      base_branch = pr.get("base", {}).get("ref", "main")
      run(["git", "clone", "--depth", "50", "--branch", branch, clone_url, workdir])
      try:
        run(["git", "config", "user.name", "Renovate Repair Agent"], cwd=workdir)
        run(["git", "config", "user.email", "renovate-repair@rupan.dev"], cwd=workdir)
        run(["git", "fetch", "origin", f"{base_branch}:refs/remotes/origin/{base_branch}"], cwd=workdir)
        merge = run(["git", "merge", "--no-edit", f"origin/{base_branch}"], cwd=workdir, check=False)
        repaired_files = []
        if merge.returncode != 0:
          repaired_files = resolve_workflow_conflicts(workdir)
          remaining = run(["git", "diff", "--name-only", "--diff-filter=U"], cwd=workdir).stdout.strip()
          if remaining:
            raise RuntimeError(f"unresolved conflicts remain: {remaining}")
          run(["git", "commit", "-m", "chore: repair workflow update conflicts"], cwd=workdir)
        else:
          status = run(["git", "status", "--porcelain"], cwd=workdir).stdout.strip()
          if status:
            run(["git", "commit", "-m", "chore: update Renovate branch"], cwd=workdir)
        validate_workflow_yaml(workdir, files)
        new_sha = run(["git", "rev-parse", "HEAD"], cwd=workdir).stdout.strip()
        if new_sha == pr.get("head", {}).get("sha"):
          return {"attempted": True, "pushed": False, "reason": "branch already up to date"}
        run(["git", "push", "origin", f"HEAD:{branch}"], cwd=workdir)
        return {"attempted": True, "pushed": True, "sha": new_sha, "files": repaired_files}
      finally:
        run(["rm", "-rf", workdir], check=False)

    def heuristic_decision(pr, checks, files):
      filenames = [item["filename"] for item in files]
      risky = [
        name for name in filenames
        if name and (
          name.startswith(".github/workflows/")
          or name in ("Dockerfile", "docker-compose.yml", "compose.yml")
          or name.endswith((".lock", "lock.json", "lock.yaml"))
          or "vite.config" in name
          or "next.config" in name
          or "astro.config" in name
        )
      ]
      if checks["state"] == "failure":
        return {
          "decision": "blocked",
          "confidence": "high",
          "reason": "CI is failing.",
          "requires_permission": True,
          "can_merge": False,
        }
      if checks["state"] in ("pending", "unknown"):
        return {
          "decision": "wait",
          "confidence": "medium",
          "reason": f"Checks are {checks['state']}.",
          "requires_permission": False,
          "can_merge": False,
        }
      if risky:
        return {
          "decision": "needs_approval",
          "confidence": "medium",
          "reason": "Major update touches build, workflow, Docker, or lock files: " + ", ".join(risky[:6]),
          "requires_permission": True,
          "can_merge": False,
        }
      return {
        "decision": "safe_to_merge",
        "confidence": "medium",
        "reason": "CI passed and changed files look limited for a public website dependency update.",
        "requires_permission": False,
        "can_merge": True,
      }

    def response_text(response):
      if response.get("output_text"):
        return response["output_text"]
      chunks = []
      for item in response.get("output", []):
        for content in item.get("content", []):
          if content.get("type") in ("output_text", "text"):
            chunks.append(content.get("text", ""))
      return "\n".join(chunks).strip()

    def ai_decision(pr, checks, files):
      if not OPENAI_API_KEY:
        return None
      prompt = {
        "task": "Review this Renovate major dependency update for a homelab-hosted public website. Decide whether automation may merge it, should wait, is blocked, or needs owner approval.",
        "rules": [
          "Return JSON only.",
          "Only can_merge true when CI/checks succeeded and the diff is low risk.",
          "Do not recommend merge when checks are failing, pending, or unknown.",
          "Ask for approval for framework/runtime/build-system majors, Dockerfile/workflow changes, security-sensitive changes, or broad diffs.",
        ],
        "schema": {
          "decision": "safe_to_merge | needs_approval | blocked | wait",
          "confidence": "low | medium | high",
          "reason": "short human-readable reason",
          "requires_permission": "boolean",
          "can_merge": "boolean",
        },
        "pull_request": {
          "title": pr.get("title"),
          "body": (pr.get("body") or "")[:6000],
          "url": pr.get("html_url"),
          "checks": checks,
          "files": files,
        },
      }
      body = {
        "model": OPENAI_MODEL,
        "instructions": "You are a conservative release engineer for a small homelab. Return strictly valid JSON and nothing else.",
        "input": json.dumps(prompt),
        "max_output_tokens": 600,
      }
      headers = {
        "Authorization": f"Bearer {OPENAI_API_KEY}",
        "Content-Type": "application/json",
      }
      try:
        response = request("POST", "https://api.openai.com/v1/responses", headers, body, timeout=60)
        text = response_text(response)
        return json.loads(text)
      except Exception as exc:
        print(f"warning: AI review failed, falling back to heuristic review: {exc}", file=sys.stderr)
        return None

    def merge_pr(owner, repo, number):
      body = {
        "merge_method": "squash",
        "commit_title": f"Merge Renovate PR #{number}",
      }
      return github("PUT", f"/repos/{owner}/{repo}/pulls/{number}/merge", body)

    def notification_actions(owner, repo, pr, sha, allow_approve):
      actions = [
        f"view, Open PR, {pr.get('html_url', '')}, clear=false"
      ]
      if allow_approve:
        query = urllib.parse.urlencode({
            "owner": owner,
            "repo": repo,
            "number": pr["number"],
            "sha": sha,
        })
        actions.append(
          f"http, Approve, {APPROVAL_URL}?{query}, method=POST, "
          f"headers.Authorization=Bearer {os.environ['NTFY_TOKEN']}, clear=true"
        )
      return "; ".join(actions)

    def approval_for(owner, repo, pr):
      labels = {label.get("name", "").lower() for label in pr.get("labels", [])}
      if APPROVAL_LABEL.lower() in labels:
        return {
          "approved": True,
          "method": f"label:{APPROVAL_LABEL}",
        }
      comments = github("GET", f"/repos/{owner}/{repo}/issues/{pr['number']}/comments?per_page=100")
      for comment in reversed(comments):
        author = comment.get("user", {}).get("login", "").lower()
        body = (comment.get("body") or "").strip().lower()
        if author in APPROVERS and APPROVAL_COMMAND.lower() in body:
          return {
            "approved": True,
            "method": f"comment:{author}",
          }
      return {
        "approved": False,
        "method": "",
      }

    def state_key(owner, repo, number, sha):
      return f"{owner}-{repo}-{number}-{sha[:12]}"

    def gitlab_state_key(namespace, project, iid, sha):
      return f"gitlab-{namespace}-{project}-{iid}-{sha[:12]}"

    def gitlab_project_id(namespace, project):
      return urllib.parse.quote(f"{namespace}/{project}", safe="")

    def gitlab_mr_is_renovate(mr):
      branch = mr.get("source_branch", "")
      title = mr.get("title", "").lower()
      labels = {label.lower() for label in mr.get("labels", [])}
      return branch.startswith("renovate/") or "renovate" in title or "renovate" in labels

    def gitlab_major_update(mr):
      combined = f"{mr.get('title', '')}\n{mr.get('description') or ''}"
      if re.search(r"\bmajor\b", combined, flags=re.IGNORECASE):
        return True
      return any(new > current for current, new in semver_major_pairs(combined))

    def gitlab_changed_files(project_id, iid):
      changes = gitlab("GET", f"/projects/{project_id}/merge_requests/{iid}/changes")
      files = []
      for item in changes.get("changes", [])[:25]:
        files.append({
          "filename": item.get("new_path") or item.get("old_path"),
          "status": "modified",
          "additions": 0,
          "deletions": 0,
          "patch": (item.get("diff") or "")[:2500],
        })
      return files

    def gitlab_checks(project_id, sha):
      pipelines = gitlab("GET", f"/projects/{project_id}/repository/commits/{sha}/pipelines?per_page=10")
      if not pipelines:
        return {"state": "unknown", "successes": [], "pending": [], "failures": [], "errors": ["no pipelines found"]}
      pipeline = pipelines[0]
      status = pipeline.get("status")
      if status == "success":
        state = "success"
      elif status in ("pending", "running", "created", "waiting_for_resource", "preparing"):
        state = "pending"
      elif status in ("failed", "canceled", "skipped", "manual"):
        state = "failure"
      else:
        state = "unknown"
      return {
        "state": state,
        "successes": [pipeline.get("web_url", "pipeline")] if state == "success" else [],
        "pending": [pipeline.get("web_url", "pipeline")] if state == "pending" else [],
        "failures": [pipeline.get("web_url", "pipeline")] if state == "failure" else [],
        "errors": [],
      }

    def infra_decision(mr, checks, files):
      filenames = [item.get("filename", "") for item in files]
      very_safe = all(
        name.endswith((".yaml", ".yml", ".json"))
        and not name.startswith(("secrets/", "bootstrap/", "terraform/"))
        for name in filenames
      )
      if checks["state"] == "failure":
        return {
          "decision": "blocked",
          "confidence": "high",
          "reason": "GitLab pipeline is failing.",
          "requires_permission": True,
          "can_merge": False,
        }
      if checks["state"] in ("pending", "unknown"):
        return {
          "decision": "wait",
          "confidence": "medium",
          "reason": f"GitLab pipeline is {checks['state']}.",
          "requires_permission": False,
          "can_merge": False,
        }
      if very_safe:
        return {
          "decision": "needs_approval",
          "confidence": "medium",
          "reason": "Homelab infra update has passing checks, but infra changes require approval.",
          "requires_permission": True,
          "can_merge": False,
        }
      return {
        "decision": "needs_approval",
        "confidence": "high",
        "reason": "Homelab infra changes are always approval-gated.",
        "requires_permission": True,
        "can_merge": False,
      }

    def process_gitlab_mr(namespace, project, mr, state):
      project_id = gitlab_project_id(namespace, project)
      iid = mr["iid"]
      sha = mr.get("sha") or mr.get("diff_refs", {}).get("head_sha", "")
      key = gitlab_state_key(namespace, project, iid, sha)
      if state.get("data", {}).get(key):
        print(f"gitlab:{namespace}/{project}!{iid}: already processed {sha[:12]}")
        return
      checks = gitlab_checks(project_id, sha)
      files = gitlab_changed_files(project_id, iid)
      decision = infra_decision(mr, checks, files)
      title = f"Renovate infra approval needed: {project}!{iid}" if decision.get("requires_permission") else f"Renovate infra waiting: {project}!{iid}"
      priority = "high" if decision.get("requires_permission") else "low"
      message = "\n".join([
        mr.get("title", ""),
        mr.get("web_url", ""),
        "scope: gitlab-infra",
        f"action: notified",
        f"decision: {decision.get('decision')} ({decision.get('confidence')})",
        f"checks: {checks['state']}",
        "files: " + ", ".join(item.get("filename", "") for item in files[:8]),
        f"reason: {decision.get('reason', '')}",
      ])
      notify(title, priority, message, click=mr.get("web_url"))
      patch_state(key, json.dumps({
        "platform": "gitlab",
        "repo": f"{namespace}/{project}",
        "number": iid,
        "sha": sha,
        "decision": decision,
        "action": "notified",
        "processed_at": int(time.time()),
      }, sort_keys=True))
      print(f"gitlab:{namespace}/{project}!{iid}: notified {decision.get('decision')}")

    def process_pr(owner, repo, pr, state):
      number = pr["number"]
      sha = pr.get("head", {}).get("sha", "")
      key = state_key(owner, repo, number, sha)
      approval = approval_for(owner, repo, pr)
      existing_raw = state.get("data", {}).get(key)
      existing = json.loads(existing_raw) if existing_raw else {}
      if existing:
        existing_decision = existing.get("decision", {}).get("decision")
        if existing.get("action") == "merged":
          print(f"{owner}/{repo}#{number}: already merged {sha[:12]}")
          return
        if MODE == "dry-run" and not approval.get("approved"):
          print(f"{owner}/{repo}#{number}: already processed {sha[:12]}")
          return
        if (
          MODE == "merge-safe"
          and not approval.get("approved")
          and existing_decision in ("needs_approval", "blocked")
        ):
          print(f"{owner}/{repo}#{number}: waiting for approval {sha[:12]}")
          return

      checks = checks_for(owner, repo, sha)
      files = changed_files(owner, repo, number)
      decision = ai_decision(pr, checks, files) or heuristic_decision(pr, checks, files)
      decision.setdefault("can_merge", False)
      decision.setdefault("requires_permission", True)

      action = "notified"
      can_auto_merge = decision.get("can_merge") and not decision.get("requires_permission")
      can_approved_merge = (
        approval.get("approved")
        and checks["state"] == "success"
        and decision.get("decision") in ("needs_approval", "safe_to_merge")
      )
      if MODE == "merge-safe" and (can_auto_merge or can_approved_merge):
        try:
          merge_pr(owner, repo, number)
          action = "merged"
        except Exception as exc:
          latest_pr = pull_request(owner, repo, number)
          repair = {"attempted": False, "reason": "not attempted"}
          if approval.get("approved") and "merge conflicts" in str(exc).lower():
            try:
              repair = repair_workflow_pr(owner, repo, latest_pr, files)
              if repair.get("pushed"):
                decision = {
                  "decision": "wait",
                  "confidence": "high",
                  "reason": "Workflow-only merge conflict repaired and pushed; waiting for checks on the repaired branch.",
                  "requires_permission": False,
                  "can_merge": False,
                }
                action = "repaired"
              else:
                decision = {
                  "decision": "blocked",
                  "confidence": "medium",
                  "reason": f"Merge failed and repair did not push: {repair.get('reason', 'unknown')}",
                  "requires_permission": True,
                  "can_merge": False,
                }
                action = "repair_skipped"
            except Exception as repair_exc:
              decision = {
                "decision": "blocked",
                "confidence": "high",
                "reason": f"Merge failed and repair failed: {repair_exc}",
                "requires_permission": True,
                "can_merge": False,
              }
              action = "repair_failed"
          else:
            decision = {
              "decision": "blocked",
              "confidence": "high",
              "reason": f"Merge attempt failed: {exc}",
              "requires_permission": True,
              "can_merge": False,
            }
            action = "merge_failed"
      title_prefix = "Renovate agent"
      if action == "merged":
        title = f"{title_prefix}: merged {repo}#{number}"
        priority = "default"
      elif action == "repaired":
        title = f"{title_prefix}: repaired {repo}#{number}"
        priority = "default"
      elif decision.get("decision") == "wait":
        title = f"{title_prefix}: waiting {repo}#{number}"
        priority = "low"
      elif decision.get("requires_permission"):
        if approval.get("approved") and checks["state"] != "success":
          title = f"{title_prefix}: approved but waiting {repo}#{number}"
          priority = "default"
        else:
          title = f"{title_prefix}: approval needed {repo}#{number}"
          priority = "high"
      else:
        title = f"{title_prefix}: safe major {repo}#{number}"
        priority = "default"

      message = "\n".join([
        pr.get("title", ""),
        pr.get("html_url", ""),
        f"mode: {MODE}",
        f"action: {action}",
        f"decision: {decision.get('decision')} ({decision.get('confidence', 'unknown')})",
        f"checks: {checks['state']}",
        f"approval: {approval.get('method') or 'none'}",
        f"reason: {decision.get('reason', '')}",
        f"approve: comment `{APPROVAL_COMMAND}` or add label `{APPROVAL_LABEL}`",
      ])
      notify(
        title,
        priority,
        message,
        actions=notification_actions(
          owner,
          repo,
          pr,
          sha,
          decision.get("requires_permission") and checks["state"] == "success",
        ),
        click=pr.get("html_url"),
      )
      patch_state(key, json.dumps({
        "repo": f"{owner}/{repo}",
        "number": number,
        "sha": sha,
        "decision": decision,
        "approval": approval,
        "action": action,
        "processed_at": int(time.time()),
      }, sort_keys=True))
      print(f"{owner}/{repo}#{number}: {action} {decision.get('decision')}")

    def main():
      state = ensure_state()
      found = 0
      processed = 0
      for owner, repo in load_repos():
        try:
          pulls = github("GET", f"/repos/{owner}/{repo}/pulls?state=open&per_page=100")
          for pr in pulls:
            if not renovate_pr(pr):
              continue
            if not major_update(pr):
              continue
            found += 1
            try:
              process_pr(owner, repo, pr, state)
              processed += 1
            except Exception as exc:
              print(f"{owner}/{repo}#{pr.get('number')}: processing failed: {exc}", file=sys.stderr)
              notify(
                f"Renovate agent: PR review failed {repo}#{pr.get('number')}",
                "high",
                f"{owner}/{repo}#{pr.get('number')} could not be reviewed: {exc}\n{pr.get('html_url', '')}",
              )
        except Exception as exc:
          notify(
            f"Renovate agent: repo scan failed {repo}",
            "high",
            f"{owner}/{repo} could not be scanned: {exc}",
          )
      for namespace, project in load_gitlab_infra_repos():
        try:
          project_id = gitlab_project_id(namespace, project)
          mrs = gitlab("GET", f"/projects/{project_id}/merge_requests?state=opened&per_page=100")
          for mr in mrs:
            if not gitlab_mr_is_renovate(mr):
              continue
            if not gitlab_major_update(mr):
              continue
            found += 1
            try:
              process_gitlab_mr(namespace, project, mr, state)
              processed += 1
            except Exception as exc:
              print(f"gitlab:{namespace}/{project}!{mr.get('iid')}: processing failed: {exc}", file=sys.stderr)
              notify(
                f"Renovate agent: GitLab MR review failed {project}!{mr.get('iid')}",
                "high",
                f"{namespace}/{project}!{mr.get('iid')} could not be reviewed: {exc}\n{mr.get('web_url', '')}",
              )
        except Exception as exc:
          notify(
            f"Renovate agent: GitLab repo scan failed {project}",
            "high",
            f"{namespace}/{project} could not be scanned: {exc}",
          )
      print(f"Renovate agent complete: found={found} processed={processed} mode={MODE}")

    if __name__ == "__main__":
      main()
