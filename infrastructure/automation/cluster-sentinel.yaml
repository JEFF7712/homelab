---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-sentinel
  namespace: automation
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: automation-runner
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: cluster-sentinel
            image: alpine/k8s:1.35.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
            command:
            - /bin/sh
            - /config/cluster-sentinel.sh
            env:
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: automation-secrets
                  key: ntfy-token
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          volumes:
          - name: config
            projected:
              defaultMode: 493
              sources:
              - configMap:
                  name: automation-config
              - configMap:
                  name: cluster-sentinel-config
