---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: renovate-dashboard-tls
  namespace: automation
spec:
  secretName: renovate-dashboard-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - renovate-status.rupan.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renovate-dashboard
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renovate-dashboard
  template:
    metadata:
      labels:
        app: renovate-dashboard
      annotations:
        reloader.stakater.com/auto: 'true'
    spec:
      serviceAccountName: automation-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        image: jeff7712/homelab-renovate-dashboard:0.0.1238
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: PORT
          value: '8080'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RENOVATE_AGENT_STATE_CONFIGMAP
          value: renovate-agent-state
        - name: RENOVATE_AGENT_APPROVAL_LABEL
          value: renovate-agent-approved
        - name: RENOVATE_AGENT_APPROVAL_COMMAND
          value: /renovate-agent approve
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: automation-secrets
              key: github-token
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: automation-secrets
              key: gitlab-token
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: automation-config
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: renovate-dashboard
  namespace: automation
spec:
  selector:
    app: renovate-dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: renovate-dashboard
  namespace: automation
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`renovate-status.rupan.dev`)
    kind: Rule
    services:
    - name: renovate-dashboard
      port: 80
  tls:
    secretName: renovate-dashboard-tls-secret
