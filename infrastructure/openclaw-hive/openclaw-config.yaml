apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "auth": {
        "profiles": {
          "anthropic:default": { "provider": "anthropic", "mode": "api_key" }
        },
        "order": { "anthropic": ["anthropic:default"] }
      },
      "agents": {
        "defaults": {
          "workspace": "/tmp/workspace",
          "model": { "primary": "anthropic/claude-sonnet-4-5", "fallbacks": [] },
          "sandbox": { "mode": "non-main", "workspaceRoot": "/tmp/sandboxes" }
        },
        "list": [
          { "id": "main", "identity": { "name": "KubeClaw", "theme": "helpful assistant", "emoji": "🦀" } }
        ]
      },
      "logging": {
        "level": "info",
        "file": "/dev/stdout",
        "consoleStyle": "json",
        "redactSensitive": "tools"
      },
      "session": {
        "scope": "per-sender",
        "store": "/data/sessions/sessions.json",
        "reset": { "mode": "idle", "idleMinutes": 240 }
      },
      "gateway": {
        "mode": "local",
        "port": 18789,
        "bind": "loopback",  
        "controlUi": { "enabled": true, "basePath": "/" },
        "auth": { "mode": "token", "token": "${GATEWAY_TOKEN}" }
      },
      "tools": { "allow": ["exec", "read", "write", "http"] }
    }