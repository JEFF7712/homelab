apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-manager
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-manager
  template:
    metadata:
      labels:
        app: openclaw-manager
      annotations:
        # Force pod restart on config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openclaw-pvc
      - name: config-source
        configMap:
          name: openclaw-config
      - name: sidecar-config
        configMap:
          name: openclaw-sidecar-config
      - name: secrets
        secret:
          secretName: openclaw-secrets
          defaultMode: 0400
      - name: tmp
        emptyDir: {}
      - name: npm-cache
        emptyDir: {}
      initContainers:
        - name: init-config
          image: busybox:latest
          command: ["sh", "-c", "cp /src/openclaw.json /dst/openclaw.json && chown 1000:1000 /dst/openclaw.json"]
          volumeMounts:
            - name: config-source
              mountPath: /src
            - name: data
              mountPath: /dst
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
      - name: gateway
        image: jeff7712/openclaw:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            export ANTHROPIC_API_KEY=$(cat /secrets/anthropic-key)
            export GATEWAY_TOKEN=$(cat /secrets/gateway-token)
            export TELEGRAM_BOT_TOKEN=$(cat /secrets/telegram-token)
            export AGENTS_DEFAULTS_SANDBOX_MODE="off"
            exec node dist/index.js gateway
        env:
          - name: NODE_OPTIONS
            value: "--dns-result-order=ipv4first"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: data
          mountPath: /home/node/.openclaw
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: npm-cache
          mountPath: /home/node/.npm
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      - name: sidecar-proxy
        image: nginx:alpine
        ports:
        - containerPort: 8080
          name: http-proxy
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: sidecar-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /var/run
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-manager
  namespace: openclaw
spec:
  selector:
    app: openclaw-manager
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-manager
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: openclaw.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw-manager
                port:
                  number: 80
  tls:
    - hosts:
        - openclaw.rupan.dev
      secretName: openclaw-manager-tls
