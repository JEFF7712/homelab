apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-manager
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-manager
  template:
    metadata:
      labels:
        app: openclaw-manager
    spec:
      securityContext:
        fsGroup: 1000
      
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openclaw-pvc
      - name: config-source
        configMap:
          name: openclaw-config
      - name: sidecar-config
        configMap:
          name: openclaw-sidecar-config

      initContainers:
        - name: init-config
          image: busybox:latest
          command: ["sh", "-c", "cp /src/openclaw.json /dst/openclaw.json && chown 1000:1000 /dst/openclaw.json"]
          volumeMounts:
            - name: config-source
              mountPath: /src
            - name: data
              mountPath: /dst

      containers:
      - name: gateway
        image: jeff7712/openclaw:latest
        imagePullPolicy: Always
        command: ["node", "dist/index.js", "gateway"]
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom: { secretKeyRef: { name: openclaw-secrets, key: anthropic-key } }
        - name: GATEWAY_TOKEN
          valueFrom: { secretKeyRef: { name: openclaw-secrets, key: gateway-token } }
        - name: AGENTS_DEFAULTS_SANDBOX_MODE
          value: "off"
        volumeMounts:
        - name: data
          mountPath: /home/node/.openclaw
        startupProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"
          failureThreshold: 3
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5

      - name: sidecar-proxy
        image: nginx:alpine
        ports:
        - containerPort: 8080
          name: http-proxy
        volumeMounts:
        - name: sidecar-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-manager
  namespace: openclaw
spec:
  selector:
    app: openclaw-manager
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-manager
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: openclaw.rupan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw-manager
                port:
                  number: 80
  tls:
    - hosts:
        - openclaw.rupan.dev
      secretName: openclaw-manager-tls