apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-sidecar-config
  namespace: openclaw
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location / {
          proxy_pass http://127.0.0.1:18789;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
        }
      }
    }