apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openclaw-policy
  namespace: openclaw
spec:
  endpointSelector:
    matchLabels:
      app: openclaw-manager
      
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: traefik
        io.kubernetes.pod.namespace: traefik
        
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY

  - toFQDNs:
    - matchName: "api.telegram.org"
    - matchName: "api.anthropic.com"
    - matchName: "cdn.anthropic.com"
    - matchName: "github.com"
    - matchName: "raw.githubusercontent.com"
    - matchName: "objects.githubusercontent.com"
    - matchName: "codeload.github.com"
    - matchName: "api.github.com"
    - matchName: "gitlab.com"
    - matchName: "registry.npmjs.org"

    - matchPattern: "*.digicert.com" 
    - matchPattern: "*.amazontrust.com"
    - matchPattern: "*.letsencrypt.org"
    - matchPattern: "*.lencr.org"
    - matchPattern: "*.pki.goog"
    - matchPattern: "*.googleapis.com"
    - matchPattern: "*.cloudflare.com"

    - matchPattern: "*.moltbook.com"
    - matchPattern: "*.openclaw.ai"

    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP