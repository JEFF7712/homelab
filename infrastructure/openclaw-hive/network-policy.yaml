apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openclaw-policy
  namespace: openclaw
spec:
  endpointSelector:
    matchLabels:
      app: openclaw-manager
      
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: traefik
        io.kubernetes.pod.namespace: traefik

  egress:
  - toEntities:
    - world
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY