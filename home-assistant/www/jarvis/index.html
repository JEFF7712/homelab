<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css?v=8" id="face-css">
  <style>
    /* Token Prompt Modal (only if token missing) */
    #token-prompt {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .token-box {
      width: 90%;
      max-width: 420px;
      padding: 28px;
      background: #090d16;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
      text-align: center;
    }
    .token-title {
      font-size: 16px;
      letter-spacing: 0.25em;
      color: #00f0ff;
      margin-bottom: 8px;
      font-family: monospace;
    }
    .token-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
      font-family: sans-serif;
    }
    .token-input {
      width: 100%;
      padding: 12px 14px;
      background: #030712;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      margin-bottom: 16px;
    }
    .token-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .token-btn {
      width: 100%;
      padding: 12px;
      background: #00f0ff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.2em;
      cursor: pointer;
    }
    .token-error {
      color: #ef4444;
      font-size: 11px;
      margin-top: 10px;
      display: none;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="app" class="state-idle">
    <div id="connection-badge">LINK LOST // RECONNECTING</div>
    <div id="status-bar"><span id="status-text">JARVIS // IDLE</span></div>
    <!-- Cozmo-style procedural eyes, drawn on canvas by app.js -->
    <div class="face-container">
      <canvas id="face-canvas"></canvas>
    </div>

    <!-- Music overlay: album art with a cava-style bar spectrum under it -->
    <div id="music-overlay" class="no-art">
      <img id="album-art" alt="Album art">
      <canvas id="cava-canvas"></canvas>
    </div>

    <!-- Token Entry Dialog (if needed) -->
    <div id="token-prompt">
      <div class="token-box">
        <div class="token-title">JARVIS CORE</div>
        <div class="token-subtitle">Paste your Home Assistant Long-Lived Access Token to authenticate this display.</div>
        <input type="password" id="token-input" class="token-input" placeholder="Paste access token here">
        <button id="token-submit" class="token-btn">CONNECT SATELLITE</button>
        <div id="token-error" class="token-error"></div>
      </div>
    </div>
  </div>

  <script>
    // Thread the page ?v= into every face asset URL so a face_version
    // bump bypasses the kiosk browser cache for the whole face.
    (function () {
      var v = new URLSearchParams(window.location.search).get('v') || '8';
      document.getElementById('face-css').href = 'style.css?v=' + encodeURIComponent(v);
      var s = document.createElement('script');
      s.src = 'app.js?v=' + encodeURIComponent(v);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
