alias: "Effects: Candlelight Dinner"
description: >-
  Set the shared kitchen and living room bulbs to a dim, very warm
  candlelight level. Re-tap any static scene or toggle a bulb off and on
  to return it to Adaptive Lighting.
sequence:
  - action: light.turn_on
    target:
      entity_id:
        - light.kitchen_ceiling_light_1
        - light.kitchen_ceiling_light_2
        - light.living_room_floor_lamp
        - light.living_room_tulip_lamp
    data:
      color_temp_kelvin: 2202
      brightness_pct: 30
mode: single
