alias: Jarvis — play media
mode: queued
description: >-
  Plays music, songs, artists, albums, or playlists on the Jarvis satellite
  speaker via Music Assistant. Supports Spotify and YouTube Music. Call this
  script whenever the user asks to play music, a song, an artist, a playlist,
  or an album. If the user specifies the music platform ('spotify' or
  'youtube_music'), pass it in the platform parameter. If the user does not
  specify a platform, default to 'spotify'. A bare artist name or "play
  some X" means the artist: pass media_content_type='artist' with the
  artist name and the script starts an endless artist mix (radio_mode)
  so playback continues past the first track. Never ask which album
  or song; just play. Specific songs use 'music' or 'track', albums 'album',
  playlists 'playlist'. Individual songs play immediately and continue autoplaying
  tracks by that artist by default. Queued (not restart) so a second command
  cannot interrupt the search/play/enqueue sequence mid-flight and leave a
  stale queue update behind; each run completes, and the latest replace wins.
  The result distinguishes 'accepted' (service submitted, playback not yet
  observed) from 'playing' (the player is playing the requested media).
  Confirmation requires positive correlation between the request and the
  player state: a URI request's trailing identity must appear in the
  player's media content id, or an artist request's name must appear in
  the player's artist/title. Anything else, including a still-playing
  previous track or a naturally advanced unrelated track, stays
  'accepted'. Same-track replay verifies through its own identity.
  Album/playlist URIs and free-text fallbacks carry no verifiable item
  identity and stay 'accepted'. Callers must not present 'accepted' as
  verified playback.
fields:
  media_content_type:
    description: >-
      `music` for free-text search (artist or track); `playlist`, `artist`,
      `album`, `track` for typed lookups.
    example: music
    required: true
    selector:
      select:
        options:
          - music
          - playlist
          - artist
          - album
          - track
  media_content_id:
    description: >-
      Free-text search (e.g. "The Weeknd"), streaming URI (e.g.
      `spotify:artist:...` or `ytmusic:...`), or full URL.
    example: The Weeknd
    required: true
    selector:
      text: {}
  platform:
    description: >-
      Music streaming platform to play from: 'spotify' or 'youtube_music'.
      If unspecified by the user, defaults to 'spotify'.
    example: spotify
    default: spotify
    required: false
    selector:
      select:
        options:
          - spotify
  speaker:
    description: >-
      Detected speaker name ('Rupan' or 'Sam'). Defaults platform:
      Rupan -> spotify, Sam -> youtube_music.
    example: Rupan
    required: false
    selector:
      text: {}
  autoplay:
    description: >-
      Whether to continue autoplaying related music after playback (radio mode).
      Defaults to true for songs and tracks, false for albums and playlists.
    example: true
    default: true
    required: false
    selector:
      boolean: {}
sequence:
  - variables:
      target_platform: >-
        {% if platform is defined and platform in ['spotify', 'youtube_music', 'youtube', 'ytmusic'] %}
          {{ platform }}
        {% elif speaker is defined and speaker | lower == 'sam' %}
          youtube_music
        {% else %}
          spotify
        {% endif %}
      use_radio_mode: >-
        {% if autoplay is defined %}
          {{ autoplay | bool }}
        {% elif radio_mode is defined %}
          {{ radio_mode | bool }}
        {% else %}
          {{ media_content_type in ['music', 'track'] }}
        {% endif %}
      satellite_player: media_player.homelab_05_satellite_media_player_2
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ media_content_type == 'artist' }}"
        sequence:
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ media_content_id }}"
              media_type: artist
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              artist_uris: >-
                {{ (mass_search | default({}, true)).artists | default([], true)
                  | map(attribute='uri') | list }}
          - variables:
              artist_uri: >-
                {% if target_platform in ['youtube_music', 'youtube', 'ytmusic'] %}
                  {{ (artist_uris | select('search', '^ytmusic') | list) | first | default('', true) }}
                {% else %}
                  {{ (artist_uris | select('search', '^spotify') | list + artist_uris + [media_content_id]) | first }}
                {% endif %}
          - variables:
              artist_name: >-
                {% set hits = (mass_search | default({}, true)).artists | default([], true) %}
                {% if target_platform in ['youtube_music', 'youtube', 'ytmusic'] %}
                  {% set pref = '^ytmusic' %}
                {% else %}
                  {% set pref = '^spotify' %}
                {% endif %}
                {% set plat = hits | selectattr('uri', 'defined') | selectattr('uri', 'search', pref) | list %}
                {{ (((plat + hits) | first | default({}, true)).name | default(media_content_id, true) | string) }}
          - variables:
              confirm_kind: name
              confirm_needle: "{{ artist_name | lower | trim }}"
          - if:
              - condition: template
                value_template: "{{ artist_uri | string | length == 0 }}"
            then:
              - stop: No artist result was found on {{ target_platform }}.
          - action: music_assistant.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_type: artist
              media_id: "{{ artist_uri }}"
              enqueue: replace
              radio_mode: true
      - conditions:
          - condition: template
            value_template: "{{ media_content_type in ['music', 'track'] }}"
        sequence:
          - variables:
              clean_track_query: >-
                {{ media_content_id | regex_replace('^(the\s+song|a\s+song|song)\s+', '', ignorecase=True) }}
          - variables:
              by_parts: >-
                {{ clean_track_query | regex_findall('^(.+?)\s+by\s+(.+)$', ignorecase=True)
                  | first | default([], true) }}
              by_song: "{{ (by_parts[0] | trim) if by_parts | length == 2 else '' }}"
              by_artist: "{{ (by_parts[1] | trim) if by_parts | length == 2 else '' }}"
              use_by_search: >-
                {{ (by_song | string | length > 2) and (by_artist | string | length > 2) }}
              search_name: >-
                {{ ((by_song | string) ~ ' ' ~ (by_artist | string)) if use_by_search | bool else clean_track_query }}
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ search_name }}"
              media_type: track
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              track_uri: >-
                {% set tracks = (mass_search | default({}, true)).tracks | default([], true) %}
                {% set pref = '^ytmusic' if target_platform in ['youtube_music', 'youtube', 'ytmusic']
                              else '^spotify' %}
                {% set plat = tracks | selectattr('uri', 'defined') | selectattr('uri', 'search', pref) | list %}
                {% if target_platform in ['youtube_music', 'youtube', 'ytmusic'] %}
                  {{ (plat | map(attribute='uri') | list) | first | default('', true) }}
                {% else %}
                  {% set ns = namespace(pick=[]) %}
                  {% for t in plat %}
                    {% if use_by_search | bool
                      and (by_song | string | lower) in (t.name | default('', true) | string | lower)
                      and (by_artist | string | lower) in (t.artists | default([], true)
                        | map(attribute='name') | join(' ') | string | lower) %}
                      {% set ns.pick = ns.pick + [t] %}
                    {% endif %}
                  {% endfor %}
                  {% set matched = (ns.pick + plat + tracks) | first | default({}, true) %}
                  {{ matched.uri | default(clean_track_query, true) }}
                {% endif %}
              artist_uri: >-
                {% set tracks = (mass_search | default({}, true)).tracks | default([], true) %}
                {% set pref = '^ytmusic' if target_platform in ['youtube_music', 'youtube', 'ytmusic']
                              else '^spotify' %}
                {% set plat = tracks | selectattr('uri', 'defined') | selectattr('uri', 'search', pref) | list %}
                {% if target_platform in ['youtube_music', 'youtube', 'ytmusic'] %}
                  {% set matched = plat | first | default({}, true) %}
                {% else %}
                  {% set matched = (plat + tracks) | first | default({}, true) %}
                {% endif %}
                {% set artists = matched.artists | default([], true) %}
                {% set artist_pref = '^ytmusic' if target_platform
                  in ['youtube_music', 'youtube', 'ytmusic'] else '^spotify' %}
                {{ (artists | selectattr('uri', 'search', artist_pref)
                  | map(attribute='uri') | list) | first | default('', true) }}
          - variables:
              confirm_kind: "{{ 'id' if (':' in (track_uri | default('', true) | string)) else 'none' }}"
              confirm_needle: "{{ (track_uri | default('', true) | string).split(':')[-1].split('/')[-1] }}"
          - if:
              - condition: template
                value_template: "{{ track_uri | string | length == 0 }}"
            then:
              - stop: No track result was found on {{ target_platform }}.
          - action: music_assistant.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_type: track
              media_id: "{{ track_uri }}"
              enqueue: replace
          - if:
              - condition: template
                value_template: "{{ use_radio_mode | bool and artist_uri | string | length > 0 }}"
            then:
              - action: music_assistant.play_media
                target:
                  entity_id: media_player.homelab_05_satellite_media_player_2
                data:
                  media_type: artist
                  media_id: "{{ artist_uri }}"
                  enqueue: replace_next
      - conditions:
          - condition: template
            value_template: "{{ target_platform in ['youtube_music', 'youtube', 'ytmusic'] }}"
        sequence:
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ media_content_id }}"
              media_type: >-
                {% if media_content_type in ['artist', 'album', 'track', 'playlist'] %}
                  {{ media_content_type }}
                {% else %}
                  track
                {% endif %}
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              yt_uri: >-
                {% set search = mass_search | default({}, true) %}
                {% set t = search.tracks | default([], true)
                  | selectattr('uri', 'search', '^ytmusic')
                  | map(attribute='uri') | list %}
                {% set al = search.albums | default([], true)
                  | selectattr('uri', 'search', '^ytmusic')
                  | map(attribute='uri') | list %}
                {% set ar = search.artists | default([], true)
                  | selectattr('uri', 'search', '^ytmusic')
                  | map(attribute='uri') | list %}
                {% set pl = search.playlists | default([], true)
                  | selectattr('uri', 'search', '^ytmusic')
                  | map(attribute='uri') | list %}
                {{ (t + al + ar + pl) | first | default('', true) }}
          - variables:
              confirm_kind: "{{ 'id' if (':' in (yt_uri | default('', true) | string)) else 'none' }}"
              confirm_needle: "{{ (yt_uri | default('', true) | string).split(':')[-1].split('/')[-1] }}"
          - if:
              - condition: template
                value_template: "{{ yt_uri | string | length == 0 }}"
            then:
              - stop: No YouTube Music result was found.
          - action: media_player.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_content_type: "{{ media_content_type }}"
              media_content_id: "{{ yt_uri }}"
              extra:
                radio_mode: "{{ use_radio_mode | bool }}"
    default:
      - variables:
          confirm_kind: "{{ 'id' if (':' in (media_content_id | default('', true) | string)) else 'none' }}"
          confirm_needle: "{{ (media_content_id | default('', true) | string).split(':')[-1].split('/')[-1] }}"
      - action: media_player.play_media
        target:
          entity_id: media_player.homelab_05_satellite_media_player_2
        data:
          media_content_type: "{{ media_content_type }}"
          media_content_id: "{{ media_content_id }}"
          extra:
            radio_mode: "{{ use_radio_mode | bool }}"
  - if:
      - condition: template
        value_template: >-
          {{ not (is_state(satellite_player, 'playing')
          and confirm_kind != 'none' and (confirm_needle | string | length) > 3
          and (confirm_needle | string
          in (state_attr(satellite_player, 'media_content_id')
          | default('', true) | string)
          or (confirm_kind == 'name' and confirm_needle | string
          in (((state_attr(satellite_player, 'media_artist')
          | default('', true) | string) + ' '
          + (state_attr(satellite_player, 'media_title')
          | default('', true) | string)) | lower)))) }}
    then:
      - repeat:
          until:
            - condition: template
              value_template: >-
                {{ repeat.index >= 6 or (is_state(satellite_player, 'playing')
                and confirm_kind != 'none' and (confirm_needle | string | length) > 3
                and (confirm_needle | string
                in (state_attr(satellite_player, 'media_content_id')
                | default('', true) | string)
                or (confirm_kind == 'name' and confirm_needle | string
                in (((state_attr(satellite_player, 'media_artist')
                | default('', true) | string) + ' '
                + (state_attr(satellite_player, 'media_title')
                | default('', true) | string)) | lower)))) }}
          sequence:
            - wait_for_trigger:
                - platform: state
                  entity_id: media_player.homelab_05_satellite_media_player_2
              timeout:
                seconds: 1
              continue_on_timeout: true
  - variables:
      playback_result:
        media: "{{ media_content_id }}"
        platform: "{{ target_platform }}"
        status: >-
          {{ 'playing' if is_state(satellite_player, 'playing')
          and confirm_kind != 'none' and (confirm_needle | string | length) > 3
          and (confirm_needle | string
          in (state_attr(satellite_player, 'media_content_id')
          | default('', true) | string)
          or (confirm_kind == 'name' and confirm_needle | string
          in (((state_attr(satellite_player, 'media_artist')
          | default('', true) | string) + ' '
          + (state_attr(satellite_player, 'media_title')
          | default('', true) | string)) | lower))) else 'accepted' }}
        verified: >-
          {{ 'true' if is_state(satellite_player, 'playing')
          and confirm_kind != 'none' and (confirm_needle | string | length) > 3
          and (confirm_needle | string
          in (state_attr(satellite_player, 'media_content_id')
          | default('', true) | string)
          or (confirm_kind == 'name' and confirm_needle | string
          in (((state_attr(satellite_player, 'media_artist')
          | default('', true) | string) + ' '
          + (state_attr(satellite_player, 'media_title')
          | default('', true) | string)) | lower))) else 'false' }}
        autoplay: "{{ use_radio_mode | bool }}"
  - stop: Playback submitted
    response_variable: playback_result
