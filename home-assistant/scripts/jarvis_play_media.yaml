alias: Jarvis — play media
mode: restart
description: >-
  Plays music, songs, artists, albums, or playlists on the Jarvis satellite
  speaker via Music Assistant. Supports Spotify and YouTube Music. Call this
  script whenever the user asks to play music, a song, an artist, a playlist,
  or an album. If the user specifies the music platform ('spotify' or
  'youtube_music'), pass it in the platform parameter. If the user does not
  specify a platform, default to 'spotify'. A bare artist name or "play
  some X" means the artist: pass media_content_type='artist' with the
  artist name and the script starts an endless artist mix (radio_mode)
  so playback continues past the first track. Never ask which album
  or song; just play. Specific songs use 'music' or 'track', albums 'album',
  playlists 'playlist'. Individual songs play immediately and continue autoplaying
  tracks by that artist by default.
fields:
  media_content_type:
    description: >-
      `music` for free-text search (artist or track); `playlist`, `artist`,
      `album`, `track` for typed lookups.
    example: music
    required: true
    selector:
      select:
        options:
          - music
          - playlist
          - artist
          - album
          - track
  media_content_id:
    description: >-
      Free-text search (e.g. "The Weeknd"), streaming URI (e.g.
      `spotify:artist:...` or `ytmusic:...`), or full URL.
    example: The Weeknd
    required: true
    selector:
      text: {}
  platform:
    description: >-
      Music streaming platform to play from: 'spotify' or 'youtube_music'.
      If unspecified by the user, defaults to 'spotify'.
    example: spotify
    default: spotify
    required: false
    selector:
      select:
        options:
          - spotify
  speaker:
    description: >-
      Detected speaker name ('Rupan' or 'Sam'). Defaults platform:
      Rupan -> spotify, Sam -> youtube_music.
    example: Rupan
    required: false
    selector:
      text: {}
  autoplay:
    description: >-
      Whether to continue autoplaying related music after playback (radio mode).
      Defaults to true for songs and tracks, false for albums and playlists.
    example: true
    default: true
    required: false
    selector:
      boolean: {}
sequence:
  - variables:
      target_platform: >-
        {% if platform is defined and platform in ['spotify', 'youtube_music', 'youtube', 'ytmusic'] %}
          {{ platform }}
        {% elif speaker is defined and speaker | lower == 'sam' %}
          youtube_music
        {% else %}
          spotify
        {% endif %}
      use_radio_mode: >-
        {% if autoplay is defined %}
          {{ autoplay | bool }}
        {% elif radio_mode is defined %}
          {{ radio_mode | bool }}
        {% else %}
          {{ media_content_type in ['music', 'track'] }}
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ media_content_type == 'artist' }}"
        sequence:
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ media_content_id }}"
              media_type: artist
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              artist_uris: >-
                {{ (mass_search | default({}, true)).artists | default([], true)
                  | map(attribute='uri') | list }}
          - variables:
              artist_uri: >-
                {% if target_platform in ['youtube_music', 'youtube', 'ytmusic'] %}
                  {{ (artist_uris | select('search', '^ytmusic:') | list + artist_uris + [media_content_id]) | first }}
                {% else %}
                  {{ (artist_uris | select('search', '^spotify:') | list + artist_uris + [media_content_id]) | first }}
                {% endif %}
          - action: music_assistant.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_type: artist
              media_id: "{{ artist_uri }}"
              enqueue: replace
              radio_mode: true
      - conditions:
          - condition: template
            value_template: "{{ media_content_type in ['music', 'track'] }}"
        sequence:
          - variables:
              clean_track_query: >-
                {{ media_content_id | regex_replace('^(the\s+song|a\s+song|song)\s+', '', ignorecase=True) }}
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ clean_track_query }}"
              media_type: track
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              track_uri: >-
                {% set tracks = (mass_search | default({}, true)).tracks | default([], true) %}
                {% set pref = '^ytmusic:' if target_platform in ['youtube_music', 'youtube', 'ytmusic']
                              else '^spotify:' %}
                {% set plat = tracks | selectattr('uri', 'defined') | selectattr('uri', 'search', pref) | list %}
                {% set matched = (plat + tracks) | first | default({}, true) %}
                {{ matched.uri | default(clean_track_query, true) }}
              artist_uri: >-
                {% set tracks = (mass_search | default({}, true)).tracks | default([], true) %}
                {% set pref = '^ytmusic:' if target_platform in ['youtube_music', 'youtube', 'ytmusic']
                              else '^spotify:' %}
                {% set plat = tracks | selectattr('uri', 'defined') | selectattr('uri', 'search', pref) | list %}
                {% set matched = (plat + tracks) | first | default({}, true) %}
                {{ (matched.artists | default([], true) | map(attribute='uri') | list) | first | default('', true) }}
          - action: music_assistant.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_type: track
              media_id: "{{ track_uri }}"
              enqueue: replace
          - if:
              - condition: template
                value_template: "{{ use_radio_mode | bool and artist_uri | length > 0 }}"
            then:
              - action: music_assistant.play_media
                target:
                  entity_id: media_player.homelab_05_satellite_media_player_2
                data:
                  media_type: artist
                  media_id: "{{ artist_uri }}"
                  enqueue: replace_next
      - conditions:
          - condition: template
            value_template: "{{ target_platform in ['youtube_music', 'youtube', 'ytmusic'] }}"
        sequence:
          - action: music_assistant.search
            data:
              config_entry_id: 01M2PW1ZWNQ31HTTG69TBVKSV3
              name: "{{ media_content_id }}"
              media_type: >-
                {% if media_content_type in ['artist', 'album', 'track', 'playlist'] %}
                  {{ media_content_type }}
                {% else %}
                  track
                {% endif %}
              limit: 5
            response_variable: mass_search
            continue_on_error: true
          - variables:
              yt_uri: >-
                {% set search = mass_search | default({}, true) %}
                {% set t = search.tracks | default([], true)
                  | selectattr('uri', 'search', '^ytmusic:')
                  | map(attribute='uri') | list %}
                {% set al = search.albums | default([], true)
                  | selectattr('uri', 'search', '^ytmusic:')
                  | map(attribute='uri') | list %}
                {% set ar = search.artists | default([], true)
                  | selectattr('uri', 'search', '^ytmusic:')
                  | map(attribute='uri') | list %}
                {% set pl = search.playlists | default([], true)
                  | selectattr('uri', 'search', '^ytmusic:')
                  | map(attribute='uri') | list %}
                {{ (t + al + ar + pl) | first | default(media_content_id) }}
          - action: media_player.play_media
            target:
              entity_id: media_player.homelab_05_satellite_media_player_2
            data:
              media_content_type: "{{ media_content_type }}"
              media_content_id: "{{ yt_uri }}"
              extra:
                radio_mode: "{{ use_radio_mode | bool }}"
    default:
      - action: media_player.play_media
        target:
          entity_id: media_player.homelab_05_satellite_media_player_2
        data:
          media_content_type: "{{ media_content_type }}"
          media_content_id: "{{ media_content_id }}"
          extra:
            radio_mode: "{{ use_radio_mode | bool }}"
  - variables:
      playback_result:
        media: "{{ media_content_id }}"
        platform: "{{ target_platform }}"
        status: playing
        autoplay: "{{ use_radio_mode | bool }}"
  - stop: Playback started
    response_variable: playback_result
