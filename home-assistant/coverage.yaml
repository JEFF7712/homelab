schema_version: "1.0"
tested_ha_versions:
  - "2026.9.1"
  - "2026.10.4"
surfaces:
  - surface: "core_configuration"
    owner_mode: "git-owned"
    readable_fields:
      - "default_config"
      - "recorder"
      - "homeassistant"
    writable_fields:
      - "default_config"
      - "recorder"
      - "homeassistant"
    secret_handling: "!secret tag substitution from SOPS / ExternalSecrets"
    identity_rules: "Single root configuration file"
    recovery_procedure: "Restored from Git into persistent volume on pod bootstrap"

  - surface: "automations"
    owner_mode: "ui-editable"
    readable_fields:
      - "id"
      - "alias"
      - "description"
      - "trigger"
      - "triggers"
      - "condition"
      - "conditions"
      - "action"
      - "actions"
      - "mode"
    writable_fields:
      - "id"
      - "alias"
      - "description"
      - "trigger"
      - "triggers"
      - "condition"
      - "conditions"
      - "action"
      - "actions"
      - "mode"
    secret_handling: "!secret references allowed; plaintext credentials rejected"
    identity_rules: "Unique automation ID (CONF_ID), preserves UI editing"
    recovery_procedure: "Recreated via /api/config/automation/config/{id}"

  - surface: "scripts"
    owner_mode: "ui-editable"
    readable_fields:
      - "alias"
      - "description"
      - "sequence"
      - "mode"
      - "icon"
    writable_fields:
      - "alias"
      - "description"
      - "sequence"
      - "mode"
      - "icon"
    secret_handling: "!secret references allowed; plaintext credentials rejected"
    identity_rules: "Script slug key, preserves UI editing"
    recovery_procedure: "Recreated via /api/config/script/config/{key}"

  - surface: "scenes"
    owner_mode: "ui-editable"
    readable_fields:
      - "id"
      - "name"
      - "icon"
      - "entities"
    writable_fields:
      - "id"
      - "name"
      - "icon"
      - "entities"
    secret_handling: "!secret references allowed"
    identity_rules: "Scene unique ID"
    recovery_procedure: "Recreated via /api/config/scene/config/{id}"

  - surface: "storage_dashboards"
    owner_mode: "ui-editable"
    readable_fields:
      - "title"
      - "icon"
      - "url_path"
      - "require_admin"
      - "show_in_sidebar"
      - "views"
      - "strategy"
    writable_fields:
      - "title"
      - "icon"
      - "url_path"
      - "require_admin"
      - "show_in_sidebar"
      - "views"
      - "strategy"
    secret_handling: "No credentials; strict order preservation"
    identity_rules: "url_path slug, storage mode retained"
    recovery_procedure: "Recreated via Lovelace WebSocket create & save"

  - surface: "area_registry"
    owner_mode: "ui-editable"
    readable_fields:
      - "area_id"
      - "name"
      - "icon"
      - "floor_id"
      - "aliases"
    writable_fields:
      - "area_id"
      - "name"
      - "icon"
      - "floor_id"
      - "aliases"
    secret_handling: "None required"
    identity_rules: "area_id slug"
    recovery_procedure: "Recreated via area registry WebSocket create"

  - surface: "device_registry"
    owner_mode: "ui-editable"
    readable_fields:
      - "id"
      - "name_by_user"
      - "area_id"
      - "disabled_by"
    writable_fields:
      - "name_by_user"
      - "area_id"
      - "disabled_by"
    secret_handling: "Discovery/runtime fields excluded"
    identity_rules: "Device UUID preserved; bindings explicit"
    recovery_procedure: "Re-applied via device registry WebSocket update"

  - surface: "entity_registry"
    owner_mode: "ui-editable"
    readable_fields:
      - "entity_id"
      - "name"
      - "icon"
      - "area_id"
      - "floor_id"
      - "disabled_by"
      - "hidden_by"
      - "labels"
    writable_fields:
      - "name"
      - "icon"
      - "area_id"
      - "floor_id"
      - "disabled_by"
      - "hidden_by"
      - "labels"
    secret_handling: "State and attributes excluded"
    identity_rules: "entity_id string"
    recovery_procedure: "Re-applied via entity registry WebSocket update"

  - surface: "helpers"
    owner_mode: "ui-editable"
    readable_fields:
      - "entity_id"
      - "name"
      - "icon"
    writable_fields:
      - "name"
      - "icon"
    secret_handling: "None required"
    identity_rules: "entity_id string"
    recovery_procedure: "Recreated via storage collections"

  - surface: "integrations"
    owner_mode: "observe-only"
    readable_fields:
      - "entry_id"
      - "domain"
      - "title"
      - "source"
      - "disabled_by"
      - "pref_disable_new_entities"
      - "pref_disable_polling"
    writable_fields: []
    secret_handling: "Credentials omitted; observe-only"
    identity_rules: "entry_id string"
    recovery_procedure: "Persistent storage backup or UI setup flow"

  - surface: "oauth_credentials"
    owner_mode: "runtime-only"
    readable_fields: []
    writable_fields: []
    secret_handling: "Non-exportable runtime secrets"
    identity_rules: "Stored in .storage/auth"
    recovery_procedure: "Volume backup / restore or operator re-authentication"
