language: en
intents:
  JarvisAliasOn:
    data:
      - sentences:
          - "(turn on|switch on) [the] {jarvis_alias} [lights]"
  JarvisAliasOff:
    data:
      - sentences:
          - "(turn off|switch off) [the] {jarvis_alias} [lights]"
  JarvisAliasColor:
    data:
      - sentences:
          - "(turn on|switch on|change|set|make) [all] [the] {jarvis_alias} [lights] to {jarvis_general_color}"
          - "(turn|set|make) [all] [the] {jarvis_alias} [lights] {jarvis_general_color}"
  JarvisDefaultLightsColor:
    data:
      - sentences:
          - "(turn on|set|change|make) [the] lights to {jarvis_general_color}"
          - "(turn|set|make) [the] lights [to] {jarvis_general_color}"
lists:
  jarvis_alias:
    values:
      - in: "bedroom"
        out: "light.bedroom_roku_lights"
      - in: "bedroom lights"
        out: "light.bedroom_roku_lights"
      - in: "roku lights"
        out: "light.bedroom_roku_lights"
      - in: "shared spaces"
        out: "light.downstairs_lights"
      - in: "shared spaces lights"
        out: "light.downstairs_lights"
      - in: "shared space lights"
        out: "light.downstairs_lights"
      - in: "all shared spaces lights"
        out: "light.downstairs_lights"
      - in: "all the shared spaces lights"
        out: "light.downstairs_lights"
      - in: "shared lights"
        out: "light.shared_zigbee_lights"
      - in: "all shared lights"
        out: "light.shared_zigbee_lights"
      - in: "all the shared lights"
        out: "light.shared_zigbee_lights"
      - in: "shared bulbs"
        out: "light.shared_zigbee_lights"
  jarvis_general_color:
    values:
      - in: "white"
        out: "white"
      - in: "red"
        out: "red"
      - in: "orange"
        out: "orange"
      - in: "yellow"
        out: "yellow"
      - in: "green"
        out: "green"
      - in: "blue"
        out: "blue"
      - in: "purple"
        out: "purple"
      - in: "pink"
        out: "pink"
