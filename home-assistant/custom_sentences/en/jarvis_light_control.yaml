language: en
intents:
  JarvisDefaultLightsOn:
    data:
      - sentences:
          - "(turn on|switch on) [the] lights"
          - "turn [the] lights on"
          - "[the] lights on"
  JarvisDefaultLightsOff:
    data:
      - sentences:
          - "(turn off|switch off) [the] lights"
          - "turn [the] lights off"
          - "[the] lights off"
  JarvisToggle:
    data:
      - sentences:
          - "toggle [the] {name}"
  HassLightSet:
    data:
      - sentences:
          - "dim [the] {name} to {brightness} [percent]"
          - "brighten [the] {name} to {brightness} [percent]"
          - "set [the] {name} to {color_temperature_names:temperature}"
  JarvisBrightenFull:
    data:
      - sentences:
          - "brighten [the] {name} to full brightness"
          - "set [the] {name} to full brightness"
