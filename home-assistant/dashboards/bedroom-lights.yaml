title: Rupan Bedroom
icon: mdi:bed
require_admin: true
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    show_state: false
    size: 22px
    styles:
      card:
        - height: 40px
        - width: 40px
        - margin: 0
        - padding: 10px
        - overflow: visible
        - border-radius: 500px
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
      icon:
        - height: 100%
        - width: 100%
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'var(--secondary-text-color)';
            ]]]
views:
  - title: Bedroom
    type: sections
    footer:
      max_width: 400
      card:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: var(--ha-card-background)
            - backdrop-filter: var(--ha-card-backdrop-filter)
            - -webkit-backdrop-filter: var(--ha-card-backdrop-filter)
            - border-radius: 40px
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - box-shadow: var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)
            - padding: 10px
            - margin: 0 auto 4px auto
            - height: 60px
            - width: 310px
            - overflow: visible
            - --mdc-ripple-color: transparent
            - position: fixed
            - bottom: max(12px, env(safe-area-inset-bottom))
            - left: 50%
            - transform: translateX(-50%)
            - z-index: 20
          grid:
            - display: grid
            - grid-template-areas: '"b1 b2 b3 b4 b5"'
            - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
            - align-items: center
            - column-gap: 14px
            - justify-content: center
          custom_fields:
            b1:
              - justify-self: center
            b2:
              - justify-self: center
            b3:
              - justify-self: center
            b4:
              - justify-self: center
            b5:
              - justify-self: center
        custom_fields:
          b1:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: home-overview
              icon: mdi:home
              tap_action:
                action: navigate
                navigation_path: /home-overview
          b2:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: bedroom-lights
              icon: mdi:bed
              tap_action:
                action: navigate
                navigation_path: /bedroom-lights
          b3:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: shared-spaces
              icon: mdi:sofa
              tap_action:
                action: navigate
                navigation_path: /shared-spaces
          b4:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: 3d-printing
              icon: mdi:printer-3d
              tap_action:
                action: navigate
                navigation_path: /3d-printing
          b5:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: map
              icon: mdi:map
              tap_action:
                action: navigate
                navigation_path: /map
    sections:
      - cards:
          - type: heading
            heading: Lights
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.bedroom_lights_on
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.bedroom_lights_off
          - type: custom:mushroom-light-card
            entity: light.bedroom_roku_lights
            name: All Roku Lights
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.desk_lamp_desk_lamp
            name: Desk Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.floor_lamp_floor_lamp
            name: Floor Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.light_strip_light_strip
            name: Light Strip
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.bedroom_window_plug
            name: Window Plug
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-light-card
            entity: light.bedroom_mushroom_plug
            name: Mushroom Plug
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - type: heading
            heading: Scenes
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Relax
                icon: mdi:sofa
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_relax
              - type: action
                name: Bright
                icon: mdi:brightness-5
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_bright
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_movie
              - type: action
                name: Party
                icon: mdi:party-popper
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_party
              - type: action
                name: Night Light
                icon: mdi:lightbulb-night
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_night_light
              - type: action
                name: Pink
                icon: mdi:heart
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.bedroom_pink
              - type: action
                name: Music
                icon: mdi:music
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_bedroom_music_mode
      - cards:
          - type: heading
            heading: Music Mode
          - type: tile
            entity: input_boolean.bedroom_music_mode
            name: Bedroom Music Mode
            icon: mdi:music
            features:
              - type: toggle
