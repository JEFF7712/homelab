title: Jarvis
icon: mdi:robot
require_admin: false
show_in_sidebar: true
kiosk_mode:
  kiosk: true
  hide_header: true
  hide_sidebar: true
  hide_overflow: true
  hide_account: true
views:
  - title: Console
    path: "0"
    type: sections
    max_columns: 4
    sections:
      - title: Jarvis Voice Core
        cards:
          - type: custom:mushroom-title-card
            title: "JARVIS"
            subtitle: "Homelab Voice Console"
          - type: custom:mushroom-template-card
            primary: "Jarvis Assistant"
            secondary: >-
              {% if is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'listening') %}
                🎤 Listening to you...
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'processing') %}
                ⚡ Thinking & Processing...
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'responding') %}
                🔊 Speaking response...
              {% else %}
                ✨ Ready • Say 'Hey Jarvis'
              {% endif %}
            icon: >-
              {% if is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'listening') %}
                mdi:waveform
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'processing') %}
                mdi:brain
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'responding') %}
                mdi:volume-high
              {% else %}
                mdi:microphone
              {% endif %}
            icon_color: >-
              {% if is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'listening') %}
                green
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'processing') %}
                amber
              {% elif is_state('assist_satellite.homelab_05_satellite_assist_satellite', 'responding') %}
                deep-purple
              {% else %}
                blue
              {% endif %}
          - type: logbook
            title: Recent Activity
            entities:
              - assist_satellite.homelab_05_satellite_assist_satellite
              - media_player.homelab_05_satellite_media_player_2
            hours_to_show: 2
          - type: media-control
            entity: media_player.homelab_05_satellite_media_player_2
            name: Speaker Output
          - type: entities
            title: Music shortcuts
            entities:
              - entity: script.jarvis_play_media
                name: Play media (Spotify / YouTube Music)
          - type: iframe
            url: http://10.0.30.15:8095
            aspect_ratio: 75%
      - title: Satellite Controls
        cards:
          - type: entities
            title: Audio Hardware
            entities:
              - entity: switch.homelab_05_satellite_mute
                name: Microphone Mute
              - entity: switch.homelab_05_satellite_thinking_sound
                name: Thinking Chime
              - entity: number.homelab_05_satellite_mic_volume
                name: Microphone Sensitivity
              - entity: select.homelab_05_satellite_wake_word
                name: Wake Word
      - title: Lighting Matrix
        cards:
          - type: tile
            entity: light.all_govee_lights
            name: All Govee Lights
            features:
              - type: light-brightness
          - type: tile
            entity: input_boolean.govee_music_mode
            name: Govee Music Mode
            icon: mdi:music
          - type: tile
            entity: light.living_room_lights
            name: Living Room
            features:
              - type: light-brightness
          - type: tile
            entity: light.kitchen_lights
            name: Kitchen
            features:
              - type: light-brightness
          - type: tile
            entity: light.bedroom_roku_lights
            name: Bedroom Lights
            features:
              - type: light-brightness
      - title: Ambiance & Power
        cards:
          - type: tile
            entity: switch.living_room_good_vibes_sign
            name: Good Vibes Sign
          - type: tile
            entity: switch.fuck_off_sign
            name: Fuck Off Sign
          - type: tile
            entity: switch.bedroom_window_plug
            name: Bedroom Window
          - type: tile
            entity: switch.bedroom_mushroom_plug
            name: Bedroom Mushroom
          - type: glance
            title: System & Environment
            entities:
              - entity: weather.forecast_home
                name: Weather
              - entity: sensor.sun_next_rising
                name: Dawn
              - entity: sensor.sun_next_setting
                name: Dusk
