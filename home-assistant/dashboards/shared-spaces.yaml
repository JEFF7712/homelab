title: Shared Spaces
icon: mdi:sofa
require_admin: false
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    show_state: false
    size: 22px
    styles:
      card:
        - height: 40px
        - width: 40px
        - margin: 0
        - padding: 10px
        - overflow: visible
        - border-radius: 500px
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
      icon:
        - height: 100%
        - width: 100%
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'var(--secondary-text-color)';
            ]]]
views:
  - title: Shared Spaces
    type: sections
    footer:
      max_width: 400
      card:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: var(--ha-card-background)
            - backdrop-filter: var(--ha-card-backdrop-filter)
            - -webkit-backdrop-filter: var(--ha-card-backdrop-filter)
            - border-radius: 40px
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - box-shadow: var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)
            - padding: 10px
            - margin: 0 auto 4px auto
            - height: 60px
            - width: 310px
            - overflow: visible
            - --mdc-ripple-color: transparent
            - position: fixed
            - bottom: max(12px, env(safe-area-inset-bottom))
            - left: 50%
            - transform: translateX(-50%)
            - z-index: 20
          grid:
            - display: grid
            - grid-template-areas: '"b1 b2 b3 b4 b5"'
            - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
            - align-items: center
            - column-gap: 14px
            - justify-content: center
          custom_fields:
            b1:
              - justify-self: center
            b2:
              - justify-self: center
            b3:
              - justify-self: center
            b4:
              - justify-self: center
            b5:
              - justify-self: center
        custom_fields:
          b1:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: home-overview
              icon: mdi:home
              tap_action:
                action: navigate
                navigation_path: /home-overview
          b2:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: bedroom-lights
              icon: mdi:bed
              tap_action:
                action: navigate
                navigation_path: /bedroom-lights
          b3:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: shared-spaces
              icon: mdi:sofa
              tap_action:
                action: navigate
                navigation_path: /shared-spaces
          b4:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: 3d-printing
              icon: mdi:printer-3d
              tap_action:
                action: navigate
                navigation_path: /3d-printing
          b5:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: map
              icon: mdi:map
              tap_action:
                action: navigate
                navigation_path: /map
    sections:
      - cards:
          - type: markdown
            content: |
              ## Shared Spaces
              {{ states.light | selectattr('state', 'eq', 'on') | list | count }} lights are on right now
          - type: custom:mushroom-chips-card
            chips:
              - type: weather
                entity: weather.forecast_home
                show_temperature: true
                show_conditions: true
              - type: entity
                entity: sun.sun
              - type: entity
                entity: sensor.sun_next_rising
                name: Sunrise
                icon: mdi:weather-sunset-up
              - type: entity
                entity: sensor.sun_next_setting
                name: Sunset
                icon: mdi:weather-sunset-down
          - type: media-control
            entity: media_player.homelab_05_satellite_media_player_2
            name: Speaker Output
      - cards:
          - heading: Family
            type: heading
          - type: custom:mushroom-person-card
            entity: person.rupan_sunderapandyan
            fill_container: true
          - type: custom:mushroom-person-card
            entity: person.sam
            fill_container: true
          - type: custom:mushroom-person-card
            entity: person.jayanth
            fill_container: true
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.shared_cooking
              - type: action
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.shared_dinner
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.living_room_movie
              - type: action
                name: Party
                icon: mdi:party-popper
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_party_mode
              - type: action
                name: Candlelight
                icon: mdi:candle
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_candlelight_dinner
              - type: action
                name: Night
                icon: mdi:weather-night
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_night_light
      - cards:
          - heading: Rooms
            type: heading
          - type: horizontal-stack
            cards:
              - name: Stairs
                icon: mdi:stairs
                entity: switch.stairs_light
                hold_action:
                  action: toggle
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/stairs
                type: button
              - name: Kitchen
                icon: mdi:stove
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/kitchen
                type: button
              - name: Living Room
                icon: mdi:sofa
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/living-room
                type: button
          - heading: All Lights
            type: heading
          - entity: light.all_govee_lights
            name: All Govee Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light
            name: Ceiling Light 1
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light_2
            name: Ceiling Light 2
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.shared_lights_on
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.shared_lights_off
      - cards:
          - heading: Adaptive Lighting
            type: heading
          - entity: switch.adaptive_lighting_all_dimmable_lights_sleep_mode
            name: Sleep Mode
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
            name: Adapt Brightness
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_color
            name: Adapt Color
            features:
              - type: toggle
            type: tile
  - title: Stairs
    path: stairs
    sections:
      - cards:
          - heading: Stairs
            type: heading
          - name: Stairs Light
            entity: switch.stairs_light
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
    subview: true
    type: sections
  - title: Kitchen
    path: kitchen
    sections:
      - cards:
          - heading: Lights
            type: heading
          - entity: light.kitchen_lights
            name: All Kitchen Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light
            name: Ceiling Light 1
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light_2
            name: Ceiling Light 2
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_mushroom_lamp
            name: Mushroom Lamp
            fill_container: true
            type: custom:mushroom-light-card
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_fuck_off_sign
            name: Fuck Off Sign
            fill_container: true
            type: custom:mushroom-light-card
            tap_action:
              action: toggle
            hold_action:
              action: more-info
    subview: true
    type: sections
  - title: Living Room
    path: living-room
    sections:
      - cards:
          - heading: Lights
            type: heading
          - name: Good Vibes Sign
            fill_container: true
            type: custom:mushroom-light-card
            entity: light.living_room_good_vibes_sign
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_lights
            name: All Living Room Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: Climate
            type: heading
          - entity: climate.living_room_ac_living_room_ac_thermostat
            fill_container: true
            type: custom:mushroom-climate-card
            hvac_modes:
              - "off"
              - cool
              - auto
              - fan_only
              - dry
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: History
            type: heading
          - type: custom:apexcharts-card
            header:
              show: true
              title: Living Room Temperature
            graph_span: 24h
            series:
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: current_temperature
                name: Current
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: temperature
                name: Target
    subview: true
    type: sections
