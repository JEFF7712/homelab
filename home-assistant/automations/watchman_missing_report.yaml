id: watchman_missing_report
alias: "Maintenance: Watchman Missing Entities Report"
description: >-
  Run Watchman each morning and notify only about genuinely new breakage.
  Known-benign items are filtered: the pre_away_* snapshot scenes that
  only exist while away, the pre_music_mode_govee snapshot that only
  exists after music mode has run, and anything merely unavailable or never
  activated (idle-printer buttons, unactivated scenes, backup sensors
  awaiting Sunday's run).
triggers:
  - trigger: time
    at: "09:00:00"
    id: "daily"
conditions: []
actions:
  - action: watchman.report
    data:
      create_file: false
      parse_config: true
    response_variable: wm_report
    continue_on_error: true
  - variables:
      wm_known_missing:
        - scene.pre_away_bedroom
        - scene.pre_away_shared
        - scene.pre_away_climate
        - scene.shared_last_state
        - scene.pre_music_mode_govee
  - variables:
      wm_bad_count: >-
        {% set r = wm_report.service_response
        if wm_report is defined and wm_report.service_response is defined
        else (wm_report.response if wm_report is defined and wm_report.response is defined
        else (wm_report if wm_report is defined else {})) %}
        {% set items = r.missing_entities
        if r is mapping and r.missing_entities is defined else [] %}
        {% set bad = items | selectattr('state', 'defined')
        | selectattr('state', 'eq', 'missing')
        | rejectattr('id', 'in', wm_known_missing) | list %}
        {{ bad | count }}
      wm_bad_ids: >-
        {% set r = wm_report.service_response
        if wm_report is defined and wm_report.service_response is defined
        else (wm_report.response if wm_report is defined and wm_report.response is defined
        else (wm_report if wm_report is defined else {})) %}
        {% set items = r.missing_entities
        if r is mapping and r.missing_entities is defined else [] %}
        {% set bad = items | selectattr('state', 'defined')
        | selectattr('state', 'eq', 'missing')
        | rejectattr('id', 'in', wm_known_missing) | list %}
        {{ bad | map(attribute='id') | join(', ') }}
  - condition: template
    value_template: "{{ wm_bad_count | int(0) > 0 }}"
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Watchman: New Configuration Drift"
      message: >-
        Watchman found {{ wm_bad_count }} new missing
        {{ 'entity' if wm_bad_count | int(0) == 1 else 'entities' }}:
        {{ wm_bad_ids }}.
mode: single
