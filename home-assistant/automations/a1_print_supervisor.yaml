id: a1_print_supervisor
alias: "A1: Print Supervisor"
description: >-
  Single owner for all A1 print notifications: started, finished, error,
  progress milestones, stall detection, and idle reminders. Replaces six
  single-purpose automations. Stall detection fires when progress has not
  changed for 30 minutes while running, at any point in the print; it uses
  a state trigger with for: instead of an in-run wait, so the check keeps
  covering the whole print and re-arms on every progress change (including
  the reset to 0 at print start). 30 minutes
  leaves headroom for 1 percent steps on long prints. Restarts reset the
  timers, which can delay but never fake a stall alert.
triggers:
  - trigger: state
    entity_id: sensor.a1_03900d642327265_print_status
    to: running
    id: "started"
  - trigger: state
    entity_id: sensor.a1_03900d642327265_print_status
    from: running
    to: finish
    id: "finished"
  - trigger: state
    entity_id: sensor.a1_03900d642327265_print_status
    not_from:
      - unknown
      - unavailable
    to: finish
    for: "01:00:00"
    id: "idle"
  - trigger: state
    entity_id: binary_sensor.a1_03900d642327265_print_error
    from: "off"
    to: "on"
    id: "error"
  - trigger: state
    entity_id: binary_sensor.a1_03900d642327265_hms_errors
    from: "off"
    to: "on"
    id: "error"
  - trigger: state
    entity_id: sensor.a1_03900d642327265_print_status
    to: failed
    id: "error"
  - trigger: numeric_state
    entity_id: sensor.a1_03900d642327265_print_progress
    above: 24
    id: "p25"
  - trigger: numeric_state
    entity_id: sensor.a1_03900d642327265_print_progress
    above: 49
    id: "p50"
  - trigger: numeric_state
    entity_id: sensor.a1_03900d642327265_print_progress
    above: 74
    id: "p75"
  - trigger: state
    entity_id: sensor.a1_03900d642327265_print_progress
    not_from:
      - unknown
      - unavailable
    to: null
    for: "00:30:00"
    id: "stall"
conditions: []
actions:
  - variables:
      task_name: "{{ states('sensor.a1_03900d642327265_task_name') }}"
      eta_raw: "{{ states('sensor.a1_03900d642327265_end_time') }}"
      eta_str: >-
        {% set eta = eta_raw | as_datetime(none) %}
        {{ (eta | as_local).strftime('%H:%M') if eta is not none else '' }}
  - choose:
      - conditions:
          - condition: trigger
            id: "started"
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none
              and trigger.from_state.state in ('idle', 'finish', 'failed') }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Started"
              message: >-
                {{ task_name | default('Print', true) }} started
                {%- if eta_str %}, ETA {{ eta_str }}{% endif %}.
      - conditions:
          - condition: trigger
            id: "finished"
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Finished"
              message: >-
                {{ task_name | default('Print', true) }} finished.
                {{ states('sensor.a1_03900d642327265_print_weight')
                | default('?', true) }}g of filament used.
      - conditions:
          - condition: trigger
            id: "idle"
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Still Sitting"
              message: >-
                {{ task_name | default('Print', true) }}
                finished over an hour ago and the printer is still occupied.
      - conditions:
          - condition: trigger
            id: "error"
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.from_state.state
              not in ('unknown', 'unavailable', 'none', '') }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Error"
              message: >-
                {{ task_name | default('Print', true) }} reported an error
                at {{ states('sensor.a1_03900d642327265_print_progress')
                | default('?', true) }}%
                (layer {{ states('sensor.a1_03900d642327265_current_layer')
                | default('?', true) }}/{{ states('sensor.a1_03900d642327265_total_layer_count')
                | default('?', true) }}).
                Nozzle {{ states('sensor.a1_03900d642327265_nozzle_temperature')
                | default('?', true) }}C,
                bed {{ states('sensor.a1_03900d642327265_bed_temperature')
                | default('?', true) }}C.
                Check the camera.
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Camera"
              message: "Snapshot from the A1 camera."
              image: /api/camera_proxy/camera.a1_03900d642327265_camera
            continue_on_error: true
      - conditions:
          - condition: trigger
            id: "p25"
          - condition: state
            entity_id: sensor.a1_03900d642327265_print_status
            state: running
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.from_state.state
              not in ('unknown', 'unavailable', 'none', '') }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Progress"
              message: >-
                {{ task_name | default('Print', true) }} is
                at {{ states('sensor.a1_03900d642327265_print_progress') }}%
                {%- if eta_str %}, ETA {{ eta_str }}{% endif %}.
      - conditions:
          - condition: trigger
            id: "p50"
          - condition: state
            entity_id: sensor.a1_03900d642327265_print_status
            state: running
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.from_state.state
              not in ('unknown', 'unavailable', 'none', '') }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Progress"
              message: >-
                {{ task_name | default('Print', true) }} is
                at {{ states('sensor.a1_03900d642327265_print_progress') }}%
                {%- if eta_str %}, ETA {{ eta_str }}{% endif %}.
      - conditions:
          - condition: trigger
            id: "p75"
          - condition: state
            entity_id: sensor.a1_03900d642327265_print_status
            state: running
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.from_state.state
              not in ('unknown', 'unavailable', 'none', '') }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Progress"
              message: >-
                {{ task_name | default('Print', true) }} is
                at {{ states('sensor.a1_03900d642327265_print_progress') }}%
                {%- if eta_str %}, ETA {{ eta_str }}{% endif %}.
      - conditions:
          - condition: trigger
            id: "stall"
          - condition: state
            entity_id: sensor.a1_03900d642327265_print_status
            state: running
          - condition: template
            value_template: >-
              {% set p = states.sensor.a1_03900d642327265_print_progress %}
              {{ p is not none and p.state not in ('unknown', 'unavailable')
              and (now() - p.last_changed).total_seconds() >= 1800 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "A1 Print Possibly Stalled"
              message: >-
                {{ task_name | default('Print', true) }}
                has been at {{ states('sensor.a1_03900d642327265_print_progress') }}%
                for 30 minutes without progress. Check the printer.
mode: parallel
max: 10
