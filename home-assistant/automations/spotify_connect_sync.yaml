id: spotify_connect_sync
alias: "Music Assistant: Spotify Connect Sync"
description: "Toggle Music Assistant Spotify Connect provider when input_boolean.spotify_connect changes."
mode: restart
triggers:
  - trigger: state
    entity_id: input_boolean.spotify_connect
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: shell_command.set_music_assistant_spotify_connect
    data:
      enabled: "{{ states('input_boolean.spotify_connect') == 'on' }}"
