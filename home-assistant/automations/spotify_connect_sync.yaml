id: spotify_connect_sync
alias: "Music Assistant: Spotify Connect Sync"
description: "Sync Music Assistant Spotify Connect provider players with input booleans."
mode: restart
triggers:
  - trigger: state
    entity_id:
      - input_boolean.spotify_connect
      - input_boolean.spotify_connect_bedroom
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: shell_command.set_music_assistant_spotify_connect
    data:
      living_room: "{{ states('input_boolean.spotify_connect') == 'on' }}"
      bedroom: "{{ states('input_boolean.spotify_connect_bedroom') == 'on' }}"
