id: bedroom_music_mode
alias: "Lighting: Bedroom Music Mode"
description: >-
  Activates real-time LedFx audio-reactive music mode on the bedroom LED matrix
  display when Bedroom Music Mode is turned on. Turn off deactivates the matrix
  music scene. Leaves bedroom room lighting untouched.
mode: restart
triggers:
  - trigger: state
    entity_id: input_boolean.bedroom_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.bedroom_music_mode
    to: "off"
    id: "mode_off"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bedroom_matrix_power
          - action: rest_command.ledfx_bedroom_activate_scene
            data:
              scene_id: "bedroom-music-mode"
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - action: rest_command.ledfx_bedroom_deactivate_scene
            data:
              scene_id: "bedroom-music-mode"
