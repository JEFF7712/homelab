id: zigbee_offline_watchdog
alias: "Zigbee: Offline Watchdog"
description: "Notify phone when the Zigbee bridge loses connection or tracked lights go unavailable."
triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: "off"
    for: "00:10:00"
    id: "bridge"
  - trigger: state
    entity_id:
      - switch.bedroom_window_plug
      - switch.bedroom_mushroom_plug
      - switch.exit_sign
      - light.desk_lamp_desk_lamp
      - light.floor_lamp_floor_lamp
      - light.light_strip_light_strip
    to: "unavailable"
    for: "00:15:00"
    id: "device"
conditions: []
actions:
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Zigbee Offline"
      message: >-
        {{ trigger.entity_id }} has been {{ trigger.to_state.state }} for a while.
        Check Zigbee2MQTT and the MQTT broker.
mode: parallel
max: 6
