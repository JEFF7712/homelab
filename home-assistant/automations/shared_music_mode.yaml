id: shared_music_mode
alias: "Lighting: Shared Music Mode"
description: >-
  While Music Mode is on, all six shared bulbs take one colour per track:
  the dominant colour of the soundbar's album art at a fixed brightness,
  applied by script.shared_music_album_color. Pausing keeps the last colour.
  The pre-music state is snapshotted first; when turned off, the snapshot is
  restored, then Adaptive Lighting control and circadian state resume.
  The LedFx music scene is deactivated on exit so the zigbee bridge stops
  driving the bulbs; LedFx itself stays up for future LED strips.
mode: queued
max: 5
triggers:
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "off"
    id: "mode_off"
  - trigger: state
    entity_id: media_player.homelab_05_satellite_media_player_2
    attribute: entity_picture
    id: "track"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_music_mode_shared
              snapshot_entities:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              manual_control: true
          - action: script.shared_music_album_color
      - conditions:
          - condition: trigger
            id: "track"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
          - condition: state
            entity_id: media_player.homelab_05_satellite_media_player_2
            state: "playing"
        sequence:
          - action: script.shared_music_album_color
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - action: rest_command.ledfx_deactivate_scene
            data:
              scene_id: "music-mode"
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ state_attr('scene.pre_music_mode_shared', 'entity_id') is not none }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: scene.pre_music_mode_shared
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              turn_on_lights: false
