id: shared_music_mode
alias: "Lighting: Shared Music Mode"
description: >-
  While Music Mode is on, each shared area whose
  input_boolean.music_mode_<area> toggle is on takes part:
  script.shared_music_area snapshots it, takes it off Adaptive Lighting and
  paints it with its shade of the track's palette from sensor.music_director,
  repainting on every new track. Areas whose toggle is off are left alone.
  Toggling an area while Music Mode is on joins or restores it immediately,
  and turning Music Mode off restores every area still taking part. The
  toggles keep their last values between sessions. The living room LED strip
  (input_boolean.music_mode_led_strip) is driven by the music_director
  integration through LedFx, not here.
mode: queued
max: 10
triggers:
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "off"
    id: "mode_off"
  - trigger: state
    entity_id:
      - input_boolean.music_mode_kitchen_ceiling
      - input_boolean.music_mode_dining_table
      - input_boolean.music_mode_floor_lamp
      - input_boolean.music_mode_tulip_lamp
      - input_boolean.music_mode_ceiling_strip
      - input_boolean.music_mode_mushroom_lamp
    to:
      - "on"
      - "off"
    id: "area"
  - trigger: state
    entity_id: sensor.music_director
    id: "palette"
conditions: []
actions:
  - variables:
      areas:
        - kitchen_ceiling
        - dining_table
        - floor_lamp
        - tulip_lamp
        - ceiling_strip
        - mushroom_lamp
      taking_part: >-
        {% set ns = namespace(on=[]) %}
        {% for area in areas if is_state('input_boolean.music_mode_' ~ area, 'on') %}
        {% set ns.on = ns.on + [area] %}
        {% endfor %}
        {{ ns.on }}
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - repeat:
              for_each: "{{ taking_part }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: join
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - repeat:
              for_each: "{{ taking_part }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: leave
      - conditions:
          - condition: trigger
            id: "area"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
        sequence:
          - action: script.shared_music_area
            data:
              area: "{{ trigger.entity_id | replace('input_boolean.music_mode_', '') }}"
              step: "{{ 'join' if trigger.to_state.state == 'on' else 'leave' }}"
      - conditions:
          - condition: trigger
            id: "palette"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
          - condition: template
            value_template: >-
              {{ trigger.to_state is not none
                 and trigger.to_state.attributes.area_colors is defined
                 and (trigger.from_state is none
                      or trigger.from_state.attributes.get('area_colors')
                         != trigger.to_state.attributes.area_colors) }}
        sequence:
          - repeat:
              for_each: "{{ taking_part }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: paint
