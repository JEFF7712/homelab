id: shared_music_mode
alias: "Lighting: Shared Music Mode"
description: >-
  While Music Mode is on, all shared lightbulbs and the ceiling LED strip
  turn off completely, leaving only the living room WLED strip reacting to
  music via LedFx (and existing signs on).
  The pre-music state is snapshotted first; when turned off, the snapshot is
  restored, then Adaptive Lighting control and circadian state resume.
  The Govee dining bulbs have their own Adaptive Lighting entry (2700K
  floor), so each call is split per switch.
  The LedFx music scene is activated on entry and deactivated on exit to drive
  the living room LED strip with real-time audio reactivity.
mode: queued
max: 5
triggers:
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "off"
    id: "mode_off"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_music_mode_shared
              snapshot_entities:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
                - light.apollo_led_strip_apollo_led_strip
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: true
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_govee_dining_bulbs
              lights:
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              manual_control: true
          - action: light.turn_off
            target:
              entity_id:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
                - light.apollo_led_strip_apollo_led_strip
          - action: rest_command.ledfx_activate_scene
            data:
              scene_id: "music-mode"
            continue_on_error: true
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - action: rest_command.ledfx_deactivate_scene
            data:
              scene_id: "music-mode"
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ state_attr('scene.pre_music_mode_shared', 'entity_id') is not none }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: scene.pre_music_mode_shared
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: false
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_govee_dining_bulbs
              lights:
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              turn_on_lights: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_govee_dining_bulbs
              lights:
                - light.kitchen_dining_table_ceiling_light_1
                - light.kitchen_dining_table_ceiling_light_2
              turn_on_lights: false
