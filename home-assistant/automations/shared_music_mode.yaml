id: shared_music_mode
alias: "Lighting: Shared Music Mode"
description: >-
  While Music Mode is on, only the lights whose input_boolean.music_mode_<area>
  toggle is on are lit. Starting Music Mode snapshots every shared area and
  the living room LED strip and takes the areas off Adaptive Lighting
  (script.shared_music_area); taking-part areas are painted with their shade
  of the track's palette from sensor.music_director, repainted on every new
  track and on colour or brightness changes, and the rest are switched off.
  New tracks change only the colour of lit areas, so a light's own brightness
  slider holds; moving Music Mode Brightness relights every taking-part area
  at that brightness. Toggling an area or the strip while Music Mode is on
  lights or switches it off immediately. Turning Music Mode off restores every area and the strip
  to its snapshot. The toggles keep their last values between sessions. The
  mushroom lamp has no toggle: Music Mode always switches it off and
  restores it afterwards, and a manual switch-on during Music Mode is left
  alone. The strip's colours and effects come from the music_director
  integration through LedFx; here it is only switched on or off.
mode: queued
max: 10
triggers:
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.shared_music_mode
    to: "off"
    id: "mode_off"
  - trigger: state
    entity_id:
      - input_boolean.music_mode_kitchen_ceiling
      - input_boolean.music_mode_dining_table
      - input_boolean.music_mode_floor_lamp
      - input_boolean.music_mode_tulip_lamp
      - input_boolean.music_mode_ceiling_strip
    to:
      - "on"
      - "off"
    id: "area"
  - trigger: state
    entity_id: input_boolean.music_mode_led_strip
    to:
      - "on"
      - "off"
    id: "strip"
  - trigger: state
    entity_id: sensor.music_director
    id: "palette"
conditions: []
actions:
  - variables:
      areas:
        - kitchen_ceiling
        - dining_table
        - floor_lamp
        - tulip_lamp
        - ceiling_strip
      taking_part: >-
        {% set ns = namespace(on=[]) %}
        {% for area in areas if is_state('input_boolean.music_mode_' ~ area, 'on') %}
        {% set ns.on = ns.on + [area] %}
        {% endfor %}
        {{ ns.on }}
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_music_mushroom_lamp
              snapshot_entities:
                - light.kitchen_mushroom_lamp
          - action: light.turn_off
            target:
              entity_id: light.kitchen_mushroom_lamp
          - action: scene.create
            data:
              scene_id: pre_music_led_strip
              snapshot_entities:
                - light.living_room_led_strip
          - action: >-
              light.turn_{{ 'on' if is_state('input_boolean.music_mode_led_strip', 'on')
              else 'off' }}
            target:
              entity_id: light.living_room_led_strip
          - repeat:
              for_each: "{{ areas }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: "{{ 'join' if repeat.item in taking_part else 'standby' }}"
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - repeat:
              for_each: "{{ areas }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: leave
          - repeat:
              for_each:
                - scene.pre_music_mushroom_lamp
                - scene.pre_music_led_strip
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ state_attr(repeat.item, 'entity_id') is not none }}"
                  then:
                    - action: scene.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
      - conditions:
          - condition: trigger
            id: "area"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
        sequence:
          - action: script.shared_music_area
            data:
              area: "{{ trigger.entity_id | replace('input_boolean.music_mode_', '') }}"
              step: "{{ 'relight' if trigger.to_state.state == 'on' else 'off' }}"
      - conditions:
          - condition: trigger
            id: "strip"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
        sequence:
          - action: "light.turn_{{ trigger.to_state.state }}"
            target:
              entity_id: light.living_room_led_strip
      - conditions:
          - condition: trigger
            id: "palette"
          - condition: state
            entity_id: input_boolean.shared_music_mode
            state: "on"
          - condition: template
            value_template: >-
              {% set new = trigger.to_state.attributes if trigger.to_state else {} %}
              {% set old = trigger.from_state.attributes if trigger.from_state else {} %}
              {{ new.area_colors is defined
                 and (old.get('area_colors') != new.area_colors
                      or old.get('brightness_pct') != new.get('brightness_pct')) }}
        sequence:
          - variables:
              step: >-
                {{ 'relight' if trigger.from_state is not none
                   and trigger.from_state.attributes.get('brightness_pct')
                       != trigger.to_state.attributes.get('brightness_pct')
                   else 'paint' }}
          - repeat:
              for_each: "{{ taking_part }}"
              sequence:
                - action: script.shared_music_area
                  data:
                    area: "{{ repeat.item }}"
                    step: "{{ step }}"
