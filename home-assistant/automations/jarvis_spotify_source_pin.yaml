id: jarvis_spotify_source_pin
alias: Pin Spotify output to Jarvis satellite
description: >-
  When the Spotify integration starts playing (or sits idle) with no output
  source selected, select the Living Room soundbar (Music Assistant satellite
  player) so audio routes to the soundbar. The target source is resolved
  dynamically from the live Spotify source list (first entry matching
  soundbar, satellite, or Music Assistant) so friendly-name renames do not
  break routing again. Never overrides an explicitly chosen source such as
  the phone, and never fires while nobody is home, so phone playback away
  from home is left alone.
mode: single
triggers:
  - trigger: state
    entity_id: media_player.spotify_rupan
    to: "idle"
    for: "00:00:05"
    id: "idle"
  - trigger: state
    entity_id: media_player.spotify_rupan
    to: "playing"
    id: "playing"
conditions:
  - condition: state
    entity_id: input_boolean.spotify_connect
    state: "on"
  - condition: template
    value_template: >-
      {% set src = state_attr('media_player.spotify_rupan', 'source') %}
      {{ not src or src in ('unknown', 'unavailable', 'none', '') }}
  - condition: template
    value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}"
actions:
  - variables:
      spotify_sources: "{{ state_attr('media_player.spotify_rupan', 'source_list') | default([], true) }}"
      target_source: >-
        {{
          (spotify_sources | select('search', '(?i)(soundbar|satellite)')
          | reject('search', '(?i)bedroom')
          | list | first) | default('', true)
        }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ target_source != '' }}"
        sequence:
          - action: media_player.select_source
            target:
              entity_id: media_player.spotify_rupan
            data:
              source: "{{ target_source }}"
            continue_on_error: true
