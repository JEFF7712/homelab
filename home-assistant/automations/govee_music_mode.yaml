id: govee_music_mode
alias: "Lighting: Govee Music Mode"
description: >-
  Activates real-time LedFx audio-reactive lighting across all shared Govee
  bulbs when Govee Music Mode is turned on, locking Adaptive Lighting. The
  pre-music state is snapshotted first; when turned off, the snapshot is
  restored so bulbs never keep LedFx's last frame (black when the audio tap
  is silent), then Adaptive Lighting control and circadian state resume
  without API spam.
mode: restart
triggers:
  - trigger: state
    entity_id: input_boolean.govee_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.govee_music_mode
    to: "off"
    id: "mode_off"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_music_mode_govee
              snapshot_entities:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
                - light.apollo_led_strip_apollo_led_strip
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: true
          - action: rest_command.ledfx_activate_scene
            data:
              scene_id: "music-mode"
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - action: rest_command.ledfx_deactivate_scene
            data:
              scene_id: "music-mode"
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ state_attr('scene.pre_music_mode_govee', 'entity_id') is not none }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: scene.pre_music_mode_govee
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              turn_on_lights: false
