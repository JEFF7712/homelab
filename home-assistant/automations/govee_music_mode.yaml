id: govee_music_mode
alias: "Lighting: Govee Music Mode"
description: >-
  Activates real-time LedFx audio-reactive lighting across all shared Govee
  bulbs when Govee Music Mode is turned on, locking Adaptive Lighting. When
  turned off, restores Adaptive Lighting control and circadian state without API spam.
mode: restart
triggers:
  - trigger: state
    entity_id: input_boolean.govee_music_mode
    to: "on"
    id: "mode_on"
  - trigger: state
    entity_id: input_boolean.govee_music_mode
    to: "off"
    id: "mode_off"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "mode_on"
        sequence:
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_light
                - light.kitchen_light_2
                - light.living_room_mushroom_lamp
                - light.living_room_tulip_lamp
              manual_control: true
          - action: rest_command.ledfx_activate_scene
            data:
              scene_id: "music-mode"
      - conditions:
          - condition: trigger
            id: "mode_off"
        sequence:
          - action: rest_command.ledfx_deactivate_scene
            data:
              scene_id: "music-mode"
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_light
                - light.kitchen_light_2
                - light.living_room_mushroom_lamp
                - light.living_room_tulip_lamp
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_light
                - light.kitchen_light_2
                - light.living_room_mushroom_lamp
                - light.living_room_tulip_lamp
              turn_on_lights: false
