id: shared_spaces_empty_lights_off
alias: "Shared Spaces: Lights Off When Empty"
description: >-
  Shared spaces only. Snapshot and switch shared lights off when the last
  person leaves, keep them off while nobody is home, restore the snapshot on
  daytime return. Dark returns re-apply the sunset-driven stairs light, since
  the snapshot alone would leave it off all night. Skipped while Guest Mode
  is on, so guests are never left in the dark.
triggers:
  - trigger: state
    entity_id:
      - person.rupan_sunderapandyan
      - person.sam
      - person.jayanth
    to: "not_home"
    id: "left_empty"
  - trigger: state
    entity_id:
      - person.rupan_sunderapandyan
      - person.sam
      - person.jayanth
    to: "home"
    id: "return"
  - trigger: state
    entity_id:
      - switch.fuck_off_sign
      - switch.living_room_good_vibes_sign
      - switch.stairs_light
      - light.kitchen_light_lan
      - light.kitchen_light_2_lan
      - light.living_room_mushroom_lamp_lan
      - light.living_room_tulip_lamp_lan
    from: "off"
    to: "on"
    id: "enforced"
  - trigger: homeassistant
    event: start
    id: "restart"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "left_empty"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count == 0 }}"
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_away_shared
              snapshot_entities:
                - switch.fuck_off_sign
                - switch.living_room_good_vibes_sign
                - switch.stairs_light
                - switch.kitchen_mushroom_lamp
                - light.kitchen_light_lan
                - light.kitchen_light_2_lan
                - light.living_room_mushroom_lamp_lan
                - light.living_room_tulip_lamp_lan
          - action: homeassistant.turn_off
            target:
              label_id: shared_space
          - action: switch.turn_off
            target:
              entity_id:
                - switch.fuck_off_sign
                - switch.living_room_good_vibes_sign
                - switch.stairs_light
                - switch.kitchen_mushroom_lamp
          - action: light.turn_off
            target:
              entity_id:
                - light.kitchen_light_lan
                - light.kitchen_light_2_lan
                - light.living_room_mushroom_lamp_lan
                - light.living_room_tulip_lamp_lan
      - conditions:
          - condition: trigger
            id: "enforced"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count == 0 }}"
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ trigger.entity_id }}"
      - conditions:
          - condition: trigger
            id: "restart"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count == 0 }}"
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
        sequence:
          - action: homeassistant.turn_off
            target:
              label_id: shared_space
          - action: switch.turn_off
            target:
              entity_id:
                - switch.fuck_off_sign
                - switch.living_room_good_vibes_sign
                - switch.stairs_light
                - switch.kitchen_mushroom_lamp
          - action: light.turn_off
            target:
              entity_id:
                - light.kitchen_light_lan
                - light.kitchen_light_2_lan
                - light.living_room_mushroom_lamp_lan
                - light.living_room_tulip_lamp_lan
      - conditions:
          - condition: trigger
            id: "return"
          - condition: template
            value_template: "{{ state_attr('scene.pre_away_shared', 'entity_id') is not none }}"
          - condition: state
            entity_id: sun.sun
            state: "above_horizon"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.pre_away_shared
      - conditions:
          - condition: trigger
            id: "return"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.stairs_light
mode: queued
