id: bedroom_away_lights
alias: "Bedroom: Lights Off While Away"
description: >-
  Rupan bedroom only. Snapshot and switch bedroom lights and the bus
  display off when Rupan leaves, keep them off while Rupan is away, restore
  the snapshot on return. Adaptive Lighting is re-enabled on leave so a
  paused morning fade cannot leave adaptation off all day.
triggers:
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    to: "not_home"
    id: "away"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "return"
  - trigger: state
    entity_id:
      - switch.bedroom_window_plug
      - switch.bedroom_mushroom_plug
      - light.desk_lamp_desk_lamp
      - light.floor_lamp_floor_lamp
      - light.light_strip_light_strip
      - light.bus_display
    from: "off"
    to: "on"
    id: "enforced"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "away"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_away_bedroom
              snapshot_entities:
                - switch.bedroom_window_plug
                - switch.bedroom_mushroom_plug
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
                - light.bus_display
          - action: script.bedroom_lights_off
          - action: switch.turn_on
            target:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
      - conditions:
          - condition: trigger
            id: "enforced"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "not_home"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ trigger.entity_id }}"
      - conditions:
          - condition: trigger
            id: "return"
          - condition: template
            value_template: "{{ state_attr('scene.pre_away_bedroom', 'entity_id') is not none }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.pre_away_bedroom
mode: queued
