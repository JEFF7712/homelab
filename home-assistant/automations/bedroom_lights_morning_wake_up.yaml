id: bedroom_lights_morning_wake_up
alias: "Bedroom Lights: Morning Wake-Up Fade"
description: >-
  Ramp bedroom lamps from 1 to 30 percent warm over the 20 minutes before
  the earlier of the Bedroom Wake Time helper and the phone's next alarm.
  Adaptive Lighting is paused during the fade so its interval adaptation
  does not fight the ramp, then restored when the fade ends. Plugs, the bus
  display, and the bedroom LED matrix display come on at fade start.
  Brightness is computed from elapsed time each minute, so a restart
  mid-fade resumes at the correct level instead of restarting or stalling.
  Turning any fade target off during the window (dashboard, voice, or
  switch; the fade itself never turns targets off) dismisses the fade until
  the window ends, so the next tick does not switch it back on. The dismissal clears on the first tick outside the
  window, so it never suppresses the next morning.
  Unknown or malformed times fall back safely to no fade.
triggers:
  - trigger: time_pattern
    minutes: "/1"
    id: "fade_tick"
  - trigger: template
    value_template: >-
      {% set wake = states('input_datetime.bedroom_wake_time') %}
      {% set wake_ts = as_timestamp(today_at(wake), none)
      if wake not in ('unknown', 'unavailable', '') else none %}
      {% set alarm_ts = as_timestamp(states('sensor.sm_s948u1_next_alarm'), none) %}
      {% set cands = [wake_ts, alarm_ts] | select('ne', none) | list %}
      {% set target_ts = cands | min if cands | count > 0 else none %}
      {{ target_ts is not none and as_timestamp(now()) >= target_ts }}
    id: "fade_end"
  - trigger: state
    entity_id:
      - switch.bedroom_window_plug
      - switch.bedroom_mushroom_plug
      - light.bus_display
      - input_boolean.bedroom_matrix_power
      - light.desk_lamp_desk_lamp
      - light.floor_lamp_floor_lamp
      - light.light_strip_light_strip
    from: "on"
    to: "off"
    id: "manual_off"
conditions:
  - condition: state
    entity_id: person.rupan_sunderapandyan
    state: "home"
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: "off"
actions:
  - variables:
      target_ts: >-
        {% set wake_raw = states('input_datetime.bedroom_wake_time') %}
        {% set wake_ts = as_timestamp(today_at(wake_raw), none)
        if wake_raw not in ('unknown', 'unavailable', '') else none %}
        {% set alarm_ts = as_timestamp(states('sensor.sm_s948u1_next_alarm'), none) %}
        {% set cands = [wake_ts, alarm_ts] | select('ne', none) | list %}
        {{ cands | min if cands | count > 0 else 0 }}
      in_window: >-
        {% set t = target_ts | float(0) %}
        {{ t > 0 and (t - 1200) <= as_timestamp(now()) <= t }}
  - choose:
      - conditions:
          - condition: trigger
            id: "fade_end"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom_wake_fade_dismissed
      - conditions:
          - condition: trigger
            id: "manual_off"
          - condition: template
            value_template: >-
              {{ in_window }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bedroom_wake_fade_dismissed
      - conditions:
          - condition: trigger
            id: "fade_tick"
          - condition: template
            value_template: "{{ not in_window }}"
          - condition: state
            entity_id: input_boolean.bedroom_wake_fade_dismissed
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom_wake_fade_dismissed
      - conditions:
          - condition: trigger
            id: "fade_tick"
          - condition: template
            value_template: "{{ in_window }}"
          - condition: state
            entity_id: input_boolean.bedroom_wake_fade_dismissed
            state: "off"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
          - action: switch.turn_on
            target:
              entity_id:
                - switch.bedroom_window_plug
                - switch.bedroom_mushroom_plug
          - action: light.turn_on
            target:
              entity_id: light.bus_display
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bedroom_matrix_power
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
            data:
              brightness_pct: >-
                {% set t = target_ts | float(0) %}
                {{ (((as_timestamp(now()) - (t - 1200)) / 1200 * 30)
                | int | max(1)) | min(100) }}
              color_temp_kelvin: 2700
mode: queued
max: 10
