id: jarvis_voice_music_playback
alias: "Jarvis: Voice Music Playback"
description: >-
  Deterministically plays music on the Jarvis satellite speaker via Music
  Assistant. A trailing device reference ("on the speaker", "on speaker",
  "on the soundbar") is stripped from the query before lookup. Bare artist
  requests ("play some MF DOOM") start an endless
  artist mix (radio_mode) so playback continues past the first track;
  song, album, playlist, and favorites ("play my liked songs") requests keep
  their narrower lookup. The media type and platform ride the trigger id into
  script.jarvis_play_media. The reply is "Done." when the script reports the
  request was accepted ('accepted') or playback was observed ('playing');
  "Done." therefore means the request was accepted, not independently
  verified playback. When the script fails, the full utterance
  (trigger.sentence) is handed to the Jev Router conversation agent for a
  second attempt instead of ending on a canned error; only if Jev also has
  no reply does the turn fall back to "Could not start playback."
mode: restart
triggers:
  - trigger: conversation
    id: track
    command:
      - "play the song {query}"
      - "play [a] song {query}"
      - "play song {query}"
      - "play {query}"
      - "put on the song {query}"
      - "put on [a] song {query}"
      - "put on [the] song {query}"
      - "put on song {query}"
      - "listen to the song {query}"
      - "listen to [a] song {query}"
      - "listen to song {query}"
      - "[speaker {speaker}] play the song {query}"
      - "[speaker {speaker}] play [a] song {query}"
      - "[speaker {speaker}] play song {query}"
      - "[speaker {speaker}] play {query}"
      - "[speaker {speaker}] put on the song {query}"
      - "[speaker {speaker}] put on [a] song {query}"
      - "[speaker {speaker}] put on [the] song {query}"
      - "[speaker {speaker}] put on song {query}"
      - "[speaker {speaker}] listen to the song {query}"
      - "[speaker {speaker}] listen to [a] song {query}"
      - "[speaker {speaker}] listen to song {query}"
  - trigger: conversation
    id: artist
    command:
      - "play some {query}"
      - "put on [some] {query}"
      - "put some {query} on"
      - "play the artist {query}"
      - "listen to [some] {query}"
      - "play [some] music by {query}"
      - "[speaker {speaker}] play some {query}"
      - "[speaker {speaker}] put on [some] {query}"
      - "[speaker {speaker}] put some {query} on"
      - "[speaker {speaker}] play the artist {query}"
      - "[speaker {speaker}] listen to [some] {query}"
      - "[speaker {speaker}] play [some] music by {query}"
  - trigger: conversation
    id: album
    command:
      - "play the album {query}"
      - "[speaker {speaker}] play the album {query}"
  - trigger: conversation
    id: playlist
    command:
      - "play the playlist {query}"
      - "play [my] {query} playlist"
      - "[speaker {speaker}] play the playlist {query}"
      - "[speaker {speaker}] play [my] {query} playlist"
  - trigger: conversation
    id: youtube_track
    command:
      - "play {query} on youtube [music]"
      - "play the song {query} on youtube [music]"
      - "play [a] song {query} on youtube [music]"
      - "play song {query} on youtube [music]"
      - "put on {query} on youtube [music]"
      - "put on the song {query} on youtube [music]"
      - "put on [a] song {query} on youtube [music]"
      - "put on song {query} on youtube [music]"
      - "[speaker {speaker}] play {query} on youtube [music]"
      - "[speaker {speaker}] play the song {query} on youtube [music]"
      - "[speaker {speaker}] play [a] song {query} on youtube [music]"
      - "[speaker {speaker}] play song {query} on youtube [music]"
      - "[speaker {speaker}] put on {query} on youtube [music]"
      - "[speaker {speaker}] put on the song {query} on youtube [music]"
      - "[speaker {speaker}] put on [a] song {query} on youtube [music]"
      - "[speaker {speaker}] put on song {query} on youtube [music]"
  - trigger: conversation
    id: youtube_artist
    command:
      - "play some {query} on youtube [music]"
      - "put on [some] {query} on youtube [music]"
      - "[speaker {speaker}] play some {query} on youtube [music]"
      - "[speaker {speaker}] put on [some] {query} on youtube [music]"
  - trigger: conversation
    id: favorites
    command:
      - "play my liked songs"
      - "play my favorites"
      - "play my liked music"
      - "[speaker {speaker}] play my liked songs"
conditions: []
actions:
  - action: script.jarvis_play_media
    data:
      media_content_type: >-
        {% if trigger.slots.query is defined
              and trigger.slots.query.lower().startswith(('the song ', 'a song ', 'song ')) %}
          music
        {% elif trigger.id == 'artist' and ' by ' in trigger.slots.query.lower() %}
          music
        {% else %}
          {{ {'artist': 'artist', 'track': 'music', 'album': 'album',
              'playlist': 'playlist', 'favorites': 'playlist',
              'youtube_artist': 'artist',
              'youtube_track': 'music'}[trigger.id] }}
        {% endif %}
      platform: >-
        {{ 'youtube_music' if trigger.id in ['youtube_artist', 'youtube_track']
            else 'youtube_music' if trigger.slots.speaker is defined and trigger.slots.speaker | lower == 'sam'
            else 'spotify' }}
      speaker: "{{ trigger.slots.speaker | default('') }}"
      media_content_id: >-
        {% if trigger.id == 'favorites' %}
          Liked Songs
        {% else %}
          {{ trigger.slots.query
              | regex_replace('\s+on\s+(the\s+)?(speaker|soundbar)\s*$', '', ignorecase=True)
              | regex_replace('^(the\s+song|a\s+song|song)\s+', '', ignorecase=True) }}
        {% endif %}
    response_variable: playback
    continue_on_error: true
  # Jev Router conversation agent (also the Jarvis pipeline engine) gets a
  # second attempt on failure. Agents never re-run sentence triggers, so
  # this cannot loop.
  - if:
      - condition: template
        value_template: "{{ not (playback is defined and playback.status in ['playing', 'accepted']) }}"
    then:
      - action: conversation.process
        data:
          agent_id: 01M3123N8QF2RJ5Z95X7M7K87K
          text: "{{ trigger.sentence }}"
        response_variable: jev_fallback
        continue_on_error: true
  - set_conversation_response: >-
      {% if playback is defined and playback.status in ['playing', 'accepted'] %}
        {% if trigger.slots.speaker is defined and trigger.slots.speaker %}
          Done, {{ 'Roopen' if trigger.slots.speaker == 'Rupan' else trigger.slots.speaker }}.
        {% else %}
          Done.
        {% endif %}
      {% else %}
        {{ (jev_fallback.response.speech.plain.speech | default('', true) | trim)
          or 'Could not start playback.' }}
      {% endif %}
