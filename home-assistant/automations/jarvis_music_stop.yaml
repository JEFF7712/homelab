id: jarvis_music_stop
alias: "Jarvis: Music Stop"
description: >-
  Deterministically pause satellite-speaker playback on turn-off, stop, pause,
  pronoun, and urgent silence phrasings. Kept as a conversation trigger so it
  never depends on the conversation agent.
mode: restart
triggers:
  - trigger: conversation
    id: stop
    command:
      - "turn off [the] music"
      - "turn [the] music off"
      - "turn it off"
      - "stop [the] music"
      - "stop it"
      - "stop"
      - "pause [the] music"
      - "pause it"
      - "pause"
      - "shut up"
      - "be quiet"
      - "silence"
      - "silence [the] music"
      - "stop playing [the] music"
      - "please turn off [the] music"
      - "turn off [the] music please"
      - "please stop [the] music"
      - "speaker {speaker} turn off [the] music"
      - "speaker {speaker} turn [the] music off"
      - "speaker {speaker} turn it off"
      - "speaker {speaker} stop [the] music"
      - "speaker {speaker} stop it"
      - "speaker {speaker} stop"
      - "speaker {speaker} pause [the] music"
      - "speaker {speaker} pause it"
      - "speaker {speaker} pause"
      - "speaker {speaker} shut up"
      - "speaker {speaker} be quiet"
      - "speaker {speaker} silence"
      - "speaker {speaker} silence [the] music"
      - "speaker {speaker} stop playing [the] music"
      - "speaker {speaker} please turn off [the] music"
      - "speaker {speaker} turn off [the] music please"
      - "speaker {speaker} please stop [the] music"
conditions: []
actions:
  - action: media_player.media_pause
    target:
      entity_id: media_player.homelab_05_satellite_media_player_2
  - set_conversation_response: Paused.
