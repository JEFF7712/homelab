image: nixos/nix:latest@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c

workflow:
  rules:
    - if: '$CI_DR_ACTIVE != "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

variables:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    sandbox = false
    max-jobs = 2
    cores = 2
    extra-substituters = http://10.0.30.20:8080/homelab
    extra-trusted-public-keys = homelab:J+OVQOCG2sNT2KoVbWGPikoWcIbBanHnY2NOcMF3vwk=

stages: [validate, plan, operate]

validate:
  stage: validate
  tags: [homelab-dr-validation]
  script:
    - >-
      nix develop ./flake -c bash -e -c 'just provision-check-deps; python
      -m scripts.ci.run fmt -- just fmt-check & f=$!; python -m scripts.ci.run
      jev -- python scripts/jev_decision_gate.py & j=$!; python -m scripts.ci.run
      gate -- just check & c=$!; rc=0; wait "$f" || rc=1; wait "$j" || rc=1;
      wait "$c" || rc=1; python -m scripts.ci.timings_report || true; exit $rc'

.production-operation:
  tags: [homelab-dr-operations]
  resource_group: production-authority
  needs: [validate]
  environment:
    name: production

opnsense-plan:
  extends: .production-operation
  stage: plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - CI_OPERATION=opnsense-plan nix develop ./flake -c python -m scripts.ci.gitlab_operation

cloudflare-plan:
  extends: .production-operation
  stage: plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - CI_OPERATION=cloudflare-plan nix develop ./flake -c python -m scripts.ci.gitlab_operation

operate:
  extends: .production-operation
  stage: operate
  needs: [validate, opnsense-plan, cloudflare-plan]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
  allow_failure: false
  script:
    - nix develop ./flake -c python -m scripts.ci.gitlab_operation
