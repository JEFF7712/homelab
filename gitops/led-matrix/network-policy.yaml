apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renderer
  namespace: led-matrix
spec:
  endpointSelector:
    matchLabels:
      app: led-matrix
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "4048"
              protocol: UDP
    - fromCIDR:
        - 10.0.30.20/32
        - 10.0.10.0/24
        - 10.0.30.0/24
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "4048"
              protocol: UDP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: home-assistant
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - toCIDR:
        - 10.0.20.136/32
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
