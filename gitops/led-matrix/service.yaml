apiVersion: v1
kind: Service
metadata:
  name: led-matrix
  namespace: led-matrix
  labels:
    bgp-advertise: "true"
    app: led-matrix
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  # Local keeps the client address so the network policy's CIDR allowlist
  # matches. With Cluster, a node without the pod SNATs the traffic into the
  # tunnel as identity world and the policy drops LedFx DDP and HTTP.
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: ddp
      port: 4048
      targetPort: 4048
      protocol: UDP
  selector:
    app: led-matrix
