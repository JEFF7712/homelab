apiVersion: v1
kind: Service
metadata:
  name: led-matrix
  namespace: led-matrix
  labels:
    bgp-advertise: "true"
    app: led-matrix
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: ddp
      port: 4048
      targetPort: 4048
      protocol: UDP
  selector:
    app: led-matrix
