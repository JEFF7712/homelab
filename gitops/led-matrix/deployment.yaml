apiVersion: apps/v1
kind: Deployment
metadata:
  name: led-matrix
  namespace: led-matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: led-matrix
  template:
    metadata:
      labels:
        app: led-matrix
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: renderer
          image: >-
            registry.rupan.dev/apps/spotify-matrix@sha256:e9ae2ec1bda04968f6c6e7cf13b5709fa38bd39a8f91a5ecc8b7a85f9f3234b0
          args:
            - --ha-url
            - http://10.0.40.13:8123
            - --ha-token-file
            - /run/secrets/ha/token
            - --entity
            - media_player.spotify_rupan,media_player.bedroom_speaker
            - --power-entity
            - input_boolean.bedroom_matrix_power
            - --mode-entity
            - input_select.bedroom_matrix_mode
            - --brightness-entity
            - input_number.bedroom_matrix_brightness
            - --weather-entity
            - weather.forecast_home
            - --music-mode-entity
            - input_boolean.bedroom_music_mode
            - --pico-ip
            - 10.0.20.136
            - --fps
            - "20"
            - --spotify-poll-interval
            - "3.0"
            - --spotify-poll-interval-paused
            - "15.0"
            - --web-port
            - "8000"
            - --ledfx-port
            - "4048"
            - --health-file
            - /tmp/health.json
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: ddp
              containerPort: 4048
              protocol: UDP
          env:
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: led-matrix-secrets
                  key: spotify-client-id
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: led-matrix-secrets
                  key: spotify-client-secret
            - name: SPOTIFY_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: led-matrix-secrets
                  key: spotify-refresh-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import json,time;
                  s=json.load(open('/tmp/health.json'));
                  assert time.time()-s['updated_at']<15
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import json,time;
                  s=json.load(open('/tmp/health.json'));
                  assert time.time()-s['updated_at']<15 and s['ready']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: ha-token
          secret:
            secretName: led-matrix-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
