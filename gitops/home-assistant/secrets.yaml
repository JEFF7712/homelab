apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: home-assistant-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_USERNAME: "homeassistant"
        DB_DATABASE_NAME: "homeassistant"
        DB_PASSWORD: "{{ .db_password }}"
        username: "homeassistant"
        password: "{{ .db_password }}"
        typesafe_api_key: "{{ .typesafe_api_key }}"
        gemini_api_key: "{{ .gemini_api_key }}"
        ha_metrics_token: "{{ .ha_metrics_token }}"
        secrets.yaml: |
          recorder_db_url: "postgresql://homeassistant:{{ .db_password }}@\
            home-assistant-postgres.home-assistant.svc.cluster.local:5432/homeassistant"
  data:
    - secretKey: db_password
      remoteRef:
        key: homelab-values
        property: HOME_ASSISTANT_DB_PASSWORD
    - secretKey: typesafe_api_key
      remoteRef:
        key: homelab-values
        property: TYPESAFE_API_KEY
    - secretKey: gemini_api_key
      remoteRef:
        key: homelab-values
        property: GEMINI_API_KEY
    - secretKey: ha_metrics_token
      remoteRef:
        key: homelab-values
        property: JARVIS_EXPORTER_HA_TOKEN
