# Stable name for Home Assistant's database: the primary of the
# CloudNativePG cluster (postgres-cluster.yaml). Home Assistant's recorder
# URL and the nightly dump connect here. The standalone Postgres this name
# once fronted was retired on 2026-11-10; its data is archived as
# home-assistant-legacy-pgdata-20261001.tar.gz in the db-dumps volume.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-postgres
  namespace: home-assistant
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    cnpg.io/cluster: home-assistant-cluster
    role: primary
