apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spotify-app-credentials
  namespace: home-assistant
  annotations:
    description: >-
      Spotify developer app credentials used by the Home Assistant Spotify
      integration. Backed by SOPS-managed values (`SPOTIFY_CLIENT_ID`,
      `SPOTIFY_CLIENT_SECRET`) via the `homelab-secrets` ClusterSecretStore.
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: spotify-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: home-assistant
          app.kubernetes.io/component: integration-credentials
  data:
    - secretKey: client_id
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_SECRET
