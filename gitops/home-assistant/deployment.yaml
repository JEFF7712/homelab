apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        checksum/config: 4b8d92c6844f97738bb92ee7b7ce9b891a833cd40f4728779564b31d002e8db6
        checksum/dependencies: 8eac350ea6f0dc5b311c3b363345bb99229e5efa193aa69111e630103301751e
        reloader.stakater.com/auto: 'true'
    spec:
      priorityClassName: homelab-critical
      nodeSelector:
        kubernetes.io/hostname: homelab-03
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-config
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - /bin/sh
            - -ec
            - |
              cp /bootstrap/configuration.yaml /config/configuration.yaml
              for src in /bootstrap/*.yaml; do
                [ -f "$src" ] || continue
                base=$(basename "$src")
                [ "$base" = "configuration.yaml" ] && continue
                lang=${base%%.*}
                file=${base#*.}
                mkdir -p "/config/custom_sentences/$lang"
                cp "$src" "/config/custom_sentences/$lang/$file"
              done
              for src in /bootstrap/component.*; do
                [ -f "$src" ] || continue
                base=$(basename "$src")
                rest=${base#component.}
                domain=${rest%%.*}
                file=${rest#*.}
                mkdir -p "/config/custom_components/$domain"
                cp "$src" "/config/custom_components/$domain/$file"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: install-hacs
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - /bin/sh
            - -ec
            - |
              hacs_version=2.0.5
              hacs_url=https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip
              hacs_sha256=97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413
              version_file=/config/.hacs-version
              if [ -f "$version_file" ] && [ "$(cat "$version_file")" = "$hacs_version" ] \
                && [ -f /config/custom_components/hacs/manifest.json ]; then
                exit 0
              fi
              workdir=$(mktemp -d)
              trap 'rm -rf "$workdir"' EXIT
              wget -q -O "$workdir/hacs.zip" "$hacs_url"
              printf '%s  %s\n' "$hacs_sha256" "$workdir/hacs.zip" | sha256sum -c -
              mkdir -p "$workdir/custom_components/hacs"
              unzip -q "$workdir/hacs.zip" -d "$workdir/custom_components/hacs"
              test -f "$workdir/custom_components/hacs/manifest.json"
              mkdir -p /config/custom_components
              rm -rf /config/custom_components/hacs
              cp -R "$workdir/custom_components/hacs" /config/custom_components/
              printf '%s\n' "$hacs_version" > "$version_file"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      containers:
        - name: home-assistant
          image: registry.rupan.dev/upstream/ghcr.io/home-assistant/home-assistant@sha256:31076d37e3b7dc9681b32d892aa4413fa866c9a90e5c8a50324b397dce415d17  # yamllint disable-line rule:line-length
          env:
            - name: TZ
              value: America/Chicago
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: home-assistant-secrets
                  key: typesafe_api_key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: home-assistant-secrets
                  key: gemini_api_key
                  optional: true
            - name: JARVIS_SHADOW_ENABLED
              value: "0"
          ports:
            - name: http
              containerPort: 8123
            - name: hap
              containerPort: 21063
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
        - name: matter-server
          image: registry.rupan.dev/upstream/ghcr.io/matter-js/matterjs-server@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236  # yamllint disable-line rule:line-length
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: matter-server-data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: bootstrap-config
          configMap:
            name: home-assistant-config
        - name: secrets
          secret:
            secretName: home-assistant-secrets
        - name: tmp
          emptyDir: {}
        - name: matter-server-data
          persistentVolumeClaim:
            claimName: home-assistant-matter-server
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
