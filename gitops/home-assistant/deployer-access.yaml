# CI's deploy-home-assistant operations use this identity instead of the
# k3s admin kubeconfig: they read the HA config files, keep their baseline
# and lock ConfigMaps, and read the HA token, all in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ha-deployer
  namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ha-deployer
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["home-assistant-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ha-deployer
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ha-deployer
subjects:
  - kind: ServiceAccount
    name: ha-deployer
    namespace: home-assistant
---
apiVersion: v1
kind: Secret
metadata:
  name: ha-deployer-token
  namespace: home-assistant
  annotations:
    kubernetes.io/service-account.name: ha-deployer
type: kubernetes.io/service-account-token
