# Inventory-only upstream image declarations for gitops/home-assistant
# consumers. Renovate tracks these tagged references; the workloads pin the
# mirrored digest. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# referenced by digest in the owning manifest.
#
# This file is NOT listed in gitops/home-assistant/kustomization.yaml: it is
# an inventory source only and must never be applied to the cluster.
#
# Update flow: change the digest below, import it, then update the consumer
# manifest digest, so a pod never pulls an image the mirror lacks.
apiVersion: v1
kind: List
metadata:
  name: home-assistant-registry-sources
items:
  # Home Assistant (deployment.yaml)
  - image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:078222f9ea47cf47b172a301c2c45a1d2344b9d666827729b71fc3f7d7a57592  # yamllint disable-line rule:line-length
  # Matter server (deployment.yaml)
  - image: ghcr.io/matter-js/matterjs-server:1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e  # yamllint disable-line rule:line-length
