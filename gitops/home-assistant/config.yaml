      --eye-bg: #00f0ff;
    }

    /* --- 5. MUSIC (Media Player Playing) --- */
    #app.state-music {
      --primary-color: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.45);
      --primary-ambient: rgba(0, 240, 255, 0.1);
      --eye-bg: #00f0ff;
    }

    /* --- 6. MUTED (Sleeping State) --- */
    #app.state-muted {
      --primary-color: #64748b;
      --primary-glow: rgba(100, 116, 139, 0.35);
      --primary-ambient: rgba(100, 116, 139, 0.05);
      --eye-bg: #475569;
    }

    /* Last response remains readable across idle and music states. */
    #response-text {
      position: fixed;
      z-index: 20;
      bottom: 5vh;
      left: 5vw;
      right: 5vw;
      max-height: 40vh;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      background: rgba(0, 0, 0, 0.88);
      color: #e6fcff;
      font: 500 clamp(22px, 3vw, 44px)/1.4 sans-serif;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
    }
    #response-text[hidden] { display: none; }
