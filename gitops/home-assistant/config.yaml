apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:
    homeassistant:
      external_url: https://ha.rupan.dev
      allowlist_external_urls:
        - http://127.0.0.1:8123
        - http://10.0.30.15:8095
      customize:
        light.shared_zigbee_lights:
          friendly_name: Shared Lights
      auth_providers:
        - type: homeassistant
        - type: trusted_networks
          trusted_networks:
            - 10.0.30.15/32
          trusted_users:
            10.0.30.15: 8415ac1522be4ac5a1a5460a40e5127f
          allow_bypass_login: true
    frontend:
      themes: !include_dir_merge_named themes
    rest_command:
      # Shared-spaces LedFx (homelab-05) is driven by music_director.
      # Bedroom LedFx (nas-01) is a separate instance with its own audio tap. Kept
      # deliberately separate so nothing in shared spaces can reach bedroom state.
      ledfx_bedroom_activate_scene:
        url: "http://10.0.30.20:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "activate"}'
      ledfx_bedroom_deactivate_scene:
        url: "http://10.0.30.20:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "deactivate"}'
      ledfx_bedroom_set_matrix_effect:
        url: "http://10.0.30.20:8888/api/virtuals/bedroom-matrix-2d/effects"
        method: post
        content_type: "application/json"
        payload: '{"type": "{{ effect_type }}", "config": {{ effect_config | default("{}") }}}'
      bose_speaker_connect:
        url: "http://10.0.30.20:8889/connect"
        method: post
      bose_speaker_disconnect:
        url: "http://10.0.30.20:8889/disconnect"
        method: post
    shell_command:
      set_music_assistant_spotify_connect: |-
        python3 -c '
        import json
        import sys
        import urllib.error
        import urllib.request

        try:
            with open("/config/.storage/core.config_entries") as source:
                entries = json.load(source)["data"]["entries"]
            connection = next(e["data"] for e in entries if e.get("domain") == "music_assistant")
            flags = [value.lower() in ("true", "on", "1") for value in sys.argv[1:3]]
            players = [player for player, enabled in zip(
                ("up25ac6335", "up4f07df12"), flags
            ) if enabled]

            def rpc(command, args):
                body = json.dumps({"command": command, "args": args,
                                   "message_id": "ha_spotify_connect"}).encode()
                request = urllib.request.Request(connection["url"].rstrip("/") + "/api", data=body,
                    headers={"Authorization": "Bearer " + connection["token"],
                             "Content-Type": "application/json"})
                with urllib.request.urlopen(request, timeout=15) as response:
                    return json.load(response)

            def matches(config):
                actual = config.get("values", {}).get("connected_players", {}).get("value", [])
                return config.get("enabled") is True and set(actual) == set(players)

            config = rpc("config/providers/get", {"instance_id": "spotify_connect"})
            if not matches(config):
                rpc("config/providers/save", {"provider_domain": "spotify_connect",
                    "instance_id": "spotify_connect",
                    "values": {"enabled": True, "connected_players": players}})
                if not matches(rpc("config/providers/get", {"instance_id": "spotify_connect"})):
                    raise RuntimeError("Spotify Connect player settings did not match after saving")
            print("Spotify Connect speaker settings verified")
        except urllib.error.HTTPError as error:
            raise SystemExit("Music Assistant API returned HTTP " + str(error.code))
        except Exception as error:
            raise SystemExit("Spotify Connect sync failed: " + type(error).__name__)
        ' "{{ living_room | default('false') }}" "{{ bedroom | default('false') }}"
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
    intent_script:
      JarvisToggle:
        action:
          - service: homeassistant.toggle
            target:
              entity_id: "{{ targets.entities }}"
        speech:
          text: "Done."
      JarvisBrightenFull:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ targets.entities }}"
            data:
              brightness_pct: 100
        speech:
          text: "Done."
      JarvisSignatureColor:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_light }}"
            data:
              rgb_color: [255, 16, 240]
        speech:
          text: "Done."
      JarvisBrightnessNudge:
        action:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ jarvis_direction == 'decrease' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: light.downstairs_lights
                    data:
                      brightness_step_pct: -30
            default:
              - service: light.turn_on
                target:
                  entity_id: light.downstairs_lights
                data:
                  brightness_step_pct: 30
        speech:
          text: "Done."
      # Bare on/off hands the shared bulbs back to Adaptive Lighting, matching
      # script.shared_lights_off. Otherwise a stale manual-control flag (from music
      # mode or a colour command) survives the cycle and bulbs come back in the old
      # colour instead of being adapted.
      JarvisDefaultLightsOn:
        action:
          - service: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: false
          - service: light.turn_on
            target:
              entity_id: light.downstairs_lights
        speech:
          text: "Done."
      JarvisDefaultLightsOff:
        action:
          - service: light.turn_off
            target:
              entity_id: light.downstairs_lights
          - service: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_all_dimmable_lights
              lights:
                - light.kitchen_ceiling_light_1
                - light.kitchen_ceiling_light_2
                - light.living_room_floor_lamp
                - light.living_room_tulip_lamp
              manual_control: false
        speech:
          text: "Done."
      JarvisDefaultLightsColor:
        action:
          - service: light.turn_on
            target:
              entity_id: light.downstairs_lights
            data:
              color_name: "{{ jarvis_general_color }}"
        speech:
          text: "Done."
      JarvisMovieMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.movie_low_living_room
        speech:
          text: "Done."
      JarvisWhatsPlaying:
        speech:
          text: >-
            {% set title = state_attr('media_player.homelab_05_speaker', 'media_title') %}
            {% set artist = state_attr('media_player.homelab_05_speaker', 'media_artist') %}
            {% if title %}{{ title }}{% if artist %} by {{ artist }}{% endif %}{% else %}Nothing is playing.{% endif %}
      JarvisTempDownstairs:
        speech:
          text: "{{ states('sensor.living_room_ac_ambient_temperature_degf') }} degrees."
      JarvisKitchenLightsState:
        speech:
          text: "{% if is_state('light.kitchen_lights', 'on') %}Yes.{% else %}No.{% endif %}"
      JarvisAcState:
        speech:
          text: "{% if states('sensor.living_room_ac_mode') == 'off' %}No.{% else %}Yes.{% endif %}"
      JarvisCookingMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.cooking_bright_kitchen
        speech:
          text: "Done."
      JarvisDinnerMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.dinner_warm_dim
        speech:
          text: "Done."
      JarvisWeatherQuery:
        speech:
          text: >-
            {% set temp = state_attr('weather.forecast_home', 'temperature') | default('unknown') %}
            {% set cond = states('weather.forecast_home') | replace('-', ' ') %}
            It is {{ temp }} degrees and {{ cond }}.
      JarvisRainQuery:
        speech:
          text: >-
            {% set cond = states('weather.forecast_home') | lower %}
            {% if 'rain' in cond or 'snow' in cond or 'hail' in cond or 'thunder' in cond %}
              Yes, rain is in the forecast.
            {% else %}
              No rain is expected.
            {% endif %}
      JarvisPrintStatus:
        speech:
          text: >-
            {% set status = states('sensor.a1_03900d642327265_print_status') %}
            {% set progress = states('sensor.a1_03900d642327265_print_progress') %}
            {% if status == 'running' %}
              The 3D print is running at {{ progress }} percent.
            {% elif status == 'finish' %}
              The 3D print is finished.
            {% elif status == 'failed' %}
              The 3D print failed.
            {% elif status in ('idle', 'offline', 'unavailable', 'unknown') %}
              The 3D printer is idle.
            {% else %}
              The printer status is {{ status }}.
            {% endif %}
      JarvisAliasOn:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_alias }}"
        speech:
          text: "Done."
      JarvisAliasOff:
        action:
          - service: light.turn_off
            target:
              entity_id: "{{ jarvis_alias }}"
        speech:
          text: "Done."
      JarvisAliasColor:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_alias }}"
            data:
              color_name: "{{ jarvis_general_color }}"
        speech:
          text: "Done."
    # One dashboard toggle per Adaptive Lighting setting for the shared spaces.
    # The Govee dining bulbs have their own entry (2700K floor), so each switch
    # drives both entries and reads on only when both are on.
    template:
      - switch:
          - name: Shared Spaces Sleep Mode
            unique_id: shared_spaces_sleep_mode
            icon: mdi:sleep
            state: >-
              {{ is_state('switch.adaptive_lighting_all_dimmable_lights_sleep_mode', 'on')
              and is_state('switch.adaptive_lighting_govee_dining_bulbs_sleep_mode', 'on') }}
            turn_on:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_sleep_mode
                    - switch.adaptive_lighting_govee_dining_bulbs_sleep_mode
            turn_off:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_sleep_mode
                    - switch.adaptive_lighting_govee_dining_bulbs_sleep_mode
          - name: Shared Spaces Adapt Brightness
            unique_id: shared_spaces_adapt_brightness
            icon: mdi:brightness-auto
            state: >-
              {{ is_state('switch.adaptive_lighting_all_dimmable_lights_adapt_brightness', 'on')
              and is_state('switch.adaptive_lighting_govee_dining_bulbs_adapt_brightness', 'on') }}
            turn_on:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
                    - switch.adaptive_lighting_govee_dining_bulbs_adapt_brightness
            turn_off:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
                    - switch.adaptive_lighting_govee_dining_bulbs_adapt_brightness
          - name: Shared Spaces Adapt Color
            unique_id: shared_spaces_adapt_color
            icon: mdi:palette
            state: >-
              {{ is_state('switch.adaptive_lighting_all_dimmable_lights_adapt_color', 'on')
              and is_state('switch.adaptive_lighting_govee_dining_bulbs_adapt_color', 'on') }}
            turn_on:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_adapt_color
                    - switch.adaptive_lighting_govee_dining_bulbs_adapt_color
            turn_off:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.adaptive_lighting_all_dimmable_lights_adapt_color
                    - switch.adaptive_lighting_govee_dining_bulbs_adapt_color
    # Shared music mode: per-track album-art palette and LedFx effect for the
    # living room strip; the shared_music_mode automation paints bulb areas from
    # sensor.music_director. Area order sets which shade each area gets.
    # input_select.music_mode_effect overrides the automatic effect until set
    # back to Auto; the integration's light.music_mode_colour (on = chosen colour,
    # off = Auto) and number.music_mode_brightness set colour and brightness;
    # transition_time is the strip's crossfade in seconds. overrides pin a colour and/or effect for
    # matching tracks (artist/album by prefix, title exactly, case ignored).
    music_director:
      player: media_player.homelab_05_speaker
      spotify: media_player.spotify_rupan
      enabled: input_boolean.shared_music_mode
      strip: input_boolean.music_mode_led_strip
      ledfx_url: http://10.0.30.15:8888
      ledfx_virtual: living-room-led-strip
      # Spotify Connect reaches the soundbar this long after the title changes
      # (measured with a pause test, docs/runbooks/shared-music-mode.md).
      audio_delay: 1.0
      library_url: http://navidrome-lookup.media.svc.cluster.local:4534
      areas:
        - kitchen_ceiling
        - dining_table
        - floor_lamp
        - tulip_lamp
        - ceiling_strip
      effect_select: input_select.music_mode_effect
      transition_time: 1.5
      overrides:
        - artist: The Weeknd
          album: Dawn FM
          color: deep blue
        - artist: The Weeknd
          album: After Hours
          color: deep blue
        - artist: Drake
          album: More Life
          color: blue
        - artist: Playboi Carti
          album: Whole Lotta Red
          color: red
        - artist: Lil Uzi Vert
          album: Watch This
          color: "#00ddff"

    input_number:
      bedroom_matrix_fireworks_volume:
        name: Fireworks Volume
        icon: mdi:volume-high
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        mode: slider
      bedroom_matrix_fireworks_delay:
        name: Fireworks Audio Sync
        icon: mdi:timer-outline
        min: 0
        max: 1000
        step: 10
        unit_of_measurement: ms
        mode: slider

    input_boolean:
      bedroom_matrix_fireworks_audio:
        name: Fireworks Audio
        icon: mdi:volume-high
      bedroom_matrix_power:
        name: Bedroom Matrix Display
        icon: mdi:led-strip-variant
        initial: true
      bedroom_matrix_cycle:
        name: Bedroom Matrix Auto-Cycle
        icon: mdi:sync
        initial: true

    input_select:
      music_mode_effect:
        name: "Music Mode: Effect"
        icon: mdi:auto-fix
        options:
          - Auto
          - Energy
          - Power
          - Melt
          - Lava Lamp
          - Scroll
          - Bands
          - Wavelength
          - Strobe
      bedroom_matrix_mode:
        name: Bedroom Matrix Mode
        icon: mdi:view-dashboard-outline
        options:
          - "Auto"
          - "Spotify"
          - "Clock & Weather"
          - "AI Arcade"
          - "Game of Life"
          - "Arcade"
          - "Visualizer"
          - "LedFx"
          - "Physics"
          - "Fireworks"
          - "Homelab Dashboards"
          - "Laptop"
        initial: "Auto"

    light:
      # The WLED strip runs as two segments (its physical halves, restored by
      # WLED boot preset 1) and HA's WLED integration makes one light per
      # segment. This group is the strip: on/off, colour and effect reach both
      # halves. It owns light.living_room_led_strip; segment 0 was renamed to
      # light.living_room_wled_gledopto_segment_0 live on 2026-11-19.
      - platform: group
        name: Living Room LED Strip
        unique_id: living_room_led_strip_group
        entities:
          - light.living_room_wled_gledopto_segment_0
          - light.living_room_wled_gledopto_segment_1
      - platform: group
        name: Kitchen Lights
        entities:
          - light.kitchen_ceiling_light_1
          - light.kitchen_ceiling_light_2
          - light.kitchen_mushroom_lamp
          - light.kitchen_fuck_off_sign
          - light.kitchen_dining_table_ceiling_light_2
      - platform: group
        name: Living Room Lights
        entities:
          - light.living_room_floor_lamp
          - light.living_room_tulip_lamp
          - light.living_room_led_strip
      - platform: group
        name: Shared Zigbee Lights
        entities:
          - light.kitchen_ceiling_light_1
          - light.kitchen_ceiling_light_2
          - light.living_room_floor_lamp
          - light.living_room_tulip_lamp
          - light.kitchen_dining_table_ceiling_light_2
      - platform: group
        name: Bedroom Roku Lights
        entities:
          - light.desk_lamp_desk_lamp
          - light.floor_lamp_floor_lamp
          - light.light_strip_light_strip
      - platform: group
        name: Downstairs Lights
        entities:
          - light.kitchen_ceiling_light_1
          - light.kitchen_ceiling_light_2
          - light.kitchen_mushroom_lamp
          - light.kitchen_fuck_off_sign
          - light.living_room_floor_lamp
          - light.living_room_tulip_lamp
          - light.kitchen_dining_table_ceiling_light_2
          - light.living_room_led_strip
      - platform: switch
        name: Bedroom Window Plug
        entity_id: switch.bedroom_window_plug
      - platform: switch
        name: Bedroom Mushroom Plug
        entity_id: switch.bedroom_mushroom_plug
      - platform: switch
        name: Living Room Good Vibes Sign
        entity_id: switch.living_room_good_vibes_sign
      - platform: switch
        name: Kitchen Mushroom Lamp
        entity_id: switch.kitchen_mushroom_lamp
      - platform: switch
        name: Kitchen Fuck Off Sign
        entity_id: switch.fuck_off_sign
      - platform: switch
        name: Exit Sign
        entity_id: switch.exit_sign
    homekit:
      - name: Homelab Bridge
        port: 21063
        advertise_ip: 10.0.40.13
        filter:
          include_entities:
            - light.kitchen_lights
            - light.living_room_lights
            - light.bedroom_roku_lights
            - light.kitchen_ceiling_light_1
            - light.kitchen_ceiling_light_2
            - light.kitchen_dining_table_ceiling_light_1
            - light.kitchen_dining_table_ceiling_light_2
            - light.living_room_floor_lamp
            - light.living_room_tulip_lamp
            - light.desk_lamp_desk_lamp
            - light.floor_lamp_floor_lamp
            - light.light_strip_light_strip
            - light.bedroom_window_plug
            - light.bedroom_mushroom_plug
            - light.living_room_good_vibes_sign
            - light.kitchen_mushroom_lamp
            - light.kitchen_fuck_off_sign
            - switch.exit_sign
            - climate.living_room_ac_living_room_ac_thermostat
    recorder:
      db_url: !secret recorder_db_url
      purge_keep_days: 10
      commit_interval: 5
      auto_purge: true
      auto_repack: true
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.sm_s948u1_volume_*
          - sensor.rupan_phone_app_*
          - sensor.*_rx_gb
          - sensor.*_tx_gb
          - sensor.*_last_*
          - sensor.*_linkquality
          - sensor.*_power_factor
          - sensor.sun_solar_*
          - sensor.ha_latest_version
        entities:
          - sensor.ha_latest_version
          # Bedroom Roku bulbs: excluded while Bedroom Music Mode streams
          # per-frame optimistic state over MQTT (see ledfx-roku-bridge).
          - light.desk_lamp_desk_lamp
          - light.floor_lamp_floor_lamp
          - light.light_strip_light_strip
        event_types:
          - call_service
    logbook:
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.*_linkquality
    rest:
      - resource: http://10.0.30.20:8889/status
        scan_interval: 10
        binary_sensor:
          - name: Bedroom Speaker Bluetooth
            value_template: "{{ value_json.connected | default(false) }}"
            device_class: connectivity
      - resource: https://version.home-assistant.io/stable.json
        scan_interval: 21600
        sensor:
          - name: HA latest version
            value_template: "{{ value_json.homeassistant.default }}"
  en.jarvis_alias.yaml: |
    language: en
    intents:
      JarvisAliasOn:
        data:
          - sentences:
              - "(turn on|switch on) [the] {jarvis_alias} [lights]"
      JarvisAliasOff:
        data:
          - sentences:
              - "(turn off|switch off) [the] {jarvis_alias} [lights]"
      JarvisAliasColor:
        data:
          - sentences:
              - "(turn on|switch on|change|set|make) [all] [the] {jarvis_alias} [lights] to {jarvis_general_color}"
              - "(turn|set|make) [all] [the] {jarvis_alias} [lights] {jarvis_general_color}"
      JarvisDefaultLightsColor:
        data:
          - sentences:
              - "(turn on|set|change|make) [the] lights to {jarvis_general_color}"
              - "(turn|set|make) [the] lights [to] {jarvis_general_color}"
    lists:
      jarvis_alias:
        values:
          - in: "bedroom"
            out: "light.bedroom_roku_lights"
          - in: "bedroom lights"
            out: "light.bedroom_roku_lights"
          - in: "roku lights"
            out: "light.bedroom_roku_lights"
          - in: "shared spaces"
            out: "light.downstairs_lights"
          - in: "shared spaces lights"
            out: "light.downstairs_lights"
          - in: "shared space lights"
            out: "light.downstairs_lights"
          - in: "all shared spaces lights"
            out: "light.downstairs_lights"
          - in: "all the shared spaces lights"
            out: "light.downstairs_lights"
          - in: "shared lights"
            out: "light.shared_zigbee_lights"
          - in: "all shared lights"
            out: "light.shared_zigbee_lights"
          - in: "all the shared lights"
            out: "light.shared_zigbee_lights"
          - in: "shared bulbs"
            out: "light.shared_zigbee_lights"
      jarvis_general_color:
        values:
          - in: "white"
            out: "white"
          - in: "red"
            out: "red"
          - in: "orange"
            out: "orange"
          - in: "yellow"
            out: "yellow"
          - in: "green"
            out: "green"
          - in: "blue"
            out: "blue"
          - in: "purple"
            out: "purple"
          - in: "pink"
            out: "pink"
  en.jarvis_colors.yaml: |
    language: en
    intents:
      JarvisSignatureColor:
        data:
          - sentences:
              - "(make|set|turn) [the] {jarvis_light} [light|lamp|lights] {jarvis_color}"
              - "[make] [the] {jarvis_light} [light|lamp|lights] {jarvis_color}"
              - "(set|turn) [the] {jarvis_light} [light|lamp|lights] to {jarvis_color}"
    lists:
      jarvis_light:
        values:
          - in: "downstairs"
            out: "light.downstairs_lights"
          - in: "downstairs lights"
            out: "light.downstairs_lights"
          - in: "kitchen"
            out: "light.kitchen_lights"
          - in: "kitchen lights"
            out: "light.kitchen_lights"
          - in: "living room"
            out: "light.living_room_lights"
          - in: "living room lights"
            out: "light.living_room_lights"
          - in: "bedroom"
            out: "light.bedroom_roku_lights"
          - in: "bedroom lights"
            out: "light.bedroom_roku_lights"
          - in: "shared spaces"
            out: "light.downstairs_lights"
          - in: "shared spaces lights"
            out: "light.downstairs_lights"
          - in: "shared space lights"
            out: "light.downstairs_lights"
          - in: "all shared spaces lights"
            out: "light.downstairs_lights"
          - in: "all the shared spaces lights"
            out: "light.downstairs_lights"
          - in: "shared lights"
            out: "light.shared_zigbee_lights"
          - in: "all shared lights"
            out: "light.shared_zigbee_lights"
