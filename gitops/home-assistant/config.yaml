      .badge.pinned { border-color: var(--primary-color); color: var(--primary-color); }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .pick {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      input[type="color"] {
        width: 36px;
        height: 32px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }
      select.effect {
        max-width: 150px;
        padding: 5px 6px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--card-background-color);
        color: var(--primary-text-color);
        font-size: 13px;
      }
      select.effect.pinned { border-color: var(--primary-color); }
      button.unpin {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: transparent;
        color: var(--primary-text-color);
        cursor: pointer;
      }
      .empty { padding: 32px 0; text-align: center; color: var(--secondary-text-color); }
      @media (max-width: 600px) {
        main { padding: 12px 16px; }
        .row { grid-template-columns: 44px minmax(0, 1fr); }
        .art { width: 44px; height: 44px; }
        .actions {
          grid-column: 1 / -1;
          flex-direction: row;
          justify-content: flex-end;
        }
      }
    `;

    class MusicColoursPanel extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" });
        this._playlists = [];
        this._effects = [];
        this._playlist = null;
        this._songs = [];
        this._filter = "all";
        this._query = "";
        this._status = "Loading playlists…";
        this._started = false;
      }

      set hass(hass) {
        this._hass = hass;
        if (this._menu) this._menu.hass = hass;
        if (!this._started) {
          this._started = true;
          this._build();
          this._loadPlaylists();
        }
      }

      set narrow(narrow) {
        this._narrow = narrow;
        if (this._menu) this._menu.narrow = narrow;
      }

      _build() {
        const root = this.shadowRoot;
        root.append(el("style", { text: STYLE }));
        this._menu = document.createElement("ha-menu-button");
        this._menu.hass = this._hass;
        this._menu.narrow = this._narrow;
        root.append(el("div", { class: "toolbar" }, [this._menu, el("span", { text: "Music Colours" })]));
        this._select = el("select", {
          "aria-label": "Playlist",
          onchange: (event) => this._loadPlaylist(event.target.value),
        });
        this._search = el("input", {
          type: "search",
          placeholder: "Search songs, artists, albums",
          "aria-label": "Search",
          oninput: (event) => {
            this._query = event.target.value.trim().toLowerCase();
            this._renderSongs();
          },
        });
        this._chips = el("div", { class: "chips" });
        this._summary = el("div", { class: "note" });
        this._list = el("div");
        root.append(
          el("main", {}, [
            el("div", { class: "controls" }, [this._select, this._search]),
            this._chips,
            this._summary,
            this._list,
          ]),
        );
        this._renderSongs();
      }

      async _loadPlaylists() {
        try {
          const result = await this._hass.callWS({ type: "music_director/playlists" });
          this._playlists = result.playlists;
          this._effects = result.effects;
        } catch (error) {
          this._status = `Could not load playlists: ${error.message || error}`;
          this._renderSongs();
          return;
        }
        this._select.replaceChildren(
          ...this._playlists.map((p) => el("option", { value: p.name, text: `${p.name} (${p.songs})` })),
        );
        if (!this._playlists.length) {
          this._status = "No playlists prepared yet. Run music_director.prepare_playlists.";
          this._renderSongs();
          return;
        }
        const saved = remembered();
        const first = this._playlists.some((p) => p.name === saved) ? saved : this._playlists[0].name;
        this._select.value = first;
        this._loadPlaylist(first);
      }

      async _loadPlaylist(name) {
        this._playlist = name;
        remember(name);
        this._status = "Loading songs…";
        this._songs = [];
        this._renderSongs();
        try {
          this._songs = await this._hass.callWS({ type: "music_director/playlist", name });
          this._status = "";
        } catch (error) {
          this._status = `Could not load ${name}: ${error.message || error}`;
        }
        this._renderSongs();
      }

      // changes: { colour } and/or { effect }; null unpins that one.
      async _pin(song, changes) {
        try {
          await this._hass.callWS({
            type: "music_director/pin",
            title: song.title,
            artist: song.artist,
            album: song.album,
            ...changes,
          });
        } catch (error) {
          window.alert(`Could not change the pin: ${error.message || error}`);
          return;
        }
        // A pin covers the whole album, so other rows can change too.
        const scroll = window.scrollY;
        await this._loadPlaylist(this._playlist);
        window.scrollTo(0, scroll);
      }

      _counts() {
        const counts = { all: this._songs.length, cover: 0, vibe: 0, pinned: 0, pending: 0 };
        for (const song of this._songs) counts[song.source] = (counts[song.source] || 0) + 1;
        return counts;
      }

      _renderSongs() {
        if (!this._list) return;
        const counts = this._counts();
        this._chips.replaceChildren(
          ...FILTERS.filter((f) => f === "all" || counts[f]).map((f) =>
            el("button", {
              class: `chip${this._filter === f ? " on" : ""}`,
              text: `${f === "all" ? "All" : SOURCES[f]} ${counts[f] || 0}`,
              onclick: () => {
                this._filter = f;
                this._renderSongs();
              },
            }),
          ),
        );
        this._summary.textContent = this._songs.length
          ? "The bar is the LED strip; the dots are the room lights. Colour and effect pins " +
            "apply to the whole album; unpin or choose Auto to go back to automatic."
          : "";
        if (this._status) {
          this._list.replaceChildren(el("div", { class: "empty", text: this._status }));
          return;
        }
        const query = this._query;
        const shown = this._songs.filter(
          (song) =>
            (this._filter === "all" || song.source === this._filter) &&
            (!query || `${song.title} ${song.artist} ${song.album}`.toLowerCase().includes(query)),
        );
        if (!shown.length) {
          this._list.replaceChildren(el("div", { class: "empty", text: "No matching songs." }));
          return;
        }
        this._list.replaceChildren(...shown.map((song) => this._row(song)));
      }

      _row(song) {
        const art = song.art
          ? el("img", {
              class: "art",
              src: song.art,
              alt: "",
              loading: "lazy",
              referrerpolicy: "no-referrer",
            })
          : el("div", { class: "art" });
        const meta = el("div", { class: "meta" }, [
          el("span", { class: `badge ${song.source}`, text: SOURCES[song.source] || song.source }),
          song.effect_pin ? el("span", { class: "badge pinned", text: "Effect pinned" }) : null,
          ...(song.areas || []).map((hex) => el("span", { class: "dot", style: `background:${hex}`, title: hex })),
          song.genres && song.genres.length ? el("span", { text: song.genres.join(", ") }) : null,
          song.intensity !== undefined
            ? el("span", { text: `intensity ${Math.round(song.intensity * 100)}%` })
            : null,
        ]);
        const text = el("div", { class: "text" }, [
          el("div", { class: "title", text: song.title }),
          el("div", { class: "sub", text: `${song.artist} · ${song.album}` }),
          el("div", { class: "strip", style: song.gradient ? `background:${song.gradient}` : "" }),
          meta,
        ]);
        const picker = el("input", {
          type: "color",
          value: song.colour || "#ff0000",
          "aria-label": `Pin a colour for ${song.album || song.title}`,
          onchange: (event) => this._pin(song, { colour: event.target.value }),
        });
        const auto = song.auto_effect ? `Auto (${effectLabel(song.auto_effect)})` : "Auto";
        const effect = el(
          "select",
          {
            class: `effect${song.effect_pin ? " pinned" : ""}`,
            "aria-label": `Effect for ${song.album || song.title}`,
            onchange: (event) => this._pin(song, { effect: event.target.value || null }),
          },
          [
            el("option", { value: "", text: auto }),
            ...this._effects.map((name) => el("option", { value: name, text: effectLabel(name) })),
          ],
        );
        effect.value = song.effect_pin || "";
        const actions = el("div", { class: "actions" }, [
          el("label", { class: "pick" }, [el("span", { text: song.pin ? "Pinned" : "Pin" }), picker]),
          song.pin
            ? el("button", {
                class: "unpin",
                text: "Unpin colour",
                onclick: () => this._pin(song, { colour: null }),
              })
            : null,
          effect,
        ]);
        return el("div", { class: "row" }, [art, text, actions]);
      }
    }

    if (!customElements.get("music-colours-panel")) {
      customElements.define("music-colours-panel", MusicColoursPanel);
    }
  component.music_director.panel.py: |
    """Music Colours: a sidebar panel to review and pin playlist song colours.

    The panel (panel.js, served from this directory) talks to the director over
    three websocket commands: list the prepared playlists, list one playlist's
    songs with the colours and effect the lights would show, and pin or unpin a
    colour or an effect.
    """

    from __future__ import annotations

    import hashlib
    from pathlib import Path
    from typing import Any

    import voluptuous as vol
    from homeassistant.components import panel_custom, websocket_api
    from homeassistant.components.http import StaticPathConfig
    from homeassistant.core import HomeAssistant, callback

    from .director import DOMAIN, Director
    from .palette import hex_rgb
    from .pins import KEEP
    from .rules import EFFECTS

    PANEL_FILE = Path(__file__).parent / "panel.js"
    STATIC_URL = "/music_director_static/panel.js"
    PANEL_PATH = "music-colours"
    ELEMENT = "music-colours-panel"


    def _director(hass: HomeAssistant) -> Director:
        return hass.data[DOMAIN]


    def _hex(value: Any) -> str:
        if hex_rgb(str(value)) is None:
            raise vol.Invalid(f"not a #RRGGBB colour: {value!r}")
        return str(value).lower()


    @websocket_api.websocket_command({vol.Required("type"): "music_director/playlists"})
    @callback
    def ws_playlists(
        hass: HomeAssistant, connection: websocket_api.ActiveConnection, msg: dict
    ) -> None:
        connection.send_result(
            msg["id"],
            {"playlists": _director(hass).playlist_names(), "effects": list(EFFECTS)},
        )


    @websocket_api.websocket_command(
        {
            vol.Required("type"): "music_director/playlist",
            vol.Required("name"): str,
        }
    )
    @callback
    def ws_playlist(
        hass: HomeAssistant, connection: websocket_api.ActiveConnection, msg: dict
    ) -> None:
        rows = _director(hass).playlist_colours(msg["name"])
        if rows is None:
            connection.send_error(msg["id"], "not_found", "No such prepared playlist")
            return
        connection.send_result(msg["id"], rows)


    @websocket_api.websocket_command(
        {
            vol.Required("type"): "music_director/pin",
            vol.Required("title"): str,
            vol.Required("artist"): str,
            vol.Required("album"): str,
            # A #RRGGBB colour or an effect name; null unpins it, and a missing
            # key leaves it as it is.
            vol.Optional("colour"): vol.Any(None, _hex),
            vol.Optional("effect"): vol.Any(None, vol.In(EFFECTS)),
        }
    )
    @callback
    def ws_pin(
        hass: HomeAssistant, connection: websocket_api.ActiveConnection, msg: dict
    ) -> None:
        _director(hass).pin_song(
            msg["title"],
            msg["artist"],
            msg["album"],
            colour=msg.get("colour", KEEP),
            effect=msg.get("effect", KEEP),
        )
        connection.send_result(msg["id"])


    async def async_setup_panel(hass: HomeAssistant) -> None:
        for command in (ws_playlists, ws_playlist, ws_pin):
            websocket_api.async_register_command(hass, command)
        await hass.http.async_register_static_paths(
            [StaticPathConfig(STATIC_URL, str(PANEL_FILE), False)]
        )
        # The version busts the browser cache when the panel changes.
        version = hashlib.sha256(
            await hass.async_add_executor_job(PANEL_FILE.read_bytes)
        ).hexdigest()[:12]
        await panel_custom.async_register_panel(
            hass,
            frontend_url_path=PANEL_PATH,
            webcomponent_name=ELEMENT,
            sidebar_title="Music Colours",
            sidebar_icon="mdi:palette-swatch",
            module_url=f"{STATIC_URL}?v={version}",
            require_admin=False,
        )
  component.music_director.pins.py: |
    """Album colour and effect pins: song overrides set from the dashboard.

    Pins live in Home Assistant storage, so they survive restarts and can be
    changed or removed without a deploy. Colour overrides in
    music_director.overrides seed the pins once each: after that the pin is the
    source of truth, so removing a seeded pin from the dashboard sticks.
    A pin holds a colour, an effect or both; each is set and cleared on its own.
    """

    from __future__ import annotations

    from dataclasses import asdict, dataclass, field
    from typing import Any, Protocol

    from .metadata import SongOverride, find_override, normalize

    STORAGE_KEY = "music_director.pins"
    STORAGE_VERSION = 1


    class PinStorage(Protocol):
        async def async_load(self) -> Any: ...

        def async_delay_save(self, data_func: Any, delay: float = 0) -> None: ...


    def pin_key(pin: SongOverride) -> str:
        return "|".join(
            normalize(part or "") for part in (pin.artist, pin.album, pin.title)
        )


    def primary_artist(artist: str) -> str:
        """The first credited artist: pins match the artist by prefix, so
        features and remixers on other tracks still match."""
        return artist.split(",")[0].strip()


    class Keep:
        """Leave a pin field as it is."""


    KEEP = Keep()


    @dataclass
    class Pins:
        """Colour pins, plus the configured overrides already seeded."""

        pins: list[SongOverride] = field(default_factory=list)
        seeded: set[str] = field(default_factory=set)

        @classmethod
        def from_data(cls, data: Any) -> Pins:
            data = data if isinstance(data, dict) else {}
            pins = [
                SongOverride(**{k: v for k, v in item.items() if k in _FIELDS})
                for item in data.get("pins", [])
                if isinstance(item, dict) and (item.get("color") or item.get("effect"))
            ]
            return cls(pins, set(data.get("seeded", [])))

        def to_data(self) -> dict[str, Any]:
            return {
                "pins": [
                    {k: v for k, v in asdict(pin).items() if v is not None}
                    for pin in self.pins
                ],
                "seeded": sorted(self.seeded),
            }

        def seed(self, overrides: tuple[SongOverride, ...]) -> bool:
            """Add each configured colour override once. Returns True if any
            were added."""
            added = False
            for override in overrides:
                if not override.color:
                    continue
                key = pin_key(override)
                if key in self.seeded:
                    continue
                self.seeded.add(key)
                self.pins.append(
                    SongOverride(
                        artist=override.artist,
                        album=override.album,
                        title=override.title,
                        color=override.color,
                    )
                )
                added = True
            return added

        def find(self, title: str, artist: str, album: str) -> SongOverride | None:
            return find_override(tuple(self.pins), title, artist, album)

        def pin(self, title: str, artist: str, album: str, color: str) -> SongOverride:
            """Pin colour for the track's album (or the track, without an album),
            keeping any pinned effect."""
            return self.update(title, artist, album, color=color)

        def unpin(self, title: str, artist: str, album: str) -> bool:
            """Clear the colour pin for the track, keeping any pinned effect."""
            before = self.find(title, artist, album)
            self.update(title, artist, album, color=None)
            return before is not None and bool(before.color)

        def update(
            self,
            title: str,
            artist: str,
            album: str,
            *,
            color: str | None | Keep = KEEP,
            effect: str | None | Keep = KEEP,
        ) -> SongOverride | None:
            """Set or clear (None) the colour and/or effect pinned to the track's
            album (or the track, without an album); KEEP leaves one as it is.
            Matching pins are replaced by one; a pin with neither is removed."""
            current = self.find(title, artist, album)
            new_color = (current.color if current else None) if color is KEEP else color
            new_effect = (current.effect if current else None) if effect is KEEP else effect
            self.pins = [p for p in self.pins if not p.matches(title, artist, album)]
            if not new_color and not new_effect:
                return None
            pin = SongOverride(
                artist=primary_artist(artist) or None,
                album=album or None,
                title=None if album else title,
                color=new_color or None,
                effect=new_effect or None,
            )
            self.pins.append(pin)
            return pin


    _FIELDS = frozenset(("artist", "album", "title", "color", "effect"))


    class PinStore:
        """Pins persisted through a Home Assistant Store."""

        def __init__(self, storage: PinStorage) -> None:
            self._storage = storage
            self.pins = Pins()

        async def async_load(self, overrides: tuple[SongOverride, ...]) -> None:
            self.pins = Pins.from_data(await self._storage.async_load())
            if self.pins.seed(overrides):
                self.save()

        def save(self) -> None:
            self._storage.async_delay_save(self.pins.to_data, 1)
  component.music_director.rules.py: |
    """Choose a LedFx effect for a track from its genre and audio features.

    Each track maps to a family of effects; the effect within a family is a
    stable hash of the track, so a replay gets the same look, and consecutive
    tracks never repeat the same effect when the family has an alternative.
    """

    from __future__ import annotations

    import zlib
    from dataclasses import dataclass
    from typing import Any

    from .palette import Palette, gradient, solid_colour, solid_gradient, to_hex, triad

    FAMILIES: dict[str, tuple[str, ...]] = {
        "calm": ("melt", "lava_lamp"),
        # R&B, soul and mellow hip-hop always melt.
        "smooth": ("melt",),
        "bass": ("power", "energy"),
        "drive": ("scroll", "bands", "strobe"),
        "rock": ("wavelength", "bands"),
        "default": ("energy",),
    }

    # Every effect the director can set, in family order; the manual override
    # dropdown offers exactly these.
    EFFECTS: tuple[str, ...] = tuple(
        dict.fromkeys(effect for effects in FAMILIES.values() for effect in effects)
    )

    # BPM mapped onto each effect's speed range: 70 BPM is slowest, 160 fastest.
    SLOW_BPM = 70.0
    FAST_BPM = 160.0

    # Ordered: within one genre string the first matching family wins.
    GENRE_FAMILIES: tuple[tuple[tuple[str, ...], str], ...] = (
        (
            (
                "ambient",
                "classical",
                "acoustic",
                "folk",
                "soundtrack",
                "film score",
                "lo-fi",
                "lofi",
                "chill",
                "new age",
                "piano",
            ),
            "calm",
        ),
        (
            (
                "house",
                "techno",
                "edm",
                "electronic",
                "electro",
                "dance",
                "trance",
                "dubstep",
                "drum and bass",
                "garage",
                "disco",
            ),
            "drive",
        ),
        (("metal", "rock", "punk", "grunge", "hardcore"), "rock"),
        (
            (
                "hip hop",
                "hip-hop",
                "rap",
                "trap",
                "drill",
                "grime",
                "reggaeton",
                "dancehall",
            ),
            "bass",
        ),
        (("r&b", "rnb", "soul", "funk", "jazz", "reggae", "blues"), "smooth"),
    )

    GRADIENT_EFFECTS = frozenset(
        {"melt", "lava_lamp", "power", "bands", "wavelength", "strobe"}
    )
    TRIAD_EFFECTS = frozenset({"energy", "scroll"})


    @dataclass(frozen=True)
    class Features:
        genres: tuple[str, ...] = ()
        bpm: float | None = None
        energy: float | None = None
        danceability: float | None = None
        acousticness: float | None = None
        valence: float | None = None


    def genre_family(genres: tuple[str, ...]) -> str | None:
        """Family of the first genre that maps to one; sources list the primary
        genre first, and the keyword table breaks ties within one genre."""
        for genre in genres:
            lowered = genre.lower()
            for keywords, family in GENRE_FAMILIES:
                if any(keyword in lowered for keyword in keywords):
                    return family
        return None


    def classify(features: Features) -> str:
        family = genre_family(features.genres)
        energy = features.energy
        if energy is not None:
            acoustic = features.acousticness or 0.0
            if energy < 0.35 or (acoustic > 0.7 and energy < 0.5):
                return "calm"
            if family == "bass" and energy < 0.5:
                return "smooth"
            danceable = (features.danceability or 0.0) >= 0.6
            in_club_tempo = features.bpm is not None and 110 <= features.bpm <= 140
            if family in (None, "smooth") and energy > 0.75 and in_club_tempo and danceable:
                return "drive"
        if family is not None:
            return family
        if energy is not None and energy > 0.7:
            return "drive"
        if features.bpm is not None and features.bpm < 85 and energy is not None:
            return "calm"
        return "default"


    # How intense each family is before audio features: drives colour vividness.
    FAMILY_INTENSITY: dict[str, float] = {
        "calm": 0.15,
        "smooth": 0.3,
        "default": 0.5,
        "bass": 0.75,
        "rock": 0.8,
        "drive": 0.85,
    }


    def intensity(features: Features, family: str) -> float:
        """0 (calm) to 1 (intense): the genre's family prior (else the chosen
        family's) blended with energy, or with tempo when ReccoBeats has no
        features. The genre sets the prior, so mellow rap that plays a smooth
        effect still rates as fairly intense; energy pulls it down."""
        prior = FAMILY_INTENSITY[genre_family(features.genres) or family]
        if features.energy is not None:
            return round(0.5 * prior + 0.5 * _unit(features.energy), 3)
        tempo = tempo_level(features.bpm)
        if tempo is not None:
            return round(0.7 * prior + 0.3 * tempo, 3)
        return prior


    def choose_effect(family: str, track_key: str, previous: str | None) -> str:
        candidates = FAMILIES[family]
        index = zlib.crc32(track_key.encode("utf-8")) % len(candidates)
        if candidates[index] == previous and len(candidates) > 1:
            index = (index + 1) % len(candidates)
        return candidates[index]


    def _unit(value: float) -> float:
        return min(1.0, max(0.0, value))


    def tempo_level(bpm: float | None) -> float | None:
        """0 at SLOW_BPM or below, 1 at FAST_BPM or above."""
        if bpm is None:
            return None
        return _unit((bpm - SLOW_BPM) / (FAST_BPM - SLOW_BPM))


    def dynamics(effect: str, features: Features, drive: float = 0.0) -> dict[str, Any]:
        """Speed from tempo and responsiveness from energy, inside each LedFx
        schema range; unknown inputs leave the LedFx default in place. Drive
        (the song section) pushes both up or down from there; with a drive,
        unknown inputs start from the middle so sections still show."""
        config: dict[str, Any] = {}
        tempo = tempo_level(features.bpm)
        energy = None if features.energy is None else _unit(features.energy)
        if drive:
            tempo = _unit((0.5 if tempo is None else tempo) + drive)
            energy = _unit((0.5 if energy is None else energy) + drive)
        if tempo is not None:
            if effect == "melt":
                config["speed"] = round(0.2 + 0.6 * tempo, 3)  # schema 0.001-1
            elif effect == "lava_lamp":
                config["speed"] = round(3.0 + 9.0 * tempo, 2)  # schema 0.1-15
            elif effect == "scroll":
                config["speed"] = round(2 + 6 * tempo)  # integer, schema 1-10
        if energy is not None:
            if effect == "melt":
                config["reactivity"] = round(0.3 + 0.6 * energy, 3)  # 0.0001-1
            elif effect == "lava_lamp":
                config["reactivity"] = round(0.15 + 0.6 * energy, 3)  # 0.00001-0.9
            elif effect == "energy":
                config["sensitivity"] = round(0.45 + 0.45 * energy, 3)  # 0.3-0.99
            elif effect == "power":
                config["bass_decay_rate"] = round(0.03 + 0.12 * energy, 3)  # 0-1
            elif effect == "scroll":
                config["decay"] = round(0.99 - 0.06 * energy, 3)  # 0.8-1
        return config


    def effect_config(
        effect: str,
        palette: Palette,
        features: Features | None = None,
        solid: bool = False,
        drive: float = 0.0,
    ) -> dict[str, Any]:
        """Colours plus tempo and energy dynamics for the effect; LedFx fills
        every other key with its schema default. Solid gives every colour slot
        the same one colour; drive is the song section's push on the dynamics."""
        colours = (solid_colour(palette),) * 3 if solid else triad(palette)
        if effect in GRADIENT_EFFECTS:
            config: dict[str, Any] = {
                "gradient": solid_gradient(palette) if solid else gradient(palette)
            }
            if effect == "power":
                config["sparks_color"] = to_hex(colours[2])
        elif effect in TRIAD_EFFECTS:
            lows, mids, high = colours
            config = {
                "color_lows": to_hex(lows),
                "color_mids": to_hex(mids),
                "color_high": to_hex(high),
            }
        else:
            raise ValueError(f"no colour mapping for LedFx effect {effect!r}")
        if features is not None:
            config.update(dynamics(effect, features, drive))
        return config
  component.music_director.sections.py: |
    """Song sections from live loudness: quiet, normal and loud stretches.

    The director feeds LedFx's live melbank level (about 60 times a second).
    A fast average (a few seconds) is compared with a slow one (the song's
    recent baseline, half a minute or so); sustained departures become sections.
    Hysteresis and a minimum dwell keep single beats and fills from flipping
    the lights. Pure logic: the caller supplies the clock.
    """

    from __future__ import annotations

    import math
    from dataclasses import dataclass

    QUIET, NORMAL, LOUD = "quiet", "normal", "loud"

    FAST_SECONDS = 6.0
    SLOW_SECONDS = 40.0
    # Ignore the first seconds of a track while the baseline settles.
    WARMUP_SECONDS = 20.0
    # A section must last this long before the next change.
    MIN_DWELL_SECONDS = 16.0
    # fast / slow ratio thresholds, with hysteresis.
    ENTER_LOUD, LEAVE_LOUD = 1.3, 1.1
    ENTER_QUIET, LEAVE_QUIET = 0.65, 0.85
    # Below this baseline level the music is near silent: stay normal.
    SILENCE = 1e-6

    # How sections move the lights: strip brightness as a fraction of the set
    # Music Mode Brightness (kept high), and an intensity offset for colours.
    SECTION_BRIGHTNESS = {QUIET: 0.8, NORMAL: 0.9, LOUD: 1.0}
    SECTION_INTENSITY = {QUIET: -0.1, NORMAL: 0.0, LOUD: 0.15}
    # Push on the effect's speed and reactivity (0-1 scales): punchier
    # choruses and drops, calmer breakdowns.
    SECTION_DRIVE = {QUIET: -0.15, NORMAL: 0.0, LOUD: 0.25}
    # Bulb brightness as a fraction of Music Mode Brightness: normal parts sit at
    # the set level, breakdowns dim and choruses lift (up to 100%).
    BULB_SECTION_BRIGHTNESS = {QUIET: 0.8, NORMAL: 1.0, LOUD: 1.15}


    def bulb_brightness_pct(brightness_pct: int, section: str) -> int:
        """The taking-part bulbs' brightness for a section, 1-100%."""
        return min(100, max(1, round(brightness_pct * BULB_SECTION_BRIGHTNESS[section])))


    @dataclass
    class SectionTracker:
        fast: float = 0.0
        slow: float = 0.0
        started: float | None = None
        last_sample: float | None = None
        section: str = NORMAL
        changed: float = 0.0

        def reset(self, now: float) -> None:
            """Start a new track: forget the old baseline."""
            self.fast = self.slow = 0.0
            self.started = now
            self.last_sample = None
            self.section = NORMAL
            self.changed = now

        def add(self, level: float, now: float) -> str | None:
            """Feed one loudness sample. Returns the new section when it
            changes, else None."""
            if self.started is None:
                self.reset(now)
            level = max(0.0, level)
            if self.last_sample is None:
                self.fast = self.slow = level
            else:
                dt = max(0.0, now - self.last_sample)
                self.fast += (level - self.fast) * (1 - math.exp(-dt / FAST_SECONDS))
                self.slow += (level - self.slow) * (1 - math.exp(-dt / SLOW_SECONDS))
            self.last_sample = now
            assert self.started is not None
            if (
                now - self.started < WARMUP_SECONDS
                or now - self.changed < MIN_DWELL_SECONDS
            ):
                return None
            wanted = self._wanted()
            if wanted == self.section:
                return None
            self.section = wanted
            self.changed = now
            return wanted

        def _wanted(self) -> str:
            if self.slow <= SILENCE:
                return NORMAL
            ratio = self.fast / self.slow
            if self.section == LOUD:
                return LOUD if ratio > LEAVE_LOUD else NORMAL
            if self.section == QUIET:
                return QUIET if ratio < LEAVE_QUIET else NORMAL
            if ratio >= ENTER_LOUD:
                return LOUD
            if ratio <= ENTER_QUIET:
                return QUIET
            return NORMAL


    # Drops: a sudden, sustained jump in loudness (a drop or a chorus slamming
    # in), as opposed to the gradual changes sections follow. The strip answers
    # with a short flash. A one second average must rise well above the last few
    # seconds and above the song's baseline, and stay there briefly, so single
    # kicks and the return after a gap between phrases do not count.
    PUNCH_SECONDS = 1.0
    DROP_JUMP = 1.5
    DROP_ABOVE_BASELINE = 1.25
    DROP_HOLD_SECONDS = 0.6
    DROP_COOLDOWN_SECONDS = 45.0
    # Music coming back after near-silence (a pause, a gap between songs) is not
    # a drop: none for this long after the one second average falls below a
    # tenth of the baseline (the few-second average needs that long to catch up).
    # Tuned on a live hip-hop recording on 2026-11-14: no drops in 90 s of verses,
    # none when music resumed after a pause, one when a beat came in after a
    # quiet intro.
    SILENT_SHARE = 0.1
    AFTER_SILENCE_SECONDS = 12.0


    @dataclass
    class DropDetector:
        punch: float = 0.0
        recent: float = 0.0
        baseline: float = 0.0
        started: float | None = None
        last_sample: float | None = None
        rising_since: float | None = None
        last_drop: float | None = None
        last_silent: float | None = None

        def reset(self, now: float) -> None:
            """Start a new track."""
            self.punch = self.recent = self.baseline = 0.0
            self.started = now
            self.last_sample = None
            self.rising_since = None
            self.last_drop = None
            self.last_silent = None

        def add(self, level: float, now: float) -> bool:
            """Feed one loudness sample. Returns True on a drop."""
            if self.started is None:
                self.reset(now)
            level = max(0.0, level)
            if self.last_sample is None:
                self.punch = self.recent = self.baseline = level
            else:
                dt = max(0.0, now - self.last_sample)
                self.punch += (level - self.punch) * (1 - math.exp(-dt / PUNCH_SECONDS))
                self.recent += (level - self.recent) * (1 - math.exp(-dt / FAST_SECONDS))
                self.baseline += (level - self.baseline) * (
                    1 - math.exp(-dt / SLOW_SECONDS)
                )
            self.last_sample = now
            assert self.started is not None
            if self.punch <= SILENT_SHARE * self.baseline or self.baseline <= SILENCE:
                self.last_silent = now
            jumping = (
                self.baseline > SILENCE
                and self.punch >= DROP_JUMP * self.recent
                and self.punch >= DROP_ABOVE_BASELINE * self.baseline
            )
            if not jumping:
                self.rising_since = None
                return False
            if self.rising_since is None:
                self.rising_since = now
            if (
                now - self.started < WARMUP_SECONDS
                or now - self.rising_since < DROP_HOLD_SECONDS
                or (
                    self.last_silent is not None
                    and now - self.last_silent < AFTER_SILENCE_SECONDS
                )
                or (
                    self.last_drop is not None
                    and now - self.last_drop < DROP_COOLDOWN_SECONDS
                )
            ):
                return False
            self.last_drop = now
            self.rising_since = None
            return True
