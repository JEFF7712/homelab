apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:
    homeassistant:
      external_url: https://ha.rupan.dev
      auth_providers:
        - type: homeassistant
        - type: trusted_networks
          trusted_networks:
            - 10.0.30.15/32
          trusted_users:
            10.0.30.15: 8415ac1522be4ac5a1a5460a40e5127f
          allow_bypass_login: true
    frontend:
      themes: !include_dir_merge_named themes
    rest_command:
      # Shared-spaces LedFx (homelab-05) drives the Govee music mode only.
      ledfx_activate_scene:
        url: "http://10.0.30.15:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "activate"}'
      ledfx_deactivate_scene:
        url: "http://10.0.30.15:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "deactivate"}'
      # Bedroom LedFx (nas-01) is a separate instance with its own audio tap. Kept
      # deliberately separate so nothing in shared spaces can reach bedroom state.
      ledfx_bedroom_activate_scene:
        url: "http://10.0.30.20:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "activate"}'
      ledfx_bedroom_deactivate_scene:
        url: "http://10.0.30.20:8888/api/scenes"
        method: put
        content_type: "application/json"
        payload: '{"id": "{{ scene_id }}", "action": "deactivate"}'
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
    intent_script:
      JarvisToggle:
        action:
          - service: homeassistant.toggle
            target:
              entity_id: "{{ targets.entities }}"
        speech:
          text: "Done."
      JarvisBrightenFull:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ targets.entities }}"
            data:
              brightness_pct: 100
        speech:
          text: "Done."
      JarvisSignatureColor:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_light }}"
            data:
              rgb_color: [255, 16, 240]
        speech:
          text: "Done."
      JarvisBrightnessNudge:
        action:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ jarvis_direction == 'decrease' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: light.downstairs_lights
                    data:
                      brightness_step_pct: -30
            default:
              - service: light.turn_on
                target:
                  entity_id: light.downstairs_lights
                data:
                  brightness_step_pct: 30
        speech:
          text: "Done."
      JarvisDefaultLightsOn:
        action:
          - service: light.turn_on
            target:
              entity_id: light.downstairs_lights
        speech:
          text: "Done."
      JarvisDefaultLightsOff:
        action:
          - service: light.turn_off
            target:
              entity_id: light.downstairs_lights
        speech:
          text: "Done."
      JarvisDefaultLightsColor:
        action:
          - service: light.turn_on
            target:
              entity_id: light.downstairs_lights
            data:
              color_name: "{{ jarvis_general_color }}"
        speech:
          text: "Done."
      JarvisMovieMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.movie_low_living_room
        speech:
          text: "Done."
      JarvisWhatsPlaying:
        speech:
          text: >-
            {% set title = state_attr('media_player.homelab_05_satellite_media_player_2', 'media_title') %}
            {% set artist = state_attr('media_player.homelab_05_satellite_media_player_2', 'media_artist') %}
            {% if title %}{{ title }}{% if artist %} by {{ artist }}{% endif %}{% else %}Nothing is playing.{% endif %}
      JarvisTempDownstairs:
        speech:
          text: "{{ states('sensor.living_room_ac_ambient_temperature_degf') }} degrees."
      JarvisKitchenLightsState:
        speech:
          text: "{% if is_state('light.kitchen_lights', 'on') %}Yes.{% else %}No.{% endif %}"
      JarvisAcState:
        speech:
          text: "{% if states('sensor.living_room_ac_mode') == 'off' %}No.{% else %}Yes.{% endif %}"
      JarvisCookingMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.cooking_bright_kitchen
        speech:
          text: "Done."
      JarvisDinnerMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.dinner_warm_dim
        speech:
          text: "Done."
      JarvisWeatherQuery:
        speech:
          text: >-
            {% set temp = state_attr('weather.forecast_home', 'temperature') | default('unknown') %}
            {% set cond = states('weather.forecast_home') | replace('-', ' ') %}
            It is {{ temp }} degrees and {{ cond }}.
      JarvisRainQuery:
        speech:
          text: >-
            {% set cond = states('weather.forecast_home') | lower %}
            {% if 'rain' in cond or 'snow' in cond or 'hail' in cond or 'thunder' in cond %}
              Yes, rain is in the forecast.
            {% else %}
              No rain is expected.
            {% endif %}
      JarvisPrintStatus:
        speech:
          text: >-
            {% set status = states('sensor.a1_03900d642327265_print_status') %}
            {% set progress = states('sensor.a1_03900d642327265_print_progress') %}
            {% if status == 'running' %}
              The 3D print is running at {{ progress }} percent.
            {% elif status == 'finish' %}
              The 3D print is finished.
            {% elif status == 'failed' %}
              The 3D print failed.
            {% elif status in ('idle', 'offline', 'unavailable', 'unknown') %}
              The 3D printer is idle.
            {% else %}
              The printer status is {{ status }}.
            {% endif %}
      JarvisAliasOn:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_alias }}"
        speech:
          text: "Done."
      JarvisAliasOff:
        action:
          - service: light.turn_off
            target:
              entity_id: "{{ jarvis_alias }}"
        speech:
          text: "Done."
      JarvisAliasColor:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_alias }}"
            data:
              color_name: "{{ jarvis_general_color }}"
        speech:
          text: "Done."
    light:
      - platform: group
        name: Kitchen Lights
        entities:
          - light.kitchen_light_lan
          - light.kitchen_light_2_lan
          - light.kitchen_mushroom_lamp
          - light.kitchen_fuck_off_sign
      - platform: group
        name: Living Room Lights
        entities:
          - light.living_room_mushroom_lamp_lan
          - light.living_room_tulip_lamp_lan
      - platform: group
        name: All Govee Lights
        entities:
          - light.kitchen_light_lan
          - light.kitchen_light_2_lan
          - light.living_room_mushroom_lamp_lan
          - light.living_room_tulip_lamp_lan
      - platform: group
        name: Bedroom Roku Lights
        entities:
          - light.desk_lamp_desk_lamp
          - light.floor_lamp_floor_lamp
          - light.light_strip_light_strip
      # Local Govee H6004 control over the UDP LAN API (see
      # docs/gotchas/govee-lan-control.md). Provisional side-by-side entities
      # ending in _lan; the .167/.168 to kitchen_light mapping is unverified,
      # toggle each live to confirm before migrating automations off cloud.
      - platform: govee_lan
        lights:
          kitchen_light_lan:
            name: Kitchen Light LAN
            host: 10.0.20.167
          kitchen_light_2_lan:
            name: Kitchen Light 2 LAN
            host: 10.0.20.168
          living_room_mushroom_lamp_lan:
            name: Living Room Mushroom Lamp LAN
            host: 10.0.20.166
          living_room_tulip_lamp_lan:
            name: Living Room Tulip Lamp LAN
            host: 10.0.20.169
      - platform: group
        name: Downstairs Lights
        entities:
          - light.kitchen_light_lan
          - light.kitchen_light_2_lan
          - light.kitchen_mushroom_lamp
          - light.kitchen_fuck_off_sign
          - light.living_room_mushroom_lamp_lan
          - light.living_room_tulip_lamp_lan
      - platform: switch
        name: Bedroom Window Plug
        entity_id: switch.bedroom_window_plug
      - platform: switch
        name: Bedroom Mushroom Plug
        entity_id: switch.bedroom_mushroom_plug
      - platform: switch
        name: Living Room Good Vibes Sign
        entity_id: switch.living_room_good_vibes_sign
      - platform: switch
        name: Kitchen Mushroom Lamp
        entity_id: switch.kitchen_mushroom_lamp
      - platform: switch
        name: Kitchen Fuck Off Sign
        entity_id: switch.fuck_off_sign
    homekit:
      - name: Homelab Bridge
        port: 21063
        advertise_ip: 10.0.40.13
        filter:
          include_entities:
            - light.kitchen_lights
            - light.living_room_lights
            - light.bedroom_roku_lights
            - light.kitchen_light_lan
            - light.kitchen_light_2_lan
            - light.living_room_mushroom_lamp_lan
            - light.living_room_tulip_lamp_lan
            - light.desk_lamp_desk_lamp
            - light.floor_lamp_floor_lamp
            - light.light_strip_light_strip
            - light.bedroom_window_plug
            - light.bedroom_mushroom_plug
            - light.living_room_good_vibes_sign
            - light.kitchen_mushroom_lamp
            - light.kitchen_fuck_off_sign
            - switch.stairs_light
            - climate.living_room_ac_living_room_ac_thermostat
    recorder:
      db_url: !secret recorder_db_url
      purge_keep_days: 10
      commit_interval: 5
      auto_purge: true
      auto_repack: true
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.sm_s948u1_volume_*
          - sensor.rupan_phone_app_*
          - sensor.*_rx_gb
          - sensor.*_tx_gb
          - sensor.*_last_*
          - sensor.*_linkquality
          - sensor.*_power_factor
          - sensor.sun_solar_*
          - sensor.ha_latest_version
        entities:
          - sensor.ha_latest_version
          # Bedroom Roku bulbs: excluded while Bedroom Music Mode streams
          # per-frame optimistic state over MQTT (see ledfx-roku-bridge).
          - light.desk_lamp_desk_lamp
          - light.floor_lamp_floor_lamp
          - light.light_strip_light_strip
        event_types:
          - call_service
    history:
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.sm_s948u1_volume_*
          - sensor.rupan_phone_app_*
          - sensor.*_rx_gb
          - sensor.*_tx_gb
          - sensor.*_last_*
          - sensor.*_linkquality
    logbook:
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.*_linkquality
    rest:
      - resource: https://version.home-assistant.io/stable.json
        scan_interval: 21600
        sensor:
          - name: HA latest version
            value_template: "{{ value_json.homeassistant.default }}"
