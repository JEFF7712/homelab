apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-database-03
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  local:
    path: /persist/romm-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab-03
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database
  namespace: romm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-nvme
  resources:
    requests:
      storage: 4Gi
  volumeName: romm-database-03
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state
  namespace: romm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-db-dumps
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
    - nfsvers=4.2
  nfs:
    server: 10.0.30.20
    path: /tank/cluster/backups-db-dumps-pvc-dcd285d5-b584-4916-a11f-64959618ca8c
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
  namespace: romm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeName: romm-db-dumps
  accessModes:
    - ReadWriteMany
  storageClassName: ''
  resources:
    requests:
      storage: 20Gi
