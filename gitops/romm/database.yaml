apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: registry.rupan.dev/upstream/docker.io/library/mariadb@sha256:73c35e8483b56390cc98f8d6d9840244bd03c929aea7109490641b9389a18088  # yamllint disable-line rule:line-length
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: DB_PASSWD
          ports:
            - name: http
              containerPort: 3306
          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: database
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/hostname: homelab-03
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: romm
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
