# Inventory-only upstream image declarations for the cert-manager Helm chart,
# whose post-renderer pins mirrored digests. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# pinned by digest in release.yaml's postRenderers.
#
# This file is NOT listed in gitops/cert-manager/kustomization.yaml: it is an
# inventory source only and must never be applied to the cluster.
#
# Chart upgrade flow: list the new chart's images here, import them, and only
# then bump the chart and its post-renderer digests together.
apiVersion: v1
kind: List
metadata:
  name: cert-manager-registry-sources
items:
  # cert-manager v1.21.3
  - image: quay.io/jetstack/cert-manager-controller:v1.21.3@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc  # yamllint disable-line rule:line-length
  - image: quay.io/jetstack/cert-manager-webhook:v1.21.3@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458  # yamllint disable-line rule:line-length
  - image: quay.io/jetstack/cert-manager-cainjector:v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f  # yamllint disable-line rule:line-length
  - image: quay.io/jetstack/cert-manager-acmesolver:v1.21.3@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7  # yamllint disable-line rule:line-length
  - image: quay.io/jetstack/cert-manager-startupapicheck:v1.21.3@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1  # yamllint disable-line rule:line-length
