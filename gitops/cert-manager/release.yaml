apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  postRenderers:
    - kustomize:
        images:
          - name: quay.io/jetstack/cert-manager-acmesolver
            newName: registry.rupan.dev/upstream/quay.io/jetstack/cert-manager-acmesolver  # yamllint disable-line rule:line-length
            digest: sha256:dbc7cc1354f603918e7c5af7f55a0a620537394452c93a565bde75c6f48e8837
          - name: quay.io/jetstack/cert-manager-cainjector
            newName: registry.rupan.dev/upstream/quay.io/jetstack/cert-manager-cainjector  # yamllint disable-line rule:line-length
            digest: sha256:ccf6b919ec0500745a47a910118f834f9636d0aac1ff221245cd2557ed8c7c98
          - name: quay.io/jetstack/cert-manager-controller
            newName: registry.rupan.dev/upstream/quay.io/jetstack/cert-manager-controller  # yamllint disable-line rule:line-length
            digest: sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a
          - name: quay.io/jetstack/cert-manager-startupapicheck
            newName: registry.rupan.dev/upstream/quay.io/jetstack/cert-manager-startupapicheck  # yamllint disable-line rule:line-length
            digest: sha256:d8ab6416e6e7303a86fa0a8daa82c94a8001f21c9d78eb2e7db20534e5d07ae8
          - name: quay.io/jetstack/cert-manager-webhook
            newName: registry.rupan.dev/upstream/quay.io/jetstack/cert-manager-webhook  # yamllint disable-line rule:line-length
            digest: sha256:d8b3961b51c8c7320633f8208dc46bf88aa13804d0f7cbe48a096b2c523cee42
  values:
    crds:
      enabled: true
      keep: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
