apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: bus-display
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-display-web
  template:
    metadata:
      labels:
        app: bus-display-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.rupan.dev/apps/bus-display@sha256:6da28826b8304ada63e75d866a233f6aff901cbce21c6c1ab58055865f55948d  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          env:
            - name: OUTLOOK_CALENDAR_URL_FILE
              value: /secrets/calendar/outlook-calendar-url
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # One Python process refreshes the live data in short bursts every
            # 15 s (about 0.08 cores on average); at 500m those bursts were
            # throttled in 61% of CPU periods and kept CPUThrottlingHigh firing.
            # A single interpreter cannot use more than about one core.
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: calendar-secret
              mountPath: /secrets/calendar
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: calendar-secret
          secret:
            secretName: bus-display-calendar
