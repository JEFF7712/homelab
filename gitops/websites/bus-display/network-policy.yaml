apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-ingress
  namespace: bus-display
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow port 8080 from any ingress (LAN, cluster, observability)
    - ports:
        - protocol: TCP
          port: 8080
