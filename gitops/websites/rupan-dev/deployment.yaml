# Generated from site.yaml by scripts/websites/render.py. Edit site.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: rupan-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rupan-dev-web
  template:
    metadata:
      labels:
        app: rupan-dev-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.rupan.dev/apps/rupan-dev@sha256:425f95dd899592957cfed5c4e1d6be74195df33690a93f7bc861ce5e683d0b54  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: tmp
          emptyDir: {}
