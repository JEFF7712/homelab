---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-inquiry-script
  namespace: sovereign
data:
  inquiry.py: |
    #!/usr/bin/env python3
    """Sovereign pilot inquiry receiver. Standard library only.

    POST /api/inquiries accepts the pilot form payload, validates it,
    stores it in SQLite, and forwards a notification to ntfy when a
    token is configured. Bot submissions (honeypot filled) get a fake
    success and are dropped. GET /healthz is the probe endpoint.
    """
    from __future__ import annotations

    import json
    import os
    import sqlite3
    import threading
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PORT = int(os.getenv("PORT", "8080"))
    DB_PATH = os.getenv("DB_PATH", "/data/inquiries.db")
    MAX_BODY = int(os.getenv("MAX_BODY_BYTES", "32768"))
    RATE_MAX = int(os.getenv("RATE_MAX_HITS", "5"))
    RATE_WINDOW = int(os.getenv("RATE_WINDOW_SECONDS", "3600"))
    NTFY_URL = os.getenv(
        "NTFY_URL",
        "http://ntfy-ntfy.observability.svc.cluster.local/sovereign-pilot",
    )
    NTFY_TOKEN = os.getenv("NTFY_TOKEN", "")

    LIMITS = {"business": 120, "role": 80, "workload": 1500}


    def validate(payload: object) -> tuple[dict[str, str] | None, str]:
        if not isinstance(payload, dict):
            return None, "payload must be a JSON object"
        record: dict[str, str] = {}
        for field, maximum in LIMITS.items():
            value = payload.get(field, "")
            if not isinstance(value, str) or not value.strip():
                return None, f"{field} is required"
            if len(value.strip()) > maximum:
                return None, f"{field} exceeds {maximum} characters"
            record[field] = value.strip()
        return record, ""


    class RateLimiter:
        def __init__(self, maximum: int, window: int) -> None:
            self.maximum = maximum
            self.window = window
            self.hits: dict[str, list[float]] = {}
            self.lock = threading.Lock()

        def allowed(self, key: str) -> bool:
            now = time.monotonic()
            with self.lock:
                recent = [t for t in self.hits.get(key, []) if now - t < self.window]
                if len(recent) >= self.maximum:
                    self.hits[key] = recent
                    return False
                recent.append(now)
                self.hits[key] = recent
                return True


    LIMITER = RateLimiter(RATE_MAX, RATE_WINDOW)


    def init_db(path: str) -> None:
        os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
        with sqlite3.connect(path) as db:
            db.execute(
                "CREATE TABLE IF NOT EXISTS inquiries"
                " (id INTEGER PRIMARY KEY, received_at TEXT NOT NULL,"
                " business TEXT NOT NULL, role TEXT NOT NULL,"
                " workload TEXT NOT NULL)"
            )


    def store(record: dict[str, str]) -> int:
        with sqlite3.connect(DB_PATH) as db:
            cursor = db.execute(
                "INSERT INTO inquiries (received_at, business, role, workload)"
                " VALUES (datetime('now'), ?, ?, ?)",
                (record["business"], record["role"], record["workload"]),
            )
            return int(cursor.lastrowid)


    def notify(record: dict[str, str]) -> None:
        if not NTFY_TOKEN:
            print("ntfy token is not configured; skipping notification", flush=True)
            return
        message = (
            f"{record['business']} ({record['role']})\n{record['workload'][:500]}"
        )
        request = urllib.request.Request(
            NTFY_URL,
            data=message.encode("utf-8"),
            headers={
                "Authorization": f"Bearer {NTFY_TOKEN}",
                "Title": "Sovereign pilot inquiry",
                "Priority": "default",
                "Tags": "speech_balloon",
            },
            method="POST",
        )
        try:
            with urllib.request.urlopen(request, timeout=20):
                pass
        except Exception as exc:
            print(f"warning: ntfy notification failed: {exc}", flush=True)


    class Handler(BaseHTTPRequestHandler):
        server_version = "SovereignInquiry/1"

        def client_key(self) -> str:
            forwarded = self.headers.get("X-Forwarded-For", "")
            if forwarded:
                return forwarded.split(",")[0].strip()
            return self.client_address[0]

        def write_json(self, status: int, payload: dict[str, object]) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self) -> None:
            if urllib.parse.urlsplit(self.path).path == "/healthz":
                self.write_json(200, {"ok": True})
                return
            self.write_json(404, {"error": "not found"})

        def do_POST(self) -> None:
            path = urllib.parse.urlsplit(self.path).path.rstrip("/")
            if path != "/api/inquiries":
                self.write_json(404, {"error": "not found"})
                return
            if "application/json" not in self.headers.get("Content-Type", ""):
                self.write_json(415, {"error": "content-type must be application/json"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
            except ValueError:
                length = 0
            if length <= 0 or length > MAX_BODY:
                self.write_json(413, {"error": "body is missing or too large"})
                return
            try:
                payload = json.loads(self.rfile.read(length).decode("utf-8"))
            except (ValueError, UnicodeDecodeError):
                self.write_json(400, {"error": "body must be valid JSON"})
                return
            if isinstance(payload, dict) and str(payload.get("website", "")).strip():
                self.write_json(200, {"ok": True})
                return
            if not LIMITER.allowed(self.client_key()):
                self.write_json(429, {"error": "rate limit exceeded"})
                return
            record, error = validate(payload)
            if record is None:
                self.write_json(400, {"error": error})
                return
            inquiry_id = store(record)
            print(
                f"stored inquiry {inquiry_id} from {record['business']}", flush=True
            )
            notify(record)
            self.write_json(200, {"ok": True, "id": inquiry_id})

        def log_message(self, fmt: str, *args: object) -> None:
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    if __name__ == "__main__":
        init_db(DB_PATH)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
