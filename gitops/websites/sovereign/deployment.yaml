apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: sovereign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereign-web
  template:
    metadata:
      labels:
        app: sovereign-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Pinned to the verified first-party digest in registry/images.lock.json
          # (apps/sovereign-site:0.0.3). registry_promote_first_party updates
          # the lock and this consumer together.
          image: registry.rupan.dev/apps/sovereign-site@sha256:873d57c8372816cf9492e2360a101dc74ebdeea8242e7ad17d219897467d163a  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: tmp
          emptyDir: {}
