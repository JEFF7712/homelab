apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-web-conf
  namespace: nix
data:
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location = /nixos.iso {
            alias /usr/share/nginx/html/iso/nixos.iso;
            add_header Content-Disposition 'attachment; filename="nixos.iso"';
            add_header Content-Type 'application/octet-stream';
            try_files "" =404;
        }

        location = /nixos.iso.sha256 {
            alias /usr/share/nginx/html/iso/nixos.iso.sha256;
            add_header Content-Type 'text/plain; charset=utf-8';
            try_files "" =404;
        }

        location /iso/ {
            alias /usr/share/nginx/html/iso/;
            autoindex on;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-web-html
  namespace: nix
data:
  # yamllint disable rule:line-length
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>nix.rupan.dev &bull; NixOS Live Installer</title>
      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,">
      <style>
        :root {
          color-scheme: dark;
          --black: #000;
          --blue: #5fb8f2;
          --blue-soft: rgba(95, 184, 242, 0.72);
          --blue-faint: rgba(95, 184, 242, 0.12);
          --blue-border: rgba(95, 184, 242, 0.28);
          --blue-border-hover: rgba(95, 184, 242, 0.65);
          --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          min-height: 100vh;
          background: var(--black);
          color: var(--blue);
          font-family: var(--mono);
          line-height: 1.6;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
        }
        .container {
          max-width: 44rem;
          margin: 0 auto;
          width: 100%;
        }
        .top-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 0.82rem;
          margin-bottom: clamp(4rem, 12vh, 8rem);
        }
        .eyebrow {
          display: inline-flex;
          align-items: center;
          gap: 0.45rem;
          text-decoration: none;
          color: var(--blue);
          font-weight: 500;
        }
        .prompt-symbol {
          color: var(--blue);
        }
        .caret {
          display: inline-block;
          width: 0.55ch;
          height: 1.1em;
          background: var(--blue);
          vertical-align: -0.15em;
          animation: blink 1.06s steps(1) infinite;
        }
        @keyframes blink {
          0%, 50% { opacity: 1; }
          50.01%, 100% { opacity: 0; }
        }
        .meta-tag {
          color: var(--blue-soft);
          font-size: 0.72rem;
          letter-spacing: 0.05em;
        }
        .content {
          margin-bottom: clamp(4rem, 12vh, 8rem);
        }
        h1 {
          font-size: clamp(2.2rem, 6vw, 3.75rem);
          font-weight: 500;
          color: #fff;
          letter-spacing: -0.04em;
          line-height: 1.05;
          margin-bottom: 2.5rem;
        }
        .actions {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }
        .btn-download {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          padding: 0.9rem 1.5rem;
          background: var(--blue-faint);
          border: 1px solid var(--blue-border);
          color: #fff;
          font-family: inherit;
          font-size: 0.95rem;
          font-weight: 500;
          text-decoration: none;
          transition: all 140ms ease;
          width: 100%;
        }
        .btn-download:hover {
          background: rgba(95, 184, 242, 0.22);
          border-color: var(--blue);
          color: #fff;
        }
        .btn-download svg {
          width: 1.1rem;
          height: 1.1rem;
          fill: currentColor;
        }
        .cmd-bar {
          display: flex;
          align-items: center;
          background: rgba(8, 8, 8, 0.6);
          border: 1px solid var(--blue-border);
          transition: border-color 140ms ease;
        }
        .cmd-bar:hover, .cmd-bar:focus-within {
          border-color: var(--blue-border-hover);
        }
        .cmd-prefix {
          color: var(--blue-soft);
          padding-left: 1rem;
          user-select: none;
        }
        .cmd-input {
          flex: 1;
          min-width: 0;
          background: transparent;
          border: 0;
          outline: none;
          color: var(--blue);
          font-family: inherit;
          font-size: 0.8rem;
          padding: 0.8rem 0.75rem;
          white-space: nowrap;
          overflow-x: auto;
        }
        .cmd-copy {
          display: grid;
          place-items: center;
          width: 2.75rem;
          height: 2.75rem;
          background: transparent;
          border: 0;
          border-left: 1px solid var(--blue-border);
          color: var(--blue-soft);
          cursor: pointer;
          transition: all 140ms ease;
          flex-shrink: 0;
        }
        .cmd-copy:hover {
          color: #fff;
          background: var(--blue-faint);
        }
        .cmd-copy svg {
          width: 1rem;
          height: 1rem;
          fill: currentColor;
        }
        .links-row {
          display: flex;
          gap: 1.5rem;
          flex-wrap: wrap;
          margin-top: 0.5rem;
          font-size: 0.78rem;
        }
        .links-row a {
          color: var(--blue-soft);
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          gap: 0.4rem;
          transition: color 120ms ease;
        }
        .links-row a:hover {
          color: var(--blue);
          text-decoration: underline;
        }
        footer {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 0.72rem;
          color: var(--blue-soft);
          opacity: 0.7;
          border-top: 1px solid rgba(95, 184, 242, 0.12);
          padding-top: 1.5rem;
        }
        footer a {
          color: inherit;
          text-decoration: none;
        }
        footer a:hover {
          color: var(--blue);
        }
      </style>
    </head>
    <body>
      <div class="container">
        <header class="top-bar">
          <a href="https://rupan.dev" class="eyebrow">
            <span class="prompt-symbol">❯</span>
            <span>nix.rupan.dev</span>
            <span class="caret" aria-hidden="true"></span>
          </a>
          <span class="meta-tag">NixOS 25.11 &bull; x86_64</span>
        </header>

        <main class="content">
          <h1>NixOS Live ISO</h1>

          <div class="actions">
            <a href="/nixos.iso" class="btn-download" download>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span>Download ISO (3.3 GB)</span>
            </a>

            <div class="cmd-bar">
              <span class="cmd-prefix">$</span>
              <input type="text" id="curl-cmd" class="cmd-input" readonly value="curl -LO https://nix.rupan.dev/nixos.iso" aria-label="cURL download command">
              <button class="cmd-copy" id="copy-btn" title="Copy to clipboard" aria-label="Copy command">
                <svg id="copy-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1Zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H8V7h11v14Z"/></svg>
              </button>
            </div>

            <div class="links-row">
              <a href="/nixos.iso.sha256">
                <span>[ sha256 ]</span>
              </a>
              <a href="https://github.com/JEFF7712/nixos-config" target="_blank" rel="noopener noreferrer">
                <span>[ source ]</span>
              </a>
              <a href="/iso/">
                <span>[ iso index ]</span>
              </a>
            </div>
          </div>
        </main>
      </div>

      <div class="container">
        <footer>
          <span>hosted on my k8s cluster</span>
          <a href="https://git.rupan.dev/JEFF7712/nixos-config">forgejo</a>
        </footer>
      </div>

      <script>
        const btn = document.getElementById('copy-btn');
        const input = document.getElementById('curl-cmd');
        const svg = document.getElementById('copy-svg');
        const defaultSvg = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1Zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H8V7h11v14Z"/>';
        const checkSvg = '<path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17Z"/>';

        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(input.value);
            svg.innerHTML = checkSvg;
            btn.style.color = '#5fb8f2';
            setTimeout(() => {
              svg.innerHTML = defaultSvg;
              btn.style.color = '';
            }, 1800);
          } catch (e) {
            input.select();
            document.execCommand('copy');
          }
        });
      </script>
    </body>
    </html>
