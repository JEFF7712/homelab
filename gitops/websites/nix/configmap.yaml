apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-web-conf
  namespace: nix
data:
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location = /nixos.iso {
            alias /usr/share/nginx/html/iso/nixos.iso;
            add_header Content-Disposition 'attachment; filename="nixos.iso"';
            add_header Content-Type 'application/octet-stream';
            try_files "" =404;
        }

        location = /nixos.iso.sha256 {
            alias /usr/share/nginx/html/iso/nixos.iso.sha256;
            add_header Content-Type 'text/plain; charset=utf-8';
            try_files "" =404;
        }

        location /iso/ {
            alias /usr/share/nginx/html/iso/;
            autoindex on;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-web-html
  namespace: nix
data:
  # yamllint disable rule:line-length
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>nixos • rupan.dev</title>
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20' fill='%235fb8f2'>❯</text></svg>">
      <style>
        :root {
          color-scheme: dark;
          --black: #000;
          --blue: #5fb8f2;
          --blue-faint: rgb(95 184 242 / 12%);
          --blue-soft: rgb(95 184 242 / 72%);
          --blue-border: rgb(95 184 242 / 24%);
          --blue-border-hover: rgb(95 184 242 / 60%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          min-height: 100vh;
          background: var(--black);
          color: var(--blue);
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          line-height: 1.5;
          padding: clamp(2rem, 7vw, 6rem) clamp(1.5rem, 5vw, 5rem);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .container {
          max-width: 44rem;
          width: 100%;
        }
        .eyebrow {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          margin-bottom: clamp(2.5rem, 6vh, 4.5rem);
        }
        .wordmark {
          display: inline-flex;
          align-items: center;
          gap: 0.5ch;
          color: var(--blue);
          font-size: 0.95rem;
          font-weight: 500;
          letter-spacing: -0.01em;
        }
        .wordmark-prompt {
          color: var(--blue);
        }
        .wordmark-caret {
          width: 0.55ch;
          height: 1.15em;
          background: var(--blue);
          animation: caret-blink 1.06s steps(1) infinite;
        }
        .wordmark-sub {
          color: var(--blue-soft);
          font-size: 0.62rem;
          letter-spacing: 0.13em;
          text-transform: uppercase;
        }
        @keyframes caret-blink {
          0%, 50% { opacity: 1; }
          50.01%, 100% { opacity: 0; }
        }
        h1 {
          font-size: clamp(1.9rem, 5.5vw, 3.2rem);
          font-weight: 500;
          letter-spacing: -0.05em;
          line-height: 1.08;
          color: var(--blue);
          margin-bottom: 1.25rem;
        }
        h1 span {
          display: block;
        }
        .desc {
          color: var(--blue-soft);
          font-size: clamp(0.82rem, 1.2vw, 0.95rem);
          line-height: 1.7;
          margin-bottom: 2rem;
        }
        .prompt-box {
          display: flex;
          position: relative;
          width: 100%;
          border: 1px solid var(--blue-border);
          background: rgb(8 8 8 / 40%);
          transition: border-color 140ms ease;
          margin-bottom: 1.5rem;
        }
        .prompt-box:hover, .prompt-box:focus-within {
          border-color: var(--blue-border-hover);
        }
        .prompt-input {
          flex: 1;
          height: 2.75rem;
          padding: 0 1rem;
          background: transparent;
          border: 0;
          color: var(--blue);
          font-family: inherit;
          font-size: 0.8rem;
          outline: none;
          white-space: nowrap;
          overflow-x: auto;
        }
        .copy-btn {
          width: 2.75rem;
          height: 2.75rem;
          border: 0;
          border-left: 1px solid var(--blue-border);
          background: transparent;
          color: var(--blue-soft);
          display: grid;
          place-items: center;
          cursor: pointer;
          transition: color 140ms ease, border-color 140ms ease;
        }
        .copy-btn:hover {
          color: var(--blue);
        }
        .copy-btn svg {
          width: 1.1rem;
          height: 1.1rem;
          fill: currentColor;
        }
        .actions {
          display: flex;
          gap: 1.8rem;
          flex-wrap: wrap;
          margin-bottom: 3.5rem;
        }
        .action-link {
          display: inline-flex;
          align-items: center;
          gap: 0.45rem;
          color: var(--blue-soft);
          text-decoration: none;
          font-size: 0.8rem;
          letter-spacing: 0.04em;
          transition: color 120ms ease;
        }
        .action-link:hover {
          color: var(--blue);
        }
        .action-link svg {
          width: 0.95rem;
          height: 0.95rem;
          fill: currentColor;
        }
        .section-label {
          color: var(--blue-soft);
          font-size: 0.65rem;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-bottom: 1rem;
        }
        .steps {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
          margin-bottom: 3.5rem;
        }
        .step-item {
          display: flex;
          align-items: baseline;
          gap: 1.25rem;
          padding: 0.7rem 0;
          border-bottom: 1px solid var(--blue-faint);
          font-size: 0.82rem;
        }
        .step-idx {
          color: var(--blue-soft);
          font-size: 0.7rem;
          letter-spacing: 0.08em;
          flex-shrink: 0;
        }
        .step-body {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 0.35rem;
        }
        .step-title {
          color: var(--blue-soft);
          font-size: 0.75rem;
        }
        .step-code {
          color: var(--blue);
          font-size: 0.82rem;
          word-break: break-all;
        }
        footer {
          margin-top: 4rem;
          color: var(--blue-soft);
          font-size: 0.7rem;
          letter-spacing: 0.08em;
          display: flex;
          gap: 1.5rem;
          flex-wrap: wrap;
        }
        footer a {
          color: inherit;
          text-decoration: none;
          transition: color 120ms ease;
        }
        footer a:hover {
          color: var(--blue);
          text-decoration: underline;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <header class="eyebrow">
          <div class="wordmark">
            <span class="wordmark-prompt">❯</span>
            <span>nixOS</span>
            <span class="wordmark-caret" aria-hidden="true"></span>
          </div>
          <div class="wordmark-sub">live installer &amp; workstation flake</div>
        </header>

        <section>
          <h1>
            <span>Declarative, reproducible</span>
            <span>workstation &amp; installer.</span>
          </h1>
          <p class="desc">
            NixOS flake configuration with Niri scrollable tiling Wayland compositor,
            Quickshell dynamic status bar, runtime desktop profile switching,
            and camp-1 impermanence on LUKS2 + btrfs.
          </p>

          <div class="prompt-box">
            <input
              type="text"
              class="prompt-input"
              id="cmd-input"
              readonly
              value="curl -LO https://nix.rupan.dev/nixos.iso"
              aria-label="Download command"
            >
            <button class="copy-btn" id="copy-btn" title="Copy to clipboard" aria-label="Copy download command">
              <svg id="copy-icon" viewBox="0 0 24 24">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1Zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H8V7h11v14Z"/>
              </svg>
            </button>
          </div>

          <nav class="actions" aria-label="Quick links">
            <a href="/nixos.iso" class="action-link" download>
              <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span>Download ISO (3.3 GB)</span>
            </a>
            <a href="/nixos.iso.sha256" class="action-link">
              <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
              <span>SHA-256</span>
            </a>
            <a href="https://github.com/JEFF7712/nixos-config" class="action-link" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
              <span>Source</span>
            </a>
          </nav>
        </section>

        <section>
          <div class="section-label">Quickstart Installation</div>
          <div class="steps">
            <div class="step-item">
              <div class="step-idx">01</div>
              <div class="step-body">
                <div class="step-title">Fetch installer ISO</div>
                <div class="step-code">curl -LO https://nix.rupan.dev/nixos.iso</div>
              </div>
            </div>
            <div class="step-item">
              <div class="step-idx">02</div>
              <div class="step-body">
                <div class="step-title">Write to USB target drive</div>
                <div class="step-code">sudo dd if=nixos.iso of=/dev/sdX bs=4M status=progress conv=fsync</div>
              </div>
            </div>
            <div class="step-item">
              <div class="step-idx">03</div>
              <div class="step-body">
                <div class="step-title">Boot UEFI into Niri &amp; install</div>
                <div class="step-code">get-config</div>
              </div>
            </div>
          </div>
        </section>

        <footer>
          <span>cluster • rupan.dev</span>
          <a href="https://git.rupan.dev/JEFF7712/nixos-config">forgejo</a>
          <a href="https://github.com/JEFF7712/nixos-config">github</a>
        </footer>
      </div>

      <script>
        const btn = document.getElementById('copy-btn');
        const input = document.getElementById('cmd-input');
        const icon = document.getElementById('copy-icon');
        const copySvg = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1Zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 16H8V7h11v14Z"/>';
        const checkSvg = '<path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17Z"/>';

        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(input.value);
            icon.innerHTML = checkSvg;
            btn.style.color = 'var(--blue)';
            setTimeout(() => {
              icon.innerHTML = copySvg;
              btn.style.color = '';
            }, 1800);
          } catch (e) {
            input.select();
            document.execCommand('copy');
          }
        });
      </script>
    </body>
    </html>
