# Generated from site.yaml by scripts/websites/render.py. Edit site.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: darkbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: darkbit-web
  template:
    metadata:
      labels:
        app: darkbit-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.rupan.dev/apps/darkbit@sha256:92d26b99bfff39d41ca517e1f92d148e8974767589eae0d5f5503bc0787876a9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: tmp
          emptyDir: {}
