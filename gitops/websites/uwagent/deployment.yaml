apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: uwagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uwagent-web
  template:
    metadata:
      labels:
        app: uwagent-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.rupan.dev/apps/uwagent@sha256:001693c3bfd18fc22b3de9f12ae9195e7ec371a310c57905af6e070fb0fc734c  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          env:
            - name: UWAGENT_PUBLIC_URL
              value: https://uwagent.rupan.dev
            - name: UWAGENT_CONTACT
              value: rupanpandyan@gmail.com
            # Public ChatGPT plugin domain-verification token, served at /.well-known/openai-apps-challenge.
            - name: UWAGENT_OPENAI_CHALLENGE
              value: 3lrw8QfONNLLS1o2wwr0STs9HDj4YF4WLz2xanPSQx8
            # Keys the session hash in usage events so it survives pod
            # restarts; gitops/secrets/uwagent-events.sops.yaml. Optional so
            # a rollout that lands before the secrets Kustomization still
            # starts (with a per-process key) instead of taking the site down.
            - name: UWAGENT_EVENTS_KEY
              valueFrom:
                secretKeyRef:
                  name: uwagent-events
                  key: events-key
                  optional: true
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: plans
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: plans
          persistentVolumeClaim:
            claimName: uwagent-plans
        - name: tmp
          emptyDir: {}
