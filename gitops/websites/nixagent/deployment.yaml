# Generated from site.yaml by scripts/websites/render.py. Edit site.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: nixagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixagent-web
  template:
    metadata:
      labels:
        app: nixagent-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.rupan.dev/apps/nix-agent-site@sha256:4daa53a5ec5cd3bcd556e1131a8b3a3d64e383b4133275df167191498328bee6  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: tmp
          emptyDir: {}
