apiVersion: v1
kind: Service
metadata:
  name: uptime
  namespace: cloudflare
spec:
  ports:
    - name: http
      port: 2203
      targetPort: 2203
---
apiVersion: v1
kind: Endpoints
metadata:
  name: uptime
  namespace: cloudflare
subsets:
  - addresses:
      - ip: 10.0.30.10
    ports:
      - name: http
        port: 2203
