# FlareSolverr: Cloudflare bypass helper for Prowlarr. ClusterIP only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: registry.rupan.dev/upstream/ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767  # yamllint disable-line rule:line-length
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/Chicago
            - name: PROXY_URL
              value: http://download-proxy.media:8888
            - name: PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: HTTPPROXY_USER
            - name: PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: HTTPPROXY_PASSWORD
          ports:
            - containerPort: 8191
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: apphome
              mountPath: /app/.local
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            tcpSocket:
              port: 8191
            initialDelaySeconds: 60
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 8191
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: apphome
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
spec:
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
