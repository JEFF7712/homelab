# Lidarr via hotio (Deezer/ARL + extended.conf). Needs a writable rootfs
# for the ffmpeg bootstrap layer; everything else stays read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      initContainers:
        - name: fix-permissions
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - sh
            - -c
            - '[ "$(stat -c ''%u:%g'' /config)" = "1000:1000" ] || chown -R 1000:1000 /config'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: lidarr
          image: registry.rupan.dev/apps/lidarr-extended@sha256:8d5da9f7ebb46e6d28da2ae904d3ecf18de11c8395e03bf56a802464cd110385  # yamllint disable-line rule:line-length
          command: ["bash", "/tmp/lidarr-extended/lidarr-boot.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: lidarrUrl
              value: http://127.0.0.1:8686
            - name: DEEZER_ARL
              valueFrom:
                secretKeyRef:
                  name: media-app
                  key: DEEZER_ARL
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-app
                  key: LIDARR_API_KEY
          ports:
            - containerPort: 8686
          volumeMounts:
            - name: config
              mountPath: /config
            - name: extended-boot
              mountPath: /tmp/lidarr-extended
              readOnly: true
            - name: media
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          readinessProbe:
            httpGet:
              path: /ping
              port: 8686
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 10
          # Boot runs apk + the deemix/freyr toolchain setup before /init,
          # routinely 4-6 minutes on fresh rootfs. The 120s delay let
          # liveness SIGKILL slow boots at ~220s and loop them.
          livenessProbe:
            httpGet:
              path: /ping
              port: 8686
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 3Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: extended-boot
          configMap:
            name: lidarr-extended-config
            defaultMode: 420
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
spec:
  selector:
    app: lidarr
  ports:
    - port: 80
      targetPort: 8686
