# ClamAV scanner for Questarr's pre-import scans (docs/runbooks/games.md).
# Questarr streams each file to clamd over TCP (INSTREAM), so no media mount
# is needed. ClamAV cannot scan files over 2 GB; StreamMaxLength refuses them
# instead of letting MaxFileSize skip them with an OK verdict, so Questarr
# holds such imports for manual review. The stock entrypoint edits
# /etc/clamav in place, so freshclam and clamd run directly against a
# config mounted at /etc/clamav-config with a read-only root filesystem.
# /etc/clamav itself must stay visible: freshclam verifies signature
# databases with the image's /etc/clamav/certs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: clamav-db
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 2Gi
