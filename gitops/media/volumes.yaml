# Per-app config volumes on the default nfs-cluster class (nas-01
# /tank/cluster, daily snapshots). Small, portable, node-independent.
# Bulk media mounts come from the media-library claim in storage.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 2Gi
---
