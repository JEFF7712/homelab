apiVersion: v1
kind: ConfigMap
metadata:
  name: lidarr-extended-config
  namespace: media
data:
  # Shell format, NOT ini. The hotio extended scripts
  # (`source /config/extended.conf`) execute this file as bash; ini
  # section headers break every assignment and fail ConfValidationCheck,
  # which exits all extended services (Audio/ARLChecker) at boot.
  # Secrets are placeholders here and are rendered at container start by
  # 10-render-extended-conf from the media-app Secret. Never put real
  # arlToken/lidarrAPI values in this file.
  extended.conf.template: |
    ##### LIDARR EXTENDED SCRIPTS SETTINGS #####

    ##### PATHS
    downloadPath="/config/extended/downloads"
    importPath="/config/extended/import"
    videoPath=""

    ##### SCRIPT ENABLEMENT
    enableAutoConfig="false"
    enableAudio="true"
    enableVideo="false"
    enableUnmappedFilesCleaner="false"
    enableQueueCleaner="true"
    enableChangeCategory="false"

    ##### SCRIPT INTERVALS
    audioScriptInterval=15m
    videoScriptInterval=15m
    autoArtistAdderInterval=12h
    unmappedFolderCleanerScriptInterval=15m
    queueCleanerScriptInterval=15m

    ##### AUTOCONFIG SCRIPT SETTINGS
    configureMediaManagement="false"
    configureMetadataConsumerSettings="false"
    configureMetadataProviderSettings="false"
    configureCustomScripts="true"
    configureLidarrUiSettings="false"
    configureMetadataProfileSettings="false"
    configureTrackNamingSettings="false"

    ##### AUDIO SCRIPT
    # SEARCH
    searchSort="date"
    matchDistance="3"
    lidarrSearchForMissing="true"
    retryNotFound="90"
    ignoreInstrumentalRelease="false"
    preferSpecialEditions="true"

    # CLIENT (arlToken rendered at boot from DEEZER_ARL)
    # "both" routes missing albums through Deezer (deemix) and Tidal
    # (tidaler via the tidal-dl compat shim installed by lidarr-boot.sh).
    # Tidal auth is a pre-provisioned token on the config PVC, not a
    # secret in this file; see docs/runbooks/arr-credentials.md.
    dlClientSource="both"
    arlToken="__DEEZER_ARL__"
    tidalCountryCode="US"
    # Upstream default canary (166356219) no longer returns audio streams
    # from the Tidal API, which would fail the client self-test and exit
    # the Audio daemon. This album is verified downloadable via tidaler.
    failedDownloadAttemptThreshold="6"
    deezerClientTestDownloadId="197472472"
    # Upstream default canary (166356219) no longer returns audio streams
    # from the Tidal API, which would fail the client self-test and exit
    # the Audio daemon. This album is verified downloadable via tidaler.
    tidalClientTestDownloadId="77610756"
    downloadClientTimeOut="10m"

    # QUALITY
    audioLyricType="both"
    audioFormat="native"
    audioBitrate="lossless"
    requireQuality="false"

    # POST PROCESSING
    enableBeetsTagging="false"
    beetsMatchPercentage="90"
    enableReplaygainTags="true"

    # ADD ARTIST AUTOMATION
    addDeezerTopArtists="false"
    addDeezerTopAlbumArtists="false"
    addDeezerTopTrackArtists="false"
    topLimit="3"
    addRelatedArtists="false"
    numberOfRelatedArtistsToAddPerArtist="1"
    autoArtistAdderMonitored="true"
    preventRelatedArtistsLoop="true"

    ##### VIDEO SCRIPT
    addFeaturedVideoArtists="false"
    videoFormat="bv[width>=1920]+ba"
    videoInfoJson="false"
    youtubeSubtitleLanguage="en"
    disableImvd="false"

    ##### PLEX NOTIFY SCRIPT
    plexUrl=""
    plexToken=""

    ##### DEEZER ARLCHECKER
    arlUpdateInterval="24h"
    telegramBotEnable="false"
    telegramBotToken=""
    telegramUserChatID=""
    pushoverEnable="false"
    pushoverUserKey=""
    pushoverAppAPIKey=""
    ntfyEnable="false"
    ntfyServerTopic=""
    ntfyUserToken=""
    AppriseEnable="false"
    AppriseString=""


    lidarrUrl="http://127.0.0.1:8686"
    lidarrAPI="__LIDARR_API_KEY__"
    autoUpdate="false"
  # Rendered at container start into /config/extended.conf by
  # lidarr-boot.sh (this image's init does not process custom-cont-init.d,
  # so the Deployment command runs the wrapper, which also installs the
  # toolchain and starts the Audio/ARLChecker services). Fails the
  # container start loudly when DEEZER_ARL or LIDARR_API_KEY is missing,
  # instead of silently downloading nothing.
  10-render-extended-conf: |
    #!/usr/bin/env python3
    """Render /config/extended.conf from the template plus secret env."""
    import os
    import sys
    from pathlib import Path

    TEMPLATE = Path("/tmp/lidarr-extended/extended.conf.template")
    DEST = Path("/config/extended.conf")


    def main() -> int:
        arl = os.environ.get("DEEZER_ARL", "").strip()
        api_key = os.environ.get("LIDARR_API_KEY", "").strip()
        missing = [
            name
            for name, value in (("DEEZER_ARL", arl), ("LIDARR_API_KEY", api_key))
            if not value
        ]
        if missing:
            print(
                "render-extended-conf: missing required env: "
                + ", ".join(missing),
                file=sys.stderr,
            )
            return 1
        text = TEMPLATE.read_text(encoding="utf-8")
        text = text.replace("__DEEZER_ARL__", arl).replace(
            "__LIDARR_API_KEY__", api_key
        )
        if "__DEEZER_ARL__" in text or "__LIDARR_API_KEY__" in text:
            print(
                "render-extended-conf: placeholder left unreplaced",
                file=sys.stderr,
            )
            return 1
        DEST.write_text(text, encoding="utf-8")
        os.chmod(DEST, 0o644)
        print("render-extended-conf: wrote /config/extended.conf")
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
  # Container entrypoint wrapper (Deployment command). The hotio init
  # system starts only its own s6 services, so this wrapper installs the
  # extended toolchain, renders secrets, launches the extended daemons in
  # the background, then execs /init. Only the services enabled in
  # extended.conf.template are started (Audio, ARLChecker).
  lidarr-boot.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    retry() {
      local -r max_attempts=15
      local -r delay=4
      local attempt=1
      until "$@"; do
        if [ "$attempt" -ge "$max_attempts" ]; then
          echo "[lidarr-boot] ERROR: Command failed after $attempt attempts: $*" >&2
          return 1
        fi
        echo "[lidarr-boot] Command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
        sleep "$delay"
        attempt=$((attempt + 1))
      done
    }

    echo "--- [lidarr-boot] checking runtime deps ---"
    if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 || ! command -v flac >/dev/null 2>&1; then
      retry apk update
      retry apk add --no-cache ffmpeg python3 py3-pip jq flac
    fi
    command -v ffprobe >/dev/null 2>&1 || true

    echo "--- [lidarr-boot] extended toolchain (pre-installed or self-skipping) ---"
    if ! command -v deemix >/dev/null 2>&1 || ! command -v xq >/dev/null 2>&1; then
      rm -f /config/setup_version.txt
      if [ -f /config/setup.bash ]; then
        bash /config/setup.bash
      fi
    elif [ -f /config/setup.bash ]; then
      bash /config/setup.bash
    fi

    echo "--- [lidarr-boot] tidal backend (tidaler + tidal-dl compat shim) ---"
    # tidaler is pre-baked in the image; fallback to dynamic install if missing
    if ! command -v tidaler >/dev/null 2>&1; then
      retry uv pip install --system --no-cache-dir --break-system-packages "tidaler==0.1.8"
    fi
    if [ -f /tmp/lidarr-extended/tidal-dl-shim ]; then
      cp /tmp/lidarr-extended/tidal-dl-shim /usr/local/bin/tidal-dl
      chmod 755 /usr/local/bin/tidal-dl
    fi
    command -v tidal-dl

    # Ensure /custom-services.d/python/ARLChecker.py exists if present on PVC
    mkdir -p /custom-services.d/python
    if [ -f /config/custom-services.d/python/ARLChecker.py ] && [ ! -f /custom-services.d/python/ARLChecker.py ]; then
      cp -a /config/custom-services.d/python/ARLChecker.py /custom-services.d/python/ARLChecker.py
    fi

    # Verify critical binaries are present
    for bin in ffmpeg flac jq xq deemix tidaler tidal-dl; do
      if ! command -v "$bin" >/dev/null 2>&1; then
        echo "[lidarr-boot] FATAL: required binary '$bin' is not installed" >&2
        exit 1
      fi
    done

    echo "--- [lidarr-boot] rendering extended.conf ---"
    python3 /tmp/lidarr-extended/10-render-extended-conf
    echo "--- [lidarr-boot] starting extended services ---"
    # deemix resolves its config via XDG_CONFIG_HOME, but the container
    # sets it to /config/.config while the scripts stage credentials in
    # /config/xdg. Without this override deemix prompts for the ARL
    # interactively and every download aborts. Scoped to the daemons so
    # /init and Lidarr keep the image default environment. Invoked via
    # bash explicitly because the scripts' with-contenv shebang would
    # reset the override back to the container default.
    mkdir -p /config/logs
    (
      while true; do
        XDG_CONFIG_HOME=/config/xdg bash /config/custom-services.d/Audio
        sleep 60
      done
    ) >>/config/logs/Audio-supervisor.log 2>&1 &
    (
      while true; do
        XDG_CONFIG_HOME=/config/xdg bash /config/custom-services.d/ARLChecker
        sleep 60
      done
    ) >>/config/logs/ARLChecker-supervisor.log 2>&1 &
    echo "--- [lidarr-boot] exec /init ---"
    exec /init
  # tidal-dl compatibility shim: translates the legacy tidal-dl CLI used by
  # the upstream Audio script to tidaler (maintained tidal-dl-ng fork).
  # Installed to /usr/local/bin/tidal-dl by lidarr-boot.sh. Handles the
  # three invocation shapes the Audio script uses: bare (session check),
  # -o DIR (output path), and -q QUALITY -o DIR -l LINK (download).
  # Never prompts: a dead session exits 1 so the script fails fast into
  # its normal retry path instead of hanging a headless daemon.
  tidal-dl-shim: |
    #!/usr/bin/env bash
    set -u
    export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-/config/xdg}"
    quality=""
    outdir=""
    link=""
    while [ $# -gt 0 ]; do
      case "$1" in
        -q) quality="${2:-}"; shift 2 ;;
        -o) outdir="${2:-}"; shift 2 ;;
        -l) link="${2:-}"; shift 2 ;;
        *) shift ;;
      esac
    done
    case "$quality" in
      Master) tidal_quality="HI_RES_LOSSLESS" ;;
      HiFi) tidal_quality="LOSSLESS" ;;
      High | Normal) tidal_quality="HIGH" ;;
      128) tidal_quality="LOW" ;;
      "") tidal_quality="" ;;
      *) tidal_quality="LOSSLESS" ;;
    esac
    if [ -n "$outdir" ]; then
      tidaler cfg download_base_path "$outdir" >/dev/null 2>&1
    fi
    if [ -n "$tidal_quality" ]; then
      tidaler cfg quality_audio "$tidal_quality" >/dev/null 2>&1
    fi
    if [ -z "$link" ]; then
      if tidaler login </dev/null 2>&1 | grep -q "logged in"; then
        exit 0
      fi
      echo "tidal-dl-shim: TIDAL session invalid, re-authentication required" >&2
      exit 1
    fi
    # The Audio script passes bare Tidal album IDs (like the Deezer side
    # passes bare Deezer IDs); tidaler needs full URLs.
    case "$link" in
      *[!0-9]*) ;;
      *) link="https://tidal.com/browse/album/$link" ;;
    esac
    exec -a tidal-dl tidaler dl "$link"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: media
data:
  config.yaml: |
    directory: /data/music
    library: /data/.beets/library.db
    plugins: fetchart embedart scrub
    import:
      move: false
      copy: false
      write: true
      incremental: true
      quiet: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-web-dirs
  namespace: media
data:
  dirs.json: |
    {"ingest_folder": "/cwa-book-ingest", "library_folder": "/calibre-library"}
