apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-vpn
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: media-vpn
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_WIREGUARD_PRIVATE_KEY
    - secretKey: WIREGUARD_PRESHARED_KEY
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_WIREGUARD_PRESHARED_KEY
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_WIREGUARD_ADDRESSES
    - secretKey: VPN_PORT_FORWARDING
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_PORT_FORWARDING
    - secretKey: HTTPPROXY_USER
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_HTTP_PROXY_USER
    - secretKey: HTTPPROXY_PASSWORD
      remoteRef:
        key: homelab-values
        property: MEDIA_VPN_HTTP_PROXY_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-app
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: media-app
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: SLSKD_USERNAME
      remoteRef:
        key: homelab-values
        property: SLSKD_USERNAME
    - secretKey: SLSKD_PASSWORD
      remoteRef:
        key: homelab-values
        property: SLSKD_PASSWORD
    - secretKey: SLSKD_YML
      remoteRef:
        key: homelab-values
        property: SLSKD_YML
    # Primary slskd API key for Soularr (Administrator role when set as a
    # plain string). Consumed as SLSKD_API_KEY env by slskd itself and
    # rendered into Soularr's config. Create the GitLab variable BEFORE
    # applying: a missing remote key fails the whole media-app sync.
    - secretKey: SLSKD_API_KEY
      remoteRef:
        key: homelab-values
        property: SLSKD_API_KEY
    - secretKey: DEEZER_ARL
      remoteRef:
        key: homelab-values
        property: LIDARR_DEEZER_ARL
    # Download-chain credentials. Source of truth is these GitLab project
    # variables; enforced into the apps by the arr-credential-sync CronJob
    # (gitops/media/arr-secret-sync.yaml). Rotation: docs/runbooks/arr-credentials.md
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: homelab-values
        property: QBITTORRENT_USERNAME
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: homelab-values
        property: QBITTORRENT_PASSWORD
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: homelab-values
        property: SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: homelab-values
        property: RADARR_API_KEY
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: homelab-values
        property: LIDARR_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: homelab-values
        property: SEERR_API_KEY
    - secretKey: JELLYFIN_SEERR_API_KEY
      remoteRef:
        key: homelab-values
        property: JELLYFIN_SEERR_API_KEY
    - secretKey: SPOTIFY_CLIENT_ID
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_ID
    - secretKey: SPOTIFY_CLIENT_SECRET
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_SECRET
    - secretKey: SPOTIFY_REFRESH_TOKEN
      remoteRef:
        key: homelab-values
        property: SPOTIFY_REFRESH_TOKEN
