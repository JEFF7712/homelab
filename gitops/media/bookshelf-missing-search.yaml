# Weekly Bookshelf maintenance (bookshelf-missing-search/weekly.py): rescan the
# library, clear queue entries Calibre has imported, then search every
# monitored book that is still missing. Bookshelf only watches indexer RSS
# between searches, so older titles posted as ebooks later need this.
# Runbook: docs/runbooks/books.md
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookshelf-missing-search
  namespace: media
spec:
  schedule: "47 3 * * 0"
  suspend: true
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: search
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/weekly.py"]
              env:
                - name: BOOKSHELF_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: BOOKSHELF_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: bookshelf-missing-search
