# Weekly backlog search for monitored books that are still missing.
#
# Bookshelf only watches indexer RSS feeds between manual searches, so an
# older title that is first posted as an ebook later is never picked up.
# This asks Bookshelf to search every monitored, missing book once a week.
# Runbook: docs/runbooks/books.md
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookshelf-missing-search
  namespace: media
spec:
  schedule: "47 3 * * 0"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: search
              image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
              command:
                - sh
                - -c
                - >-
                  wget -q -O - -T 60
                  --header "X-Api-Key: $BOOKSHELF_API_KEY"
                  --header "Content-Type: application/json"
                  --post-data '{"name":"MissingBookSearch","monitored":true}'
                  http://bookshelf.media/api/v1/command
              env:
                - name: BOOKSHELF_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: BOOKSHELF_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
