directory: /data/music
library: /data/.beets/library.db
statefile: /data/.beets/state.pickle
# No embedart or scrub: both rewrite whole audio files, and tank/media
# snapshots pin every old copy (2026-11-15 pool near-full). fetchart's
# cover.jpg is what Navidrome serves.
plugins: musicbrainz fetchart lastgenre
# Fill empty genres from Last.fm tags (whitelisted) as albums import;
# existing genre tags are kept. Navidrome serves them to music lighting.
lastgenre:
  source: album
  count: 3
  force: false
import:
  move: false
  copy: false
  write: true
  incremental: true
  incremental_skip_later: true
  quiet: true
  quiet_fallback: skip
  log: /data/.beets/import.log
