apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-isolate-ingress
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow all pods within media namespace to communicate with each other
    - from:
        - podSelector: {}
    # 2. Allow ingress from Cloudflare Tunnel connector pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
    # 3. Allow ingress from Observability (Prometheus/Alloy scrapers)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
    # 4. Allow ingress from Home Assistant for media integrations
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
    # 5. Allow ingress from internal LAN clients and NetBird VPN mesh
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
    # 6. NetBird clients arrive with 100.64.0.0/10 source addresses (the
    # mesh CIDR), not 10.x, so the LAN VIP is unreachable without this.
    - from:
        - ipBlock:
            cidr: 100.64.0.0/10
