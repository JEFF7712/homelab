# Soularr: Lidarr wanted list -> Soulseek downloads via slskd.
#
# soularr.py runs once per invocation, so this is a CronJob (hourly),
# not a daemon. It needs: Lidarr API key, slskd API key (SLSKD_API_KEY
# homelab-values property, also consumed by the slskd Deployment), the shared
# media library at /data, and a small config PVC for config.ini plus the
# failed-import denylist state.
#
# Secrets never live here: run.py renders config.ini at job start from
# LIDARR_API_KEY / SLSKD_API_KEY env (media-app Secret). Soularr itself
# is fetched from the pinned upstream commit at runtime (same precedent
# as the Lidarr extended toolchain in setup.bash).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: soularr
  namespace: media
spec:
  schedule: "17 * * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: soularr
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: soularr
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/run.py"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: HOME
                  value: /tmp
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: LIDARR_API_KEY
                - name: SLSKD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: SLSKD_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: config
                  mountPath: /config
                - name: media
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
          volumes:
            - name: script
              configMap:
                name: soularr
            - name: config
              persistentVolumeClaim:
                claimName: soularr-config
            - name: media
              persistentVolumeClaim:
                claimName: media-library
            - name: tmp
              emptyDir: {}
