# Credential drift guard for the media download chain.
#
# The qBittorrent WebUI password and the *arr/Seerr API keys live in app
# databases (PVCs), not in Git. When any of them is changed by hand, the
# integrations break silently (Seerr pending forever, *arr "unable to
# communicate with qBittorrent", stale availability in Seerr).
#
# Source of truth is gitops/secrets/homelab-values.sops.yaml, synced hourly into the
# media-app Secret by ExternalSecrets. This CronJob runs every 15 minutes
# and pushes the secret values into the apps via their HTTP APIs:
#   - qBittorrent password -> Radarr/Sonarr/Lidarr download clients
#     (test-first: only rewrites when the live test fails)
#   - Sonarr/Radarr API keys -> Seerr server settings
#   - Jellyfin API key -> Seerr Jellyfin settings
#
# Rotation runbook: docs/runbooks/arr-credentials.md
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-credential-sync
  namespace: media
spec:
  schedule: "*/15 * * * *"
  timeZone: America/Chicago
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/sync.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              envFrom:
                - secretRef:
                    name: media-app
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: arr-credential-sync
            - name: tmp
              emptyDir: {}
