# Credential drift guard for the media download chain.
#
# The qBittorrent WebUI password and the *arr/Seerr API keys live in app
# databases (PVCs), not in Git. When any of them is changed by hand, the
# integrations break silently (Seerr pending forever, *arr "unable to
# communicate with qBittorrent", stale availability in Seerr).
#
# Source of truth is GitLab project variables, synced hourly into the
# media-app Secret by ExternalSecrets. This CronJob runs every 15 minutes
# and pushes the secret values into the apps via their HTTP APIs:
#   - qBittorrent password -> Radarr/Sonarr/Lidarr download clients
#     (test-first: only rewrites when the live test fails)
#   - Sonarr/Radarr API keys -> Seerr server settings
#   - Jellyfin API key -> Seerr Jellyfin settings
#
# Rotation runbook: docs/runbooks/arr-credentials.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-credential-sync
  namespace: media
data:
  sync.py: |
    """Push secret-managed credentials into *arr/Seerr via their HTTP APIs.

    Test-first: nothing is rewritten unless the live config fails its own
    connection test (or a stored key differs from the secret). Any failure
    exits nonzero so the CronJob surfaces it.
    """

    import copy
    import json
    import os
    import sys
    import urllib.request
    from typing import Any, Optional

    TIMEOUT = 15

    ARR_APPS = (
        {"name": "sonarr", "host": "sonarr.media", "key_env": "SONARR_API_KEY",
         "api_root": "/api/v3"},
        {"name": "radarr", "host": "radarr.media", "key_env": "RADARR_API_KEY",
         "api_root": "/api/v3"},
        # Lidarr still serves the v1 API (v3 returns 404).
        {"name": "lidarr", "host": "lidarr.media", "key_env": "LIDARR_API_KEY",
         "api_root": "/api/v1"},
    )
    SEERR_HOST = "seerr.media"


    class ApiError(Exception):
        pass


    def api(
        method: str,
        base: str,
        api_key: str,
        path: str,
        body: Optional[dict] = None,
    ) -> tuple[int, Any]:
        data = None
        headers = {"X-Api-Key": api_key, "Accept": "application/json"}
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(
            base + path, data=data, headers=headers, method=method
        )
        try:
            with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                raw = resp.read().decode()
                return resp.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read().decode()
            try:
                return e.code, json.loads(raw) if raw else None
            except json.JSONDecodeError:
                return e.code, raw
        except (urllib.error.URLError, TimeoutError, OSError) as e:
            raise ApiError(f"{method} {base}{path}: {e}") from e


    def find_qbit_clients(clients: list) -> list:
        return [
            c for c in clients if c.get("implementation") == "QBittorrent"
        ]


    def with_password(client: dict, password: str) -> dict:
        updated = copy.deepcopy(client)
        for field in updated.get("fields", []):
            if field.get("name") == "password":
                field["value"] = password
        return updated


    def sync_arr_download_client(
        app: str, base: str, api_key: str, password: str, api_root: str
    ) -> list[str]:
        problems: list[str] = []
        _, clients = api("GET", base, api_key, f"{api_root}/downloadclient")
        if not isinstance(clients, list):
            return [f"{app}: unexpected downloadclient response"]
        qbit = find_qbit_clients(clients)
        if not qbit:
            return [f"{app}: no qBittorrent download client defined"]
        for client in qbit:
            cid = client["id"]
            status, _ = api(
                "POST",
                base,
                api_key,
                f"{api_root}/downloadclient/test",
                with_password(client, password),
            )
            if status == 200:
                print(f"{app}: qBittorrent client {cid} test OK")
                continue
            print(f"{app}: qBittorrent client {cid} test failed, updating")
            status, _ = api(
                "PUT",
                base,
                api_key,
                f"{api_root}/downloadclient/{cid}",
                with_password(client, password),
            )
            if status not in (200, 202):
                problems.append(f"{app}: PUT client {cid} -> HTTP{status}")
                continue
            status, _ = api(
                "POST",
                base,
                api_key,
                f"{api_root}/downloadclient/test",
                with_password(client, password),
            )
            if status == 200:
                print(f"{app}: qBittorrent client {cid} updated and OK")
            else:
                problems.append(
                    f"{app}: client {cid} still failing after update"
                )
        return problems


    def sync_seerr_server(
        seerr_base: str, seerr_key: str, svc: str, api_key: str
    ) -> list[str]:
        _, servers = api(
            "GET", seerr_base, seerr_key, f"/api/v1/settings/{svc}"
        )
        if not isinstance(servers, list) or not servers:
            return [f"seerr/{svc}: no server configured"]
        current = servers[0]
        if current.get("apiKey") == api_key:
            print(f"seerr/{svc}: apiKey in sync")
            return []
        updated = dict(current)
        updated["apiKey"] = api_key
        status, _ = api(
            "POST", seerr_base, seerr_key, f"/api/v1/settings/{svc}", updated
        )
        if status == 200:
            print(f"seerr/{svc}: apiKey updated")
            return []
        return [f"seerr/{svc}: POST -> HTTP{status}"]


    def sync_seerr_jellyfin(
        seerr_base: str, seerr_key: str, jellyfin_key: str
    ) -> list[str]:
        _, current = api(
            "GET", seerr_base, seerr_key, "/api/v1/settings/jellyfin"
        )
        if not isinstance(current, dict):
            return ["seerr/jellyfin: unexpected settings response"]
        if current.get("apiKey") == jellyfin_key:
            print("seerr/jellyfin: apiKey in sync")
            return []
        updated = {
            k: v
            for k, v in current.items()
            if k not in ("name", "serverId", "libraries")
        }
        updated["apiKey"] = jellyfin_key
        status, _ = api(
            "POST", seerr_base, seerr_key, "/api/v1/settings/jellyfin",
            updated,
        )
        if status == 200:
            print("seerr/jellyfin: apiKey updated")
            return []
        return [f"seerr/jellyfin: POST -> HTTP{status}"]


    def required_env(name: str) -> str:
        value = os.environ.get(name, "")
        if not value:
            raise ApiError(f"missing required env {name}")
        return value


    def run() -> int:
        problems: list[str] = []
        try:
            qbit_password = required_env("QBITTORRENT_PASSWORD")
            seerr_key = required_env("SEERR_API_KEY")
            jellyfin_key = required_env("JELLYFIN_SEERR_API_KEY")
            seerr_base = f"http://{SEERR_HOST}"
            for app in ARR_APPS:
                api_key = required_env(app["key_env"])
                base = f"http://{app['host']}"
                problems += sync_arr_download_client(
                    app["name"], base, api_key, qbit_password,
                    app["api_root"],
                )
            problems += sync_seerr_server(
                seerr_base, seerr_key, "sonarr", required_env("SONARR_API_KEY")
            )
            problems += sync_seerr_server(
                seerr_base, seerr_key, "radarr", required_env("RADARR_API_KEY")
            )
            problems += sync_seerr_jellyfin(seerr_base, seerr_key, jellyfin_key)
        except ApiError as e:
            problems.append(str(e))
        if problems:
            print("FAIL:")
            for p in problems:
                print(f"  - {p}")
            return 1
        print("OK: all credentials in sync")
        return 0


    if __name__ == "__main__":
        sys.exit(run())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-credential-sync
  namespace: media
spec:
  schedule: "*/15 * * * *"
  timeZone: America/Chicago
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/sync.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              envFrom:
                - secretRef:
                    name: media-app
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: arr-credential-sync
            - name: tmp
              emptyDir: {}
