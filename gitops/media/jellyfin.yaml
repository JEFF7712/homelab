# Jellyfin on Intel Quick Sync (homelab-04 UHD 770). Restored to 1
# replica with explicit requests/limits: the old AMD deployment had no
# limits and was implicated in the 2026-05-25 worker OOM, after which it
# was left scaled to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 303
          - 26
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - sh
            - -c
            - '[ "$(stat -c ''%u:%g'' /config)" = "1000:1000" ] || chown -R 1000:1000 /config'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: registry.rupan.dev/upstream/lscr.io/linuxserver/jellyfin@sha256:4f6d8dfc53ec5a1ddf7a90e4338972d57d7b0adff6dc88b53184f8285d0b594f  # yamllint disable-line rule:line-length
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.rupan.dev
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /data/tv
              subPath: tv
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          startupProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              # Intel UHD 770 via the intel-gpu-plugin DaemonSet. The plugin
              # injects the i915 device nodes, so no /dev/dri hostPath mount
              # (which the device cgroup blocks without privileged).
              gpu.intel.com/i915: "1"
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              # 2026-10-24: stacked ASS burn-in QSV transcodes (5x ~59 Mbps,
              # uncapped remote bitrate) OOMed the pod at 8Gi. 10Gi plus the
              # 25 Mbps remote cap leaves room for 2-3 concurrent transcodes
              # without pressuring homelab-04 (18 GB).
              memory: 10Gi
              gpu.intel.com/i915: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-nvme
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir:
            sizeLimit: 128Mi
        - name: dri
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    bgp-advertise: "true"
  annotations:
    io.cilium/lb-ipam-ips: 10.0.40.16
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  selector:
    app: jellyfin
  ports:
    - port: 80
      targetPort: 8096
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  timeZone: America/Chicago
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab-04
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/backup.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: jellyfin-backup
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin-config-nvme
            - name: backups
              persistentVolumeClaim:
                claimName: jellyfin-config
            - name: tmp
              emptyDir: {}
