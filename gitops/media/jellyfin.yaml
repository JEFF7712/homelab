# Jellyfin on Intel Quick Sync (homelab-04 UHD 770). Restored to 1
# replica with explicit requests/limits: the old AMD deployment had no
# limits and was implicated in the 2026-05-25 worker OOM, after which it
# was left scaled to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 303
          - 26
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - sh
            - -c
            - '[ "$(stat -c ''%u:%g'' /config)" = "1000:1000" ] || chown -R 1000:1000 /config'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: registry.rupan.dev/upstream/lscr.io/linuxserver/jellyfin@sha256:4f6d8dfc53ec5a1ddf7a90e4338972d57d7b0adff6dc88b53184f8285d0b594f  # yamllint disable-line rule:line-length
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.rupan.dev
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          startupProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              # Intel UHD 770 via the intel-gpu-plugin DaemonSet. The plugin
              # injects the i915 device nodes, so no /dev/dri hostPath mount
              # (which the device cgroup blocks without privileged).
              gpu.intel.com/i915: "1"
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              gpu.intel.com/i915: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-nvme
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir:
            sizeLimit: 128Mi
        - name: dri
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - port: 80
      targetPort: 8096
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-backup
  namespace: media
data:
  backup.py: |
    """Online SQLite backup, config/plugin archive, and retention for Jellyfin."""

    import datetime
    import glob
    import os
    import sqlite3
    import sys
    import tarfile

    CONFIG_ROOT = "/config"
    DB_PATH = "/config/data/data/jellyfin.db"
    BACKUP_DIR = "/backups/SQLiteBackups"
    CONFIG_BACKUP_DIR = "/backups/ConfigBackups"
    # Server settings, users, and installed plugins with their settings.
    # metadata/ and cache/ are regenerable and excluded.
    CONFIG_PATHS = ["*.xml", "users", "data/plugins"]
    RETENTION_DAYS = 7


    def prune(pattern: str, now: datetime.datetime) -> None:
        for f in glob.glob(pattern):
            try:
                mtime = datetime.datetime.fromtimestamp(os.path.getmtime(f))
                if (now - mtime).days > RETENTION_DAYS:
                    os.remove(f)
                    print(f"Pruned old backup: {f}")
            except OSError as e:
                print(f"Warning: failed to remove {f}: {e}", file=sys.stderr)


    def run_config_backup(today: str) -> None:
        members = []
        for pattern in CONFIG_PATHS:
            matches = sorted(glob.glob(os.path.join(CONFIG_ROOT, pattern)))
            if not matches:
                print(f"Error: no config files match {pattern}", file=sys.stderr)
                sys.exit(1)
            members.extend(matches)

        os.makedirs(CONFIG_BACKUP_DIR, exist_ok=True)
        archive = os.path.join(CONFIG_BACKUP_DIR, f"jellyfin-config-{today}.tar.gz")
        tmp_archive = archive + ".tmp"
        with tarfile.open(tmp_archive, "w:gz") as tar:
            for path in members:
                tar.add(path, arcname=os.path.relpath(path, CONFIG_ROOT))

        with tarfile.open(tmp_archive, "r:gz") as tar:
            names = tar.getnames()
        if "system.xml" not in names:
            raise RuntimeError("Config archive is missing system.xml")

        os.replace(tmp_archive, archive)
        print(f"Successfully saved {archive} ({len(names)} entries, {os.path.getsize(archive)} bytes)")


    def run_backup() -> None:
        if not os.path.isfile(DB_PATH):
            print(f"Error: Database not found at {DB_PATH}", file=sys.stderr)
            sys.exit(1)

        os.makedirs(BACKUP_DIR, exist_ok=True)
        today = datetime.datetime.now().strftime("%Y-%m-%d")
        backup_file = os.path.join(BACKUP_DIR, f"jellyfin-{today}.db")
        tmp_backup_file = backup_file + ".tmp"

        if os.path.exists(tmp_backup_file):
            os.remove(tmp_backup_file)

        print(f"Starting online backup of {DB_PATH} -> {backup_file}...")
        source = sqlite3.connect(f"file:{DB_PATH}?mode=ro", uri=True)
        dest = sqlite3.connect(tmp_backup_file)
        try:
            source.backup(dest)
        finally:
            dest.close()
            source.close()

        # Validate integrity of the newly created backup
        check = sqlite3.connect(tmp_backup_file)
        try:
            cursor = check.cursor()
            cursor.execute("PRAGMA integrity_check;")
            result = cursor.fetchone()
            if not result or result[0] != "ok":
                raise RuntimeError(f"Backup integrity check failed: {result}")
            print("Backup integrity verified: ok")
        finally:
            check.close()

        os.replace(tmp_backup_file, backup_file)
        print(f"Successfully saved {backup_file} ({os.path.getsize(backup_file)} bytes)")

        run_config_backup(today)

        now = datetime.datetime.now()
        prune(os.path.join(BACKUP_DIR, "jellyfin-*.db"), now)
        prune(os.path.join(CONFIG_BACKUP_DIR, "jellyfin-config-*.tar.gz"), now)


    if __name__ == "__main__":
        run_backup()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  timeZone: America/Chicago
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab-04
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/backup.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: jellyfin-backup
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin-config-nvme
            - name: backups
              persistentVolumeClaim:
                claimName: jellyfin-config
            - name: tmp
              emptyDir: {}
