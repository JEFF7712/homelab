---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spotify-sync
  namespace: media
spec:
  schedule: "17 * * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spotify-sync
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
              command: ["python3", "/app/sync.py"]
              args:
                - --music-dir
                - /music/music
                - --playlist-dir
                - /music/music/playlists
                - --http-timeout
                - "120"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: MUSIC_DIR
                  value: /music/music
                - name: PLAYLIST_DIR
                  value: /music/music/playlists
                - name: LIDARR_URL
                  value: http://lidarr
                - name: SPOTIFY_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: SPOTIFY_CLIENT_ID
                - name: SPOTIFY_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: SPOTIFY_CLIENT_SECRET
                - name: SPOTIFY_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: SPOTIFY_REFRESH_TOKEN
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-app
                      key: LIDARR_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: media
                  mountPath: /music
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
          volumes:
            - name: script
              configMap:
                name: spotify-sync
            - name: media
              persistentVolumeClaim:
                claimName: media-library
            - name: tmp
              emptyDir: {}
