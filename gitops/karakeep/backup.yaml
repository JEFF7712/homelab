apiVersion: batch/v1
kind: CronJob
metadata:
  name: karakeep-backup
  namespace: karakeep
spec:
  schedule: 15 1 * * *
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.rupan.dev/upstream/docker.io/library/python@sha256:e4bc83a3314d078d651f06c8440e9a03ba892ee2f6577437f174abd8731fb343  # yamllint disable-line rule:line-length
              command:
                - python
                - /scripts/backup.py
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: assets
                  mountPath: /assets
                  readOnly: true
                - name: dumps
                  mountPath: /dumps
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data
            - name: assets
              persistentVolumeClaim:
                claimName: assets
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
            - name: script
              configMap:
                name: karakeep-backup
            - name: tmp
              emptyDir: {}
          nodeSelector:
            kubernetes.io/hostname: homelab-03
