apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: karakeep
          image: registry.rupan.dev/upstream/ghcr.io/karakeep-app/karakeep@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d  # yamllint disable-line rule:line-length
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DATA_DIR
              value: /data
            - name: ASSETS_DIR
              value: /assets
            - name: NEXTAUTH_URL
              value: https://karakeep.rupan.dev
            - name: AUTH_TRUSTED_ORIGINS
              value: ''
            - name: DB_WAL_MODE
              value: 'true'
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://chrome:9222
            - name: DISABLE_SIGNUPS
              value: 'false'
            - name: DISABLE_NEW_RELEASE_CHECK
              value: 'true'
            - name: INFERENCE_ENABLE_AUTO_TAGGING
              value: 'false'
            - name: INFERENCE_ENABLE_AUTO_SUMMARIZATION
              value: 'false'
            - name: EMBEDDING_ENABLE_AUTO_INDEXING
              value: 'false'
            - name: LOG_LEVEL
              value: info
            - name: CRAWLER_NUM_WORKERS
              value: '1'
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: NEXTAUTH_SECRET
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: MEILI_MASTER_KEY
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: assets
              mountPath: /assets
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: assets
          persistentVolumeClaim:
            claimName: assets
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
      nodeSelector:
        kubernetes.io/hostname: homelab-03
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  selector:
    app: karakeep
  ports:
    - port: 80
      targetPort: 3000
