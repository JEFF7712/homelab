# Inventory-only upstream image declarations for observability Helm charts
# whose post-renderers pin mirrored digests. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# pinned by digest in the owning HelmRelease's postRenderers.
#
# This file is NOT listed in gitops/observability/kustomization.yaml: it is
# an inventory source only and must never be applied to the cluster.
#
# Chart upgrade flow: list the new chart's images here, import them, and only
# then bump the chart and its post-renderer digests together.
apiVersion: v1
kind: List
metadata:
  name: observability-registry-sources
items:
