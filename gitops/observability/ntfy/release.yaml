apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/binwiederhier/ntfy
            newName: registry.rupan.dev/upstream/docker.io/binwiederhier/ntfy  # yamllint disable-line rule:line-length
            digest: sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
  values:
    ntfy:
      baseUrl: https://ntfy.rupan.dev
      authDefaultAccess: deny-all
      extraEnv:
        - name: NTFY_AUTH_USERS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-users
        - name: NTFY_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-tokens
        - name: NTFY_AUTH_ACCESS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-access
    podAnnotations:
      migration.rupan.dev/ntfy-auth-format: v2
    persistence:
      enabled: true
      existingClaim: ntfy-ntfy-data
      size: 2Gi
      storageClass: nfs-cluster
    gateway:
      enabled: false
      hostnames:
        - ntfy.rupan.dev
