apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: 1.8.1
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/binwiederhier/ntfy
            newName: registry.rupan.dev/upstream/docker.io/binwiederhier/ntfy  # yamllint disable-line rule:line-length
            digest: sha256:038da2be5e668fee6d36a62884eea48975e1b71c29a56964e5298c1b9165a573
  values:
    ntfy:
      baseUrl: https://ntfy.rupan.dev
      authDefaultAccess: deny-all
      extraEnv:
        - name: NTFY_AUTH_USERS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-users
        - name: NTFY_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-tokens
        - name: NTFY_AUTH_ACCESS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-access
      extraConfig: |
        template-dir: /etc/ntfy-templates
    extraVolumes:
      - name: templates
        configMap:
          name: ntfy-templates
    extraVolumeMounts:
      - name: templates
        mountPath: /etc/ntfy-templates
        readOnly: true
    podAnnotations:
      migration.rupan.dev/ntfy-auth-format: v2
    persistence:
      enabled: true
      existingClaim: ntfy-local
    gateway:
      enabled: false
      hostnames:
        - ntfy.rupan.dev
