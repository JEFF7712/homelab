apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/binwiederhier/ntfy
            newName: registry.rupan.dev/upstream/docker.io/binwiederhier/ntfy  # yamllint disable-line rule:line-length
            digest: sha256:59250e1d8be2ee2186c4560322f625faef22ace380331f05b63f8842dbd62602
  values:
    ntfy:
      baseUrl: https://ntfy.rupan.dev
      authDefaultAccess: deny-all
      extraEnv:
        - name: NTFY_AUTH_USERS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-users
        - name: NTFY_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-tokens
        - name: NTFY_AUTH_ACCESS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-access
    podAnnotations:
      migration.rupan.dev/ntfy-auth-format: v2
    persistence:
      enabled: true
      existingClaim: ntfy-ntfy-data
      size: 2Gi
      storageClass: nfs-cluster
    gateway:
      enabled: false
      hostnames:
        - ntfy.rupan.dev
