apiVersion: v1
kind: Service
metadata:
  name: grafana-lb
  namespace: observability
  annotations:
    io.cilium/lb-ipam-ips: 10.0.40.12
  labels:
    bgp-advertise: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
