apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: observability
data:
  rules.yaml: |
    groups:
      - name: systemd-journal-alerts
        rules:
          - alert: HostKernelOOMKilled
            expr: |
              count_over_time({component="system-journal"} |= "Out of memory: Kill process" [5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Kernel Out of Memory (OOM) killer invoked"
              description: "A process was terminated by the OOM killer on a host system."

          - alert: HostStorageIoError
            expr: |
              count_over_time(
                {component="system-journal"}
                |~ "(?i)(I/O error|EXT4-fs error|BTRFS error|blk_update_request: I/O error)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Host storage I/O error detected in system journal"
              description: "Hardware I/O error or filesystem corruption logged in system journal."

          - alert: ZfsPoolIoError
            expr: |
              count_over_time(
                {component="system-journal"}
                |~ "(?i)(ZFS: checksum error|ZFS: error reading|ZFS: pool .* degraded)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "ZFS I/O or checksum error detected"
              description: "A ZFS filesystem checksum error or degraded pool event was logged in system journal."

      - name: container-log-alerts
        rules:
          - alert: ContainerFatalPanic
            expr: |
              count_over_time(
                {namespace=~"immich|home-assistant|obsidian"}
                |~ "(?i)(panic: runtime error|fatal error: runtime: out of memory)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Critical application panic detected in container logs"
              description: "A fatal runtime panic was logged in namespace {{ $labels.namespace }}."

          - alert: MusicAssistantHaLinkDown
            expr: |
              count_over_time(
                {namespace="music-assistant"}
                |~ "(?i)(Please call connect first|HomeAssistantProvider._hass_listener)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Music Assistant lost its Home Assistant link"
              description: "MA lost its HA link; restart the music-assistant Deployment."

      - name: host-security-alerts
        rules:
          - alert: HostSSHAuthFailed
            expr: |
              count_over_time(
                {component="system-journal"}
                |~ "(?i)(Failed password|Failed publickey|invalid user|\\[preauth\\])"
                [5m]
              ) > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Repeated SSH authentication failures detected on host"
              description: "More than 5 SSH auth failures observed on {{ $labels.hostname }} in 5m."

          - alert: HostSudoAuthFailed
            expr: |
              count_over_time(
                {component="system-journal"}
                |~ "(?i)(incorrect password attempt|authentication failure.*sudo)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Failed sudo authentication attempt detected"
              description: "A failed sudo authentication was logged in system journal on {{ $labels.hostname }}."

          - alert: HostSudoInteractiveRoot
            expr: |
              count_over_time(
                {component="system-journal"}
                |~ "(?i)sudo:.*COMMAND=(/run/current-system/sw/bin/(su|bash|zsh)|/bin/sh)"
                [5m]
              ) > 0
            for: 0m
            labels:
              severity: info
            annotations:
              summary: "Interactive root shell spawned via sudo"
              description: "An interactive root shell was spawned via sudo on {{ $labels.hostname }}."
