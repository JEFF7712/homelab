# Ingress to the Loki gateway. In-cluster, only the observability namespace
# uses it (loki-canary pushes and queries through it; Grafana and Alloy talk
# to the loki service directly). From outside the cluster, only the two
# journal shippers in flake/modules/host-log-shipping.nix; the gateway's
# nginx (serverSnippet in release.yaml) limits them to log pushes. Anything
# else, including other LAN hosts and k3s node addresses, is dropped. An L7
# rule here is deliberately absent: with it, Cilium's proxy took the
# LoadBalancer SYNs and never answered, so no push connected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-gateway-ingress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/instance: loki
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromCIDR:
        - 10.0.30.20/32  # nas-01
        - 10.0.30.10/32  # adguard-netbird-01
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
