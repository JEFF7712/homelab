apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/grafana/loki
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki  # yamllint disable-line rule:line-length
            digest: sha256:3c8fd3570dd9219951a60d3f919c7f31923d10baee578b77bc26c4a0b32d092d
          - name: docker.io/grafana/loki-canary
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki-canary  # yamllint disable-line rule:line-length
            digest: sha256:0dac7d5cb383adb8d3723676a70ed0c65b582e636846f4ce48703556dd509ad1
          - name: docker.io/grafana/loki-helm-test
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki-helm-test  # yamllint disable-line rule:line-length
            digest: sha256:2ed6447bbdbcd23019c3fdb02bce6db3fbef296d5a8f77a68d3dbc386bfa43fb
          - name: docker.io/kiwigrid/k8s-sidecar
            newName: registry.rupan.dev/upstream/docker.io/kiwigrid/k8s-sidecar  # yamllint disable-line rule:line-length
            digest: sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df
          - name: docker.io/nginxinc/nginx-unprivileged
            newName: registry.rupan.dev/upstream/docker.io/nginxinc/nginx-unprivileged  # yamllint disable-line rule:line-length
            digest: sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          - name: memcached
            newName: registry.rupan.dev/upstream/docker.io/library/memcached  # yamllint disable-line rule:line-length
            digest: sha256:c8503d4491edd3110cc07d0465089d3a41cf1daf8645e71149e39a51835e92cd
          - name: prom/memcached-exporter
            newName: registry.rupan.dev/upstream/docker.io/prom/memcached-exporter  # yamllint disable-line rule:line-length
            digest: sha256:b6763ecb3c47f2408e0398518851b7f8c5fc46232b2649f8c78a321130c54266
  values:
    deploymentMode: SingleBinary
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      limits_config:
        # Alloy replays pod logs after restarts; a single stale entry makes
        # Loki reject the whole batch, which silently stops all ingestion.
        reject_old_samples: false
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      rulerConfig:
        enable_api: true
        enable_alertmanager_v2: true
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
        storage:
          type: local
          local:
            directory: /var/loki/rules
        rule_path: /tmp/scratch
        ring:
          kvstore:
            store: inmemory
    singleBinary:
      replicas: 1
      extraVolumes:
        - name: loki-rules
          configMap:
            name: loki-alerting-rules
      extraVolumeMounts:
        - name: loki-rules
          mountPath: /var/loki/rules/fake
      persistence:
        storageClass: nfs-cluster
        size: 20Gi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
