apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.7.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/grafana/loki
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki  # yamllint disable-line rule:line-length
            digest: sha256:3c8fd3570dd9219951a60d3f919c7f31923d10baee578b77bc26c4a0b32d092d
          - name: docker.io/grafana/loki-canary
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki-canary  # yamllint disable-line rule:line-length
            digest: sha256:4f38ce9f80d0fcc2cbc2d823b14b434e46f58a4780e9500da5c5d37b7cb31621
          - name: docker.io/grafana/loki-helm-test
            newName: registry.rupan.dev/upstream/docker.io/grafana/loki-helm-test  # yamllint disable-line rule:line-length
            digest: sha256:2ed6447bbdbcd23019c3fdb02bce6db3fbef296d5a8f77a68d3dbc386bfa43fb
          - name: docker.io/kiwigrid/k8s-sidecar
            newName: registry.rupan.dev/upstream/docker.io/kiwigrid/k8s-sidecar  # yamllint disable-line rule:line-length
            digest: sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df
          - name: docker.io/nginxinc/nginx-unprivileged
            newName: registry.rupan.dev/upstream/docker.io/nginxinc/nginx-unprivileged  # yamllint disable-line rule:line-length
            digest: sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          - name: memcached
            newName: registry.rupan.dev/upstream/docker.io/library/memcached  # yamllint disable-line rule:line-length
            digest: sha256:c8503d4491edd3110cc07d0465089d3a41cf1daf8645e71149e39a51835e92cd
          - name: prom/memcached-exporter
            newName: registry.rupan.dev/upstream/docker.io/prom/memcached-exporter  # yamllint disable-line rule:line-length
            digest: sha256:b6763ecb3c47f2408e0398518851b7f8c5fc46232b2649f8c78a321130c54266
  values:
    deploymentMode: SingleBinary
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      limits_config:
        # Alloy replays pod logs after restarts; a single stale entry makes
        # Loki reject the whole batch, which silently stops all ingestion.
        reject_old_samples: false
        # About 110 MiB/day on disk (6.6 GiB for 60 days measured on the old
        # NFS store), so 30 days stays well inside the 20Gi local PV.
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      rulerConfig:
        enable_api: true
        enable_alertmanager_v2: true
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
        storage:
          type: local
          local:
            directory: /var/loki/rules
        rule_path: /tmp/scratch
        ring:
          kvstore:
            store: inmemory
    gateway:
      # loki-push (push-service.yaml) uses externalTrafficPolicy Local, and
      # only control-plane nodes peer BGP, so the VIP is advertised only
      # while the gateway runs on one of them. One replica per control-plane
      # node (the chart's anti-affinity spreads them): nas-01 and
      # adguard-netbird-01 route the VIP straight to those three nodes
      # (flake/modules/host-log-shipping.nix), and each needs a local backend.
      replicas: 3
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      nginxConfig:
        # The gateway also proxies Loki's delete, flush and rules APIs. The
        # hosts admitted by push-policy.yaml may only push logs; every
        # other request from them gets 403. Pods (10.42.0.0/16) are not
        # matched. This is here rather than as a Cilium HTTP rule because
        # Cilium's L7 proxy never answered the LoadBalancer traffic.
        serverSnippet: |
          set $loki_push_request "$remote_addr $request_method $uri";
          if ($loki_push_request ~ "^10\.0\.(30\.(10|20)|20\.50|10\.50) (?!POST /loki/api/v1/push$)") {
            return 403;
          }
    singleBinary:
      replicas: 1
      # The store is the static local claim in local-storage.yaml (homelab-05
      # NVMe), not a claim template: the chart names its template "storage",
      # which would rebind the retained NFS claim storage-loki-0.
      persistence:
        enabled: false
      extraVolumes:
        - name: storage
          persistentVolumeClaim:
            claimName: loki-local
        - name: loki-rules
          configMap:
            name: loki-alerting-rules
      extraVolumeMounts:
        - name: storage
          mountPath: /var/loki
        - name: loki-rules
          mountPath: /var/loki/rules/fake
      # Refuse to start on an empty store before the cold copy from the NFS
      # claim has verified and written its marker.
      initContainers:
        - name: require-store-migration
          image: registry.rupan.dev/upstream/docker.io/alpine/k8s@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042  # yamllint disable-line rule:line-length
          command: [/bin/sh, -ec, 'test -f /var/loki/.migration-complete']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: storage
              mountPath: /var/loki
              readOnly: true
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
