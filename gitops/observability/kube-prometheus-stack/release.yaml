apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.4.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/grafana/grafana
            newName: registry.rupan.dev/upstream/docker.io/grafana/grafana  # yamllint disable-line rule:line-length
            digest: sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
          - name: ghcr.io/jkroepke/kube-webhook-certgen
            newName: registry.rupan.dev/upstream/ghcr.io/jkroepke/kube-webhook-certgen  # yamllint disable-line rule:line-length
            digest: sha256:8ce13c365c8e9ced0aad5ef350a53c50b7ca5817f99d856b9eec895db1056728
          - name: quay.io/kiwigrid/k8s-sidecar
            newName: registry.rupan.dev/upstream/quay.io/kiwigrid/k8s-sidecar  # yamllint disable-line rule:line-length
            digest: sha256:694950d736c8b532eba4006527ccbdac98fefc9f30b3346ba2de50b6cad91c94
          - name: quay.io/prometheus-operator/prometheus-config-reloader
            newName: registry.rupan.dev/upstream/quay.io/prometheus-operator/prometheus-config-reloader  # yamllint disable-line rule:line-length
            digest: sha256:142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7
          - name: quay.io/prometheus-operator/prometheus-operator
            newName: registry.rupan.dev/upstream/quay.io/prometheus-operator/prometheus-operator  # yamllint disable-line rule:line-length
            digest: sha256:cf153f64d6c38113fceb2cda7642365ea887f71edd7888f054e43e54cf177e55
          - name: quay.io/prometheus/alertmanager
            newName: registry.rupan.dev/upstream/quay.io/prometheus/alertmanager  # yamllint disable-line rule:line-length
            digest: sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
          - name: quay.io/prometheus/node-exporter
            newName: registry.rupan.dev/upstream/quay.io/prometheus/node-exporter  # yamllint disable-line rule:line-length
            digest: sha256:6112664fd761bb964d8a2d3d0119d6c8402618a89edbb3a43c8f7b4090fb53c9
          - name: quay.io/prometheus/prometheus
            newName: registry.rupan.dev/upstream/quay.io/prometheus/prometheus  # yamllint disable-line rule:line-length
            digest: sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2
          - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
            newName: registry.rupan.dev/upstream/registry.k8s.io/kube-state-metrics/kube-state-metrics  # yamllint disable-line rule:line-length
            digest: sha256:6b2f0b6f2f86ac5b1aa883a033a8dd55bb96c16d191ec973393bdaadaddac914
  values:
    prometheus:
      prometheusSpec:
        priorityClassName: homelab-critical
        image:
          registry: registry.rupan.dev
          repository: upstream/quay.io/prometheus/prometheus
          tag: v3.12.0-distroless
          sha: f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2
        replicas: 1
        retention: 7d
        retentionSize: 9GB
        additionalScrapeConfigs:
          - job_name: nas-01-node
            static_configs:
              - targets:
                  - 10.0.30.20:9100
                labels:
                  host: nas-01
          - job_name: nas-01-smartctl
            static_configs:
              - targets:
                  - 10.0.30.20:9633
                labels:
                  host: nas-01
          - job_name: adguard-netbird-01-node
            static_configs:
              - targets:
                  - 10.0.30.10:9100
                labels:
                  host: adguard-netbird-01
          - job_name: homelab-04-node
            static_configs:
              - targets:
                  - 10.0.30.14:9101
                labels:
                  host: homelab-04
          - job_name: nvidia-gpu
            static_configs:
              - targets:
                  - 10.0.30.14:9835
                labels:
                  node: homelab-04
                  gpu_model: "NVIDIA T1000"
              - targets:
                  - 10.0.30.15:9835
                labels:
                  node: homelab-05
                  gpu_model: "NVIDIA T600"
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-cluster
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        priorityClassName: homelab-critical
        image:
          registry: registry.rupan.dev
          repository: upstream/quay.io/prometheus/alertmanager
          tag: v0.32.1
          sha: 51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
        replicas: 1
        configSecret: alertmanager-kube-prometheus-stack-alertmanager
        secrets:
          - alertmanager-ntfy-token
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: ntfy-default
          group_by:
            - alertname
            - namespace
            - host
            - node
            - pool
            - device
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - alertname = "InfoInhibitor"
              receiver: "null"
            - matchers:
                - severity = "critical"
              receiver: ntfy-critical
              group_wait: 10s
              group_interval: 2m
              repeat_interval: 1h
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal:
              - alertname
              - namespace
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal:
              - alertname
              - instance
          - source_matchers:
              - alertname = "NodeRootFilesystemCriticallyLowSpace"
            target_matchers:
              - alertname = "NodeRootFilesystemLowSpace"
            equal:
              - instance
          - source_matchers:
              - alertname = "MoneroPersistSpaceCritical"
            target_matchers:
              - alertname = "MoneroPersistSpaceWarning"
            equal:
              - instance
              - mountpoint
          - source_matchers:
              - alertname = "ZfsPoolCapacityCritical"
            target_matchers:
              - alertname = "ZfsPoolCapacityWarning"
            equal:
              - pool
          - source_matchers:
              - alertname = "SmartDeviceTemperatureCritical"
            target_matchers:
              - alertname = "SmartDeviceTemperatureHigh"
            equal:
              - device
          - source_matchers:
              - alertname = "AdguardNetbirdApplianceDown"
            target_matchers:
              - alertname = "ApplianceServiceFailed"
            equal:
              - host
          - source_matchers:
              - alertname =~ "NodeNotReady|KubeNodeNotReady"
            target_matchers:
              - alertname =~ "KubePodCrashLooping|KubePodStuckPending"
            equal:
              - node
        receivers:
          - name: ntfy-critical
            webhook_configs:
              # yamllint disable-line rule:line-length
              - url: http://ntfy-ntfy.observability.svc.cluster.local/homelab-alerts?template=alertmanager&priority=urgent&tags=rotating_light,fire
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy-token/token
          - name: ntfy-default
            webhook_configs:
              # yamllint disable-line rule:line-length
              - url: http://ntfy-ntfy.observability.svc.cluster.local/homelab-alerts?template=alertmanager&priority=default&tags=warning
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy-token/token
          - name: "null"
    grafana:
      priorityClassName: homelab-critical
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      admin:
        existingSecret: grafana-admin-creds
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        auth.anonymous:
          enabled: false
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
    prometheusOperator:
      prometheusConfigReloader:
        image:
          registry: registry.rupan.dev
          repository: upstream/quay.io/prometheus-operator/prometheus-config-reloader
          tag: v0.94.0
          sha: 142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7
