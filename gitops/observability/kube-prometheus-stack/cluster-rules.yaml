apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-health
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cluster.rules
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been in a non-ready state for more than 5 minutes."

        - alert: NodeHighCpuUsage
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU utilization is above 90%"
            description: "Node {{ $labels.instance }} has had sustained CPU usage above 90% for 15 minutes."

        - alert: NodeHighMemoryUsage
          expr: |
            (
              ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
                / node_memory_MemTotal_bytes) * 100 > 90
              unless on(instance) node_zfs_arc_size
            )
            or
            (
              ((node_memory_MemTotal_bytes - (node_memory_MemAvailable_bytes + node_zfs_arc_size))
                / node_memory_MemTotal_bytes) * 100 > 90
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is above 90%"
            description: "Node {{ $labels.instance }} has less than 10% memory available for 15 minutes."

        - alert: NodeRootFilesystemLowSpace
          expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node root filesystem is below 15% free"
            description: "Root filesystem on {{ $labels.instance }} has less than 15% disk space remaining."

        - alert: NodeRootFilesystemCriticallyLowSpace
          expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node root filesystem is below 5% free"
            description: "Root filesystem on {{ $labels.instance }} has less than 5% disk space remaining."

        - alert: KubeNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is under disk pressure"
            description: >-
              Kubelet on {{ $labels.node }} reports DiskPressure: ephemeral-storage
              is exhausted and pinned pods will be evicted. Uses API-server state so it
              still fires when node-exporter itself has been evicted (2026-10-09 homelab-04).

        - alert: KubePodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash looping"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted frequently over the last 15 minutes.

        - alert: KubePodStuckPending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is stuck pending"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Pending state for > 15m."

        - alert: KubeDeploymentReplicasMismatch
          expr: kube_deployment_status_replicas_available != kube_deployment_spec_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has unavailable replicas"
            description: >-
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has not had all desired replicas ready for 15 minutes.

        - alert: KubePersistentVolumeFillingUp
          expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is below 15% free"
            description: >-
              Persistent volume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}
              has less than 15% space remaining.

        - alert: AdguardNetbirdApplianceDown
          expr: up{job="adguard-netbird-01-node"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "adguard-netbird-01 appliance is down"
            description: "Prometheus has been unable to scrape adguard-netbird-01:9100 for 5 minutes."

        - alert: ApplianceServiceFailed
          expr: |
            node_systemd_unit_state{
              job="adguard-netbird-01-node",
              name=~"(adguardhome|netbird|roku-bridge|mosquitto)\\.service",
              state="active"
            } != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Appliance service {{ $labels.name }} failed or inactive"
            description: "Service {{ $labels.name }} on adguard-netbird-01 is not active."

        - alert: ZfsPoolDegraded
          expr: node_zfs_zpool_state{job="nas-01-node",state!="online"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is degraded or faulted"
            description: "ZFS pool {{ $labels.zpool }} on nas-01 state is {{ $labels.state }}."

        - alert: ZfsPoolSpaceWarning
          expr: |
            (
              node_zfs_zpool_alloc_bytes{job="nas-01-node"}
              /
              (node_zfs_zpool_alloc_bytes{job="nas-01-node"} + node_zfs_zpool_free_bytes{job="nas-01-node"})
            ) * 100 > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is above 80% capacity"
            description: "ZFS pool {{ $labels.zpool }} on nas-01 has exceeded 80% allocated capacity."

        - alert: ZfsPoolSpaceCritical
          expr: |
            (
              node_zfs_zpool_alloc_bytes{job="nas-01-node"}
              /
              (node_zfs_zpool_alloc_bytes{job="nas-01-node"} + node_zfs_zpool_free_bytes{job="nas-01-node"})
            ) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is above 90% capacity"
            description: "ZFS pool {{ $labels.zpool }} on nas-01 has exceeded 90% allocated capacity."

        - alert: SmartDeviceHealthFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART health test failing on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} on {{ $labels.host }} reported failing SMART status."

        - alert: SmartDeviceTemperatureHigh
          expr: smartctl_device_temperature > 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Drive temperature is high on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} temperature is {{ $value }}C on {{ $labels.host }}."

        - alert: SmartDeviceTemperatureCritical
          expr: smartctl_device_temperature > 70
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Drive temperature critically high on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} temperature has reached {{ $value }}C on {{ $labels.host }}."

        - alert: SmartNvmeCriticalWarning
          expr: smartctl_device_critical_warning > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe critical warning on {{ $labels.device }}"
            description: "NVMe drive {{ $labels.device }} reported critical warning on {{ $labels.host }}."

        - alert: SmartNvmeAvailableSpareLow
          expr: smartctl_device_available_spare < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NVMe available spare below 15% on {{ $labels.device }}"
            description: "NVMe drive {{ $labels.device }} available spare is {{ $value }}% on {{ $labels.host }}."
