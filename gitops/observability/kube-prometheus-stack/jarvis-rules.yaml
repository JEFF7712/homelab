apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jarvis-voice
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jarvis.voice
      rules:
        - alert: JarvisExporterDisconnected
          expr: jarvis_exporter_ha_connected == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Jarvis exporter is disconnected from Home Assistant
            description: The exporter has not held an authenticated HA websocket for 5 minutes.
        - alert: JarvisExporterSubscriptionStale
          expr: >-
            jarvis_exporter_last_event_age_seconds > 120 or
            jarvis_exporter_subscription_state{state!="subscribed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Jarvis exporter subscription is stale
            description: Jarvis telemetry is not receiving a healthy subscribed event stream.
        - alert: JarvisExporterMissing
          expr: absent(jarvis_exporter_ha_connected)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Jarvis exporter metrics are absent
            description: The exporter pod or ServiceMonitor may be gone; no scrape at all.
        - alert: JarvisExporterAuthFailures
          expr: increase(jarvis_exporter_auth_failures_total[15m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Jarvis exporter authentication failures detected
            description: HA token may be revoked or rotated incorrectly.
        - alert: JarvisZeroTurns
          expr: sum(increase(jarvis_requests_total[1h])) == 0 and jarvis_exporter_ha_connected == 1
          for: 1h
          labels:
            severity: info
          annotations:
            summary: No Jarvis voice turns in the last hour
            description: Satellite may be unhealthy or house is quiet; verify live state.
        - alert: JarvisSlowTurnRatio
          expr: >-
            sum(increase(jarvis_turn_speed_class_total{class="slow"}[1h]))
            / sum(increase(jarvis_turn_speed_class_total[1h]))
            > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: High ratio of slow Jarvis turns
            description: More than 50% of turns exceed the fast threshold; check LLM/TTS latency.
        - alert: JarvisVoiceScrapeDown
          expr: >-
            up{job=~"wyoming-gateway-metrics|wyoming-tts-chatterbox|wyoming-stt-nemotron-metrics|jarvis-exporter|local-decision"}
            == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A Jarvis voice metrics target is not scraping
            description: >-
              Prometheus cannot scrape {{ $labels.job }};
              check the pod, ServiceMonitor, and (for Chatterbox) the observability ingress policy.
        - alert: JarvisSttAllBackendsDown
          expr: sum(jarvis_gateway_backend_available{mode="stt"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: All STT backends report unavailable
            description: >-
              The STT gateway has no healthy backend. Requires the gateway availability accounting
              from the gateway repair; pending until that series
              is driven by protocol outcomes.
        - alert: JarvisTtsAllBackendsDown
          expr: sum(jarvis_gateway_backend_available{mode="tts"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: All TTS backends report unavailable
            description: >-
              The TTS gateway has no healthy backend. Requires the gateway availability accounting
              from the gateway repair; pending until that series
              is driven by protocol outcomes.
        - alert: JarvisSttBackendDegraded
          expr: >-
            count(jarvis_gateway_backend_available{mode="stt"}) > 0
            and sum(jarvis_gateway_backend_available{mode="stt"})
              < count(jarvis_gateway_backend_available{mode="stt"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: An STT backend is unavailable
            description: >-
              At least one STT backend reports unavailable while others still serve;
              check the failing backend before the next one degrades.
        - alert: JarvisTtsBackendDegraded
          expr: >-
            count(jarvis_gateway_backend_available{mode="tts"}) > 0
            and sum(jarvis_gateway_backend_available{mode="tts"})
              < count(jarvis_gateway_backend_available{mode="tts"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A TTS backend is unavailable
            description: >-
              At least one TTS backend reports unavailable while others still serve;
              fallback TTS voice mapping must already be repaired for this to help.
        - alert: JarvisFailedTurns
          expr: sum(increase(jarvis_failed_requests_total[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Jarvis turns are stalling after processing started
            description: >-
              Turns abandoned after processing without ever responding;
              check the stage label, then gateway/STT/TTS health.
        - alert: JarvisAbortedSpike
          expr: sum(increase(jarvis_aborted_requests_total[15m])) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Spike in turns cancelled during listening
            description: >-
              Many turns cancelled before processing; check wake behavior
              , endpointing, and False activations. Threshold is tunable.
        - alert: JarvisUnmatchedServiceCalls
          expr: sum(increase(jarvis_unmatched_service_calls_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Unattributed service calls during Jarvis turns
            description: >-
              Service calls fired mid-turn under a different HA context; they are not Jarvis tool calls.
              Identify the automation before trusting tool-call counts.
        - alert: JarvisTtsSynthesisFailures
          expr: sum(increase(jarvis_tts_synthesis_failures_total[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: TTS synthesis failures detected
            description: >-
              Gateway or Chatterbox synthesis failures; requires the TTS failure seri
              es from the gateway/Chatterbox repairs and the Piper voice-mapping fix.
