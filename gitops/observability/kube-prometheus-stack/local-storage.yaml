apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-nvme-05
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    homelab.rupan.dev/storage: prometheus-local
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  local:
    path: /persist/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [homelab-05]
