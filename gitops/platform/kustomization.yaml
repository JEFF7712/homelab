apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secrets/repository.yaml
  - external-secrets/release.yaml
  - reloader/repository.yaml
  - reloader/release.yaml
  - nvidia-device-plugin/runtimeclass.yaml
  - nvidia-device-plugin/daemonset.yaml
  - priorityclass.yaml
  - coredns-pdb.yaml
  - cnpg/repository.yaml
  - cnpg/release.yaml
  - storage-class.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: coredns
        namespace: kube-system
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: coredns
      namespace: kube-system
