# Intel GPU device plugin (i915) for homelab-04 UHD Graphics 770.
# Advertises gpu.intel.com/i915 so Jellyfin QSV gets scoped /dev/dri access
# without privileged. Pinned to homelab-04: homelab-05 also has an Intel iGPU
# (UHD 750) but no consumer, so it is left out until one exists.
# Upstream: intel/intel-gpu-plugin:0.37.1, adapted with kube-system namespace,
# system-node-critical priority, and an explicit homelab-04 nodeSelector
# (upstream selects all amd64 nodes; this cluster has no NFD labels).
# A registration-watchdog sidecar restarts the plugin when its device-plugin
# socket disappears. Kubelet deletes that socket on restart, and the plugin's
# fsnotify re-registration is unreliable, which silently drops i915 from the
# node and stops Quick Sync workloads (e.g. Jellyfin) from scheduling. The
# sidecar shares the pod PID namespace and signals the plugin, which kubelet
# then restarts and re-registers.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      containers:
        - name: intel-gpu-plugin
          image: registry.rupan.dev/upstream/docker.io/intel/intel-gpu-plugin@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33  # yamllint disable-line rule:line-length
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 40m
              memory: 45Mi
            limits:
              cpu: 100m
              memory: 115Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
        - name: registration-watchdog
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              sock=/var/lib/kubelet/device-plugins/gpu.intel.com-i915.sock
              while [ ! -S "$sock" ]; do sleep 2; done
              echo "armed; watching $sock"
              while true; do
                while [ -S "$sock" ]; do sleep 5; done
                echo "registration socket removed; restarting intel-gpu-plugin"
                pkill -TERM -f '^/usr/local/bin/intel_gpu_device_plugin$' || true
                while [ ! -S "$sock" ]; do sleep 2; done
                echo "re-armed; watching $sock"
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
              readOnly: true
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
