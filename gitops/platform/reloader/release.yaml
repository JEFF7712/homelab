apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.20
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/stakater/reloader
            newName: registry.rupan.dev/upstream/ghcr.io/stakater/reloader  # yamllint disable-line rule:line-length
            digest: sha256:3ab43d3eb96c59798644bf826b0444a846c0197d22ab4b6c101c4da3e1d6ef23
  values:
    fullnameOverride: reloader
    reloader:
      watchGlobally: true
