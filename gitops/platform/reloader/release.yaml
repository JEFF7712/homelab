apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/stakater/reloader
            newName: registry.rupan.dev/upstream/ghcr.io/stakater/reloader  # yamllint disable-line rule:line-length
            digest: sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
  values:
    fullnameOverride: reloader
    reloader:
      watchGlobally: true
