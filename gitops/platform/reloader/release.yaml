apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.21
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/stakater/reloader
            newName: registry.rupan.dev/upstream/ghcr.io/stakater/reloader  # yamllint disable-line rule:line-length
            digest: sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
  values:
    fullnameOverride: reloader
    reloader:
      watchGlobally: true
