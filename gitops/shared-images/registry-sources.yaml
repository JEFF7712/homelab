# Inventory-only upstream image declarations for images whose consumers span
# several gitops areas. Renovate tracks these tagged references; the workloads
# pin the mirrored digest. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# referenced by digest in the owning manifest.
#
# No Flux Kustomization references this directory: it is an inventory
# source only and must never be applied to the cluster.
#
# Update flow: change the digest below, import it, then update the consumer
# manifest digest, so a pod never pulls an image the mirror lacks.
apiVersion: v1
kind: List
metadata:
  name: shared-images-registry-sources
items:
  # busybox init containers (home-assistant, media, obsidian, platform)
  - image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
  # Python job runtime (automation, media, observability, voice, websites, CI)
  - image: docker.io/library/python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
  # PostgreSQL 17 (home-assistant/postgres.yaml and its dumps in backups)
  - image: docker.io/library/postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be  # yamllint disable-line rule:line-length
  # unprivileged nginx (websites/nix, CI)
  - image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6  # yamllint disable-line rule:line-length
  # Nix (config/ci/applications.json, services/voice-supply)
  - image: docker.io/nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  # Intel GPU device plugin (platform/intel-gpu-plugin)
  - image: docker.io/intel/intel-gpu-plugin:0.37.1@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33  # yamllint disable-line rule:line-length
  # NVIDIA device plugin (platform/nvidia-device-plugin)
  - image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0-ubi9@sha256:7089559ce6153018806857f5049085bae15b3bf6f1c8bd19d8b12f707d087dea  # yamllint disable-line rule:line-length
