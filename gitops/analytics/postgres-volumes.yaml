apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: umami-postgres-nvme-01
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  claimRef:
    namespace: analytics
    name: umami-cluster-1
  local:
    path: /persist/postgres/cnpg/umami-postgres-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab-01
