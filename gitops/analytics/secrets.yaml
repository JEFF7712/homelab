# Database credentials come from the CloudNativePG-generated umami-cluster-app
# Secret. APP_SECRET is generated in-cluster once and never rotated, because
# rotating it signs every dashboard session out.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: umami-app-secret
  namespace: analytics
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-app-secret
  namespace: analytics
spec:
  refreshPolicy: CreatedOnce
  target:
    name: umami-app-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        APP_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: umami-app-secret
---
# Lets the shared ESO reader identity copy only the generated database
# credentials into the backups namespace for umami-db-dump.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-umami-db-reader
  namespace: analytics
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [umami-cluster-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-umami-db-reader
  namespace: analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-umami-db-reader
subjects:
  - kind: ServiceAccount
    name: eso-local-reader
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: analytics-db
spec:
  conditions:
    - namespaces:
        - backups
  provider:
    kubernetes:
      remoteNamespace: analytics
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: eso-local-reader
          namespace: external-secrets
