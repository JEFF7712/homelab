# Inventory-only upstream image declarations for gitops/analytics consumers.
# Scanned by `python -m scripts.registry inventory` (item "image:" fields),
# imported to registry.rupan.dev/upstream/<host>/<path> by the registry CI
# lane, then referenced by digest in the owning manifest.
#
# This file is NOT listed in gitops/analytics/kustomization.yaml: it is an
# inventory source only and must never be applied to the cluster.
apiVersion: v1
kind: List
metadata:
  name: analytics-registry-sources
items:
  - image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc  # yamllint disable-line rule:line-length
