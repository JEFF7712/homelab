# The database is the CloudNativePG cluster (postgres-cluster.yaml). This
# Service keeps the name Immich and the nightly dump connect to and follows
# the cluster's primary. The legacy single-instance Deployment is gone; its
# volume (postgres-volume.yaml) is retained and not pruned.
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    cnpg.io/cluster: immich-cluster
    role: primary
