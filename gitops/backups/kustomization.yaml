apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - volumes.yaml
  - secrets.yaml
  - db-dump.yaml
  - home-assistant-db-dump.yaml
  - umami-db-dump.yaml
  - dumps-to-r2.yaml
  - library-volumes.yaml
  - library-local.yaml
  - restore-drill.yaml
  - library-drill.yaml
configMapGenerator:
  - name: restore-drill-script
    namespace: backups
    files:
      - restore-drill/verify-dump.sh
      - restore-drill/record.sh
  - name: restore-drill-script
    namespace: immich
    files:
      - restore-drill/record.sh
