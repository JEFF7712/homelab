apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-local-repo
  namespace: immich
spec:
  volumeName: pvc-317cc47c-9741-4633-a1b5-e68a39d84685
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 500Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-backup-secrets
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: immich-backup-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: restic-password
      remoteRef:
        key: homelab-values
        property: RESTIC_PASSWORD
