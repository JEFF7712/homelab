apiVersion: batch/v1
kind: CronJob
metadata:
  name: library-to-local-repo
  namespace: immich
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 21600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: registry.rupan.dev/upstream/docker.io/restic/restic@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a  # yamllint disable-line rule:line-length
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: RESTIC_REPOSITORY
                  value: /repo/immich-library
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-backup-secrets
                      key: restic-password
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # A run evicted by a node drain leaves its lock behind, and
                  # restic unlock only removes it once stale, 30 minutes after
                  # its last refresh. Retry lock failures (exit 11) past that.
                  locked() {
                    for _ in 1 2 3 4 5 6 7 8; do
                      rc=0
                      restic "$@" || rc=$?
                      [ "$rc" -eq 11 ] || return "$rc"
                      sleep 300
                      restic unlock || true
                    done
                    return 11
                  }
                  restic unlock || true
                  [ -f "$RESTIC_REPOSITORY/config" ] || restic init
                  locked backup /library --host immich --exclude '/library/.storage'
                  locked forget --host immich --keep-last 7 --prune
              volumeMounts:
                - name: library
                  mountPath: /library
                  readOnly: true
                - name: repo
                  mountPath: /repo
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: immich-library
            - name: repo
              persistentVolumeClaim:
                claimName: immich-local-repo
            - name: tmp
              emptyDir: {}
