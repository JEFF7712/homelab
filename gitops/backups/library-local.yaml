apiVersion: batch/v1
kind: CronJob
metadata:
  name: library-to-local-repo
  namespace: immich
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 21600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: registry.rupan.dev/upstream/docker.io/restic/restic@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510  # yamllint disable-line rule:line-length
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: RESTIC_REPOSITORY
                  value: /repo/immich-library
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-backup-secrets
                      key: restic-password
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  restic unlock || true
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /library --host immich --exclude '/library/.storage'
                  restic forget --host immich --keep-last 7 --prune
              volumeMounts:
                - name: library
                  mountPath: /library
                  readOnly: true
                - name: repo
                  mountPath: /repo
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: immich-library
            - name: repo
              persistentVolumeClaim:
                claimName: immich-local-repo
            - name: tmp
              emptyDir: {}
