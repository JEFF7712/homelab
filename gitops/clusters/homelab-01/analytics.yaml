apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: analytics
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/analytics
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: eso
    - name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: umami
      namespace: analytics
