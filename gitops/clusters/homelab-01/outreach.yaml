apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: outreach
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/outreach
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: automation
    - name: secrets
    - name: storage
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: outreach-control
      namespace: automation
