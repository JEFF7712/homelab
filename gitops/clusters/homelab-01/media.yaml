apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: eso
    - name: storage
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: sonarr
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: radarr
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: jellyfin
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: slskd
      namespace: media
