apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lan-gateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/lan-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-issuer
    - name: cloudflare
  wait: true
  # The first wildcard issuance waits on DNS-01 propagation.
  timeout: 10m0s
