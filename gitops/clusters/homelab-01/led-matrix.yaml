apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: led-matrix
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/led-matrix
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: home-assistant
    - name: secrets
    - name: eso
  wait: true
  timeout: 3m0s
