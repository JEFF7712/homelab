apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-05
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # runtime/recovery.py patches this 2.10.4 digest at startup (HA import
          # recovery, 0.15 s queue skip debounce); recheck both when upgrading.
          image: registry.rupan.dev/upstream/ghcr.io/music-assistant/server@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de  # yamllint disable-line rule:line-length
          command:
            - /app/venv/bin/python
            - /opt/homelab/recovery.py
            - --data-dir
            - /data
            - --cache-dir
            - /data/.cache
          env:
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ ! -f /usr/local/bin/go-librespot.orig ]; then
                      mv /usr/local/bin/go-librespot /usr/local/bin/go-librespot.orig
                    fi
                    cat << 'EOF' > /usr/local/bin/go-librespot
                    #!/bin/sh
                    # Zeroconf range must stay clear of MA's per-daemon API range
                    # 38800-38900 (see API_PORT_RANGE in the spotify_connect provider).
                    PORT=$(python3 -c "
                    import socket
                    for p in range(38901, 38920):
                        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                            try:
                                s.bind(('0.0.0.0', p))
                                print(p)
                                break
                            except OSError:
                                continue
                    ")
                    exec python3 /opt/spotify-connect/relay.py /usr/local/bin/go-librespot.orig \
                      -c "zeroconf_port=${PORT:-38901}" \
                      -c "zeroconf_interfaces_to_advertise=enp0s31f6" \
                      "$@"
                    EOF
                    chmod +x /usr/local/bin/go-librespot
          # Steady playback reaches ~1.5Gi; 2Gi was OOM-killed four times
          # between 2026-11-15 and 2026-11-17 (MA plus its AirPlay children).
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: player-recovery
              mountPath: /opt/homelab
              readOnly: true
            - name: spotify-connect-relay
              mountPath: /opt/spotify-connect
              readOnly: true
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8095
            initialDelaySeconds: 120
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8095
            initialDelaySeconds: 180
            periodSeconds: 30
            # The default 1s killed MA during brief event-loop stalls under load.
            timeoutSeconds: 5
        - name: pot-provider
          image: docker.io/brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472  # yamllint disable-line rule:line-length
          ports:
            - containerPort: 4416
          readinessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: player-recovery
          configMap:
            name: music-assistant-player-recovery
        - name: spotify-connect-relay
          configMap:
            name: spotify-connect-relay
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
        - name: media
          nfs:
            server: 10.0.30.20
            path: /tank/media
            readOnly: true
