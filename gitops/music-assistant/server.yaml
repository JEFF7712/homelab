apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-05
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: registry.rupan.dev/upstream/ghcr.io/music-assistant/server@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de  # yamllint disable-line rule:line-length
          env:
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ ! -f /usr/local/bin/go-librespot.orig ]; then
                      mv /usr/local/bin/go-librespot /usr/local/bin/go-librespot.orig
                    fi
                    cat << 'EOF' > /usr/local/bin/go-librespot
                    #!/bin/sh
                    PORT=$(python3 -c "
                    import socket
                    for p in range(38801, 38820):
                        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                            try:
                                s.bind(('0.0.0.0', p))
                                print(p)
                                break
                            except OSError:
                                continue
                    ")
                    exec /usr/local/bin/go-librespot.orig \
                      -c "zeroconf_port=${PORT:-38801}" \
                      -c "zeroconf_interfaces_to_advertise=enp0s31f6" \
                      "$@"
                    EOF
                    chmod +x /usr/local/bin/go-librespot
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8095
            initialDelaySeconds: 120
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8095
            initialDelaySeconds: 180
            periodSeconds: 30
        - name: pot-provider
          image: docker.io/brainicism/bgutil-ytdlp-pot-provider:2.0.0@sha256:ed86b6fdd5e430ddd7c8ce1adb55e1ab54db7c7dbc1bcbf3a82454a85b971164  # yamllint disable-line rule:line-length
          ports:
            - containerPort: 4416
          readinessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
