# ADMIN_TOKEN is generated in-cluster once and never leaves it. The admin page
# is reachable only through a port-forward or an exec into the pod, because
# the tunnel answers /admin with 404.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vaultwarden-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ADMIN_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vaultwarden-admin
