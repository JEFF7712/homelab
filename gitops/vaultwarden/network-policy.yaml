# Vault clients arrive only through the tunnel. No LAN or scraper access:
# admin work uses a port-forward or exec, which kubelet delivers inside the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-ingress
  namespace: vaultwarden
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow ingress from Cloudflare Tunnel connector pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
      ports:
        - port: 8080
          protocol: TCP
