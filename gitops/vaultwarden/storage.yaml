# Vault database, attachments and Sends on nas-01 /tank/cluster (sanoid
# snapshots, the nightly external backup and the hourly off-site
# platform-backup). Never pruned: deleting this claim deletes every vault.
# volumeName pins the provisioned directory that
# homelab.platformBackup.vaultwardenDataPath on nas-01 names.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  volumeName: pvc-87889574-696e-4829-8a09-9c0f5dd94e52
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 2Gi
