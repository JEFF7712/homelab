    \        self._timer_finished = False\n        self._pipeline_active = False\n\
    \n        # Only tear down shared playback/state when the LAST client disconnects.\n\
    \        # Otherwise a secondary client (a diagnostic tool, a second dashboard,\
    \ or\n        # Home Assistant's own overlapping reconnect) dropping would stop\
    \ audio\n        # that belongs to a client still connected.\n        if not self.state.connections:\n\
    \            # Stop any ongoing audio playback and wake/stop word processing.\n\
    \            try:\n                self.state.music_player.stop()\n          \
    \  except Exception:  # pylint: disable=broad-except\n                _LOGGER.exception(\"\
    Failed to stop music player during disconnect\")\n\n            try:\n       \
    \         self.state.tts_player.stop()\n            except Exception:  # pylint:\
    \ disable=broad-except\n                _LOGGER.exception(\"Failed to stop TTS\
    \ player during disconnect\")\n\n            self.state.stop_word.is_active =\
    \ False  # type: ignore[attr-defined]\n            self.state.connected = False\n\
    \n        if self.state.satellite is self:\n            self.state.satellite =\
    \ None\n\n        if self.state.mute_switch_entity is not None:\n            self.state.mute_switch_entity.sync_with_state()\n\
    \n        if self.state.mic_gain_entity is not None:\n            self.state.mic_gain_entity.sync_with_state()\n\
    \n        if self.state.mic_noise_suppression_entity is not None:\n          \
    \  self.state.mic_noise_suppression_entity.sync_with_state()\n\n        if self.state.mic_volume_entity\
    \ is not None:\n            self.state.mic_volume_entity.sync_with_state()\n\n\
    \        # Notify peripheral container that HA is no longer reachable\n      \
    \  self._emit(LVAEvent.DISCONNECTED)\n\n        _LOGGER.info(\"Disconnected from\
    \ Home Assistant; waiting for reconnection\")\n\n    def process_packet(self,\
    \ msg_type: int, packet_data: bytes) -> None:\n        super().process_packet(msg_type,\
    \ packet_data)\n\n        if msg_type == PROTO_TO_MESSAGE_TYPE[AuthenticationRequest]:\n\
    \            self.is_established_ha = True\n            self.state.connected =\
    \ True\n            self.state.satellite = self\n            _LOGGER.debug(\"\
    Authentication successful, connected to Home Assistant\")\n\n            # Send\
    \ states after connect\n            states: List[message.Message] = []\n     \
    \       _LOGGER.debug(\"Found %d entities in state\", len(self.state.entities))\n\
    \            for i, entity in enumerate(self.state.entities):\n              \
    \  entity_states = list(\n                    entity.handle_message(SubscribeHomeAssistantStatesRequest())\n\
    \                )\n                states.extend(entity_states)\n           \
    \     _LOGGER.debug(\n                    \"Entity %d (%s) returned %d state messages\"\
    ,\n                    i,\n                    type(entity).__name__,\n      \
    \              len(entity_states),\n                )\n\n            _LOGGER.debug(\"\
    Total state messages to send: %d\", len(states))\n            self.send_messages(states)\n\
    \            for i, msg in enumerate(states):\n                _LOGGER.debug(\"\
    Sent state message %d: %s\", i, type(msg).__name__)\n            _LOGGER.debug(\"\
    All entity states sent after connect\")\n\n            # Notify peripherals that\
    \ Home Assistant is now connected\n            self._emit(LVAEvent.ZEROCONF, {\"\
    status\": \"connected\"})\n\n    # ------------------------------------------------------------------\n\
    \    # External wake word download\n    # ------------------------------------------------------------------\n\
    \n    def _download_external_wake_word(\n        self, external_wake_word: VoiceAssistantExternalWakeWord\n\
    \    ) -> Optional[AvailableWakeWord]:\n        eww_dir = self.state.download_dir\
    \ / \"external_wake_words\"\n        eww_dir.mkdir(parents=True, exist_ok=True)\n\
    \n        config_path = eww_dir / f\"{external_wake_word.id}.json\"\n        should_download_config\
    \ = not config_path.exists()\n\n        # Check if we need to download the model\
    \ file\n        model_path = eww_dir / f\"{external_wake_word.id}.tflite\"\n \
    \       should_download_model = True\n        if model_path.exists():\n      \
    \      model_size = model_path.stat().st_size\n            if model_size == external_wake_word.model_size:\n\
    \                with open(model_path, \"rb\") as model_file:\n              \
    \      model_hash = hashlib.sha256(model_file.read()).hexdigest()\n\n        \
    \        if model_hash == external_wake_word.model_hash:\n                   \
    \ should_download_model = False\n                    _LOGGER.debug(\n        \
    \                \"Model size and hash match for %s. Skipping download.\",\n \
    \                       external_wake_word.id,\n                    )\n\n    \
    \    if should_download_config or should_download_model:\n            # Download\
    \ config\n            _LOGGER.debug(\"Downloading %s to %s\", external_wake_word.url,\
    \ config_path)\n            with urlopen(external_wake_word.url) as request:\n\
    \                if request.status != 200:\n                    _LOGGER.warning(\n\
    \                        \"Failed to download: %s, status=%s\",\n            \
    \            external_wake_word.url,\n                        request.status,\n\
    \                    )\n                    return None\n\n                with\
    \ open(config_path, \"wb\") as model_file:\n                    shutil.copyfileobj(request,\
    \ model_file)\n\n        if should_download_model:\n            # Download model\
    \ file\n            parsed_url = urlparse(external_wake_word.url)\n          \
    \  parsed_url = parsed_url._replace(\n                path=posixpath.join(\n \
    \                   posixpath.dirname(parsed_url.path), model_path.name\n    \
    \            ),\n            )\n            model_url = urlunparse(parsed_url)\n\
    \n            _LOGGER.debug(\"Downloading %s to %s\", model_url, model_path)\n\
    \            with urlopen(model_url) as request:\n                if request.status\
    \ != 200:\n                    _LOGGER.warning(\n                        \"Failed\
    \ to download: %s, status=%s\", model_url, request.status\n                  \
    \  )\n                    return None\n\n                with open(model_path,\
    \ \"wb\") as model_file:\n                    shutil.copyfileobj(request, model_file)\n\
    \n        return AvailableWakeWord(\n            id=external_wake_word.id,\n \
    \           type=WakeWordType.MICRO_WAKE_WORD,\n            wake_word=external_wake_word.wake_word,\n\
    \            trained_languages=external_wake_word.trained_languages,\n       \
    \     wake_word_path=config_path,\n        )\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-voice-assistant
  namespace: voice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linux-voice-assistant
  template:
    metadata:
      labels:
        app: linux-voice-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-05
      containers:
        - name: satellite
          image: registry.rupan.dev/upstream/ghcr.io/ohf-voice/linux-voice-assistant@sha256:5a6ecf5ad5ee871851331c47885b0b0fdf81b2a5e6e33824093b557028d619b6
          securityContext:
            privileged: true
            runAsUser: 1001
            runAsGroup: 995
          env:
            - name: CLIENT_NAME
              value: Homelab 05 Satellite
            - name: PORT
              value: '6053'
            - name: PREFERENCES_FILE
              value: /data/preferences.json
            - name: PULSE_SERVER
              value: unix:/run/user/1001/pulse/native
            - name: SKIP_PULSE_AUDIO_WAIT
              value: '1'
            - name: PULSE_COOKIE
              value: /tmp/pulse-cookie
            - name: XDG_RUNTIME_DIR
              value: /tmp
            - name: ENABLE_DEBUG
              value: '0'
            - name: AUDIO_INPUT_DEVICE
              value: QuadCast
            - name: LISTEN_DURING_WAKE_SOUND
              value: '1'
            - name: WAKE_MODEL
              value: hey_jarvis.tflite
            - name: ACOUSTIC_TAIL_SECONDS
              value: '0.35'
            - name: AUDIO_STALL_TIMEOUT
              value: '6.0'
            - name: HEALTH_PORT
              value: '10202'
          args:
            - --mic-volume
            - '75'
          ports:
            - containerPort: 6053
              name: satellite
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - /app/healthcheck.py
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - /app/healthcheck.py
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /app/.venv/bin/python3
                - /app/healthcheck.py
            periodSeconds: 15
          volumeMounts:
            - name: sound-device
              mountPath: /dev/snd
            - name: pulse-socket
              mountPath: /run/user/1001/pulse
            - name: persist-data
              mountPath: /data
            - name: local-data
              mountPath: /app/local
            - name: tmp
              mountPath: /tmp
            - name: satellite-patches
              mountPath: /app/linux_voice_assistant/__main__.py
              subPath: __main__.py
            - name: satellite-patches
              mountPath: /app/linux_voice_assistant/satellite.py
              subPath: satellite.py
            - name: satellite-patches
              mountPath: /app/healthcheck.py
              subPath: healthcheck.py
      volumes:
        - name: sound-device
          hostPath:
            path: /dev/snd
            type: Directory
        - name: pulse-socket
          hostPath:
            path: /run/user/1001/pulse
            type: Directory
        - name: persist-data
          hostPath:
            path: /persist/voice-assistant
            type: DirectoryOrCreate
        - name: local-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: satellite-patches
          configMap:
            name: satellite-patch-code
---
apiVersion: v1
kind: Service
metadata:
  name: voice-satellite
  namespace: voice
spec:
  selector:
    app: linux-voice-assistant
  ports:
    - name: satellite
      port: 6053
      targetPort: 6053
