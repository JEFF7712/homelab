  healthcheck.py: "#!/usr/bin/env python3\n\"\"\"Liveness and readiness healthcheck\
    \ for Linux Voice Assistant Satellite.\n\nValidates that:\n1. Audio capture thread\
    \ is alive and freshly writing frames (mtime of /tmp/satellite_audio_healthy <\
    \ 10s).\n2. Dedicated satellite health endpoint is responding 200 OK on 127.0.0.1:HEALTH_PORT\
    \ (isolated from ESPHome API).\n\"\"\"\n\nimport os\nimport socket\nimport sys\n\
    import time\n\nHEALTH_FILE = \"/tmp/satellite_audio_healthy\"\nMAX_FRAME_AGE =\
    \ 10.0\nHEALTH_PORT = int(os.environ.get(\"HEALTH_PORT\", \"10202\"))\n\n\ndef\
    \ check_audio_freshness() -> bool:\n    if not os.path.exists(HEALTH_FILE):\n\
    \        return False\n    try:\n        mtime = os.path.getmtime(HEALTH_FILE)\n\
    \        age = time.time() - mtime\n        return age <= MAX_FRAME_AGE\n    except\
    \ OSError:\n        return False\n\n\ndef check_health_endpoint() -> bool:\n \
    \   try:\n        with socket.create_connection((\"127.0.0.1\", HEALTH_PORT),\
    \ timeout=3.0) as sock:\n            sock.sendall(b\"GET /healthz HTTP/1.1\\r\\\
    nHost: 127.0.0.1\\r\\n\\r\\n\")\n            resp = sock.recv(512)\n         \
    \   return b\"200 OK\" in resp\n    except OSError:\n        return False\n\n\n\
    def main() -> int:\n    audio_ok = check_audio_freshness()\n    endpoint_ok =\
    \ check_health_endpoint()\n    if audio_ok and endpoint_ok:\n        return 0\n\
    \    errors = []\n    if not audio_ok:\n        errors.append(\"audio capture\
    \ stalled or dead\")\n    if not endpoint_ok:\n        errors.append(\n      \
    \      f\"satellite health endpoint on 127.0.0.1:{HEALTH_PORT} not responding\
    \ 200 OK\"\n        )\n    print(f\"Healthcheck failed: {', '.join(errors)}\"\
    , file=sys.stderr)\n    return 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"
