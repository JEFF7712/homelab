apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voice
resources:
  - namespace.yaml
  - gateway.yaml
  - display.yaml
  - network-policy.yaml
  - local-decision.yaml
  - von.yaml
  - stt-nemotron.yaml
  - satellite.yaml
  - exporter.yaml

configMapGenerator:
  - name: wyoming-gateway-code
    files:
      - gateway/gateway.py
  - name: jarvis-display-code
    files:
      - display/server.py
  - name: local-decision-runtime
    files:
      - local-decision/app.py
      - local-decision/pyproject.toml
      - local-decision/uv.lock
  # Unhashed names keep today's behaviour: a script edit does not roll pods by
  # itself. The source files are the deployed bytes; edit them, not YAML.
  - name: satellite-patch-code
    options:
      disableNameSuffixHash: true
    files:
      - satellite/healthcheck.py
      - satellite/__main__.py
      - satellite/satellite.py
  - name: jarvis-exporter-code
    options:
      disableNameSuffixHash: true
    files:
      - exporter/exporter.py
