apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voice
resources:
  - namespace.yaml
  - gateway.yaml
  - network-policy.yaml
  - local-decision.yaml
  - von.yaml
  - whisper.yaml
  - stt-nemotron.yaml
  - stt-groq.yaml
  - piper.yaml
  - chatterbox.yaml
  - satellite.yaml
  - exporter.yaml

configMapGenerator:
  - name: wyoming-gateway-code
    files:
      - gateway/gateway.py
  - name: wyoming-voice-id-config
    files:
      - voice-id/proxy.py
  - name: chatterbox-bridge-code
    files:
      - chatterbox-bridge/server.py
  - name: local-decision-runtime
    files:
      - local-decision/app.py
      - local-decision/pyproject.toml
      - local-decision/uv.lock
