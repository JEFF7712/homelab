apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-whisper
  namespace: voice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-whisper
  template:
    metadata:
      labels:
        app: wyoming-whisper
        backend: local
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          # Pinned upstream tag: 3.8.1
          image: registry.rupan.dev/upstream/docker.io/rhasspy/wyoming-whisper@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80  # yamllint disable-line rule:line-length
          args:
            - "--model"
            - "base.en"
            - "--language"
            - "en"
            - "--beam-size"
            - "5"
            - "--initial-prompt"
            - >-
              Govee, Spotify, Young Thug, The Weeknd, Kendrick Lamar,
              Drake, Travis Scott, Kanye West, Frank Ocean, Marvin Gaye,
              Metro Boomin, 21 Savage, Gunna, Future, tulip lamp, mushroom lamp,
              good vibes sign, floor lamp, desk lamp, light strip, living room,
              bedroom, kitchen, downstairs, Jarvis.
            - "--data-dir"
            - "/data"
            - "--download-dir"
            - "/data"
            - "--uri"
            - "tcp://0.0.0.0:10301"
          ports:
            - containerPort: 10301
              name: whisper
          startupProbe:
            tcpSocket:
              port: whisper
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: whisper
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: whisper
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
        - name: voice-id
          # Pinned upstream tag: 3.8.1
          image: registry.rupan.dev/upstream/docker.io/rhasspy/wyoming-whisper@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80  # yamllint disable-line rule:line-length
          command:
            - "/usr/src/.venv/bin/python3"
            - "/app/proxy.py"
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "10300"
            - "--upstream-host"
            - "127.0.0.1"
            - "--upstream-port"
            - "10301"
            - "--model"
            - "/data/voice-id/model.onnx"
            - "--profiles"
            - "/etc/voice-id/profiles.json"
          ports:
            - containerPort: 10300
              name: wyoming
          startupProbe:
            tcpSocket:
              port: wyoming
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
            - name: voice-id-config
              mountPath: /app
            - name: voice-id-profiles
              mountPath: /etc/voice-id
              readOnly: true
      volumes:
        - name: model-cache
          hostPath:
            path: /persist/voice-models/whisper
            type: DirectoryOrCreate
        - name: voice-id-config
          configMap:
            name: wyoming-voice-id-config
        - name: voice-id-profiles
          secret:
            secretName: voice-id-profiles
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-stt-local
  namespace: voice
spec:
  selector:
    app: wyoming-whisper
    backend: local
  ports:
    - name: wyoming
      port: 10300
      targetPort: 10300
