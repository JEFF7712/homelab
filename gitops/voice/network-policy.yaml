apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: voice
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: voice
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-home-assistant-clients
  namespace: voice
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wyoming-gateway, linux-voice-assistant]
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10300"
              protocol: TCP
            - port: "10201"
              protocol: TCP
            - port: "6053"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home-assistant
      toPorts:
        - ports:
            - port: "10300"
              protocol: TCP
            - port: "10201"
              protocol: TCP
            - port: "6053"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: voice
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wyoming-whisper, wyoming-piper, wyoming-chatterbox]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wyoming-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: voice
spec:
  podSelector:
    matchLabels:
      app: wyoming-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [wyoming-whisper, wyoming-piper, wyoming-chatterbox]
      ports:
        - {protocol: TCP, port: 10300}
        - {protocol: TCP, port: 10200}
        - {protocol: TCP, port: 10201}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrapes
  namespace: voice
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wyoming-gateway, jarvis-exporter, local-decision, wyoming-whisper]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-home-assistant-shadow
  namespace: voice
spec:
  endpointSelector:
    matchLabels:
      app: local-decision
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home-assistant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: voice
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wyoming-whisper, wyoming-chatterbox, local-decision, von-decision]
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-exporter-to-home-assistant
  namespace: voice
spec:
  endpointSelector:
    matchLabels:
      app: jarvis-exporter
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-satellite-runtime
  namespace: voice
spec:
  podSelector:
    matchLabels:
      app: linux-voice-assistant
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
