# Inventory-only upstream image declarations for gitops/voice
# consumers. Renovate tracks these tagged references; the workloads pin the
# mirrored digest. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# referenced by digest in the owning manifest.
#
# This file is NOT listed in gitops/voice/kustomization.yaml: it is
# an inventory source only and must never be applied to the cluster.
#
# Update flow: change the digest below, import it, then update the consumer
# manifest digest, so a pod never pulls an image the mirror lacks.
apiVersion: v1
kind: List
metadata:
  name: voice-registry-sources
items:
  # Wyoming Piper TTS (piper.yaml)
  - image: docker.io/rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
  # Linux voice satellite (satellite.yaml)
  - image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.15@sha256:5a6ecf5ad5ee871851331c47885b0b0fdf81b2a5e6e33824093b557028d619b6  # yamllint disable-line rule:line-length
  # Wyoming gateway and exporter runtime (gateway.yaml, exporter.yaml)
  - image: docker.io/library/python:3.14.7@sha256:be8ccd085666c34273c9dc5607c9842f8b2e3116128aae45148ce164c07ce09d
  # uv runtime for chatterbox, local-decision and von
  - image: ghcr.io/astral-sh/uv:0.9.30-python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58  # yamllint disable-line rule:line-length
