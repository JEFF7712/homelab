---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jarvis-exporter-ha
  namespace: voice
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-voice
  target:
    name: jarvis-exporter-ha
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        token: "{{ .ha_token }}"
  data:
    - secretKey: ha_token
      remoteRef:
        key: homelab-voice-values
        property: JARVIS_EXPORTER_HA_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-exporter
  namespace: voice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jarvis-exporter
  template:
    metadata:
      labels:
        app: jarvis-exporter
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Pinned upstream tag: 3.13-slim
          image: registry.rupan.dev/upstream/docker.io/library/python@sha256:be8ccd085666c34273c9dc5607c9842f8b2e3116128aae45148ce164c07ce09d  # yamllint disable-line rule:line-length
          command:
            - python3
            - /app/exporter.py
          env:
            - name: HA_URL
              value: "http://10.0.40.13:8123"
            - name: SATELLITE_ENTITY
              value: "assist_satellite.homelab_05_satellite_assist_satellite"
            - name: FAST_TURN_MAX_SECONDS
              value: "2.0"
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jarvis-exporter-ha
                  key: token
                  optional: true
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: jarvis-exporter-code
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-exporter
  namespace: voice
  labels:
    app: jarvis-exporter
spec:
  selector:
    app: jarvis-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jarvis-exporter
  namespace: voice
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: jarvis-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
