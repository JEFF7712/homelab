# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: stt-groq-bridge-code
  namespace: voice
data:
  bridge.py: |
    #!/usr/bin/env python3
    """Wyoming-to-Groq STT bridge (stdlib only).

    Speaks the Wyoming protocol to Home Assistant on one side and the
    OpenAI-compatible Groq audio API on the other. Buffered turns only:
    audio-start/chunk/stop is collected, wrapped as WAV, posted to Groq,
    and the returned text goes back as a transcript event.
    """

    from __future__ import annotations

    import argparse
    import asyncio
    import io
    import json
    import logging
    import os
    import urllib.request
    import wave

    LOG = logging.getLogger("stt-groq-bridge")

    GROQ_ENDPOINT = "https://api.groq.com/openai/v1/audio/transcriptions"

    # Govee needs dense priming: large-v3-turbo hears "Gobi" when Govee
    # appears only once in a long list (verified 2026-09-20).
    DEFAULT_PROMPT = (
        "Govee, Govee, Govee. Turn on all Govee lights. "
        "Govee, Spotify, Young Thug, The Weeknd, Coldplay, Kendrick Lamar, "
        "Drake, Travis Scott, Kanye West, Rauw Alejandro, Post Malone, "
        "Metro Boomin, 21 Savage, Gunna, Future, tulip lamp, mushroom lamp, "
        "good vibes sign, floor lamp, desk lamp, light strip, living room, "
        "bedroom, kitchen, downstairs, Jarvis."
    )


    def encode_event(type_: str, data: dict | None = None) -> bytes:
        header: dict = {"type": type_, "version": "1.0"}
        line = json.dumps(header).encode() + b"\n"
        if data:
            raw = json.dumps(data, ensure_ascii=False).encode()
            header["data_length"] = len(raw)
            line = json.dumps(header).encode() + b"\n" + raw
        return line


    async def read_event(reader: asyncio.StreamReader) -> dict | None:
        try:
            line = await reader.readline()
        except (asyncio.IncompleteReadError, ConnectionError):
            return None
        if not line:
            return None
        try:
            event = json.loads(line)
        except ValueError:
            return None
        data_length = event.get("data_length") or 0
        data: dict = {}
        if data_length > 0:
            try:
                raw = await reader.readexactly(data_length)
            except (asyncio.IncompleteReadError, ConnectionError):
                return None
            try:
                data = json.loads(raw)
            except ValueError:
                data = {}
        payload_length = event.get("payload_length") or 0
        payload = b""
        if payload_length > 0:
            try:
                payload = await reader.readexactly(payload_length)
            except (asyncio.IncompleteReadError, ConnectionError):
                return None
        return {"type": event.get("type"), "data": data, "payload": payload}


    def info_event(model: str) -> bytes:
        attribution = {"name": "Groq", "url": "https://groq.com"}
        return encode_event(
            "info",
            {
                "asr": [
                    {
                        "name": "groq-cloud",
                        "description": "Groq cloud speech-to-text",
                        "attribution": attribution,
                        "installed": True,
                        "models": [
                            {
                                "name": model,
                                "description": "Groq cloud STT model",
                                "attribution": attribution,
                                "installed": True,
                                "languages": ["en"],
                            }
                        ],
                    }
                ]
            },
        )


    def pcm_to_wav(pcm: bytes, rate: int, width: int, channels: int) -> bytes:
        buf = io.BytesIO()
        with wave.open(buf, "wb") as wav:
            wav.setframerate(rate)
            wav.setsampwidth(width)
            wav.setnchannels(channels)
            wav.writeframes(pcm)
        return buf.getvalue()


    def build_multipart(fields: dict, file_field: str, filename: str, file_bytes: bytes) -> tuple[bytes, str]:
        boundary = "wyoming-groq-bridge-boundary"
        body = io.BytesIO()
        for key, value in fields.items():
            body.write(f"--{boundary}\r\n".encode())
            body.write(f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode())
            body.write(f"{value}\r\n".encode())
        body.write(f"--{boundary}\r\n".encode())
        body.write(
            f'Content-Disposition: form-data; name="{file_field}"; filename="{filename}"\r\n'.encode()
        )
        body.write(b"Content-Type: audio/wav\r\n\r\n")
        body.write(file_bytes)
        body.write(f"\r\n--{boundary}--\r\n".encode())
        return body.getvalue(), f"multipart/form-data; boundary={boundary}"


    def groq_transcribe(wav_bytes: bytes, api_key: str, model: str, language: str, prompt: str, timeout: float) -> str:
        body, content_type = build_multipart(
            {
                "model": model,
                "language": language,
                "prompt": prompt,
                "temperature": "0",
                "response_format": "json",
            },
            "file",
            "audio.wav",
            wav_bytes,
        )
        request = urllib.request.Request(
            GROQ_ENDPOINT,
            data=body,
            headers={
                "Authorization": f"Bearer {api_key}",
                "Content-Type": content_type,
                # Cloudflare in front of the API rejects urllib's default UA (error 1010)
                "User-Agent": "homelab-stt-groq-bridge/1.0",
            },
            method="POST",
        )
        with urllib.request.urlopen(request, timeout=timeout) as response:
            payload = json.loads(response.read().decode())
        text = payload.get("text", "")
        return text if isinstance(text, str) else ""


    async def handle_client(reader: asyncio.StreamReader, writer: asyncio.StreamWriter) -> None:
        api_key = os.environ.get("GROQ_API_KEY", "")
        model = os.environ.get("GROQ_MODEL", "whisper-large-v3-turbo")
        language = os.environ.get("GROQ_LANGUAGE", "en")
        prompt = os.environ.get("GROQ_PROMPT", DEFAULT_PROMPT)
        timeout = float(os.environ.get("GROQ_TIMEOUT", "30"))
        pcm = bytearray()
        fmt = {"rate": 16000, "width": 2, "channels": 1}
        peer = writer.get_extra_info("peername")
        try:
            while True:
                event = await read_event(reader)
                if event is None:
                    break
                kind = event["type"]
                if kind == "describe":
                    writer.write(info_event(model))
                    await writer.drain()
                elif kind == "transcribe":
                    language = event["data"].get("language") or language
                elif kind == "audio-start":
                    fmt = {
                        "rate": int(event["data"].get("rate", 16000)),
                        "width": int(event["data"].get("width", 2)),
                        "channels": int(event["data"].get("channels", 1)),
                    }
                    pcm.clear()
                elif kind == "audio-chunk":
                    pcm += event["payload"]
                elif kind == "audio-stop":
                    text = ""
                    if pcm and api_key:
                        try:
                            wav_bytes = pcm_to_wav(bytes(pcm), fmt["rate"], fmt["width"], fmt["channels"])
                            text = await asyncio.to_thread(
                                groq_transcribe, wav_bytes, api_key, model, language, prompt, timeout
                            )
                        except Exception:
                            LOG.exception("groq transcription failed for %s", peer)
                    elif pcm and not api_key:
                        LOG.error("no GROQ_API_KEY configured, returning empty transcript")
                    writer.write(encode_event("transcript", {"text": text}))
                    await writer.drain()
        except (ConnectionError, asyncio.IncompleteReadError):
            pass
        finally:
            try:
                writer.close()
            except Exception:
                pass


    async def serve(port: int) -> None:
        server = await asyncio.start_server(handle_client, "0.0.0.0", port)
        LOG.info("stt-groq-bridge listening on %d", port)
        async with server:
            await server.serve_forever()


    def main() -> None:
        parser = argparse.ArgumentParser()
        parser.add_argument("--port", type=int, default=10300)
        args = parser.parse_args()
        logging.basicConfig(level=logging.INFO)
        asyncio.run(serve(args.port))


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-stt-groq
  namespace: voice
spec:
  # Nemotron's only fallback since local Whisper was removed.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-whisper
      backend: cloud
  template:
    metadata:
      labels:
        app: wyoming-whisper
        backend: cloud
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: registry.rupan.dev/upstream/docker.io/library/python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc  # yamllint disable-line rule:line-length
          command:
            - "/usr/local/bin/python"
            - "/app/bridge.py"
          env:
            - name: GROQ_MODEL
              value: whisper-large-v3-turbo
            - name: GROQ_LANGUAGE
              value: en
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-stt
                  key: api-key
                  optional: true
          ports:
            - containerPort: 10300
              name: wyoming
          startupProbe:
            tcpSocket:
              port: wyoming
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bridge-code
              mountPath: /app
      volumes:
        - name: bridge-code
          configMap:
            name: stt-groq-bridge-code
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-stt-groq
  namespace: voice
spec:
  selector:
    app: wyoming-whisper
    backend: cloud
  ports:
    - name: wyoming
      port: 10300
      targetPort: 10300
