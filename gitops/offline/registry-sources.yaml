# Inventory-only upstream image declarations for gitops/offline consumers.
# Renovate tracks these tagged references; the workloads pin the mirrored
# digest. Scanned by `python -m scripts.registry inventory` (item "image:"
# fields), imported to registry.rupan.dev/upstream/<host>/<path> by the
# registry CI lane, then referenced by digest in the owning manifest.
#
# This file is NOT listed in gitops/offline/kustomization.yaml: it is an
# inventory source only and must never be applied to the cluster.
#
# Update flow: change the digest below, import it, then update the consumer
# manifest digest, so a pod never pulls an image the mirror lacks.
apiVersion: v1
kind: List
metadata:
  name: offline-registry-sources
items:
  # Kiwix server and library tools (kiwix-serve, kiwix-manage)
  - image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5  # yamllint disable-line rule:line-length
  # Valhalla routing engine: builds US routing tiles and serves directions
  - image: ghcr.io/valhalla/valhalla:3.9.3@sha256:cf618ccafdead96829282acc81a70aa00947c2f28ddcf118f0194acf2fbc7e9d  # yamllint disable-line rule:line-length
  # Java runtime for the Photon place-search server (release jar from the archive)
  - image: docker.io/library/eclipse-temurin:21.0.12.1_1-jre@sha256:f37956012e0cb88400e5b3689aeae2d2d735364c1922ae2225536163b5a99f56  # yamllint disable-line rule:line-length
