apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - network-policy.yaml
  - storage.yaml
  - kiwix.yaml
  - web.yaml
  - geo.yaml
  - kiwix-update.yaml
configMapGenerator:
  # update.py is tested from this rendered ConfigMap
  # (tests/test_offline_library.py).
  - name: kiwix-update
    namespace: offline
    options:
      disableNameSuffixHash: true
    files:
      - kiwix-update/update.py
      - kiwix-update/books.json
      - kiwix-update/maps.json
      - kiwix-update/geo.py
      - kiwix-update/geo.json
      - kiwix-update/build-routing.sh
  - name: offline-web
    namespace: offline
    options:
      disableNameSuffixHash: true
    files:
      - web/nginx.conf
      - web/index.html
