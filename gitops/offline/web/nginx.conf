# Front of the offline VIP (10.0.40.18): maps.homelab is the map viewer and
# its planet file, served from the archive; every other name goes to Kiwix.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
  worker_connections 1024;
}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080 default_server;
    location = /healthz {
      return 200 "ok\n";
    }
    location / {
      proxy_pass http://kiwix.offline.svc.cluster.local;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 8080;
    server_name maps.homelab maps;
    location = / {
      root /site;
      try_files /index.html =404;
    }
    location /assets/ {
      root /archive/maps;
      expires 1d;
    }
    # A symlink to the current planet file; the viewer reads it by range.
    location = /planet.pmtiles {
      root /archive/maps;
      add_header Cache-Control no-cache;
    }
    # US place search (Photon) and directions (Valhalla), geo.yaml.
    location = /api/search {
      proxy_pass http://maps-search.offline.svc.cluster.local:2322/api;
      proxy_read_timeout 30s;
    }
    location = /api/reverse {
      proxy_pass http://maps-search.offline.svc.cluster.local:2322/reverse;
      proxy_read_timeout 30s;
    }
    location = /api/route {
      proxy_pass http://maps-routing.offline.svc.cluster.local:8002/route;
      proxy_read_timeout 60s;
      client_max_body_size 64k;
    }
  }
}
