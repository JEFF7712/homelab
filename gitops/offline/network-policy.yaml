apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-isolate-ingress
  namespace: offline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. The update Job verifies the server it just refreshed
    - from:
        - podSelector: {}
    # 2. Prometheus/Alloy scrapers
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
    # 3. LAN clients reaching the 10.0.40.18 VIP
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
    # 4. NetBird clients keep their 100.64.0.0/10 mesh source address
    - from:
        - ipBlock:
            cidr: 100.64.0.0/10
---
# VIP traffic reaches offline-web through a node that usually runs no
# offline-web pod (OPNsense routes 10.0.40.18 to homelab-01). In tunnel mode
# that node forwards it with its own address and the world identity, so the
# CIDR rules above never match a LAN client; nodes themselves (and CI, which
# runs on homelab-04) arrive as host or remote-node. Only the LAN and the
# NetBird mesh can route to the VIP, so admitting world on the web port
# admits exactly them. Kiwix itself stays reachable only through this front.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: offline-web-ingress
  namespace: offline
spec:
  endpointSelector:
    matchLabels:
      app: offline-web
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
