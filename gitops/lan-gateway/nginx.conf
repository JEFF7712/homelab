# Generated by `python -m scripts.lan_gateway` from config/lan-gateway.json
# and gitops/cloudflare/ingress-config.yaml. Do not edit.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
  worker_connections 4096;
}
http {
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
  resolver_timeout 5s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  http2 on;
  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:tls:10m;
  server {
    listen 8080 default_server;
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      return 308 https://$host$request_uri;
    }
  }
  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
  }
  server {
    listen 8443 ssl;
    server_name arcade.rupan.dev;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    location / {
      set $upstream http://led-matrix.led-matrix.svc.cluster.local:8000;
      proxy_pass $upstream;
    }
  }
