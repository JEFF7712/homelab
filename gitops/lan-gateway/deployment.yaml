apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-gateway
  labels:
    app: lan-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lan-gateway
  template:
    metadata:
      labels:
        app: lan-gateway
      annotations:
        # Restart onto a renewed certificate.
        reloader.stakater.com/auto: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lan-gateway
      containers:
        - name: nginx
          image: registry.rupan.dev/upstream/docker.io/library/nginx@sha256:b50897d5c7b1aa08067c3d90c5e8b3e47ec4e3c91c91446f67820228f7b41e34  # yamllint disable-line rule:line-length
          # Skip the image entrypoint: its templating writes under /etc/nginx.
          command:
            - nginx
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: lan-gateway-nginx
        - name: tls
          secret:
            secretName: lan-gateway-tls
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
