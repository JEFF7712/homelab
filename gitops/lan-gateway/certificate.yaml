apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-gateway
spec:
  secretName: lan-gateway-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  # One wildcard covers every single-label tunnel hostname without listing
  # LAN names in Certificate Transparency logs one by one.
  dnsNames:
    - "*.rupan.dev"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
