apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The router runs in the cloudflare namespace because application network
# policies already admit the tunnel's namespace; the gateway reaches exactly
# the origins the tunnel reaches.
namespace: cloudflare
resources:
  - certificate.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
configMapGenerator:
  # nginx.conf is generated by `python -m scripts.lan_gateway`; the hash
  # suffix rolls the router whenever the tunnel rules or host list change.
  - name: lan-gateway-nginx
    files:
      - nginx.conf
