apiVersion: v1
kind: Service
metadata:
  name: lan-gateway
  labels:
    app: lan-gateway
    bgp-advertise: "true"
  annotations:
    # config/lan-gateway.json resolves every LAN gateway name to this VIP.
    io.cilium/lb-ipam-ips: 10.0.40.19
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  selector:
    app: lan-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
