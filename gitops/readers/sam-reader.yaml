---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sam-reader
  namespace: cluster-readers
---
# A long-lived token for sam-reader so a plain kubeconfig grants read-only
# cluster access from Sam's workspace VM. The controller fills in token,
# ca.crt, and namespace, so only the annotation is ours and nothing secret is
# committed. Rotate by deleting and recreating this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: sam-reader-token
  namespace: cluster-readers
  annotations:
    kubernetes.io/service-account.name: sam-reader
type: kubernetes.io/service-account-token
---
# Read-only cluster visibility for Sam. Deliberately excludes secrets (read
# access to secrets would expose every credential in the cluster) and omits
# pods/exec, pods/attach, and portforward, which allow running code or
# tunneling into workloads. No write verbs anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sam-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, replicationcontrollers, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sam-reader
subjects:
  - kind: ServiceAccount
    name: sam-reader
    namespace: cluster-readers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sam-reader
