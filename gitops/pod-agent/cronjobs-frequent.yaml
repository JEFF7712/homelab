# High-frequency pod-agent jobs. Mirrors deploy/*.service + *.timer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-agent-veto-sweep
  namespace: pod-agent
spec:
  schedule: "0 * * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab-01
          securityContext:
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-network
              image: registry.rupan.dev/apps/pod-agent@sha256:59f669bf8e20b96c504a78626636973c69342acf49542739276b011a85c1e243  # yamllint disable-line rule:line-length
              imagePullPolicy: IfNotPresent
              command: [python, /app/wait-for-network.py]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 101
          containers:
            - name: veto-sweep
              image: registry.rupan.dev/apps/pod-agent@sha256:59f669bf8e20b96c504a78626636973c69342acf49542739276b011a85c1e243  # yamllint disable-line rule:line-length
              imagePullPolicy: IfNotPresent
              args:
                - veto-sweep
                - --shop
                - distrojeff
              workingDir: /data
              envFrom:
                - secretRef:
                    name: pod-agent-env
                - configMapRef:
                    name: pod-agent-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: home
                  mountPath: /home/podagent
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 101
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pod-agent-data
            - name: home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
