# Daily pod-agent jobs. Mirrors deploy/*.service + *.timer on the laptop.
# Schedules keep America/Chicago wall-clock time via timeZone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-agent-backup
  namespace: pod-agent
spec:
  schedule: "45 6 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab-01
          securityContext:
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.rupan.dev/apps/pod-agent@sha256:45ce5865293efe67ba84db310a66d20dd77aa546a4ce4e7d0f32cab32cc7c6f9  # yamllint disable-line rule:line-length
              imagePullPolicy: IfNotPresent
              args:
                - task-run
                - wrap
                - --task
                - backup.snapshot
                - --
                - python
                - /app/scripts-backup/backup_state.py
                - snapshot
              workingDir: /data
              envFrom:
                - secretRef:
                    name: pod-agent-env
                - configMapRef:
                    name: pod-agent-config
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: age-identity
                  mountPath: /age-identity
                  readOnly: true
                - name: home
                  mountPath: /home/podagent
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 101
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pod-agent-data
            - name: age-identity
              secret:
                secretName: pod-agent-age
                defaultMode: 0400
            - name: home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
