                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: home
                  mountPath: /home/podagent
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 101
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pod-agent-data
            - name: home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
