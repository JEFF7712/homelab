apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pod-agent-env
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: pod-agent-env
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DISCORD_WEBHOOK_ORDERS
      remoteRef: {key: homelab-values, property: DISCORD_WEBHOOK_ORDERS}
    - secretKey: DISCORD_WEBHOOK_SEO
      remoteRef: {key: homelab-values, property: DISCORD_WEBHOOK_SEO}
    - secretKey: DISCORD_WEBHOOK_GROWTH
      remoteRef: {key: homelab-values, property: DISCORD_WEBHOOK_GROWTH}
    - secretKey: DISCORD_WEBHOOK_APPROVALS
      remoteRef: {key: homelab-values, property: DISCORD_WEBHOOK_APPROVALS}
    - secretKey: DISCORD_WEBHOOK_ERRORS
      remoteRef: {key: homelab-values, property: DISCORD_WEBHOOK_ERRORS}
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef: {key: homelab-values, property: DISCORD_BOT_TOKEN}
    - secretKey: DISCORD_OWNER_USER_IDS
      remoteRef: {key: homelab-values, property: DISCORD_OWNER_USER_IDS}
    - secretKey: DISCORD_APPROVALS_CHANNEL_ID
      remoteRef: {key: homelab-values, property: DISCORD_APPROVALS_CHANNEL_ID}
    - secretKey: DISCORD_SEO_CHANNEL_ID
      remoteRef: {key: homelab-values, property: DISCORD_SEO_CHANNEL_ID}
    - secretKey: DISCORD_ORDERS_CHANNEL_ID
      remoteRef: {key: homelab-values, property: DISCORD_ORDERS_CHANNEL_ID}
    - secretKey: DISTROJEFF_ETSY_KEYSTRING
      remoteRef: {key: homelab-values, property: DISTROJEFF_ETSY_KEYSTRING}
    - secretKey: DISTROJEFF_ETSY_SHARED_SECRET
      remoteRef: {key: homelab-values, property: DISTROJEFF_ETSY_SHARED_SECRET}
    - secretKey: DISTROJEFF_PRINTIFY_API_TOKEN
      remoteRef: {key: homelab-values, property: DISTROJEFF_PRINTIFY_API_TOKEN}
    - secretKey: DISTROJEFF_PRINTIFY_SHOP_ID
      remoteRef: {key: homelab-values, property: DISTROJEFF_PRINTIFY_SHOP_ID}
    - secretKey: DISTROJEFF_RESEND_API_KEY
      remoteRef: {key: homelab-values, property: DISTROJEFF_RESEND_API_KEY}
    - secretKey: DISTROJEFF_ZOHO_IMAP_USER
      remoteRef: {key: homelab-values, property: DISTROJEFF_ZOHO_IMAP_USER}
    - secretKey: DISTROJEFF_ZOHO_IMAP_PASSWORD
      remoteRef: {key: homelab-values, property: DISTROJEFF_ZOHO_IMAP_PASSWORD}
    - secretKey: DISTROJEFF_BUYER_EMAIL_FROM
      remoteRef: {key: homelab-values, property: DISTROJEFF_BUYER_EMAIL_FROM}
    - secretKey: DISTROJEFF_BUYER_EMAIL_AUTO
      remoteRef: {key: homelab-values, property: DISTROJEFF_BUYER_EMAIL_AUTO}
    - secretKey: DARKBIT_PRINTIFY_API_TOKEN
      remoteRef: {key: homelab-values, property: DARKBIT_PRINTIFY_API_TOKEN}
    - secretKey: DARKBIT_PRINTIFY_SHOP_ID
      remoteRef: {key: homelab-values, property: DARKBIT_PRINTIFY_SHOP_ID}
    - secretKey: MERCURY_API_TOKEN
      remoteRef: {key: homelab-values, property: MERCURY_API_TOKEN}
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef: {key: homelab-values, property: TELEGRAM_BOT_TOKEN}
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef: {key: homelab-values, property: TELEGRAM_CHAT_ID}
    - secretKey: POD_AGENT_BACKUP_RECIPIENTS
      remoteRef: {key: homelab-values, property: POD_AGENT_BACKUP_RECIPIENTS}
    - secretKey: DASHBOARD_TOKEN
      remoteRef: {key: homelab-values, property: POD_AGENT_DASHBOARD_TOKEN}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pod-agent-age
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: pod-agent-age
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: backup-age.key
      remoteRef: {key: homelab-values, property: POD_AGENT_BACKUP_IDENTITY_FILE}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pod-agent-antigravity-keyring
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: pod-agent-antigravity-keyring
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: homelab-values
        property: POD_AGENT_ANTIGRAVITY_KEYRING_PASSWORD
