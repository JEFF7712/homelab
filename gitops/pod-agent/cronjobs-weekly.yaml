# Weekly pod-agent jobs plus the daily privacy purge.
# Mirrors deploy/*.service + *.timer on the laptop.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-agent-privacy-purge
  namespace: pod-agent
spec:
  schedule: "30 6 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab-01
          securityContext:
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: privacy-purge
              image: registry.rupan.dev/apps/pod-agent@sha256:7f0aade76a9c7a82c40d4167be6301ad813593963d7e719532af791de64b4515  # yamllint disable-line rule:line-length
              imagePullPolicy: IfNotPresent
              args:
                - privacy
                - purge
                - --apply
              workingDir: /data
              envFrom:
                - secretRef:
                    name: pod-agent-env
                - configMapRef:
                    name: pod-agent-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: home
                  mountPath: /home/podagent
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 101
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pod-agent-data
            - name: home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
