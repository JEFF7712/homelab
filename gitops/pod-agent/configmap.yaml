apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-agent-config
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
data:
  DB_PATH: /data/state.db
  ECONOMICS_INBOX_DIR: /data/economics-inbox
  ASSETS_ROOT: /data/assets/distro-logos
  TELEGRAM_STATE_PATH: /data/telegram_bot_state.json
  POD_AGENT_AGE_BIN: /usr/bin/age
  POD_AGENT_BACKUP_DIR: /data/backups
  POD_AGENT_BACKUP_IDENTITY: /age-identity/backup-age.key
  CODEX_HOME: /data/cliauth/codex
  CLAUDE_CONFIG_DIR: /data/cliauth/claude
  CURSOR_CONFIG_DIR: /data/cliauth/cursor
  OWNER_NOTIFY_CHANNELS: discord
  GOVERNOR_SUBSCRIPTION_PROVIDERS: codex
  GOVERNOR_PROVIDER_ROTATION_ORDER: codex
  POD_AGENT_PROVIDER_CONTAINMENT: best-effort
  PLANNER_FALLBACK_PROVIDERS: agy
  PLANNER_AGY_HOME: /data/cliauth/agy
  PLANNER_AGY_MODEL: gemini-3.1-pro-high
  DBUS_SESSION_BUS_ADDRESS: unix:path=/data/cliauth/agy/keyring/bus
  VISION_PRECHECK_ENABLED: "true"
  VISION_PRECHECK_BLOCKING: "false"
  VISION_EVIDENCE_ROOT: /data/quality
