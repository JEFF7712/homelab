apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-agent-discord-bot
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pod-agent-discord-bot
  template:
    metadata:
      labels:
        app: pod-agent-discord-bot
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-01
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: registry.rupan.dev/apps/pod-agent@sha256:0cd9075379682a0a826b2f285bb2dcc7d07af0b7a18f00b6a76cfe78cfe6dd32  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          args:
            - discord-bot
            - run
            - --shop
            - distrojeff
          workingDir: /data
          envFrom:
            - secretRef:
                name: pod-agent-env
            - configMapRef:
                name: pod-agent-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: home
              mountPath: /home/podagent
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pod-agent-data
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
