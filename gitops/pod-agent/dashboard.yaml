apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-agent-dashboard
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-agent-dashboard
  template:
    metadata:
      labels:
        app: pod-agent-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-01
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-memory
          # Pinned digest; tags roll forward via registry promotion.
          image: registry.rupan.dev/apps/pod-agent@sha256:d8eb13487bfa610fd71c62ee9764880a50a5df0973e0d7a9c69516568a1292fb  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/memory/learnings /data/cliauth /data/assets
              cp -rn /app/repo-memory/strategies /data/memory/ 2>/dev/null || true
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      containers:
        - name: dashboard
          image: registry.rupan.dev/apps/pod-agent@sha256:d8eb13487bfa610fd71c62ee9764880a50a5df0973e0d7a9c69516568a1292fb  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          args:
            - dashboard
            - --shop
            - distrojeff
            - --host
            - 0.0.0.0
            - --port
            - "3010"
            - --no-open-browser
          workingDir: /data
          ports:
            - name: http
              containerPort: 3010
          envFrom:
            - secretRef:
                name: pod-agent-env
            - configMapRef:
                name: pod-agent-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: home
              mountPath: /home/podagent
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pod-agent-data
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pod-agent-dashboard
  namespace: pod-agent
  labels:
    app.kubernetes.io/name: pod-agent
spec:
  selector:
    app: pod-agent-dashboard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
