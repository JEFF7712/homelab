apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: receiver-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-flux-system
  target:
    name: receiver-token
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: homelab-flux-system-values
        property: FLUX_RECEIVER_TOKEN
