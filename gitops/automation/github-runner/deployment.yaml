            - name: REPO_URL
              value: "https://github.com/JEFF7712/sovereign"
            - name: RUNNER_NAME
              value: "homelab-sovereign"
            - name: RUNNER_LABELS
              value: "homelab,self-hosted"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Docker daemon to become responsive..."
              while ! docker info >/dev/null 2>&1; do
                sleep 1
              done
              echo "Docker daemon is responsive."

              echo "Requesting runner registration token from GitHub API..."
              REG_TOKEN=$(curl -s -S -f -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/JEFF7712/sovereign/actions/runners/registration-token | jq -r .token)

              if [ -z "$REG_TOKEN" ] || [ "$REG_TOKEN" = "null" ]; then
                echo "Failed to acquire runner registration token!" >&2
                exit 1
              fi

              cleanup() {
                echo "Termination signal received: unregistering runner..."
                REM_TOKEN=$(curl -s -S -X POST \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/JEFF7712/sovereign/actions/runners/remove-token | jq -r .token)
                if [ -n "$REM_TOKEN" ] && [ "$REM_TOKEN" != "null" ]; then
                  ./config.sh remove --token "${REM_TOKEN}" || true
                fi
              }
              trap cleanup EXIT SIGTERM SIGINT

              echo "Registering runner with GitHub..."
              ./config.sh --url "${REPO_URL}" \
                --token "${REG_TOKEN}" \
                --name "${RUNNER_NAME}" \
                --labels "${RUNNER_LABELS}" \
                --unattended \
                --replace

              echo "Starting runner listener loop..."
              ./run.sh
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: docker-sock
          emptyDir: {}
        - name: dind-storage
          hostPath:
            path: /persist/runner-storage/sovereign
            type: DirectoryOrCreate
