apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-gitlab
  namespace: automation
spec:
  interval: 1h
  chart:
    spec:
      chart: renovate
      version: 46.311.3
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/renovatebot/renovate
            newName: registry.rupan.dev/upstream/ghcr.io/renovatebot/renovate  # yamllint disable-line rule:line-length
            digest: sha256:43c7b64c9f617f35d1dbf120836de4d90f75aee5767cc51a6a8a5b5261196e6c  # yamllint disable-line rule:line-length
  values:
    image:
      tag: 42.70.2
      useFull: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    renovate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      config: |
        {
          "platform": "forgejo",
          "endpoint": "http://git.internal:3000/api/v1/",
          "binarySource": "global",
          "autodiscover": true,
          "autodiscoverFilter": [
            "jeff7712/homelab",
            "JEFF7712/homelab"
          ],
          "onboarding": false,
          "requireConfig": "optional"
        }
    cronjob:
      schedule: "0 * * * *"
      concurrencyPolicy: Forbid
    envList:
      - name: LOG_LEVEL
        value: info
      - name: RENOVATE_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: forgejo-token
      - name: GITHUB_COM_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: github-token
