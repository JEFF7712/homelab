---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-major-reviewer
  namespace: automation
spec:
  schedule: 17 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: automation-runner
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate-major-reviewer
              image: registry.rupan.dev/upstream/ghcr.io/renovatebot/renovate@sha256:7138934c013df961d92acf6e3f1326f9dc705ed3d02e399ac0a3395d777182ff  # yamllint disable-line rule:line-length
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              command:
                - python3
                - /config/renovate-agent.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: RENOVATE_AGENT_STATE_CONFIGMAP
                  value: renovate-agent-state
                - name: RENOVATE_AGENT_STATE_RETENTION_DAYS
                  value: '30'
                - name: RENOVATE_AGENT_APPROVAL_COMMAND
                  value: /renovate-agent approve
                - name: RENOVATE_AGENT_APPROVERS
                  value: rupan,jeff7712
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: ntfy-token
                - name: FORGEJO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: forgejo-token
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              projected:
                defaultMode: 493
                sources:
                  - configMap:
                      name: automation-config
                  - configMap:
                      name: renovate-reviewer-script
            - name: tmp
              emptyDir: {}
