# Inventory-only upstream image declarations for gitops/automation
# consumers. Renovate tracks these tagged references; the workloads pin the
# mirrored digest. Scanned by
# `python -m scripts.registry inventory` (item "image:" fields), imported to
# registry.rupan.dev/upstream/<host>/<path> by the registry CI lane, then
# referenced by digest in the owning manifest.
#
# This file is NOT listed in gitops/automation/kustomization.yaml: it is
# an inventory source only and must never be applied to the cluster.
#
# Update flow: change the digest below, import it, then update the consumer
# manifest digest, so a pod never pulls an image the mirror lacks.
apiVersion: v1
kind: List
metadata:
  name: automation-registry-sources
items:
  # kubectl jobs (cluster-sentinel, dockerhub-retention, website-monitors)
  - image: docker.io/alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
  # Renovate CLI for the reviewer (renovate-agent.yaml)
  - image: ghcr.io/renovatebot/renovate:42.70.2@sha256:97006d85961032ad4a991d70c1a8b8255038f4cd17c8bae732a263f735261130
