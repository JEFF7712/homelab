# The scheduled registry-advance operation (scripts/ci/registry_advance.py)
# verifies the workloads it moved to a new image and reverts a failed rollout.
# It reads workload, pod and Flux Kustomization status cluster-wide and
# nothing else: no writes, no exec, no secrets. CI holds this identity's
# kubeconfig as the Woodpecker file secret registry_advance_kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-advance
  namespace: automation
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-advance-token
  namespace: automation
  annotations:
    kubernetes.io/service-account.name: registry-advance
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-advance-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  # Whether Flux has applied a merged adopt before it is verified.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: registry-advance-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-advance-reader
subjects:
  - kind: ServiceAccount
    name: registry-advance
    namespace: automation
