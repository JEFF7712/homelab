---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-sentinel
  namespace: automation
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: automation-runner
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cluster-sentinel
              image: registry.rupan.dev/upstream/docker.io/alpine/k8s@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0  # yamllint disable-line rule:line-length
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
              command:
                - /bin/sh
                - /config/cluster-sentinel.sh
              env:
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: ntfy-token
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              projected:
                defaultMode: 493
                sources:
                  - configMap:
                      name: automation-config
                  - configMap:
                      name: cluster-sentinel-config
