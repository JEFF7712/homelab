---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renovate-dashboard
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renovate-dashboard
  template:
    metadata:
      labels:
        app: renovate-dashboard
      annotations:
        reloader.stakater.com/auto: 'true'
    spec:
      serviceAccountName: automation-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        command: [python, /config/dashboard.py]
        image: registry.rupan.dev/apps/homelab-renovate-dashboard@sha256:dc947a8226bcdb112cc2bf9e119c67fcd3f63168b7234eb1e060618613d490e3  # yamllint disable-line rule:line-length
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: PORT
          value: '8080'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RENOVATE_AGENT_STATE_CONFIGMAP
          value: renovate-agent-state
        - name: RENOVATE_AGENT_APPROVAL_LABEL
          value: renovate-agent-approved
        - name: RENOVATE_AGENT_APPROVAL_COMMAND
          value: /renovate-agent approve
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: renovate-secrets
              key: github-token
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: renovate-secrets
              key: forgejo-token
        - name: FORGEJO_APPROVAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: renovate-secrets
              key: forgejo-approval-token
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: automation-config
          - configMap:
              name: forgejo-dashboard-script
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: renovate-dashboard
  namespace: automation
spec:
  selector:
    app: renovate-dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
