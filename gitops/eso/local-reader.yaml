apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-local-reader
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-local-reader
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [homelab-values]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-local-reader
  namespace: secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-local-reader
subjects:
  - kind: ServiceAccount
    name: eso-local-reader
    namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-local-reader-self-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews, selfsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-local-reader-self-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-local-reader-self-review
subjects:
  - kind: ServiceAccount
    name: eso-local-reader
    namespace: external-secrets
