apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-canary
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: eso-canary
    creationPolicy: Owner
  data:
    - secretKey: canary
      remoteRef:
        key: homelab-values
        property: FLUX_ESO_CANARY
