apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth
  namespace: hearth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hearth
  template:
    metadata:
      labels:
        app: hearth
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hearth
          image: registry.rupan.dev/upstream/ghcr.io/knowald/ha-hearth@sha256:8e95c28f367358ac11ae5c81672c1871d0f7f2486cd7e52d445375b6ac0b771a  # yamllint disable-line rule:line-length
          env:
            - name: TZ
              value: America/Chicago
            - name: HASS_URL
              value: http://home-assistant.home-assistant:8123
            - name: HASS_PUBLIC_URL
              value: https://ha.rupan.dev
            - name: PORT
              value: "5050"
          ports:
            - name: http
              containerPort: 5050
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hearth-data
        - name: tmp
          emptyDir: {}
