apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: couchdb-data
  namespace: obsidian
  labels:
    app.kubernetes.io/name: couchdb
    app.kubernetes.io/part-of: obsidian
spec:
  volumeName: pvc-ddbae8df-c945-4ec2-a680-0f5127be3c0f
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-cluster
