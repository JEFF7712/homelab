apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spotify-matrix-ha
  namespace: spotify-matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-secrets
  target:
    name: spotify-matrix-ha
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: homelab-values
        property: SPOTIFY_MATRIX_HA_TOKEN
    - secretKey: spotify-client-id
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_ID
    - secretKey: spotify-client-secret
      remoteRef:
        key: homelab-values
        property: SPOTIFY_CLIENT_SECRET
    - secretKey: spotify-refresh-token
      remoteRef:
        key: homelab-values
        property: SPOTIFY_REFRESH_TOKEN
