apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  path: "./infrastructure/configs"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
