apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  path: "./infrastructure/controllers"
  prune: true
  wait: true
  timeout: 5m # Give Helm time to install
  sourceRef:
    kind: GitRepository
    name: flux-system
