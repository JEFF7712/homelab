- name: Bootstrap Python on Alpine
  hosts: netbird_gateway
  gather_facts: false
  tasks:
    - name: Install Python3
      raw: test -x /usr/bin/python3 || { apk add --no-cache python3 > /dev/null && echo CHANGED; }
      register: python_bootstrap
      changed_when: "'CHANGED' in python_bootstrap.stdout"

- name: Configure NetBird Gateway
  hosts: netbird_gateway
  gather_facts: true

  tasks:
    - name: Update Alpine Repositories
      apk:
        update_cache: yes

    - name: Install Dependencies
      apk:
        name:
          - curl
          - ca-certificates
          - bash
        state: present

    - name: Install NetBird
      shell: curl -fsSL https://pkgs.netbird.io/install.sh | sh
      args:
        creates: /usr/bin/netbird

    - name: Ensure NetBird Service is Running
      service:
        name: netbird
        state: started
        enabled: yes

    - name: Wait for NetBird Sock
      wait_for:
        path: /var/run/netbird.sock
        state: present
        timeout: 10

    - name: Connect to NetBird
      command: netbird up --setup-key {{ netbird_setup_key }}
      register: netbird_up
      changed_when: "'Connected' in netbird_up.stdout"
      failed_when: 
        - netbird_up.rc != 0
        - "'already connected' not in netbird_up.stderr"
        - "'already connected' not in netbird_up.stdout"
