[extend]
useDefault = true

[[allowlists]]
description = "Allow kubeseal encryptedData payloads in SealedSecret manifests"
condition = "AND"
paths = [
  '''(^|/)(bootstrap|secrets)/sealed-gitlab-auth\.yaml$''',
  '''(^|/)secrets/gitlab-auth\.yaml$''',
  '''(^|/)infrastructure/sealed-gitlab-auth\.yaml$'''
]
regexes = [
  '''^Ag[0-9A-Za-z+/=]+$'''
]

[[allowlists]]
description = "Allow synthetic test-only RSA key used by predmarkbot unit tests"
paths = [
  '''infrastructure/predmarkbot/src/tests/fixtures/test_key\.pem$'''
]
